<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inicio de Sesion del Sistema</title>
<style>
:root{
  --bg:#000000;--panel:#000000;--card:#000000;--border:#22c55e;
  --fg:#ffffff;--mut:#d4d4d8;--accent:#22c55e;--warn:#eab308;--bad:#ef4444;--blue:#38bdf8;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{
  height:100%;margin:0;padding:0;background:#000000;color:#ffffff;
  font:14px/1.45 ui-monospace,"Cascadia Code","Fira Code",Consolas,monospace;
}
body{
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,6px) 8px env(safe-area-inset-bottom,8px);
  overflow:hidden;
}
main{
  width:100%;max-width:100%;flex:1;min-height:0;display:flex;flex-direction:column;margin:0;
}
.terminal{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  overflow:hidden;box-shadow:0 0 0 1px #000000, 0 12px 40px rgba(0,0,0,.92);
  position:relative;flex:1;min-height:0;display:flex;flex-direction:column;width:100%;
}
.terminal::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0px,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px);
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 12px;background:#000000;border-bottom:1px solid #22c55e;font-size:12px;color:#ffffff;
  flex:none;
}
.topbar b{color:#ffffff;letter-spacing:1px}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:#000000;border:1px solid #22c55e;color:#ffffff;padding:3px 8px;border-radius:3px}
.pill.night{border-color:#ef4444;color:#ffffff;background:#000000}
.pill.slowrech{border-color:#eab308;color:#ffffff;background:#000000}
.pill.norech{border-color:#f97316;color:#ffffff;background:#000000}
#tabs{
  display:flex;overflow-x:auto;background:#000000;border-bottom:2px solid #22c55e;
  gap:2px;padding:4px 6px;flex:none;
}
.tab{
  flex:none;background:#000000;color:#e4e4e7;
  border:1px solid #166534;border-radius:3px;
  padding:7px 14px;font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.4px;
  cursor:pointer;transition:.12s;
}
.tab:hover{background:#061c0e;color:#ffffff;border-color:#22c55e}
.tab.on{
  background:#072412;color:#ffffff;border:2px solid #22c55e;
  box-shadow:inset 0 -2px #4ade80;
}
.bd{background:#22c55e;color:#000000;border-radius:3px;padding:0 5px;font-weight:800;font-size:11px;margin-left:6px}
#win{
  padding:10px 12px;flex:1;min-height:0;display:flex;flex-direction:column;
  background:#000000;color:#ffffff;position:relative;overflow-y:auto;
}
button{
  font:inherit;font-size:13px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:7px 14px;cursor:pointer;
}
button:hover:not(:disabled){background:#072412;border-color:#4ade80;color:#ffffff}
button.primary-os{
  border-width:2px;font-weight:700;
}
button.logout-btn{
  padding:3px 10px;font-size:12px;font-weight:700;border-width:1px;
}
button.logout-btn:not(:disabled){
  border-color:#4ade80;background:#062110;color:#ffffff;
}
button.alt{background:#000000;color:#ffffff;border:1px solid #22c55e}
button.alt:hover:not(:disabled){background:#072412;border-color:#4ade80}
button.bad{background:#000000;border:1px solid #ef4444;color:#ffffff}
button.bad:hover:not(:disabled){background:#240808}
button.warn{background:#000000;border:1px solid #eab308;color:#ffffff}
button.warn:hover:not(:disabled){background:#241b06}
button.shadow{background:#000000;border:1px solid #a855f7;color:#ffffff}
button.shadow:hover:not(:disabled){background:#1c0b2e}
button:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:8px 0}
.card{background:#000000;border:1px solid #22c55e;border-radius:4px;padding:10px;margin:8px 0;color:#ffffff}
.card.warnbox{border-color:#eab308;background:#000000}
.card.dangerbox{border-color:#ef4444;background:#000000}
.card.shadowbox{border-color:#a855f7;background:#000000}
.mut{color:#d4d4d8}

/* Panel de Correo inspirado en terminal clásica de dos columnas */
.mail-shell{
  flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;
}
.mail-layout{
  flex:1;display:grid;grid-template-columns:1fr;gap:8px;min-height:360px;
}
@media(min-width:760px){
  .mail-layout{grid-template-columns:minmax(310px,38%) 1fr}
}
.mail-pane{
  border:2px solid #22c55e;border-radius:4px;background:#000000;
  display:flex;flex-direction:column;min-height:320px;overflow:hidden;
}
.mail-pane-top{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 10px;background:#000000;border-bottom:1px solid #22c55e;
  font-size:12px;font-weight:700;
}
.mail-list{
  flex:1;overflow-y:auto;background:#000000;
}
.mi{
  display:grid;grid-template-columns:115px 1fr auto;gap:8px;align-items:center;
  padding:8px 10px;border-bottom:1px solid #14532d;cursor:pointer;font-size:12.5px;color:#ffffff;
}
.mi:hover{background:#061c0e}
.mi.un{font-weight:700;background:#031208}
.mi.sel{background:#092b16;outline:1px solid #22c55e}
.mi.anom-mail{border-left:3px solid #a855f7}
.mi-sender{
  color:#4ade80;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi-subj{
  color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi-tag{
  color:#38bdf8;font-size:11.5px;font-weight:700;white-space:nowrap;
}
.mail-reader-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 12px;border-bottom:1px solid #22c55e;background:#000000;
}
.mail-sender-box{
  display:flex;align-items:center;gap:10px;
}
.mail-sender-avatar{
  width:30px;height:30px;border:1px solid #22c55e;border-radius:3px;
  display:flex;align-items:center;justify-content:center;background:#000000;flex:none;
}
.mail-sender-name{
  font-size:14px;font-weight:700;color:#fde047;letter-spacing:.3px;
}
.mail-reader-meta{
  color:#38bdf8;font-size:12px;font-weight:700;
}
.mail-reader-subj{
  padding:8px 14px;border-bottom:1px solid #14532d;
  color:#4ade80;font-size:15px;font-weight:700;background:#000000;
}
.mail-body{
  flex:1;padding:14px 16px;white-space:pre-line;font-size:14px;line-height:1.62;
  color:#ffffff;overflow-y:auto;background:#000000;
}

/* Mapa Estelar: área ampliada a pantalla completa con barra HUD compacta */
.map-shell{
  flex:1;display:flex;flex-direction:column;min-height:0;gap:6px;
}
.map-viewport{
  flex:1;min-height:280px;position:relative;display:flex;
  border:1px solid #22c55e;border-radius:4px;background:#03070d;overflow:hidden;
}
#cv{
  width:100%;height:100%;display:block;touch-action:none;cursor:grab;
}
#cv:active{cursor:grabbing}
.map-hud-bar{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:4px 10px;background:#030a06;border:1px solid #166534;border-radius:4px;
  font-size:12px;
}
.map-hud-bar button{
  padding:4px 11px;font-size:12px;
}

/* Procesador: CRT + Espectrograma lado a lado y controles a la derecha */
.proc-shell{
  flex:1;display:flex;flex-direction:column;min-height:0;gap:8px;
}
.proc-buffer-bar{
  flex:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:5px 10px;background:#030a06;border:1px solid #166534;border-radius:4px;
}
.proc-buffer-bar button{
  padding:4px 10px;font-size:12px;
}
.proc-grid{
  flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:10px;
}
@media(min-width:960px){
  .proc-grid{grid-template-columns:1.38fr 1fr}
}
.monitors-pair{
  display:grid;grid-template-columns:1fr;gap:8px;min-height:240px;height:100%;
}
@media(min-width:620px){
  .monitors-pair{grid-template-columns:1fr 1fr}
}
.crt-wrap{
  background:#000000;border:2px solid #22c55e;border-radius:4px;padding:8px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  position:relative;min-height:220px;height:100%;
}
.crt-wrap.opt-fail{border-color:#ef4444;background:#000000}
.crt-wrap.spec-locked{opacity:.65}
.crt-stage{
  flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;
  background:#020503;border:1px solid #166534;border-radius:3px;padding:4px;overflow:hidden;position:relative;
}
#crt{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
  background:#000000;display:block;
}
#spec{
  width:100%;height:100%;object-fit:fill;image-rendering:pixelated;
  background:#000000;display:block;
}
.proc-side{
  display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;
}
.proc-side > .card{
  margin:0;flex:1;display:flex;flex-direction:column;justify-content:space-between;
}

.databox{
  background:#000000;border:1px solid #22c55e;border-radius:4px;padding:7px 9px;
  font-size:11.5px;color:#ffffff;white-space:pre-wrap;word-break:break-all;margin-top:6px;
}
.databox.anom{border-color:#ef4444;color:#ffffff;background:#000000}
input[type=range]{flex:1;accent-color:#22c55e;cursor:pointer}
input[type=text]{
  width:100%;max-width:340px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:9px 12px;font:14px inherit;
  outline:none;
}
input[type=text]:focus{border-color:#4ade80;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
select{
  width:100%;max-width:100%;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:9px 12px;font:13px inherit;
  outline:none;cursor:pointer;
}
select:focus{border-color:#4ade80;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
.prox-wrap{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:#ffffff}
.prox-bar{flex:1;height:7px;background:#000000;border:1px solid #22c55e;border-radius:3px;overflow:hidden}
.prox-fill{height:100%;transition:width .08s,background .12s}
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.atlas-card{
  background:#000000;border:1px solid #22c55e;border-radius:4px;padding:9px;
  display:flex;flex-direction:column;gap:6px;color:#ffffff;
}
.atlas-card.locked{opacity:.52;background:#000000;border-color:#15803d}
.atlas-cv{width:100%;height:110px;image-rendering:pixelated;background:#000000;border:1px solid #22c55e;border-radius:3px;display:block}
.paper-sheet{
  background:linear-gradient(180deg,#e9dec4 0%,#dfd0b0 100%);
  color:#2b2116;border:2px solid #8c734b;border-radius:6px;padding:14px;
  margin-top:16px;box-shadow:inset 0 0 24px rgba(92,68,36,.28),0 4px 14px rgba(0,0,0,.45);
  font-family:"Courier New",Courier,monospace;
}
.paper-sheet h3{
  margin:0 0 10px;color:#3d2814;border-bottom:1px dashed #7c623c;padding-bottom:6px;
  font-size:15px;letter-spacing:.5px;
}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}
.paper-entry{
  background:rgba(255,250,238,.65);border:1px solid #9c8259;border-radius:4px;padding:9px;
  display:flex;flex-direction:column;gap:6px;
}
.paper-cv{
  width:100%;height:110px;image-rendering:pixelated;background:#1e1912;
  border:1px solid #6e5634;border-radius:3px;display:block;
}
.paper-bin{
  background:#f5eedc;border:1px solid #a89068;padding:6px;border-radius:3px;
  font-size:11px;color:#24190e;word-break:break-all;white-space:pre-wrap;
}
.paper-btn{
  background:#5c4424;color:#fbf6ea;border:1px solid #3d2b14;font-size:11px;padding:3px 8px;
}
.paper-btn:hover{background:#473319}
#toast{
  margin-top:6px;padding:6px 12px;border-radius:4px;background:#000000;
  border:1px solid #22c55e;color:#ffffff;text-align:center;font-size:12px;flex:none;
}
#toast.ok{border-color:#22c55e;background:#000000;color:#ffffff}
#toast.bad{border-color:#ef4444;background:#000000;color:#ffffff}
.boot-screen{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  padding:34px 20px 28px;margin:auto;width:100%;max-width:620px;min-height:420px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;overflow:hidden;
}
.boot-logo{
  width:234px;height:192px;image-rendering:pixelated;image-rendering:crisp-edges;
  display:block;margin:0 auto 22px;object-fit:contain;
  animation:bootFadeIn .65s ease-out;
}
@keyframes bootFadeIn{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}
.boot-bar-frame{
  width:100%;max-width:360px;height:22px;padding:3px;
  background:#000000;border:1px solid #22c55e;
  margin:0 auto 10px;
}
.boot-bar-track{
  width:100%;height:100%;background:#000000;overflow:hidden;position:relative;
}
.boot-bar-fill{
  height:100%;width:0%;
  background:repeating-linear-gradient(
    90deg,
    #22c55e 0px,
    #22c55e 10px,
    #000000 10px,
    #000000 13px
  );
  transition:width .12s linear;
}
.boot-status{
  font-size:12px;color:#ffffff;letter-spacing:.6px;min-height:18px;margin-top:4px;
}
.boot-audio-hint{
  margin-top:18px;font-size:11px;color:#ffffff;letter-spacing:.8px;
  animation:blinkHint 1.3s steps(2,end) infinite;cursor:pointer;
}
@keyframes blinkHint{
  0%,100%{opacity:1}
  50%{opacity:.28}
}
.login-win{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  width:100%;max-width:460px;margin:auto;padding:0;overflow:hidden;
}
.os-win-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 12px;background:#000000;border-bottom:1px solid #22c55e;
  font-size:12px;color:#ffffff;letter-spacing:.8px;
}
.login-body{
  padding:28px 24px 26px;text-align:center;background:#000000;color:#ffffff;
}
.user-avatar-frame{
  width:96px;height:96px;margin:0 auto 18px;
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
}
.os-modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.86);
  display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;
}
.os-modal-win{
  width:100%;max-width:460px;background:#000000;border:2px solid #22c55e;
  border-radius:4px;color:#ffffff;overflow:hidden;
  box-shadow:0 0 0 2px #000000, 0 0 28px rgba(34,197,94,.25);
}
.os-modal-body{
  padding:18px 20px;background:#000000;color:#ffffff;text-align:left;
}
#nightFadeOverlay{
  position:fixed;inset:0;background:#000000;opacity:0;pointer-events:none;
  z-index:999;transition:opacity 0.65s ease-in-out;
  display:flex;align-items:center;justify-content:center;
}
#nightFadeOverlay.active{
  opacity:1;pointer-events:all;
}
#nightFadeText{
  color:#ffffff;
  font-family:"Courier New",Courier,ui-monospace,monospace;
  font-size:clamp(26px,4.5vw,44px);
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:0;
  transition:opacity 0.55s ease-in-out;
  user-select:none;
}
#nightFadeText.visible{
  opacity:1;
}

/* ============================================================================
   ENTORNO GRAFICO UNIFICADO ESTILO ARCHIVO / ANOMALIAS (A PARTIR DEL LOGIN)
   ============================================================================ */
body.boot-mode{
  background:#000000;
  padding:0;
}
body.boot-mode .terminal{
  background:#000000;
  border:none;
  border-radius:0;
  box-shadow:none;
}
body.boot-mode .terminal::after,
body.boot-mode .topbar,
body.boot-mode #tabs{
  display:none !important;
}
body.boot-mode #win{
  background:#000000;
  padding:0;
  overflow:hidden;
}
body.boot-mode .boot-screen{
  background:#000000;
  border:none;
  border-radius:0;
  max-width:none;
  width:100%;
  height:100%;
  padding:20px;
}
body.login-mode .terminal{
  background:transparent;
  border:none;
  box-shadow:none;
}
body.login-mode .terminal::after,
body.login-mode .topbar,
body.login-mode #tabs{
  display:none !important;
}
body.login-mode #win{
  background:transparent;
  padding:16px;
}
body.paper-theme{
  background:#1e1912;
  color:#2b2116;
  font-family:"Courier New",Courier,ui-monospace,monospace;
}
body.paper-theme .terminal{
  background:linear-gradient(180deg,#e9dec4 0%,#dfd0b0 100%);
  border:2px solid #8c734b;
  box-shadow:inset 0 0 28px rgba(92,68,36,.26),0 12px 36px rgba(0,0,0,.78);
}
body.paper-theme .terminal::after{
  background:radial-gradient(circle at center,transparent 62%,rgba(92,68,36,.16) 100%);
}
body.paper-theme .topbar{
  background:#d8c7a3;
  border-bottom:2px solid #8c734b;
  color:#2b2116;
}
body.paper-theme .topbar b{color:#3d2814}
body.paper-theme .pill{
  background:#f5eedc;
  border:1px solid #8c734b;
  color:#2b2116;
  font-weight:700;
}
body.paper-theme .pill.night{
  border-color:#991b1b;
  background:#f3d8d2;
  color:#7f1d1d;
}
body.paper-theme .pill.slowrech{
  border-color:#a16207;
  background:#f6e7c1;
  color:#713f12;
}
body.paper-theme .pill.norech{
  border-color:#9a3412;
  background:#f5dcd0;
  color:#7c2d12;
}
body.paper-theme #tabs{
  background:#d5c39e;
  border-bottom:2px solid #8c734b;
}
body.paper-theme .tab{
  background:#e9dec4;
  color:#3d2814;
  border:1px solid #9c8259;
}
body.paper-theme .tab:hover{
  background:#f5eedc;
  color:#24190e;
  border-color:#6e5634;
}
body.paper-theme .tab.on{
  background:#5c4424;
  color:#fbf6ea;
  border:2px solid #3d2b14;
  box-shadow:inset 0 -2px #a89068;
}
body.paper-theme .bd{
  background:#5c4424;
  color:#fbf6ea;
  border:1px solid #3d2b14;
}
body.paper-theme .tab.on .bd{
  background:#fbf6ea;
  color:#3d2b14;
}
body.paper-theme #win{
  background:transparent;
  color:#2b2116;
}
body.paper-theme button{
  background:#5c4424;
  color:#fbf6ea;
  border:1px solid #3d2b14;
  font-weight:700;
}
body.paper-theme button:hover:not(:disabled){
  background:#473319;
  border-color:#2b1d0d;
  color:#fffdf7;
}
body.paper-theme button.alt{
  background:#f5eedc;
  color:#2b2116;
  border:1px solid #8c734b;
  font-weight:600;
}
body.paper-theme button.alt:hover:not(:disabled){
  background:#e6d7b8;
  border-color:#5c4424;
  color:#1e1912;
}
body.paper-theme button.logout-btn:not(:disabled){
  background:#5c4424;
  border-color:#3d2b14;
  color:#fbf6ea;
}
body.paper-theme button.bad{
  background:#7f1d1d;
  border-color:#450a0a;
  color:#fef2f2;
}
body.paper-theme button.bad:hover:not(:disabled){
  background:#991b1b;
  border-color:#450a0a;
}
body.paper-theme button.warn{
  background:#92400e;
  border-color:#451a03;
  color:#fffbeb;
}
body.paper-theme button.warn:hover:not(:disabled){
  background:#78350f;
}
body.paper-theme button.shadow{
  background:#4c1d95;
  border-color:#2e1065;
  color:#f5f3ff;
}
body.paper-theme button.shadow:hover:not(:disabled){
  background:#3b0764;
}
body.paper-theme .card{
  background:rgba(255,250,238,.72);
  border:1px solid #9c8259;
  color:#2b2116;
  box-shadow:0 1px 4px rgba(61,40,20,.08);
}
body.paper-theme .card.warnbox{
  border-color:#b45309;
  background:rgba(254,243,199,.82);
}
body.paper-theme .card.dangerbox{
  border-color:#991b1b;
  background:rgba(254,226,226,.82);
}
body.paper-theme .card.shadowbox{
  border-color:#6b21a8;
  background:rgba(243,232,255,.82);
}
body.paper-theme .mut{
  color:#5c462e;
}
