<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inicio de Sesion del Sistema</title>
<style>
:root{
  --bg:#000000;--panel:#000000;--card:#000000;--border:#22c55e;
  --fg:#ffffff;--mut:#d4d4d8;--accent:#22c55e;--warn:#eab308;--bad:#ef4444;--blue:#38bdf8;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{
  height:100%;margin:0;padding:0;background:#000000;color:#ffffff;
  font:14px/1.45 ui-monospace,"Cascadia Code","Fira Code",Consolas,monospace;
}
body{
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,6px) 8px env(safe-area-inset-bottom,8px);
}
main{
  width:100%;max-width:100%;flex:1;display:flex;flex-direction:column;margin:0;
}
.terminal{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  overflow:hidden;box-shadow:0 0 0 1px #000000, 0 12px 40px rgba(0,0,0,.92);
  position:relative;flex:1;display:flex;flex-direction:column;width:100%;
}
.terminal::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0px,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px);
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;background:#000000;border-bottom:1px solid #22c55e;font-size:12px;color:#ffffff;
}
.topbar b{color:#ffffff;letter-spacing:1px}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:#000000;border:1px solid #22c55e;color:#ffffff;padding:3px 8px;border-radius:3px}
.pill.night{border-color:#ef4444;color:#ffffff;background:#000000}
.pill.slowrech{border-color:#eab308;color:#ffffff;background:#000000}
.pill.norech{border-color:#f97316;color:#ffffff;background:#000000}
#tabs{
  display:flex;overflow-x:auto;background:#000000;border-bottom:2px solid #22c55e;
  gap:2px;padding:4px 6px;
}
.tab{
  flex:none;background:#000000;color:#e4e4e7;
  border:1px solid #166534;border-radius:3px;
  padding:8px 14px;font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.4px;
  cursor:pointer;transition:.12s;
}
.tab:hover{background:#061c0e;color:#ffffff;border-color:#22c55e}
.tab.on{
  background:#072412;color:#ffffff;border:2px solid #22c55e;
  box-shadow:inset 0 -2px #4ade80;
}
.bd{background:#22c55e;color:#000000;border-radius:3px;padding:0 5px;font-weight:800;font-size:11px;margin-left:6px}
#win{
  padding:12px 14px;flex:1;display:flex;flex-direction:column;
  background:#000000;color:#ffffff;position:relative;overflow-y:auto;
}
button{
  font:inherit;font-size:13px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:8px 14px;cursor:pointer;
}
button:hover:not(:disabled){background:#072412;border-color:#4ade80;color:#ffffff}
button.primary-os{
  border-width:2px;font-weight:700;
}
button.logout-btn{
  padding:3px 10px;font-size:12px;font-weight:700;border-width:1px;
}
button.logout-btn:not(:disabled){
  border-color:#4ade80;background:#062110;color:#ffffff;
}
button.alt{background:#000000;color:#ffffff;border:1px solid #22c55e}
button.alt:hover:not(:disabled){background:#072412;border-color:#4ade80}
button.bad{background:#000000;border:1px solid #ef4444;color:#ffffff}
button.bad:hover:not(:disabled){background:#240808}
button.warn{background:#000000;border:1px solid #eab308;color:#ffffff}
button.warn:hover:not(:disabled){background:#241b06}
button.shadow{background:#000000;border:1px solid #a855f7;color:#ffffff}
button.shadow:hover:not(:disabled){background:#1c0b2e}
button:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:8px 0}
.card{background:#000000;border:1px solid #22c55e;border-radius:4px;padding:10px;margin:8px 0;color:#ffffff}
.card.warnbox{border-color:#eab308;background:#000000}
.card.dangerbox{border-color:#ef4444;background:#000000}
.card.shadowbox{border-color:#a855f7;background:#000000}
.mut{color:#d4d4d8}

/* Panel de Correo inspirado en terminal clásica de dos columnas */
.mail-shell{
  flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;
}
.mail-layout{
  flex:1;display:grid;grid-template-columns:1fr;gap:8px;min-height:360px;
}
@media(min-width:760px){
  .mail-layout{grid-template-columns:minmax(310px,38%) 1fr}
}
.mail-pane{
  border:2px solid #22c55e;border-radius:4px;background:#000000;
  display:flex;flex-direction:column;min-height:320px;overflow:hidden;
}
.mail-pane-top{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 10px;background:#000000;border-bottom:1px solid #22c55e;
  font-size:12px;font-weight:700;
}
.mail-list{
  flex:1;overflow-y:auto;background:#000000;
}
.mi{
  display:grid;grid-template-columns:115px 1fr auto;gap:8px;align-items:center;
  padding:8px 10px;border-bottom:1px solid #14532d;cursor:pointer;font-size:12.5px;color:#ffffff;
}
.mi:hover{background:#061c0e}
.mi.un{font-weight:700;background:#031208}
.mi.sel{background:#092b16;outline:1px solid #22c55e}
.mi.anom-mail{border-left:3px solid #a855f7}
.mi-sender{
  color:#4ade80;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi-subj{
  color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi-tag{
  color:#38bdf8;font-size:11.5px;font-weight:700;white-space:nowrap;
}
.mail-reader-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 12px;border-bottom:1px solid #22c55e;background:#000000;
}
.mail-sender-box{
  display:flex;align-items:center;gap:10px;
}
.mail-sender-avatar{
  width:30px;height:30px;border:1px solid #22c55e;border-radius:3px;
  display:flex;align-items:center;justify-content:center;background:#000000;flex:none;
}
.mail-sender-name{
  font-size:14px;font-weight:700;color:#fde047;letter-spacing:.3px;
}
.mail-reader-meta{
  color:#38bdf8;font-size:12px;font-weight:700;
}
.mail-reader-subj{
  padding:8px 14px;border-bottom:1px solid #14532d;
  color:#4ade80;font-size:15px;font-weight:700;background:#000000;
}
.mail-body{
  flex:1;padding:14px 16px;white-space:pre-line;font-size:14px;line-height:1.62;
  color:#ffffff;overflow-y:auto;background:#000000;
}
.mail-footer-bar{
  display:grid;grid-template-columns:1fr;gap:8px;
}
@media(min-width:760px){
  .mail-footer-bar{grid-template-columns:1fr 1fr}
}

#cv{
  width:100%;height:clamp(320px,56vh,640px);
  border:1px solid #22c55e;border-radius:4px;background:#000000;display:block;touch-action:none;cursor:grab;
}
#cv:active{cursor:grabbing}
.crt-wrap{
  background:#000000;border:2px solid #22c55e;border-radius:4px;padding:10px;
  display:flex;flex-direction:column;align-items:center;position:relative;
}
.crt-wrap.opt-fail{border-color:#ef4444;background:#000000}
#crt{width:100%;max-width:480px;height:260px;image-rendering:pixelated;background:#000000;border:1px solid #22c55e;display:block}
#spec{width:100%;height:clamp(200px,36vh,340px);background:#000000;border:1px solid #22c55e;border-radius:4px;display:block}
.databox{
  background:#000000;border:1px solid #22c55e;border-radius:4px;padding:9px;
  font-size:12px;color:#ffffff;white-space:pre-wrap;word-break:break-all;margin-top:8px;
}
.databox.anom{border-color:#ef4444;color:#ffffff;background:#000000}
input[type=range]{flex:1;accent-color:#22c55e;cursor:pointer}
input[type=text]{
  width:100%;max-width:340px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:9px 12px;font:14px inherit;
  outline:none;
}
input[type=text]:focus{border-color:#4ade80;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
select{
  width:100%;max-width:100%;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:9px 12px;font:13px inherit;
  outline:none;cursor:pointer;
}
select:focus{border-color:#4ade80;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
textarea{
  width:100%;min-height:54px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:4px;padding:8px;font:12.5px inherit;
}
.prox-wrap{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:#ffffff}
.prox-bar{flex:1;height:7px;background:#000000;border:1px solid #22c55e;border-radius:3px;overflow:hidden}
.prox-fill{height:100%;transition:width .08s,background .12s}
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.atlas-card{
  background:#000000;border:1px solid #22c55e;border-radius:4px;padding:9px;
  display:flex;flex-direction:column;gap:6px;color:#ffffff;
}
.atlas-card.locked{opacity:.52;background:#000000;border-color:#15803d}
.atlas-cv{width:100%;height:110px;image-rendering:pixelated;background:#000000;border:1px solid #22c55e;border-radius:3px;display:block}
.paper-sheet{
  background:linear-gradient(180deg,#e9dec4 0%,#dfd0b0 100%);
  color:#2b2116;border:2px solid #8c734b;border-radius:6px;padding:14px;
  margin-top:16px;box-shadow:inset 0 0 24px rgba(92,68,36,.28),0 4px 14px rgba(0,0,0,.45);
  font-family:"Courier New",Courier,monospace;
}
.paper-sheet h3{
  margin:0 0 10px;color:#3d2814;border-bottom:1px dashed #7c623c;padding-bottom:6px;
  font-size:15px;letter-spacing:.5px;
}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.paper-entry{
  background:rgba(255,250,238,.65);border:1px solid #9c8259;border-radius:4px;padding:9px;
  display:flex;flex-direction:column;gap:6px;
}
.paper-cv{
  width:100%;height:110px;image-rendering:pixelated;background:#1e1912;
  border:1px solid #6e5634;border-radius:3px;display:block;
}
.paper-bin{
  background:#f5eedc;border:1px solid #a89068;padding:6px;border-radius:3px;
  font-size:11px;color:#24190e;word-break:break-all;white-space:pre-wrap;
}
.paper-btn{
  background:#5c4424;color:#fbf6ea;border:1px solid #3d2b14;font-size:12px;padding:6px 10px;
}
.paper-btn:hover{background:#473319}
#toast{
  margin-top:6px;padding:7px 12px;border-radius:4px;background:#000000;
  border:1px solid #22c55e;color:#ffffff;text-align:center;font-size:12px;min-height:32px;
}
#toast.ok{border-color:#22c55e;background:#000000;color:#ffffff}
#toast.bad{border-color:#ef4444;background:#000000;color:#ffffff}
.boot-screen{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  padding:34px 20px 28px;margin:auto;width:100%;max-width:620px;min-height:420px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;overflow:hidden;
}
.boot-logo{
  width:234px;height:192px;image-rendering:pixelated;image-rendering:crisp-edges;
  display:block;margin:0 auto 22px;object-fit:contain;
  animation:bootFadeIn .65s ease-out;
}
@keyframes bootFadeIn{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}
.boot-bar-frame{
  width:100%;max-width:360px;height:22px;padding:3px;
  background:#000000;border:1px solid #22c55e;
  margin:0 auto 10px;
}
.boot-bar-track{
  width:100%;height:100%;background:#000000;overflow:hidden;position:relative;
}
.boot-bar-fill{
  height:100%;width:0%;
  background:repeating-linear-gradient(
    90deg,
    #22c55e 0px,
    #22c55e 10px,
    #000000 10px,
    #000000 13px
  );
  transition:width .12s linear;
}
.boot-status{
  font-size:12px;color:#ffffff;letter-spacing:.6px;min-height:18px;margin-top:4px;
}
.boot-audio-hint{
  margin-top:18px;font-size:11px;color:#ffffff;letter-spacing:.8px;
  animation:blinkHint 1.3s steps(2,end) infinite;cursor:pointer;
}
@keyframes blinkHint{
  0%,100%{opacity:1}
  50%{opacity:.28}
}
.login-win{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  width:100%;max-width:460px;margin:auto;padding:0;overflow:hidden;
}
.os-win-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 12px;background:#000000;border-bottom:1px solid #22c55e;
  font-size:12px;color:#ffffff;letter-spacing:.8px;
}
.login-body{
  padding:28px 24px 26px;text-align:center;background:#000000;color:#ffffff;
}
.user-avatar-frame{
  width:96px;height:96px;margin:0 auto 18px;
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
}
.os-modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.86);
  display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;
}
.os-modal-win{
  width:100%;max-width:460px;background:#000000;border:2px solid #22c55e;
  border-radius:4px;color:#ffffff;overflow:hidden;
  box-shadow:0 0 0 2px #000000, 0 0 28px rgba(34,197,94,.25);
}
.os-modal-body{
  padding:18px 20px;background:#000000;color:#ffffff;text-align:left;
}
#nightFadeOverlay{
  position:fixed;inset:0;background:#000000;opacity:0;pointer-events:none;
  z-index:999;transition:opacity 0.65s ease-in-out;
}
#nightFadeOverlay.active{
  opacity:1;pointer-events:all;
}
</style>
</head>
<body>
<main>
<div class="terminal">
  <div class="topbar">
    <b id="topTitle">INICIO DE SESION</b>
    <div class="stats" id="st"></div>
  </div>
  <div id="tabs"></div>
  <div id="win"></div>
</div>
<div id="toast" style="visibility:hidden"></div>
</main>
<div id="nightFadeOverlay"></div>

<script>
// ============================================================================
// TELEMETRÍA SILENCIOSA EN SEGUNDO PLANO (Firebase Realtime Database)
// ============================================================================
const CLOUD_DB_URL = "https://signal-finder-5e191-default-rtdb.firebaseio.com";

const $ = s => document.querySelector(s);
const CLASSES = ["Estrella", "Planeta", "Asteroide", "Satelite", "Pulsar"];
const TOTAL_NIGHTS = 15;
const EXTRA_SIGNALS_PER_NIGHT = 10;
const W = 1400, H = 900;
const stars = Array.from({length: 340}, () => [Math.random()*W, Math.random()*H, Math.random()*1.5 + 0.4]);

// Catálogo de 28 modelos normales vinculados a Signals/
const MODELS = [
  // 0: Estrella (5 modelos)
  {id:"est_enana", cat:0, name:"Enana Amarilla", img:"Signals/yellow_dwarf.png", freq:210, wave:"sine", pattern:"band3", desc:"Estrella de secuencia principal con 3 bandas horizontales anchas y estables."},
  {id:"est_enana_roja", cat:0, name:"Enana Roja", img:"Signals/red_dwarf.png", freq:188, wave:"sine", pattern:"band3", desc:"Emision termica tenue de baja masa y larga vida orbital."},
  {id:"est_gigante", cat:0, name:"Gigante Roja", img:"Signals/red_giant.png", freq:175, wave:"sine", pattern:"band3", desc:"3 bandas anchas de baja frecuencia y corona extensa."},
  {id:"est_binaria", cat:0, name:"Estrella Binaria", img:"Signals/binary_star.png", freq:255, wave:"triangle", pattern:"band3", desc:"Doble pico orbital con modulacion en 3 bandas."},
  {id:"est_trinaria", cat:0, name:"Sistema Trinario", img:"Signals/trinary_star.png", freq:295, wave:"triangle", pattern:"band3", desc:"Tres focos gravitacionales sincronizados."},
  // 1: Planeta y Lunas/Enanos (13 modelos)
  {id:"pla_venus", cat:1, name:"Venus", img:"Signals/venus.png", freq:106, wave:"sine", pattern:"band4", desc:"Planeta rocoso con cobertura nubosa densa de alto albedo."},
  {id:"pla_marte", cat:1, name:"Marte", img:"Signals/mars.png", freq:112, wave:"sine", pattern:"band4", desc:"Planeta rocoso con casquetes polares y superficie ferrosa."},
  {id:"pla_jupiter", cat:1, name:"Jupiter", img:"Signals/jupiter.png", freq:132, wave:"sine", pattern:"band4", desc:"Gigante gaseoso con franjas atmosfericas densas."},
  {id:"pla_saturno", cat:1, name:"Saturno", img:"Signals/saturn.png", freq:148, wave:"triangle", pattern:"band4", desc:"Gigante gaseoso con sistema de anillos de alta densidad."},
  {id:"pla_urano", cat:1, name:"Urano", img:"Signals/uranus.png", freq:138, wave:"sine", pattern:"band4", desc:"Gigante helado con eje de rotacion fuertemente inclinado."},
  {id:"pla_neptuno", cat:1, name:"Neptuno", img:"Signals/neptune.png", freq:144, wave:"sine", pattern:"band4", desc:"Gigante helado profundo con vientos supersonicos."},
  {id:"pla_exoplaneta", cat:1, name:"Exoplaneta", img:"Signals/exoplanet.png", freq:124, wave:"sine", pattern:"band4", desc:"Mundo extrasolar detectado por transito espectral."},
  {id:"pla_luna", cat:1, name:"Luna", img:"Signals/moon.png", freq:94, wave:"sine", pattern:"band4", desc:"Satelite natural rocoso marcado por cuencas de impacto."},
  {id:"pla_io", cat:1, name:"Io", img:"Signals/io.png", freq:98, wave:"triangle", pattern:"band4", desc:"Satelite volcanico activo con flujo de plasma orbital."},
  {id:"pla_europa", cat:1, name:"Europa", img:"Signals/europa.png", freq:102, wave:"sine", pattern:"band4", desc:"Corteza de hielo fracturada sobre oceano subsuperficial."},
  {id:"pla_ceres", cat:1, name:"Ceres", img:"Signals/ceres.png", freq:88, wave:"sine", pattern:"band4", desc:"Planeta enano del cinturon principal de asteroides."},
  {id:"pla_pluton", cat:1, name:"Pluton", img:"Signals/pluto.png", freq:84, wave:"sine", pattern:"band4", desc:"Planeta enano helado del cinturon de Kuiper."},
  {id:"pla_makemake", cat:1, name:"Makemake", img:"Signals/makemake.png", freq:86, wave:"sine", pattern:"band4", desc:"Cuerpo transneptuniano brillante de superficie metanica."},
  // 2: Asteroide (3 modelos)
  {id:"ast_metalico", cat:2, name:"Asteroide Metalico", img:"Signals/metallic_asteroid.png", freq:320, wave:"triangle", pattern:"diag", desc:"Trazas diagonales definidas de alta reflectividad."},
  {id:"ast_condrita", cat:2, name:"Condrita Carbonacea", img:"Signals/chondrite_asteroid.png", freq:285, wave:"sine", pattern:"diag", desc:"Trazas diagonales suaves con deriva constante."},
  {id:"ast_cometa", cat:2, name:"Cometa de Nucleo Activo", img:"Signals/comet.png", freq:355, wave:"sawtooth", pattern:"diag", desc:"Trazas diagonales alargadas por estela volatil."},
  // 3: Satelite (4 modelos)
  {id:"sat_com", cat:3, name:"Satelite de Comunicaciones", img:"Signals/comms_satellite.png", freq:760, wave:"sawtooth", pattern:"blocks", desc:"Columnas de bloques digitales + subportadora TLM."},
  {id:"sat_sonda", cat:3, name:"Sonda Orbital", img:"Signals/space_probe.png", freq:810, wave:"sawtooth", pattern:"blocks", desc:"Paquetes telemetricos espaciados + subportadora."},
  {id:"sat_telescopio", cat:3, name:"Telescopio Espacial", img:"Signals/space_telescope.png", freq:720, wave:"square", pattern:"blocks", desc:"Bloques regulares de observacion profunda."},
  {id:"sat_estacion", cat:3, name:"Estacion Modular", img:"Signals/station.png", freq:850, wave:"sawtooth", pattern:"blocks", desc:"Tramas continuas de alta densidad telemetrica."},
  // 4: Pulsar (3 modelos, aparece a partir de Noche 3 -> shift >= 2)
  {id:"pul_ms", cat:4, name:"Pulsar de Milisegundos", img:"Signals/millisecond_pulsar.png", freq:480, wave:"square", pattern:"pulses", desc:"Columnas verticales periodicas de cadencia rapida."},
  {id:"pul_magnetar", cat:4, name:"Magnetar", img:"Signals/magnetar.png", freq:430, wave:"square", pattern:"pulses", desc:"Pulsos verticales de altisima intensidad magnetica."},
  {id:"pul_binario", cat:4, name:"Pulsar Binario", img:"Signals/binary_pulsar.png", freq:515, wave:"square", pattern:"pulses", desc:"Doble tren de pulsos verticales con deriva de fase."}
];

// Saludos en diferentes idiomas codificados únicamente en binario ASCII de 8 bits
const VOYAGER_GREETINGS_TEXT = "HELLO | HOLA | BONJOUR | NI HAO | PRIVET | KONNICHIWA";
const VOYAGER_BINARY = VOYAGER_GREETINGS_TEXT
  .split("")

// Caché de sprites PNG en Signals/
const IMG_CACHE = {};
const offCv = document.createElement("canvas");
const offCx = offCv.getContext("2d");

function getSprite(src) {
  if (!src) return null;
  if (!IMG_CACHE[src]) {
    const im = new Image();
    im._failed = false;
    im.onerror = () => { im._failed = true; };
    im.src = src;
    IMG_CACHE[src] = im;
  }
  const im = IMG_CACHE[src];
  if (im._failed) return null;
  return (im.complete && im.naturalWidth > 0) ? im : null;
}

function preloadAllSprites() {
  MODELS.forEach(m => { if (m.img) getSprite(m.img); });
  ANOMALY_DEFS.forEach(a => { if (a.img) getSprite(a.img); });
}

function buildSessionSnapshot(finalized = false) {
  if (!S) return null;
  const elapsedTotal = sessionStartPerf ? +((performance.now() - sessionStartPerf) / 1000).toFixed(1) : (S.totalPlayTime || 0);
  S.totalPlayTime = elapsedTotal;
  S.notesLength = notes.trim().length;
  S.satReportsTotal = satReportsSent;
  S.status = finalized ? (gameOverReason === "ARREST" ? "CLAUSURADA_ONU" : "FINALIZADA") : "EN_CURSO";
  S.lastUpdated = new Date().toISOString();

  const shiftsList = [...S.shifts];
  if (!finalized && R && V !== "end") {
    shiftsList.push({
      ...R,
      time: +((performance.now() - R.t0) / 1000).toFixed(1),
      energy: Math.round(en),
      money: G ? G.money : 75
    });
  }

  return {
    id: S.id,
    playerName: S.playerName,
    startNight: selectedStartNight + 1,
    freeMode: isFreeMode,
    date: S.date,
    dateISO: S.dateISO,
    totalPlayTime: S.totalPlayTime,
    status: S.status,
    lastUpdated: S.lastUpdated,
    shifts: shiftsList,
    survey: null,
    notesLength: S.notesLength,
    satReportsTotal: S.satReportsTotal
  };
}

async function pushSnapshotToCloud(snap) {
  if (!activeDbUrl || !snap) return;
  if (cloudInFlight) {
    cloudQueuedSnap = snap;
    return;
  }
  cloudInFlight = true;
  try {
    await fetch(`${activeDbUrl}/sessions/${encodeURIComponent(snap.id)}.json`, {
      method: "PUT",
      body: JSON.stringify(snap)
    });
  } catch (_) {
  } finally {
    cloudInFlight = false;
    if (cloudQueuedSnap) {
      const next = cloudQueuedSnap;
      cloudQueuedSnap = null;
      pushSnapshotToCloud(next);
    }
  }
}

function syncLiveTelemetry(finalized = false, pushCloudNow = true) {
  const snap = buildSessionSnapshot(finalized);
  if (!snap) return;
  try {
    const raw = localStorage.getItem(LIVE_STORAGE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    const idx = list.findIndex(item => item.id === snap.id);
    if (idx >= 0) list[idx] = snap;
    else list.push(snap);
    localStorage.setItem(LIVE_STORAGE_KEY, JSON.stringify(list));
  } catch (_) {}

  if (bc) {
    try { bc.postMessage({type: "SESSION_UPDATE", session: snap}); } catch (_) {}
  }

  if (pushCloudNow && activeDbUrl) {
    pushSnapshotToCloud(snap);
  }
}

function beep(freq, dur = 0.08, type = "sine", vol = 0.06) {
  if (muted) return;
  try {
    au = au || new (window.AudioContext || window.webkitAudioContext)();
    if (au.state === "suspended") au.resume();
    const o = au.createOscillator(), g = au.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, au.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, au.currentTime + dur);
    o.connect(g); g.connect(au.destination);
    o.start(); o.stop(au.currentTime + dur);
  } catch (_) {}
}

function stopVoice() {
  if (!activeVoice) return;
  try { activeVoice.o.stop(); } catch (_) {}
  activeVoice = null;
}

function playStartupSound(forceReplay = false) {
  if (muted) return false;
  if (bootSoundPlayed && !forceReplay) return true;
  try {
    au = au || new (window.AudioContext || window.webkitAudioContext)();
    if (au.state === "suspended") {
      au.resume().catch(() => {});
    }
    if (au.state !== "running") {
      return false;
    }
    bootSoundPlayed = true;
    bootLoginChimePending = false;

    const now = au.currentTime + 0.03;
    const master = au.createGain();
    const filter = au.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(360, now);
    filter.frequency.exponentialRampToValueAtTime(2400, now + 0.85);
    filter.frequency.exponentialRampToValueAtTime(980, now + 3.4);
    filter.Q.value = 1.4;

    master.gain.setValueAtTime(0.0001, now);
    master.gain.linearRampToValueAtTime(0.16, now + 0.22);
    master.gain.setValueAtTime(0.15, now + 1.65);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 3.6);

    filter.connect(master);
    master.connect(au.destination);

    // Acordes sintetizados estilo PC 1995 (EbMaj9 -> AbMaj9 -> Bb13sus -> EbMaj9)
    const chords = [
      { t: 0.00, dur: 1.05, freqs: [155.56, 233.08, 311.13, 392.00, 466.16, 587.33] },
      { t: 0.82, dur: 1.05, freqs: [207.65, 311.13, 415.30, 523.25, 622.25, 783.99] },
      { t: 1.58, dur: 2.00, freqs: [155.56, 233.08, 349.23, 392.00, 587.33, 932.33] }
    ];

    chords.forEach((ch, ci) => {
      ch.freqs.forEach((f, fi) => {
        const osc = au.createOscillator();
        const vg = au.createGain();
        osc.type = (fi % 2 === 0) ? "triangle" : "sine";
        const detune = (fi % 2 === 0 ? -5 : 5) + ci * 1.5;
        osc.frequency.setValueAtTime(f, now + ch.t);
        osc.detune.setValueAtTime(detune, now + ch.t);

        const voicePeak = (fi === 0 ? 0.22 : 0.13) / Math.sqrt(ch.freqs.length);
        vg.gain.setValueAtTime(0.0001, now + ch.t);
        vg.gain.linearRampToValueAtTime(voicePeak, now + ch.t + 0.14);
        vg.gain.exponentialRampToValueAtTime(0.0001, now + ch.t + ch.dur);

        osc.connect(vg);
        vg.connect(filter);
        osc.start(now + ch.t);
        osc.stop(now + ch.t + ch.dur + 0.05);
      });
    });

    // Destello cristalino superior (campana espacial 95)
    [1174.66, 1567.98, 1864.66].forEach((bf, idx) => {
      const bell = au.createOscillator();
      const bg = au.createGain();
      bell.type = "sine";
      const bt = now + 0.45 + idx * 0.42;
      bell.frequency.setValueAtTime(bf, bt);
      bg.gain.setValueAtTime(0.0001, bt);
      bg.gain.linearRampToValueAtTime(0.032, bt + 0.03);
      bg.gain.exponentialRampToValueAtTime(0.0001, bt + 1.35);
      bell.connect(bg);
      bg.connect(au.destination);
      bell.start(bt);
      bell.stop(bt + 1.4);
    });

    return true;
  } catch (_) {
    return false;
  }
}

function playSignalAudio(sigObj) {
  stopVoice();
  if (muted) return;
  try {
    au = au || new (window.AudioContext || window.webkitAudioContext)();
    if (au.state === "suspended") au.resume();
    const o = au.createOscillator(), g = au.createGain();
    const mod = MODELS.find(m => m.id === sigObj.modelId) || MODELS[0];
    const anomDef = sigObj.anom ? ANOMALY_DEFS.find(a => a.type === sigObj.anomType) : null;
    o.type = anomDef ? anomDef.wave : mod.wave;
    o.frequency.value = anomDef ? anomDef.freq : mod.freq;
    g.gain.value = 0.07;
    o.connect(g); g.connect(au.destination);
    o.start();
    activeVoice = {o, g, sig: sigObj, t: 0, max: 3.4};
  } catch (_) {}
}

function playMailChime() {
  if (muted) return;
  try {
    au = au || new (window.AudioContext || window.webkitAudioContext)();
    if (au.state === "suspended") au.resume();
    if (au.state !== "running") return;
    const now = au.currentTime;
    const startAt = Math.max(now + 0.01, nextMailChimeAt);
    nextMailChimeAt = startAt + 0.17;

    const notes = [880, 1174.66];
    notes.forEach((freq, idx) => {
      const o = au.createOscillator();
      const g = au.createGain();
      o.type = "triangle";
      const t0 = startAt + idx * 0.065;
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.065, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.connect(g);
      g.connect(au.destination);
      o.start(t0);
      o.stop(t0 + 0.17);
    });
  } catch (_) {}
}

function pickUniqueModelForCat(cat, forcedModelId = null) {
  const catModels = MODELS.filter(m => m.cat === cat);
  if (forcedModelId) {
    const found = catModels.find(m => m.id === forcedModelId);
    if (found) {
      if (cat === 1) usedPlanetModelsThisNight.add(found.id);
      return found;
    }
  }
  if (cat === 1) {
    const unusedPlanets = catModels.filter(m => !usedPlanetModelsThisNight.has(m.id));
    const pool = unusedPlanets.length ? unusedPlanets : catModels;
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    usedPlanetModelsThisNight.add(chosen.id);
    return chosen;
  }
  return catModels[Math.floor(Math.random() * catModels.length)];
}

function makeSignal(cat, forcedAnom = null, forcedAnomType = null, forcedModelId = null, assignRefId = null) {
  let x, y, tries = 0;
  do {
    x = 110 + Math.random() * (W - 220);
    y = 110 + Math.random() * (H - 220);
  } while (tries++ < 60 && sigs.some(s => s.st !== "gone" && Math.hypot(s.x - x, s.y - y) < 195));

  // Las anomalías SOLO aparecen a partir de Noche 10 (isAnomEnabled()) y nunca reemplazan una señal de asignación
  const allowAnom = isAnomEnabled() && !assignRefId;
  const anom = allowAnom ? (forcedAnom !== null ? forcedAnom : (Math.random() < 0.22)) : false;

  let anomDef = null;
  if (anom) {
    if (forcedAnomType) {
      anomDef = ANOMALY_DEFS.find(a => a.type === forcedAnomType) || ANOMALY_DEFS[0];
    } else {
      const undiscovered = ANOMALY_DEFS.filter(a => !discoveredAnomalies.some(d => d.anomType === a.type));
      const pool = undiscovered.length ? undiscovered : ANOMALY_DEFS;
      anomDef = pool[Math.floor(Math.random() * pool.length)];
    }
  }

  let actualCat = anomDef ? anomDef.cat : cat;
  // Si todos los planetas únicos de la noche ya aparecieron y no es asignación forzada, rotar a otra categoría disponible
  if (!anomDef && !forcedModelId && actualCat === 1) {
    const allPlanets = MODELS.filter(m => m.cat === 1);
    if (usedPlanetModelsThisNight.size >= allPlanets.length) {
      const altCats = (isPulsarEnabled() ? [0, 2, 3, 4] : [0, 2, 3]);
      actualCat = altCats[Math.floor(Math.random() * altCats.length)];
    }
  }

  const chosenModel = pickUniqueModelForCat(actualCat, forcedModelId);

  // Probabilidad de señal corrupta a partir de Noche 5 (shift >= 4) (nunca corrompe las 3 señales de asignación)
  const corruptProb = (!anom && !assignRefId)
    ? (shift >= 4 ? Math.min(0.38, 0.15 + (shift - 4) * 0.03) : 0.04)
    : 0;
  const isCorruptSignal = Math.random() < corruptProb;

  const moving = (actualCat === 2 || actualCat === 3);
  const ang = Math.random() * Math.PI * 2;
  const spd = moving ? (2.1 + Math.random() * 1.4) : 0;

  let textData = "[Sin subportadora]";
  let anomTitle = "";
  let anomType = "";
  if (anomDef) {
    anomType = anomDef.type;
    anomTitle = anomDef.title;
    textData = anomDef.textData;
  } else if (actualCat === 3) {
    const satNum = 100 + Math.floor(Math.random() * 899);
    const alt = 420 + Math.floor(Math.random() * 380);
    const hex = uid();
    textData = `TLM-SAT-${satNum} // ${chosenModel.name.toUpperCase()} // ALT:${alt}KM // PWR:88% // HASH:${hex}`;
  } else {
    textData = `ESPECTRO-${chosenModel.id.toUpperCase()} // INTENSIDAD:${62 + Math.floor(Math.random()*35)}%`;
  }

  return {
    id: ++sid, x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    cat: actualCat, modelId: chosenModel.id, img: anomDef ? anomDef.img : chosenModel.img,
    anom, anomType, anomTitle, assignRefId,
    isCorruptSignal, st: "echo", align: 0, prog: 0,
    tot: 0, bad: 0, acc: 0, seed: Math.random() * 100,
    tgF: 14 + Math.floor(Math.random() * 72),
    tgP: 14 + Math.floor(Math.random() * 72),
    fixed: false, textData
  };
}

function ensureSectorDiversity() {
  if (!isPulsarEnabled()) {
    sigs.forEach(s => { if (s.cat === 4 && s.st === "echo") s.st = "gone"; });
  }
  if (!isAnomEnabled()) {
    sigs.forEach(s => { if (s.anom && s.st === "echo") s.st = "gone"; });
  }

  const inSector = () => sigs.filter(s => s.st === "echo" || s.st === "align" || s.st === "dl");
  const heldOrQueued = sigs.filter(s => s.st === "raw");

  // 1. Asegurar las 3 señales de asignación de la noche (ratio aumentado y presencia garantizada si aún no están entregadas ni en buffer)
  for (const target of nightAssignPool) {
    const asg = nightAssignments.find(a => a.id === target.assignId);
    if (!asg || asg.done || asg.failed) continue;
    const alreadyPresent = [...inSector(), ...heldOrQueued].some(s =>
      !s.anom && !s.isCorruptSignal && s.cat === target.cat && (!target.modelId || s.modelId === target.modelId)
    ) || outbox.some(p =>
      !p.anom && p.trueCat === target.cat && (!target.modelId || p.trueMod === target.modelId)
    );

    if (!alreadyPresent && inSector().length < 5) {
      sigs.push(makeSignal(target.cat, false, null, target.modelId, target.assignId));
    }
  }

  // 2. Completar con hasta 10 señales adicionales por noche; al alcanzar las 10 dejan de aparecer nuevas señales
  const allowedCats = isPulsarEnabled() ? [0, 1, 2, 3, 4] : [0, 1, 2, 3];
  while (inSector().length < 5 && nightExtraSpawned < EXTRA_SIGNALS_PER_NIGHT) {
    const curSector = inSector();
    const missingCats = allowedCats.filter(c => !curSector.some(s => s.cat === c && !s.anom));
    let chosenCat;
    if (missingCats.length > 0) {
      chosenCat = missingCats[Math.floor(Math.random() * missingCats.length)];
    } else {
      // Ligeramente mayor peso a categorías solicitadas en asignaciones activas
      const activeCats = activeAssigns().map(a => a.cat);
      const weightedPool = [...allowedCats, ...activeCats];
      chosenCat = weightedPool[Math.floor(Math.random() * weightedPool.length)];
    }

    const forceAnom = isAnomEnabled() && !curSector.some(s => s.anom) && nightExtraSpawned === 2 ? true : null;
    sigs.push(makeSignal(chosenCat, forceAnom, null, null, null));
    nightExtraSpawned++;
  }
}

function offF(s) { return Math.min(1, Math.abs(knobF - s.tgF) / 45); }

function proxPct(val, target) { return Math.max(0, Math.round(100 - Math.min(100, Math.abs(val - target) * 2.2))); }
function isTuned(s) { return Math.abs(knobF - s.tgF) <= 6 && Math.abs(knobP - s.tgP) <= 6; }

function makeServerChallenge() {
  const count = Math.min(7, 3 + Math.floor(shift / 3));
  const seq = Array.from({length: count}, (_, i) => i);
  if (shift >= 2) {
    for (let i = seq.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [seq[i], seq[j]] = [seq[j], seq[i]];
    }
  }
  return {
    count,
    seq,
    step: 0,
    latched: Array(count).fill(false),
    t: performance.now()
  };
}

    triggerGovernmentArrestEnding();
    return;
  }

  if (targetType === "shadow") {
    if (!pkg.anom) {
      addMail(
        "INTERMEDIARIO SOMBRA // PAQUETE RECHAZADO",
        "Esto es telemetria convencional. Solo pagamos por anomalias reales fuera de catalogo. Pago: $0 CR."
      );
    } else {
      if (R) R.anomSent++;
      G.money += 240;
      addMail(
        "INTERMEDIARIO SOMBRA // TRANSFERENCIA COMPLETADA",
        `Paquete anomalo (${pkg.anomTitle}) recibido en el nodo cifrado. Fondos acreditados: +$240 CR.`
      );
      msg("[OK] Venta cifrada completada (+$240 CR)", 1);
    }
    syncLiveTelemetry(false, true);
    updTop();
    if (V === "mail" || V === "shop") render();
    return;
  }

  const modObj = MODELS.find(m => m.id === pkg.modelId);

  if (targetType === "assign") {
    const asg = nightAssignments.find(a => a.id === assignId) || mail.find(m => m.id === assignId);
    if (!asg || asg.done || asg.failed) {
      addMail(
        `Envio #${pkg.sigId} [Asignacion Cerrada]`,
        "El encargo seleccionado ya no se encuentra vigente. Abono acreditado: $0 CR.",
        {sender: "CENTRAL", tag: `N${shift + 1} · $0`}
      );
      return;
    }

    const catMatches = pkg.chosenCat === pkg.trueCat && pkg.chosenCat === asg.cat;
    const modMatches = !asg.modelId || (pkg.chosenMod === pkg.trueMod && pkg.chosenMod === asg.modelId);

    if (!catMatches || !modMatches) {
      if (R) R.silentErrors++;
      addMail(
        `Archivo Erroneo (#${pkg.sigId})`,
        `El paquete enviado (#${pkg.sigId}) no coincide con los parametros solicitados o contiene una clasificacion erronea.\n\n` +
        `Lectura real verificada: ${CLASSES[pkg.trueCat]}${modObj ? ` (${modObj.name})` : ""}.\n` +
        `Pago emitido: $0 CR.`,
        {sender: asg.sciName, tag: `N${shift + 1} · ERR`}
      );
      syncLiveTelemetry(false, true);
      if (V === "mail") render();
      else updBadges();
      return;
    }

    asg.done = true;
    const mailItem = mail.find(m => m.assignId === asg.id || m.id === assignId);
    if (mailItem) mailItem.done = true;
    discoveredModels.add(pkg.trueMod);
    G.money += asg.reward;
    addMail(
      `Encargo Validado (+$${asg.reward} CR)`,
      `Excelente trabajo, Operador. Los datos de ${CLASSES[pkg.trueCat]} (${modObj ? modObj.name : ""}) han sido incorporados a nuestra investigacion.\n\n` +
      `Honorarios transferidos: +$${asg.reward} CR.`,
      {sender: asg.sciName, tag: `N${shift + 1} · +$${asg.reward}`}
    );
    msg(`[OK] Encargo validado (+$${asg.reward} CR)`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    if (V === "mail" || V === "shop" || V === "atlas") render();
    return;
  }

  if (targetType === "central") {
    const catOk = pkg.chosenCat === pkg.trueCat;
    const modOk = !isSubcatEnabled() || (pkg.chosenMod === pkg.trueMod);

    if (!catOk || !modOk) {
      if (R) R.silentErrors++;
      addMail(
        `CENTRAL // PAQUETE #${pkg.sigId} [ARCHIVO ERRONEO]`,
        `La verificacion automatica detecto discrepancias en tu etiqueta (${CLASSES[pkg.chosenCat]}).\n` +
        `Cuerpo real: ${CLASSES[pkg.trueCat]}${modObj ? ` (${modObj.name})` : ""}. Abono: $0 CR.`
      );
      syncLiveTelemetry(false, true);
      if (V === "mail") render();
      else updBadges();
      return;
    }

    discoveredModels.add(pkg.trueMod);
    const isSat = pkg.trueCat === 3;
    const baseExtraPay = 48;
    const pay = isSat ? 60 : Math.round(baseExtraPay * 0.75);
    G.money += pay;

    addMail(
      `CENTRAL // REGISTRO EXTRA #${pkg.sigId} [ACEPTADO]`,
      isSat
        ? `Telemetria satelital (${modObj ? modObj.name : "Satelite"}) archivada al 100% de tarifa orbital: +$${pay} CR.`
        : `Registro adicional de ${CLASSES[pkg.trueCat]} archivado (tarifa extra -25%): +$${pay} CR.`
    );
    msg(`[OK] Registro extra acreditado (+$${pay} CR)`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    if (V === "mail" || V === "shop" || V === "atlas") render();
  }
}

function advanceNight() {
  const pendingList = nightAssignments.filter(a => a.night === shift && !a.done && !a.failed);
  const completed = pendingList.length === 0;

  if (R) {
    R.ok = completed ? 1 : 0;
    R.status = completed ? "COMPLETADA" : "INCOMPLETA";
    R.time = +((performance.now() - R.t0) / 1000).toFixed(1);
    R.energy = Math.round(en);
    R.money = G.money;
    S.shifts.push({...R});
  }

  if (shift < TOTAL_NIGHTS - 1) {
    shift++;
    selMail = null;
    initShift();
    V = "mail";
    updTop();
    render();
  } else {
    gameOverReason = "COMPLETED";
    V = "end";
    syncLiveTelemetry(true, true);
    updTop();
    render();
  }
}

function triggerNightFadeTransition() {
  if (isTransitioningNight) return;
  isTransitioningNight = true;
  stopVoice();
  beep(420, 0.14, "sine", 0.06);
  const overlay = document.querySelector("#nightFadeOverlay");
  if (overlay) {
    overlay.classList.add("active");
  }
  setTimeout(() => {
    advanceNight();
    setTimeout(() => {
      if (overlay) overlay.classList.remove("active");
      isTransitioningNight = false;
    }, 180);
  }, 680);
}

function computeBootProgress(sec) {
  if (sec <= 0.6) return Math.round((sec / 0.6) * 18);
  if (sec <= 1.5) return Math.round(18 + ((sec - 0.6) / 0.9) * 34);
  if (sec <= 2.3) return Math.round(52 + ((sec - 1.5) / 0.8) * 14);
  if (sec <= 3.5) return Math.round(66 + ((sec - 2.3) / 1.2) * 30);
  if (sec <= 4.0) return Math.round(96 + ((sec - 3.5) / 0.5) * 4);
  return 100;
}

function getBootStatusText(pct) {
  if (pct < 20) return "AVALANCHE COSMOS 95 (R) · INICIANDO NUCLEO DEL SISTEMA...";
  if (pct < 48) return "VERIFICANDO MEMORIA EXTENDIDA: 65536 KB OK";
  if (pct < 72) return "CARGANDO CONTROLADORES DE TELEMETRIA ERIAL-7...";
  if (pct < 96) return "SINCRONIZANDO MATRIZ DE RADIOASTRONOMIA...";
  return "SISTEMA OPERATIVO LISTO · CARGANDO INICIO DE SESION...";
}

function drawBoot() {
  const fill = document.querySelector("#bootBarFill");
  const st = document.querySelector("#bootStatus");
  const pctEl = document.querySelector("#bootPct");
  if (fill) fill.style.width = `${bootProgress}%`;
  if (pctEl) pctEl.textContent = `${bootProgress}%`;
  if (st) st.textContent = getBootStatusText(bootProgress);
}

function tick(dt) {
  if (V === "boot") {
    bootElapsed += dt;
    bootProgress = computeBootProgress(bootElapsed);
    if (!bootSoundPlayed && playStartupSound(false)) {
      const hint = document.querySelector("#bootAudioHint");
      if (hint) hint.style.display = "none";
    }
    if (bootElapsed >= 4.45) {
      V = "intro";
      updTop();
      render();
    }
    return;
  }
  if (!G || V === "intro" || V === "end") return;



  // Recuperación de energía escalonada por tramos de noches:
  // Noches 1 a 5 (shift 0..4): rápida
  // Noches 6 a 10 (shift 5..9): lenta
  // Noches 11 a 15 (shift 10..14): nula
  const regenMode = getEnergyRegenMode();
  if (regenMode === "fast") {
    en = Math.min(cap, en + dt * (en < 25 ? 1.45 : 0.90));
  } else if (regenMode === "slow") {
    en = Math.min(cap, en + dt * (en < 20 ? 0.42 : 0.22));
  }

  if (rd > 0) rd = Math.max(0, rd - dt);

  const alignDur = Math.max(1.1, 4.4 - G.a * 0.65);
  const dlDur = Math.max(3.8, 12.0 - G.a * 1.6);
  const noiseProb = Math.max(0.02, 0.24 - G.f * 0.04);
  let activeDl = false;

  sigs.forEach(s => {
    if ((s.st === "echo" || s.st === "align" || s.st === "dl") && (s.vx || s.vy)) {
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.x < 90 || s.x > W - 90) { s.vx *= -1; s.x = Math.max(90, Math.min(W - 90, s.x)); }
      if (s.y < 90 || s.y > H - 90) { s.vy *= -1; s.y = Math.max(90, Math.min(H - 90, s.y)); }
    }

    if (srv) return;

    if (s.st === "align") {
      if (R) R.slewTime += dt;
      s.align += dt / alignDur;
      if (s.align >= 1) {
        s.align = 1;
        s.st = "dl";
        beep(520, 0.08, "triangle", 0.05);
        msg("[OK] Antenas alineadas // Descargando trama", 1);
      }
    } else if (s.st === "dl") {
      activeDl = true;
      s.prog += dt / dlDur;
      s.acc += dt;
      while (s.acc >= 0.5) {
        s.acc -= 0.5;
        s.tot++;
        if (Math.random() < noiseProb) {
          s.bad++;
          if (R) R.corrupt++;
        }
      }
      if (s.prog >= 1) {
        s.prog = 1;
        s.st = "raw";
        beep(680, 0.12, "sine", 0.07);
        msg(`[OK] Trama #${s.id} lista en Procesador`, 1);
        ensureSectorDiversity();
        syncLiveTelemetry(false, true);
        if (V === "map" || V === "mail") render();
        else updBadges();
      }
    }
  });

  if (activeDl && !srv && Math.random() < dt / 46) triggerCrash();

  if (activeVoice) {
    activeVoice.t += dt;
    const s = activeVoice.sig;
    const clarity = s.fixed ? 1 : (s.tgF !== undefined ? Math.max(0.18, 1 - (offF(s) + offP(s)) * 0.6) : 1);
    const pulse = s.cat === 4 ? ((activeVoice.t * 7 % 1) < 0.22 ? 1 : 0.05)
                : s.cat === 3 ? ((activeVoice.t * 2.5 % 1) < 0.45 ? 0.9 : 0.1)
                : (0.65 + 0.35 * Math.sin(activeVoice.t * 3));
    activeVoice.g.gain.value = 0.07 * clarity * pulse;
    if (activeVoice.t >= activeVoice.max) stopVoice();
  }

  for (let i = pendingEvals.length - 1; i >= 0; i--) {
    if (performance.now() >= pendingEvals[i].at) {
      const ev = pendingEvals.splice(i, 1)[0];
      evaluatePlatformDispatch(ev);
    }
  }

  if (flashT > 0) {
    flashT -= dt;
    if (flashT <= 0) { flash = ""; updTop(); }
  }

  uiTick += dt;
  if (uiTick >= 0.45) { uiTick = 0; updTop(); }

  liveSyncTimer += dt;
  if (liveSyncTimer >= 2.0) {
    liveSyncTimer = 0;
    syncLiveTelemetry(false, false);
  }

  cloudSyncTimer += dt;
  if (cloudSyncTimer >= 5.0) {
    cloudSyncTimer = 0;
    if (activeDbUrl) {
      pushSnapshotToCloud(buildSessionSnapshot(false));
    }
  }
}

// Renderizador procedural de modelos y anomalías
function renderCelestialToCanvas(cv, spec, t, filterLv = 5, tuneErr = 0, sepiaMode = false, opticalFailure = false) {
  if (!cv) return;
  const cx = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  const img = cx.createImageData(w, h);
  const d = img.data;

  // Evento Noche 9: fallo óptico total en el monitor CRT del Procesador
  if (opticalFailure) {
    for (let y = 0; y < h; y++) {
      const band = Math.sin(y * 0.4 + t * 22) > 0.72 ? 42 : 0;
      for (let x = 0; x < w; x++) {
        const noise = (Math.random() * 28 + band) * ((y % 2 === 0) ? 0.7 : 1.0);
        const idx = (y * w + x) * 4;
        d[idx] = Math.min(255, noise * 1.45);
        d[idx + 1] = Math.min(255, noise * 0.42);
        d[idx + 2] = Math.min(255, noise * 0.42);
        d[idx + 3] = 255;
      }
    }
    cx.putImageData(img, 0, 0);
    return;
  }

  const baseFloor = [0.60, 0.44, 0.30, 0.18, 0.09, 0.02][Math.min(5, Math.max(0, filterLv))];
  const staticAmt = sepiaMode ? 0.06 : Math.min(0.98, baseFloor + tuneErr * (1 - baseFloor));

  const modObj = MODELS.find(m => m.id === spec.modelId);
  const spriteSrc = spec.img || (modObj && modObj.img);
  const sprite = getSprite(spriteSrc);

  if (sprite && offCx) {
    offCv.width = w;
    offCv.height = h;
    offCx.imageSmoothingEnabled = false;
    offCx.fillStyle = "#000000";
    offCx.fillRect(0, 0, w, h);

    const aspect = sprite.naturalWidth / sprite.naturalHeight;
    let dw = w, dh = h;
    if (w / h > aspect) {
      dw = Math.round(h * aspect);
    } else {
      dh = Math.round(w / aspect);
    }
    const ox = Math.floor((w - dw) / 2);
    const oy = Math.floor((h - dh) / 2);
    offCx.drawImage(sprite, ox, oy, dw, dh);

    try {
      const srcData = offCx.getImageData(0, 0, w, h).data;
      for (let y = 0; y < h; y++) {
        const scanline = (y % 2 === 0) ? 0.86 : 1.0;
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const alpha = srcData[idx + 3] / 255;
          const r0 = srcData[idx] * alpha;
          const g0 = srcData[idx + 1] * alpha;
          const b0 = srcData[idx + 2] * alpha;
          const snow = Math.random() * 255;

          let r = (r0 * (1 - staticAmt) + snow * staticAmt) * scanline;
          let g = (g0 * (1 - staticAmt) + snow * staticAmt) * scanline;
          let b = (b0 * (1 - staticAmt) + snow * staticAmt) * scanline;

          if (sepiaMode) {
            r *= 1.04;
            g *= 0.99;
            b *= 0.90;
          }

          d[idx] = Math.max(0, Math.min(255, r));
          d[idx + 1] = Math.max(0, Math.min(255, g));
          d[idx + 2] = Math.max(0, Math.min(255, b));
          d[idx + 3] = 255;
        }
      }
      cx.putImageData(img, 0, 0);
      return;
    } catch (_) {
      // Fallback a color con filtro CRT si se abre via file:// sin servidor local
      cx.imageSmoothingEnabled = false;
      cx.fillStyle = sepiaMode ? "#1e1912" : "#000000";
      cx.fillRect(0, 0, w, h);
      cx.save();
      cx.globalAlpha = Math.max(0.18, 1 - staticAmt * 0.85);
      cx.drawImage(sprite, ox, oy, dw, dh);
      cx.restore();
      // Scanlines CRT y estatica sobre el fallback a color
      cx.fillStyle = "rgba(0, 0, 0, 0.18)";
      for (let y = 0; y < h; y += 2) {
        cx.fillRect(0, y, w, 1);
      }
      if (staticAmt > 0.04) {
        const specks = Math.floor(w * h * staticAmt * 0.35);
        for (let i = 0; i < specks; i++) {
          const sx = Math.floor(Math.random() * w);
          const sy = Math.floor(Math.random() * h);
          const v = Math.floor(Math.random() * 255);
          cx.fillStyle = `rgba(${v},${v},${v},0.45)`;
          cx.fillRect(sx, sy, 1, 1);
        }
      }
      return;
    }
  }

  const cx0 = w / 2, cy0 = h / 2;
  const scale = Math.min(w, h) / 96;
  const mid = spec.modelId || "est_enana";
  const seed = spec.seed || 1.5;
  const anomType = spec.anomType || "";

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = (x - cx0) / scale;
      const dy = (y - cy0) / scale;
      const dist = Math.hypot(dx, dy);
      let lum = 10;

      if (anomType === "voyager") {
        // Voyager 1: plato parabólico fracturado, bus decagonal y antena magnetómetro
        const dish = Math.hypot(dx + 6, dy + 2);
        const crack = Math.abs(dx - dy * 0.7 + 4) < 1.6;
        const bus = Math.abs(dx - 8) < 6 && Math.abs(dy - 5) < 5;
        const boom = Math.abs(dy - (dx - 8) * 0.45 - 5) < 1.2 && dx >= 12 && dx <= 34;
        const frag1 = Math.hypot(dx + 22, dy - 14) < 3.2;
        const frag2 = Math.hypot(dx - 24, dy + 16) < 2.6;
        if (dish < 15 && dish > 10 && !crack) lum = 225;
        else if (dish <= 10 && !crack) lum = 145;
        else if (bus) lum = 205;
        else if (boom) lum = 185;
        else if (frag1 || frag2) lum = 195;
      } else if (anomType === "dyson") {
        // Esfera de Dyson: estrella central parcialmente eclipsada por anillos geodésicos orbitales
        const core = dist < 15;
        const shellOuter = dist >= 22 && dist <= 26;
        const latRing = Math.abs(dy - Math.sin(dx * 0.14 + t * 1.4) * 9) < 2.1 && dist <= 26;
        const lonRing = Math.abs(dx - Math.cos(dy * 0.14 - t * 1.1) * 9) < 2.1 && dist <= 26;
        const gap = ((Math.floor(dx + 40) + Math.floor(dy + 40)) % 7 === 0);
        if (shellOuter && !gap) lum = 235;
        else if ((latRing || lonRing) && !gap) lum = 215;
        else if (core) lum = 155 + Math.sin(t * 6) * 20;
      } else if (anomType === "failed_planet") {
        // Planeta Fallido: cuerpo masivo agrietado con núcleo incandescente expuesto y fragmentos orbitales
        const ang = Math.atan2(dy, dx);
        const rad = 25 + Math.sin(ang * 5 + seed) * 3;
        const fissure = Math.abs(Math.sin(dx * 0.22 + dy * 0.18)) < 0.16 && dist < rad;
        const deb1 = Math.hypot(dx - 31, dy + 12) < 3.2;
        const deb2 = Math.hypot(dx + 30, dy - 15) < 2.8;
        if (dist < rad) {
          lum = fissure ? (235 + Math.sin(t * 8) * 18) : (105 - dx * 0.9);
        } else if (deb1 || deb2) {
          lum = 190;
        }
      } else if (anomType === "dark_eyes") {
        // Silueta pálida ovalada con dos cuencas oculares negras profundas (sin boca)
        const oval = Math.hypot(dx * 1.15, dy * 0.85);
        const leftEye = Math.hypot(dx + 9, dy + 4) < 5.2;
        const rightEye = Math.hypot(dx - 9, dy + 4) < 5.2;
        if (oval < 27) {
          if (leftEye || rightEye) lum = 4;
          else lum = 205 - oval * 2.4 + Math.sin(t * 5 + dy * 0.3) * 10;
        }
      } else if (mid === "est_enana") {
        if (dist < 20) lum = 235 - dist * 2;
        else if (dist < 40) lum = Math.max(14, 155 - (dist - 20) * 6);
        if ((Math.abs(dx) < 1.6 || Math.abs(dy) < 1.6) && dist < 48) lum = Math.max(lum, 185 - dist * 2.5);
      } else if (mid === "est_gigante") {
        if (dist < 30) lum = 240 - dist * 1.4;
        else if (dist < 50) lum = Math.max(14, 180 - (dist - 30) * 7 + Math.sin(Math.atan2(dy, dx)*10 + t*2)*16);
      } else if (mid === "est_binaria") {
        const off = 14;
        const a = t * 1.4;
        const d1 = Math.hypot(dx - Math.cos(a)*off, dy - Math.sin(a)*off);
        const d2 = Math.hypot(dx + Math.cos(a)*off, dy + Math.sin(a)*off);
        if (d1 < 12) lum = 240 - d1 * 5;
        if (d2 < 9) lum = Math.max(lum, 225 - d2 * 6);
      } else if (mid === "est_trinaria") {
        for (let k = 0; k < 3; k++) {
          const a = t * 1.2 + k * (Math.PI * 2 / 3);
          const dk = Math.hypot(dx - Math.cos(a)*15, dy - Math.sin(a)*15);
          if (dk < 9) lum = Math.max(lum, 235 - dk * 6);
        }
      } else if (mid === "pla_rocoso") {
        if (dist < 22) lum = 165 - dx * 1.2 + Math.sin(dx * 0.5) * Math.cos(dy * 0.5) * 28;
      } else if (mid === "pla_gaseoso") {
        if (dist < 27) lum = 175 + Math.sin(dy * 0.75) * 48 - dx * 0.9;
      } else if (mid === "pla_anillos") {
        const rx = dx * 0.86 + dy * 0.5;
        const ry = -dx * 0.5 + dy * 0.86;
        const ring = Math.abs(Math.hypot(rx * 0.36, ry * 1.45) - 27) < 3.8;
        if (dist < 20) lum = 165 + Math.sin(ry * 0.6) * 35 - dx * 0.9;
        else if (ring) lum = 220;
      } else if (mid === "pla_enano") {
        if (dist < 13) lum = 180 - dx * 1.4;
      } else if (mid === "pla_oceanico") {
        if (dist < 23) lum = 195 + Math.sin(dx * 0.25 + t * 2) * 18 - dx * 0.7;
      } else if (mid === "ast_metalico") {
        const ang = Math.atan2(dy, dx);
        const rad = 22 + Math.sin(ang * 3 + seed) * 7 + Math.cos(ang * 5) * 4;
        if (dist < rad) lum = 195 + Math.sin(dx * 0.4) * 40;
      } else if (mid === "ast_condrita") {
        const ang = Math.atan2(dy, dx);
        const rad = 24 + Math.cos(ang * 4 + seed) * 6;
        if (dist < rad) lum = 125 + Math.sin(dx * 0.5) * Math.cos(dy * 0.5) * 35;
      } else if (mid === "ast_cometa") {
        const head = Math.hypot(dx + 14, dy);
        if (head < 10) lum = 240 - head * 6;
        else if (dx > -14 && Math.abs(dy) < (dx + 14) * 0.38 && dx < 38) {
          lum = Math.max(14, 175 - (dx + 14) * 3.1);
        }
      } else if (mid === "sat_com") {
        const core = Math.abs(dx) < 7 && Math.abs(dy) < 9;
        const panel = Math.abs(dx) >= 11 && Math.abs(dx) <= 42 && Math.abs(dy) < 6;
        const strut = Math.abs(dy) < 1.8 && Math.abs(dx) < 42;
        if (core) lum = 225;
        else if (panel) lum = ((x % 5 === 0 || y % 4 === 0) ? 95 : 190);
        else if (strut) lum = 170;
      } else if (mid === "sat_sonda") {
        const dish = Math.hypot(dx + 8, dy);
        const body = dx >= 4 && dx <= 22 && Math.abs(dy) < 6;
        if (dish < 14 && dish > 9) lum = 230;
        else if (body) lum = 195;
      } else if (mid === "sat_telescopio") {
        const tube = Math.abs(dx) < 22 && Math.abs(dy) < 8;
        const flap = dx < -18 && dx > -28 && Math.abs(dy + 10) < 4;
        if (tube) lum = 210 - Math.abs(dy) * 8;
        else if (flap) lum = 180;
      } else if (mid === "sat_estacion") {
        const truss = Math.abs(dy) < 2.2 && Math.abs(dx) < 44;
        const modV = Math.abs(dx) < 5 && Math.abs(dy) < 22;
        const wings = (Math.abs(dx + 28) < 6 || Math.abs(dx - 28) < 6) && Math.abs(dy) < 18;
        if (truss || modV) lum = 225;
        else if (wings) lum = 175;
      } else if (mid === "pul_ms") {
        const beam = Math.abs(dy - dx * Math.tan(t * 9)) < 2.4 && dist < 46;
        if (dist < 11) lum = 245;
        else if (beam) lum = 220;
      } else if (mid === "pul_magnetar") {
        const ring = Math.abs(dist - 24) < 2.5;
        if (dist < 14) lum = 250;
        else if (ring) lum = 200;
      } else if (mid === "pul_binario") {
        const d1 = Math.hypot(dx + 12, dy);
        const d2 = Math.hypot(dx - 14, dy);
        if (d1 < 10) lum = 245;
        if (d2 < 14 && d2 > 10) lum = 195;
      }

      const snow = Math.random() * 255;
      const scanline = (y % 2 === 0) ? 0.90 : 1.0;
      const finalVal = Math.max(0, Math.min(255, (lum * (1 - staticAmt) + snow * staticAmt) * scanline));

      const idx = (y * w + x) * 4;
      if (sepiaMode) {
        d[idx] = Math.min(255, finalVal * 1.05);
        d[idx + 1] = Math.min(255, finalVal * 0.92);
        d[idx + 2] = Math.min(255, finalVal * 0.72);
      } else {
        d[idx] = finalVal;
        d[idx + 1] = finalVal;
        d[idx + 2] = finalVal;
      }
      d[idx + 3] = 255;
    }
  }
  cx.putImageData(img, 0, 0);
}

function drawMap(t) {
  const cv = $("#cv");
  if (!cv) return;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#03070d";
  cx.fillRect(0, 0, 640, 310);

  cx.strokeStyle = "rgba(52, 95, 68, 0.2)";
  cx.lineWidth = 1;
  const gx0 = -(cam.x % 80), gy0 = -(cam.y % 80);
  for (let x = gx0; x < 640; x += 80) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, 310); cx.stroke(); }
  for (let y = gy0; y < 310; y += 80) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(640, y); cx.stroke(); }

  cx.fillStyle = "#d1fae5";
  stars.forEach(([x, y, r]) => {
    const sx = x - cam.x, sy = y - cam.y;
    if (sx < 0 || sx > 640 || sy < 0 || sy > 310) return;
    cx.globalAlpha = 0.3 + 0.35 * Math.sin(t * 1.4 + x);
    cx.fillRect(sx, sy, r, r);
  });
  cx.globalAlpha = 1;

  cx.save();
  cx.translate(-cam.x, -cam.y);
  sigs.forEach(s => {
    if (s.st === "gone" || s.st === "raw") return;
    const col = s.st === "echo" ? "96, 195, 255" : s.st === "align" ? "234, 179, 8" : "74, 222, 128";
    const pulse = (t * 0.45 + s.seed) % 1;
    cx.strokeStyle = `rgba(${col}, ${(1 - pulse) * 0.65})`;
    cx.beginPath(); cx.arc(s.x, s.y, 7 + pulse * 26, 0, Math.PI * 2); cx.stroke();

    cx.fillStyle = `rgb(${col})`;
    cx.beginPath(); cx.arc(s.x, s.y, 4.5, 0, Math.PI * 2); cx.fill();

    if (s.st === "align") {
      cx.strokeStyle = "#eab308";
      cx.lineWidth = 2.5;
      cx.beginPath(); cx.arc(s.x, s.y, 16, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.align); cx.stroke();
      cx.lineWidth = 1;
    } else if (s.st === "dl") {
      cx.strokeStyle = srv ? "#ef4444" : "#4ade80";
      cx.lineWidth = 2.5;
      cx.beginPath(); cx.arc(s.x, s.y, 16, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.prog); cx.stroke();
      cx.lineWidth = 1;
    }
  });
  cx.restore();

  if (rd > 0) {
    cx.globalAlpha = Math.min(1, rd / 2);
    sigs.forEach(s => {
      if (s.st !== "echo") return;
      const sx = s.x - cam.x, sy = s.y - cam.y;
      if (sx > 10 && sx < 630 && sy > 10 && sy < 300) return;
      const a = Math.atan2(sy - 155, sx - 320);
      const k = Math.min(295 / Math.abs(Math.cos(a) || 1e-5), 136 / Math.abs(Math.sin(a) || 1e-5));
      cx.save();
      cx.translate(320 + Math.cos(a)*k, 155 + Math.sin(a)*k);
      cx.rotate(a);
      cx.fillStyle = "#4ade80";
      cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(-14, -6); cx.lineTo(-14, 6); cx.fill();
      cx.restore();
    });
    cx.globalAlpha = 1;
  }

  const aligning = sigs.find(s => s.st === "align");
  const targetAng = aligning ? Math.atan2(aligning.y - H/2, aligning.x - W/2) : -Math.PI/2;
  cx.fillStyle = "rgba(8, 14, 11, 0.78)";
  cx.fillRect(8, 268, 112, 34);
  cx.strokeStyle = "#243d2b";
  cx.strokeRect(8, 268, 112, 34);
  for (let i = 0; i < 3; i++) {
    const ax = 26 + i * 36, ay = 285;
    cx.strokeStyle = "#4ade80";
    cx.beginPath(); cx.arc(ax, ay, 8, 0, Math.PI * 2); cx.stroke();
    const curA = aligning ? (targetAng - (1 - aligning.align) * 2.2) : targetAng;
    cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(ax + Math.cos(curA)*10, ay + Math.sin(curA)*10); cx.stroke();
  }
}

function drawCRT(t) {
  const cv = $("#crt");
  if (!cv || !cur) return;
  const [rw, rh] = CRT_RES[Math.min(5, G.f)];
  if (cv.width !== rw || cv.height !== rh) {
    cv.width = rw;
    cv.height = rh;
  }
  const tuneErr = cur.fixed ? 0 : Math.min(1, (offF(cur) + offP(cur)) * 0.75);
  renderCelestialToCanvas(cv, cur, t, G.f, tuneErr, false, isOpticalFailed());
}

function drawAtlasCanvases(t) {
  document.querySelectorAll("[data-atlas-mid]").forEach(cv => {
    const mid = cv.dataset.atlasMid;
    const mod = MODELS.find(m => m.id === mid);
    if (mod) {
      renderCelestialToCanvas(cv, {modelId: mod.id, img: mod.img, seed: 2.1, anom: false, anomType: ""}, t, 5, 0, false, false);
    }
  });
  document.querySelectorAll("[data-anom-idx]").forEach(cv => {
    const idx = +cv.dataset.anomIdx;
    const item = discoveredAnomalies[idx];
    if (item) {
      renderCelestialToCanvas(cv, item, t, 5, 0, true, false);
    }
  });
}

function drawSpectrogram(t) {
  const cv = $("#spec");
  if (!cv || !cur) return;
  const cx = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  cx.fillStyle = "#030805";
  cx.fillRect(0, 0, w, h);

  cx.strokeStyle = "rgba(52, 95, 68, 0.25)";
  for (let x = 0; x < w; x += 40) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, h); cx.stroke(); }
  for (let y = 0; y < h; y += 30) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(w, y); cx.stroke(); }

  const cat = cur.cat;
  for (let x = 0; x < w; x += 3) {
    const phase = x * 0.04 + t * 2.2;
    if (cur.anom) {
      for (let b = 0; b < 4; b++) {
        const bend = Math.exp(-Math.pow((x - w/2)/65, 2)) * 38;
        const y = 30 + b * 28 + bend + Math.sin(phase * 1.4 + b) * 4;
        cx.fillStyle = "rgba(248, 113, 113, 0.88)";
        cx.fillRect(x, y, 2, 5);
      }
    } else if (cat === 0) {
      for (let b = 0; b < 3; b++) {
        const y = 38 + b * 42 + Math.sin(phase * 0.7 + b) * 4;
        cx.fillStyle = "rgba(74, 222, 128, 0.55)";
        cx.fillRect(x, y - 6, 3, 12);
      }
    } else if (cat === 1) {
      for (let b = 0; b < 4; b++) {
        const y = 32 + b * 28 + Math.sin(phase + b) * 2;
        cx.fillStyle = "rgba(74, 222, 128, 0.82)";
        cx.fillRect(x, y, 3, 4);
      }
    } else if (cat === 4) {
      if (((x + Math.floor(t * 45)) % 36) < 4) {
        cx.fillStyle = "rgba(74, 222, 128, 0.9)";
        cx.fillRect(x, 18, 3, h - 36);
      }
    } else if (cat === 3) {
      const slot = Math.floor((x + t * 35) / 18);
      if ((slot * 7 + Math.floor(cur.seed)) % 3 === 0) {
        const top = 26 + (slot % 3) * 32;
        cx.fillStyle = "rgba(74, 222, 128, 0.85)";
        cx.fillRect(x, top, 3, 28);
      }
    } else if (cat === 2) {
      const y = ((x * 0.6 + t * 40) % (h - 30)) + 15;
      cx.fillStyle = "rgba(134, 239, 172, 0.65)";
      cx.fillRect(x, y, 2, 9);
    }
  }
}

function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  tick(dt);
  const t = now / 1000;
  if (V === "boot") drawBoot();
  if (V === "map") drawMap(t);
  if (V === "proc") drawCRT(t);
  if (V === "spec") drawSpectrogram(t);
  if (V === "atlas") drawAtlasCanvases(t);
  requestAnimationFrame(loop);
}
