                <div class="prox-bar"><div class="prox-fill" id="barF" style="width:${pF}%;background:${colF}"></div></div>
                <span id="txtF" style="width:82px;text-align:right;color:${colF}">${pF}%</span>
              </div>
            </div>
            <div style="margin-top:10px">
              <div class="row" style="margin-bottom:2px">
                <span style="width:95px;font-size:12px">POLARIDAD</span>
                <input type="range" id="knP" min="0" max="100" value="${knobP}">
                <span id="valP" style="width:32px;text-align:right">${knobP}</span>
              </div>
              <div class="prox-wrap">
                <span class="mut" style="width:95px">PROXIMIDAD:</span>
                <div class="prox-bar"><div class="prox-fill" id="barP" style="width:${pP}%;background:${colP}"></div></div>
                <span id="txtP" style="width:82px;text-align:right;color:${colP}">${pP}%</span>
              </div>
            </div>
            <div class="row" style="margin-top:12px">
              <button class="alt" id="playAu">${activeVoice ? "Detener audio" : "Escuchar audio (-2 PWR)"}</button>
              <button id="fixBtn" ${tuned && !cur.fixed ? "" : "disabled"}>Fijar captura</button>
              <button class="bad" id="dropBtn">Descartar</button>
            </div>
          </div>`;

        if (cur.fixed) {
          const needSub = isSubcatEnabled();
          const catModels = choiceCat !== null ? MODELS.filter(m => m.cat === choiceCat) : [];
          const canQueue = choiceCat !== null && (!needSub || choiceMod !== null);

          h += `<div class="card">
            <div class="mut" style="font-size:12px;margin-bottom:6px">1. SELECCIONA CATEGORIA PRINCIPAL:</div>
            <div class="grid">
              ${CLASSES.map((c, i) => `<button class="${choiceCat === i ? "" : "alt"}" data-k="${i}">${c}</button>`).join("")}
            </div>
            ${needSub && choiceCat !== null ? `
              <div class="mut" style="font-size:12px;margin:10px 0 6px">2. ESPECIFICA SUBCATEGORIA (HABILITADO DESDE NOCHE 10):</div>
              <div class="grid">
                ${catModels.map(m => `<button class="${choiceMod === m.id ? "" : "alt"}" data-mod="${m.id}">${m.name}</button>`).join("")}
              </div>
            ` : ""}
            <div class="row" style="justify-content:flex-end;margin-top:10px">
              <button id="queueBtn" ${canQueue ? "" : "disabled"}>Preparar paquete para Plataforma</button>
            </div>
          </div>`;
        }
      }
    }
  } else if (V === "plat") {
    const selPkg = outbox.find(p => p.id === selPkgId) || outbox[0] || null;
    if (selPkg) selPkgId = selPkg.id;
    const nightAssigns = nightAssignments.filter(a => a.night === shift);
    const extrasMode = allNightAssignsClosed();

    h = `
      <div class="card">
        <b>PLATAFORMA DE ENVIO INDEPENDIENTE</b>
        <div class="mut" style="font-size:12px">Selecciona un paquete preparado y elige manualmente su destinatario.</div>
        <div class="row" style="margin-top:8px">
          ${outbox.length
            ? outbox.map(p => {
                const mod = MODELS.find(m => m.id === p.chosenMod);
                const lbl = `PAQ #${p.sigId} · ${CLASSES[p.chosenCat]}${mod ? ` (${mod.name})` : ""}`;
                return `<button class="${selPkg && selPkg.id === p.id ? "" : "alt"}" data-pkg="${p.id}">${lbl}</button>`;
              }).join("")
            : `<span class="mut">No hay paquetes preparados en cola. Procesa y fija una captura primero.</span>`}
        </div>
      </div>`;

    if (selPkg) {
      h += `
        <div class="card">
          <div class="mut" style="font-size:12px;margin-bottom:8px">DESTINATARIOS DISPONIBLES PARA PAQUETE #${selPkg.sigId}:</div>
          ${nightAssigns.map((a, idx) => {
            const mod = a.modelId ? MODELS.find(m => m.id === a.modelId) : null;
            const reqTxt = `${CLASSES[a.cat]}${mod ? ` (${mod.name})` : ""}`;
            return `<div class="between" style="padding:7px 0;border-bottom:1px solid #166534">
              <div>
                <b>Encargo ${idx + 1}/3 · ${a.sciName}</b>
                <div class="mut" style="font-size:12px">Solicita: ${reqTxt} · Pago: $${a.reward} CR</div>
              </div>
              <button data-send-as="${a.id}" ${a.done || a.failed ? "disabled" : ""}>
                ${a.done ? "ENTREGADO" : a.failed ? "EXPIRADO" : "Enviar a encargo"}
              </button>
            </div>`;
          }).join("")}

          <div class="between" style="padding:9px 0;border-bottom:1px solid #166534">
            <div>
              <b>Archivo Central (Envio Libre / Extra)</b>
              <div class="mut" style="font-size:12px">
                ${extrasMode
                  ? "Asignaciones diarias completadas: tarifa extra -25% ($36 CR), Satelites conservan 100% ($60 CR)."
                  : "Envio secundario fuera de asignacion (-25% = $36 CR; Satelites 100% = $60 CR)."}
              </div>
            </div>
            <button class="alt" id="sendCentralBtn">Enviar a Central</button>
          </div>

          ${shadowBuyerUnlocked ? `
            <div class="between" style="padding:9px 0">
              <div>
                <b style="color:#d8b4fe">Canal Cifrado // Intermediario Sombra</b>
                <div class="mut" style="font-size:12px">Compra directa de lecturas anomalas fuera de la red oficial ($240 CR).</div>
              </div>
              <button class="shadow" id="sendShadowBtn">Transmitir por Canal Cifrado</button>
            </div>
          ` : ""}
        </div>`;
    }
  } else if (V === "atlas") {
    h = `
      <div class="card">
        <b>ATLAS DE CUERPOS CELESTES (${discoveredModels.size}/${MODELS.length} DESCUBIERTOS)</b>
        <div class="atlas-grid">
          ${MODELS.map(m => {
            const unlocked = discoveredModels.has(m.id);
            if (!unlocked) {
              return `<div class="atlas-card locked">
                <div style="font-size:11px" class="mut">${CLASSES[m.cat].toUpperCase()}</div>
                <b>[NO DESCUBIERTO]</b>
                <div class="mut" style="font-size:11px">Verifica esta senal en Central para desbloquear su registro visual y sonoro.</div>
              </div>`;
            }
            return `<div class="atlas-card">
              <div class="between">
                <span style="font-size:11px;color:#ffffff">${CLASSES[m.cat].toUpperCase()}</span>
                <button class="alt" style="padding:2px 7px;font-size:11px" data-atlas-au="${m.id}">Audio</button>
              </div>
              <b>${m.name}</b>
              <canvas class="atlas-cv" width="96" height="58" data-atlas-mid="${m.id}"></canvas>
              <div class="mut" style="font-size:11px">${m.desc}</div>
            </div>`;
          }).join("")}
        </div>
      </div>`;

    if (discoveredAnomalies.length > 0) {
      h += `
        <div class="paper-sheet">
          <h3>REGISTRO EN PAPEL // ANOMALIAS</h3>
          <div class="paper-grid">
            ${discoveredAnomalies.map((a, idx) => `
              <div class="paper-entry">
                <div class="between">
                  <b>${a.anomTitle}</b>
                  <button class="paper-btn" data-anom-au="${idx}">Audio</button>
                </div>
                <canvas class="paper-cv" width="96" height="58" data-anom-idx="${idx}"></canvas>
                <div class="paper-bin">${a.textData}</div>
              </div>
            `).join("")}
          </div>
        </div>`;
    }
  } else if (V === "spec") {
    const ready = sigs.filter(s => s.st === "raw");
    if (cur && !ready.includes(cur)) cur = null;
    if (!cur && ready[0]) { cur = ready[0]; knobF = 50; knobP = 50; choiceCat = null; choiceMod = null; }

    h = `<div class="row">
      <span class="mut" style="font-size:12px">ANALISIS ESPECTRAL:</span>
      ${ready.length ? ready.map(s => `<button class="${s === cur ? "" : "alt"}" data-s="${s.id}">TRAMA #${s.id}</button>`).join("") : `<span class="mut">Sin tramas en buffer</span>`}
    </div>`;

    if (cur) {
      h += `
        <canvas id="spec" width="640" height="190"></canvas>
        <div class="card">
          <div class="between">
            <b>SUBPORTADORA // TRAMA #${cur.id}</b>
            ${cur.cat === 3 && !cur.anom ? `<button id="saveSatBtn">Guardar datos de satelite</button>` : ""}
          </div>
          <div class="databox ${cur.anom ? "anom" : ""}">${cur.textData}</div>
        </div>`;
    }
  } else if (V === "srv") {
    h = srv ? `
      <div class="card">
        <b>ENLACE DE RELES INTERRUMPIDO (${srv.count} MODULOS)</b>
        <p class="mut">Activa los ${srv.count} reles en el orden correcto de sincronizacion (avance: ${srv.step}/${srv.count}).</p>
        <div class="grid">
          ${Array.from({length: srv.count}, (_, i) => {
            const on = srv.latched[i];
            return `<button class="${on ? "" : "alt"}" data-b="${i}">RELE 0${i + 1}</button>`;
          }).join("")}
        </div>
      </div>` : `<div class="card"><b>SERVIDOR EN LINEA</b><p class="mut">Sin incidencias.</p></div>`;
  } else if (V === "shop") {
    const upgrades = [
      ["a", "Servomotores de Antena", "Acelera el giro de antenas y la descarga.", 5, 85 + 55 * G.a],
      ["f", "Filtro CRT Optico", "Aumenta la resolucion del CRT y reduce la estatica.", 5, 80 + 50 * G.f],
      ["b", "Banco de Baterias", "Aumenta la capacidad maxima de PWR (+20 por nivel).", 5, 75 + 45 * G.b],
      ["spec", "Modulo Espectrograma", "Habilita Espectrograma y lectura de subportadoras.", 5, 65 + 40 * G.spec]
    ];
    h = upgrades.map(([k, name, desc, maxLv, cost]) => {
      const lv = G[k];
      return `<div class="card between">
        <div>
          <b>${name}</b> <span class="mut">[NV ${lv}/${maxLv}]</span>
          <div class="mut" style="font-size:12px">${desc}</div>
        </div>
        <button data-u="${k}" ${lv >= maxLv || G.money < cost ? "disabled" : ""}>${lv >= maxLv ? "MAXIMO" : `$${cost} CR`}</button>
      </div>`;
    }).join("") + `
    <div class="card between">
      <div>
        <b>Celda de Energia Auxiliar (+45 PWR)</b>
        <div class="mut" style="font-size:12px">Suministro de emergencia indispensable cuando la recarga es lenta o nula.</div>
      </div>
      <button id="buyCellBtn" ${G.money < 30 || en >= cap ? "disabled" : ""}>$30 CR</button>
    </div>`;
  } else if (V === "end") {
    if (gameOverReason === "ARREST") {
      h = `
        <div class="card dangerbox" style="padding:22px">
          <div style="font-size:12px;color:#fca5a5;letter-spacing:1.5px">INTERVENCION GUBERNAMENTAL // DIVISION DEL ESPACIO DE NACIONES UNIDAS</div>
          <h2 style="margin:8px 0;color:#f87171">ESTACION ERIAL-7 CLAUSURADA</h2>
          <p>
            Al transmitir una senal anomala a traves de la red oficial, los filtros de seguridad de la <b>Division del Espacio de Naciones Unidas</b> rastrearon el origen hasta tu terminal.
          </p>
          <p class="mut">
            Fuerzas de contencion orbital han clausurado la estacion Erial-7 y has sido puesto bajo arresto preventivo para investigacion.
          </p>
          <div class="row" style="margin-top:16px">
            <button id="rsBtn">Iniciar nueva partida</button>
          </div>
        </div>`;
    } else {
      h = `
        <div class="card" style="padding:22px">
          <div style="font-size:12px;color:#ffffff;letter-spacing:1.5px">CAMPANA COMPLETADA // 15 NOCHES</div>
          <h2 style="margin:8px 0;color:#ffffff">GUARDIA FINALIZADA · OP. ${S.playerName.toUpperCase()}</h2>
          <p>
            Has completado las 15 noches de vigilancia en la Estacion Erial-7.
          </p>
          <div class="row">
            <span class="pill">Creditos finales: $${G.money} CR</span>
            <span class="pill">Modelos en Atlas: ${discoveredModels.size}/${MODELS.length}</span>
            <span class="pill">Anomalias registradas: ${discoveredAnomalies.length}</span>
          </div>
          <div class="row" style="margin-top:16px">
            <button id="rsBtn">Iniciar nueva partida</button>
          </div>
        </div>`;
    }
  }

  w.innerHTML = h;
  bindEvents(w);
}

function bindEvents(w) {
  const on = (sel, fn) => { const el = w.querySelector(sel); if (el) el.onclick = fn; };

  const bootEl = w.querySelector("#bootScreen");
  if (bootEl) {
    bootEl.onclick = () => {
      if (playStartupSound(false)) {
        const hint = w.querySelector("#bootAudioHint");
        if (hint) hint.style.display = "none";
      }
    };
  }

  const pn = w.querySelector("#playerName");
  const apn = w.querySelector("#adminPlayerName");
  const sn = w.querySelector("#startNight");

  if (sn) {
    sn.onchange = e => { selectedStartNight = +e.target.value; };
  }

  if (pn) {
    pn.oninput = e => { playerNameInput = e.target.value; };
    pn.onkeydown = e => {
      if (e.key === "Enter") {
        beep(520, 0.1);
        adminModalOpen = false;
        start(pn.value, 0, false);
      }
    };
    pn.onfocus = () => {
      if (bootLoginChimePending && !bootSoundPlayed) {
        playStartupSound(false);
      }
    };
    if (!adminModalOpen) {
      setTimeout(() => pn.focus(), 30);
    }
  }

  if (apn) {
    apn.oninput = e => {
      playerNameInput = e.target.value;
      if (pn) pn.value = playerNameInput;
    };
    apn.onkeydown = e => {
      if (e.key === "Enter") {
        const nightVal = sn ? +sn.value : selectedStartNight;
        beep(620, 0.12);
        adminModalOpen = false;
        start(apn.value, nightVal, true);
      } else if (e.key === "Escape") {
        adminModalOpen = false;
        render();
      }
    };
    setTimeout(() => apn.focus(), 30);
  }

  on("#go", () => {
    const val = w.querySelector("#playerName")?.value || playerNameInput;
    if (bootLoginChimePending && !bootSoundPlayed) {
      playStartupSound(false);
    } else {
      beep(520, 0.1);
    }
    adminModalOpen = false;
    start(val, 0, false);
  });

  on("#openAdminBtn", () => {
    const val = w.querySelector("#playerName")?.value;
    if (typeof val === "string") playerNameInput = val;
    if (bootLoginChimePending && !bootSoundPlayed) {
      playStartupSound(false);
    } else {
      beep(460, 0.08);
    }
    adminModalOpen = true;
    render();
  });

  on("#closeAdminBtn", () => {
    beep(380, 0.06);
    adminModalOpen = false;
    render();
  });

  on("#cancelAdminBtn", () => {
    beep(380, 0.06);
    adminModalOpen = false;
    render();
  });

  on("#adminNormalBtn", () => {
    const val = w.querySelector("#adminPlayerName")?.value || playerNameInput;
    const nightVal = sn ? +sn.value : selectedStartNight;
    beep(520, 0.1);
    adminModalOpen = false;
    start(val, nightVal, false);
  });

  on("#adminFreeBtn", () => {
    const val = w.querySelector("#adminPlayerName")?.value || playerNameInput;
    const nightVal = sn ? +sn.value : selectedStartNight;
    beep(620, 0.12);
    adminModalOpen = false;
    start(val, nightVal, true);
  });

  w.querySelectorAll("[data-m]").forEach(el => el.onclick = () => {
    markFirst();
    const m = mail.find(x => x.id === el.dataset.m);
    if (m) { m.read = 1; selMail = m.id; beep(380, 0.04); render(); updBadges(); }
  });

  on("#clearMailBtn", () => {
    if (!mail.length) return;
    mail = [];
    selMail = null;
    beep(340, 0.06);
    updBadges();
    render();
  });

  const nb = w.querySelector("#notesBox");
  if (nb) nb.oninput = e => { notes = e.target.value; syncLiveTelemetry(false, false); };

  on("#sendSatMail", () => {
    if (!savedSatLog) return;
    markFirst();
    const log = savedSatLog;
    savedSatLog = null;
    satReportsSent++;
    if (R) R.satReports++;
    G.money += 45;
    beep(640, 0.1);
    addMail(
      "RE: REPORTE DE TELEMETRIA SATELITAL [RECIBIDO]",
      `Registro orbital archivado:\n${log}\n\nBonificacion acreditada: +$45 CR.`
    );
    msg("[OK] Reporte satelital enviado (+$45 CR)", 1);
    syncLiveTelemetry(false, true);
    updTop();
    render();
  });



  on("#goSrvBtn", () => {
    beep(420, 0.05);
    V = "srv";
    render();
  });

  const cv = $("#cv");
  if (cv) {
    cv.onpointerdown = e => {
      moved = 0;
      drag = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y};
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    };
    cv.onpointermove = e => {
      if (!drag) return;
      const r = cv.getBoundingClientRect();
      const dx = (e.clientX - drag.x) * 640 / r.width;
      const dy = (e.clientY - drag.y) * 310 / r.height;
      if (Math.hypot(dx, dy) > 6) moved = 1;
      if (moved) {
        cam.x = Math.max(0, Math.min(W - 640, drag.cx - dx));
        cam.y = Math.max(0, Math.min(H - 310, drag.cy - dy));
      }
    };
    cv.onpointerup = cv.onpointercancel = () => { drag = null; };
    cv.onclick = e => {
      if (moved) return;
      markFirst();
      const r = cv.getBoundingClientRect();
      const x = (e.clientX - r.left) * 640 / r.width + cam.x;
      const y = (e.clientY - r.top) * 310 / r.height + cam.y;
      const hit = sigs.find(s => (s.st === "echo" || s.st === "align" || s.st === "dl") && Math.hypot(s.x - x, s.y - y) < 32);
      if (!hit) { if (R) R.invalid++; syncLiveTelemetry(false, false); return; }

      if (hit.st === "echo") {
        const busySig = sigs.find(s => s.st === "align" || s.st === "dl");
        if (busySig) {
          if (pendingOverrideSig && pendingOverrideSig.id === hit.id) {
            if (en < 8) { beep(180, 0.15, "sawtooth"); return msg("[ERR] Energia insuficiente (8 PWR)", 0); }
            busySig.st = "gone";
            pendingOverrideSig = null;
            en -= 8;
            hit.st = "align";
            ensureSectorDiversity();
            beep(340, 0.12, "triangle");
            msg(`[OK] Busqueda anterior cancelada // Rastreando #${hit.id}`, 1);
            updTop();
            render();
            return;
          }
          pendingOverrideSig = hit;
          beep(220, 0.1, "sawtooth");
          msg(`[AVISO] Antenas ocupadas con #${busySig.id}. Insiste para cancelar y cambiar.`, 0);
          render();
          return;
        }

        if (en < 8) { if (R) R.invalid++; beep(180, 0.15, "sawtooth"); return msg("[ERR] Energia insuficiente (8 PWR)", 0); }
        en -= 8;
        hit.st = "align";
        pendingOverrideSig = null;
        beep(320, 0.12, "triangle");
        syncLiveTelemetry(false, true);
        updTop();
        render();
      }
    };
  }

  on("#confirmOverrideBtn", () => {
    if (!pendingOverrideSig) return;
    const busySig = sigs.find(s => s.st === "align" || s.st === "dl");
    if (en < 8) { beep(180, 0.15, "sawtooth"); return msg("[ERR] Energia insuficiente (8 PWR)", 0); }
    if (busySig) busySig.st = "gone";
    en -= 8;
    pendingOverrideSig.st = "align";
    const newId = pendingOverrideSig.id;
    pendingOverrideSig = null;
    ensureSectorDiversity();
    beep(340, 0.12, "triangle");
    msg(`[OK] Investigacion reemplazada // Rastreando #${newId}`, 1);
    updTop();
    render();
  });

  on("#cancelOverrideBtn", () => {
    pendingOverrideSig = null;
    render();
  });

  on("#rd", () => {
    markFirst();
    if (rd > 0) return;
    if (en < 6) { if (R) R.invalid++; return msg("[ERR] Energia insuficiente (6 PWR)", 0); }
    en -= 6; rd = 7;
    beep(580, 0.12);
    updTop();
  });

  w.querySelectorAll("[data-s]").forEach(el => el.onclick = () => {
    cur = sigs.find(s => s.id === +el.dataset.s) || null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    stopVoice();
    render();
  });

  const knF = $("#knF"), knP = $("#knP");
  if (knF) knF.oninput = e => {
    knobF = +e.target.value;
    const vf = $("#valF");
    if (vf) vf.textContent = knobF;
    if (R) R.retunes++;
    if (cur) {
      const pF = proxPct(knobF, cur.tgF);
      const colF = pF >= 88 ? "#4ade80" : pF >= 55 ? "#eab308" : "#ef4444";
      const bf = $("#barF"), tf = $("#txtF");
      if (bf) { bf.style.width = `${pF}%`; bf.style.background = colF; }
      if (tf) { tf.textContent = `${pF}%`; tf.style.color = colF; }
      const fb = $("#fixBtn");
      if (fb) fb.disabled = !(isTuned(cur) && !cur.fixed);
    }
  };
  if (knP) knP.oninput = e => {
    knobP = +e.target.value;
    const vp = $("#valP");
    if (vp) vp.textContent = knobP;
    if (R) R.retunes++;
    if (cur) {
      const pP = proxPct(knobP, cur.tgP);
      const colP = pP >= 88 ? "#4ade80" : pP >= 55 ? "#eab308" : "#ef4444";
      const bp = $("#barP"), tp = $("#txtP");
      if (bp) { bp.style.width = `${pP}%`; bp.style.background = colP; }
      if (tp) { tp.textContent = `${pP}%`; tp.style.color = colP; }
      const fb = $("#fixBtn");
      if (fb) fb.disabled = !(isTuned(cur) && !cur.fixed);
    }
  };

  on("#playAu", () => {
    if (!cur) return;
    if (activeVoice) { stopVoice(); render(); return; }
    if (en < 2) { if (R) R.invalid++; return msg("[ERR] Energia insuficiente (2 PWR)", 0); }
    en -= 2;
    if (R) R.repeats++;
    playSignalAudio(cur);
    syncLiveTelemetry(false, false);
    updTop();
    render();
  });

  on("#fixBtn", () => {
    if (!cur || !isTuned(cur)) return;
    cur.fixed = true;
    beep(620, 0.08);

    if (cur.anom) {
      if (!discoveredAnomalies.some(a => a.anomType === cur.anomType)) {
        discoveredAnomalies.push({
          anomTitle: cur.anomTitle,
          anomType: cur.anomType,
          modelId: cur.modelId,
          img: cur.img,
          seed: cur.seed,
          anom: true,
          textData: cur.textData
        });
      }
      onFirstAnomalyDiscovered();
    }

    syncLiveTelemetry(false, true);
    render();
  });

  on("#dropBtn", () => {
    if (!cur) return;
    stopVoice();
    cur.st = "gone";
    cur = null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    ensureSectorDiversity();
    msg("Trama descartada", 1);
    render();
  });

  w.querySelectorAll("[data-k]").forEach(el => el.onclick = () => {
    choiceCat = +el.dataset.k;
    choiceMod = null;
    beep(440, 0.04);
    render();
  });

  w.querySelectorAll("[data-mod]").forEach(el => el.onclick = () => {
    choiceMod = el.dataset.mod;
    beep(490, 0.04);
    render();
  });

  on("#queueBtn", () => {
    if (!cur || choiceCat === null) return;
    if (isSubcatEnabled() && choiceMod === null) return;
    stopVoice();
    const pkgId = uid();
    outbox.push({
      id: pkgId,
      sigId: cur.id,
      trueCat: cur.cat,
      trueMod: cur.modelId,
      anom: cur.anom,
      anomTitle: cur.anomTitle,
      chosenCat: choiceCat,
      chosenMod: choiceMod
    });
    selPkgId = pkgId;
    cur.st = "gone";
    cur = null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    ensureSectorDiversity();
    beep(560, 0.1);
    msg("[OK] Paquete enviado a Plataforma de Envio", 1);
    V = "plat";
    render();
  });

  w.querySelectorAll("[data-pkg]").forEach(el => el.onclick = () => {
    selPkgId = el.dataset.pkg;
    render();
  });

  w.querySelectorAll("[data-send-as]").forEach(el => el.onclick = () => {
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox.splice(pkgIdx, 1)[0];
    selPkgId = outbox[0]?.id || null;
    beep(540, 0.1);
    msg("[OK] Paquete despachado a asignacion", 1);
    pendingEvals.push({
      at: performance.now() + 1800,
      pkg,
      targetType: "assign",
      assignId: el.dataset.sendAs
    });
    render();
  });

  on("#sendCentralBtn", () => {
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox.splice(pkgIdx, 1)[0];
    selPkgId = outbox[0]?.id || null;
    beep(540, 0.1);
    msg("[OK] Paquete despachado a Archivo Central", 1);
    pendingEvals.push({
      at: performance.now() + 1800,
      pkg,
      targetType: "central"
    });
    render();
  });

  on("#sendShadowBtn", () => {
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox.splice(pkgIdx, 1)[0];
    selPkgId = outbox[0]?.id || null;
    beep(620, 0.12);
    msg("[OK] Paquete enviado por Canal Cifrado", 1);
    pendingEvals.push({
      at: performance.now() + 1800,
      pkg,
      targetType: "shadow"
    });
    render();
  });

  w.querySelectorAll("[data-atlas-au]").forEach(el => el.onclick = () => {
    playSignalAudio({modelId: el.dataset.atlasAu, anom: false, anomType: ""});
  });

  w.querySelectorAll("[data-anom-au]").forEach(el => el.onclick = () => {
    const item = discoveredAnomalies[+el.dataset.anomAu];
    if (item) playSignalAudio(item);
  });

  on("#saveSatBtn", () => {
    if (!cur || cur.cat !== 3 || cur.anom) return;
    savedSatLog = cur.textData;
    beep(600, 0.08);
    msg("[OK] Telemetria satelital guardada", 1);
  });

  w.querySelectorAll("[data-b]").forEach(el => el.onclick = () => {
    if (!srv) return;
    const idx = +el.dataset.b;
    if (srv.latched[idx]) return;
    const expected = srv.seq[srv.step];
    if (idx === expected) {
      srv.latched[idx] = true;
      srv.step++;
      en = Math.max(0, en - 1);
      beep(440 + srv.step * 90, 0.09);
      if (srv.step >= srv.seq.length) {
        if (R) R.fix += +((performance.now() - srv.t) / 1000).toFixed(1);
        srv = null;
        msg("[OK] Servidor restablecido", 1);
        syncLiveTelemetry(false, true);
      }
      render();
    } else {
      srv.step = 0;
      srv.latched = Array(srv.count).fill(false);
      beep(150, 0.16, "sawtooth");
      msg("[ERR] Secuencia de reles reiniciada", 0);
      render();
    }
  });

  w.querySelectorAll("[data-u]").forEach(el => el.onclick = () => {
    const k = el.dataset.u;
    if (G[k] >= 5) return;
    const costs = {
      a: 85 + 55 * G.a,
      f: 80 + 50 * G.f,
      b: 75 + 45 * G.b,
      spec: 65 + 40 * G.spec
    };
    const cost = costs[k];
    if (G.money < cost) return;
    G.money -= cost;
    G[k]++;
    if (k === "b") { cap = 100 + 20 * G.b; en = Math.min(cap, en + 20); }
    beep(660, 0.1);
    msg(`[OK] Mejora instalada (NV ${G[k]}/5)`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    render();
  });

  on("#buyCellBtn", () => {
    if (G.money < 30 || en >= cap) return;
    G.money -= 30;
    en = Math.min(cap, en + 45);
    beep(680, 0.1);
    msg("[OK] Celda auxiliar conectada (+45 PWR)", 1);
    updTop();
    render();
  });

  on("#rsBtn", () => { adminModalOpen = false; V = "intro"; updTop(); render(); });
}

function unlockBootAudioOnGesture() {
  if (V === "boot" && !bootSoundPlayed) {
    if (playStartupSound(false)) {
      const hint = document.querySelector("#bootAudioHint");
      if (hint) hint.style.display = "none";
    }
  }
}
window.addEventListener("pointerdown", unlockBootAudioOnGesture, { passive: true });
window.addEventListener("keydown", unlockBootAudioOnGesture, { passive: true });

function bootTerminal() {
  try {
    preloadAllSprites();
    startBootSequence();
    requestAnimationFrame(loop);
  } catch (err) {
    const w = document.querySelector("#win");
    if (w) {
      w.innerHTML = `<div class="card dangerbox"><b>ERROR DE INICIALIZACION</b><pre style="white-space:pre-wrap;font-size:12px">${err && err.stack ? err.stack : err}</pre></div>`;
    }
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootTerminal);
} else {
  bootTerminal();
}
</script>
</body>
</html>
