<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inicio de Sesion del Sistema</title>
<style>
:root{
  --bg:#000000;--panel:#000000;--card:#000000;--border:#22c55e;
  --fg:#ffffff;--mut:#d4d4d8;--accent:#22c55e;--warn:#eab308;--bad:#ef4444;--blue:#38bdf8;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{
  height:100%;margin:0;padding:0;background:#000000;color:#ffffff;
  font:14px/1.45 ui-monospace,"Cascadia Code","Fira Code",Consolas,monospace;
}
body{
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,6px) 8px env(safe-area-inset-bottom,8px);
  overflow:hidden;
}
main{
  width:100%;max-width:100%;flex:1;min-height:0;display:flex;flex-direction:column;margin:0;
}
.terminal{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  overflow:hidden;box-shadow:0 0 0 1px #000000, 0 12px 40px rgba(0,0,0,.92);
  position:relative;flex:1;min-height:0;display:flex;flex-direction:column;width:100%;
}
.terminal::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0px,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px);
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 12px;background:#000000;border-bottom:1px solid #22c55e;font-size:12px;color:#ffffff;
  flex:none;
}
.topbar b{color:#ffffff;letter-spacing:1px}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:#000000;border:1px solid #22c55e;color:#ffffff;padding:3px 8px;border-radius:3px}
.pill.night{border-color:#ef4444;color:#ffffff;background:#000000}
.pill.slowrech{border-color:#eab308;color:#ffffff;background:#000000}
.pill.norech{border-color:#f97316;color:#ffffff;background:#000000}
#tabs{
  display:flex;overflow-x:auto;background:#000000;border-bottom:2px solid #22c55e;
  gap:2px;padding:4px 6px;flex:none;
}
.tab{
  flex:none;background:#000000;color:#e4e4e7;
  border:1px solid #166534;border-radius:3px;
  padding:7px 14px;font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.4px;
  cursor:pointer;transition:.12s;
}
.tab:hover{background:#061c0e;color:#ffffff;border-color:#22c55e}
.tab.on{
  background:#072412;color:#ffffff;border:2px solid #22c55e;
  box-shadow:inset 0 -2px #4ade80;
}
.bd{background:#22c55e;color:#000000;border-radius:3px;padding:0 5px;font-weight:800;font-size:11px;margin-left:6px}
#win{
  padding:10px 12px;flex:1;min-height:0;display:flex;flex-direction:column;
  background:#000000;color:#ffffff;position:relative;overflow-y:auto;
}
button{
  font:inherit;font-size:13px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:7px 14px;cursor:pointer;
}
button:hover:not(:disabled){background:#072412;border-color:#4ade80;color:#ffffff}
button.primary-os{
  border-width:2px;font-weight:700;
}
button.logout-btn{
  padding:3px 10px;font-size:12px;font-weight:700;border-width:1px;
}
button.logout-btn:not(:disabled){
  border-color:#4ade80;background:#062110;color:#ffffff;
}
button.alt{background:#000000;color:#ffffff;border:1px solid #22c55e}
button.alt:hover:not(:disabled){background:#072412;border-color:#4ade80}
button.bad{background:#000000;border:1px solid #ef4444;color:#ffffff}
button.bad:hover:not(:disabled){background:#240808}
button.warn{background:#000000;border:1px solid #eab308;color:#ffffff}
button.warn:hover:not(:disabled){background:#241b06}
button.shadow{background:#000000;border:1px solid #a855f7;color:#ffffff}
button.shadow:hover:not(:disabled){background:#1c0b2e}
button:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:8px 0}
.card{background:#000000;border:1px solid #22c55e;border-radius:4px;padding:10px;margin:8px 0;color:#ffffff}
.card.warnbox{border-color:#eab308;background:#000000}
.card.dangerbox{border-color:#ef4444;background:#000000}
.card.shadowbox{border-color:#a855f7;background:#000000}
.mut{color:#d4d4d8}

/* Panel de Correo inspirado en terminal clásica de dos columnas */
.mail-shell{
  flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;
}
.mail-layout{
  flex:1;display:grid;grid-template-columns:1fr;gap:8px;min-height:360px;
}
@media(min-width:760px){
  .mail-layout{grid-template-columns:minmax(310px,38%) 1fr}
}
.mail-pane{
  border:2px solid #22c55e;border-radius:4px;background:#000000;
  display:flex;flex-direction:column;min-height:320px;overflow:hidden;
}
.mail-pane-top{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 10px;background:#000000;border-bottom:1px solid #22c55e;
  font-size:12px;font-weight:700;
}
.mail-list{
  flex:1;overflow-y:auto;background:#000000;
}
.mi{
  display:grid;grid-template-columns:115px 1fr auto;gap:8px;align-items:center;
  padding:8px 10px;border-bottom:1px solid #14532d;cursor:pointer;font-size:12.5px;color:#ffffff;
}
.mi:hover{background:#061c0e}
.mi.un{font-weight:700;background:#031208}
.mi.sel{background:#092b16;outline:1px solid #22c55e}
.mi.anom-mail{border-left:3px solid #a855f7}
.mi-sender{
  color:#4ade80;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi-subj{
  color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi-tag{
  color:#38bdf8;font-size:11.5px;font-weight:700;white-space:nowrap;
}
.mail-reader-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 12px;border-bottom:1px solid #22c55e;background:#000000;
}
.mail-sender-box{
  display:flex;align-items:center;gap:10px;
}
.mail-sender-avatar{
  width:30px;height:30px;border:1px solid #22c55e;border-radius:3px;
  display:flex;align-items:center;justify-content:center;background:#000000;flex:none;
}
.mail-sender-name{
  font-size:14px;font-weight:700;color:#fde047;letter-spacing:.3px;
}
.mail-reader-meta{
  color:#38bdf8;font-size:12px;font-weight:700;
}
.mail-reader-subj{
  padding:8px 14px;border-bottom:1px solid #14532d;
  color:#4ade80;font-size:15px;font-weight:700;background:#000000;
}
.mail-body{
  flex:1;padding:14px 16px;white-space:pre-line;font-size:14px;line-height:1.62;
  color:#ffffff;overflow-y:auto;background:#000000;
}

/* Mapa Estelar: área ampliada a pantalla completa con barra HUD compacta */
.map-shell{
  flex:1;display:flex;flex-direction:column;min-height:0;gap:6px;
}
.map-viewport{
  flex:1;min-height:280px;position:relative;display:flex;
  border:1px solid #22c55e;border-radius:4px;background:#03070d;overflow:hidden;
}
#cv{
  width:100%;height:100%;display:block;touch-action:none;cursor:grab;
}
#cv:active{cursor:grabbing}
.map-hud-bar{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:4px 10px;background:#030a06;border:1px solid #166534;border-radius:4px;
  font-size:12px;
}
.map-hud-bar button{
  padding:4px 11px;font-size:12px;
}

/* Procesador: monitores amplios y simétricos + panel lateral compacto y ordenado */
.proc-shell{
  flex:1;display:flex;flex-direction:column;min-height:0;gap:8px;
}
.proc-buffer-bar{
  flex:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:5px 10px;background:#030a06;border:1px solid #166534;border-radius:4px;
}
.proc-buffer-bar button{
  padding:4px 10px;font-size:12px;
}
.proc-grid{
  flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:10px;
}
@media(min-width:900px){
  .proc-grid{grid-template-columns:minmax(0,1fr) 315px}
}
@media(min-width:1280px){
  .proc-grid{grid-template-columns:minmax(0,1fr) 335px}
}
.proc-monitors{
  display:grid;grid-template-columns:1fr;gap:10px;min-height:250px;height:100%;
}
.proc-monitors.dual{
  grid-template-columns:1fr;
}
@media(min-width:640px){
  .proc-monitors.dual{grid-template-columns:1fr 1fr}
}
.crt-wrap{
  background:#000000;border:2px solid #22c55e;border-radius:4px;padding:8px 10px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;
  gap:6px;position:relative;min-height:230px;height:100%;min-width:0;
}
.crt-wrap.opt-fail{border-color:#ef4444;background:#000000}
.monitor-head{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.4px;padding-bottom:4px;
  border-bottom:1px dashed #166534;
}
body.paper-theme .monitor-head{
  border-bottom-color:#a89068;color:#3d2814;
}
.monitor-foot{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;
  min-height:38px;font-size:11px;padding:4px 6px;border-radius:3px;
  border:1px solid #166534;background:#030a06;
}
body.paper-theme .monitor-foot{
  border-color:#a89068;background:#f5eedc;
}
.crt-stage{
  flex:1;width:100%;min-height:175px;display:flex;align-items:center;justify-content:center;
  background:#020503;border:1px solid #166534;border-radius:3px;padding:5px;overflow:hidden;
}
#crt{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
  background:#000000;display:block;
}
#spec{
  width:100%;height:100%;background:#000000;display:block;
}
.proc-side{
  display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;
}
.proc-side > .card{
  margin:0;flex:none;display:flex;flex-direction:column;gap:8px;padding:9px 10px;
}
.proc-sec-head{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;letter-spacing:.4px;padding-bottom:5px;
  border-bottom:1px dashed #166534;
}
body.paper-theme .proc-sec-head{
  border-bottom-color:#a89068;color:#3d2814;
}
.tuner-box{
  display:flex;flex-direction:column;gap:4px;padding:6px 8px;
  border:1px solid #166534;border-radius:3px;background:rgba(3,10,6,.55);
}
body.paper-theme .tuner-box{
  border-color:#b8a078;background:rgba(245,238,220,.7);
}
.tuner-row{
  display:flex;align-items:center;gap:6px;
}
.tuner-lbl{
  width:74px;flex:none;font-size:11.5px;font-weight:700;
}
.tuner-row input[type=range]{
  flex:1;min-width:0;margin:0;height:16px;
}
.tuner-val{
  width:28px;flex:none;text-align:right;font-size:12px;font-weight:700;
}
.tuner-box .prox-wrap{
  margin-top:0;gap:6px;font-size:10.5px;
}
.proc-actions{
  display:grid;grid-template-columns:1fr 1fr auto;gap:5px;padding-top:4px;
}
.proc-actions button{
  padding:6px 7px;font-size:11.5px;white-space:nowrap;
}
.proc-cat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:5px;
}
.proc-cat-grid button{
  padding:5px 6px;font-size:11.5px;
}

.databox{
  flex:none;height:38px;overflow-y:auto;
  background:#000000;border:1px solid #22c55e;border-radius:3px;padding:4px 7px;
  font-size:10.5px;line-height:1.35;color:#ffffff;white-space:pre-wrap;word-break:break-all;width:100%;
}
.databox.anom{border-color:#ef4444;color:#ffffff;background:#000000}
input[type=range]{flex:1;accent-color:#22c55e;cursor:pointer}
input[type=text]{
  width:100%;max-width:340px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:9px 12px;font:14px inherit;
  outline:none;
}
input[type=text]:focus{border-color:#4ade80;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
select{
  width:100%;max-width:100%;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:9px 12px;font:13px inherit;
  outline:none;cursor:pointer;
}
select:focus{border-color:#4ade80;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
.prox-wrap{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:#ffffff}
.prox-bar{flex:1;height:7px;background:#000000;border:1px solid #22c55e;border-radius:3px;overflow:hidden}
.prox-fill{height:100%;transition:width .08s,background .12s}
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px;margin-top:10px}
.atlas-card{
  background:#000000;border:1px solid #22c55e;border-radius:4px;padding:9px;
  display:flex;flex-direction:column;gap:6px;color:#ffffff;
}
.atlas-card.locked{opacity:.52;background:#000000;border-color:#15803d}
.atlas-cv{width:100%;height:110px;image-rendering:pixelated;background:#000000;border:1px solid #22c55e;border-radius:3px;display:block}
.atlas-cv.spec-mode{image-rendering:auto}
.paper-sheet{
  background:linear-gradient(180deg,#e9dec4 0%,#dfd0b0 100%);
  color:#2b2116;border:2px solid #8c734b;border-radius:6px;padding:14px;
  margin-top:16px;box-shadow:inset 0 0 24px rgba(92,68,36,.28),0 4px 14px rgba(0,0,0,.45);
  font-family:"Courier New",Courier,monospace;
}
.paper-sheet h3{
  margin:0 0 10px;color:#3d2814;border-bottom:1px dashed #7c623c;padding-bottom:6px;
  font-size:15px;letter-spacing:.5px;
}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.paper-entry{
  background:rgba(255,250,238,.65);border:1px solid #9c8259;border-radius:4px;padding:9px;
  display:flex;flex-direction:column;gap:6px;
}
.paper-cv{
  width:100%;height:110px;image-rendering:pixelated;background:#1e1912;
  border:1px solid #6e5634;border-radius:3px;display:block;
}
.paper-cv.spec-mode{image-rendering:auto}
.paper-bin{
  background:#f5eedc;border:1px solid #a89068;padding:6px;border-radius:3px;
  font-size:11px;color:#24190e;word-break:break-all;white-space:pre-wrap;
}
.paper-btn{
  background:#5c4424;color:#fbf6ea;border:1px solid #3d2b14;font-size:11.5px;padding:4px 8px;
}
.paper-btn:hover{background:#473319}
#toast{
  margin-top:6px;padding:6px 12px;border-radius:4px;background:#000000;
  border:1px solid #22c55e;color:#ffffff;text-align:center;font-size:12px;flex:none;
}
#toast.ok{border-color:#22c55e;background:#000000;color:#ffffff}
#toast.bad{border-color:#ef4444;background:#000000;color:#ffffff}
.boot-screen{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  padding:34px 20px 28px;margin:auto;width:100%;max-width:620px;min-height:420px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;overflow:hidden;
}
.boot-logo{
  width:234px;height:192px;image-rendering:pixelated;image-rendering:crisp-edges;
  display:block;margin:0 auto 22px;object-fit:contain;
  animation:bootFadeIn .65s ease-out;
}
@keyframes bootFadeIn{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}
.boot-bar-frame{
  width:100%;max-width:360px;height:22px;padding:3px;
  background:#000000;border:1px solid #22c55e;
  margin:0 auto 10px;
}
.boot-bar-track{
  width:100%;height:100%;background:#000000;overflow:hidden;position:relative;
}
.boot-bar-fill{
  height:100%;width:0%;
  background:repeating-linear-gradient(
    90deg,
    #22c55e 0px,
    #22c55e 10px,
    #000000 10px,
    #000000 13px
  );
  transition:width .12s linear;
}
.boot-status{
  font-size:12px;color:#ffffff;letter-spacing:.6px;min-height:18px;margin-top:4px;
}
.boot-audio-hint{
  margin-top:18px;font-size:11px;color:#ffffff;letter-spacing:.8px;
  animation:blinkHint 1.3s steps(2,end) infinite;cursor:pointer;
}
@keyframes blinkHint{
  0%,100%{opacity:1}
  50%{opacity:.28}
}
.login-win{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  width:100%;max-width:460px;margin:auto;padding:0;overflow:hidden;
}
.os-win-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 12px;background:#000000;border-bottom:1px solid #22c55e;
  font-size:12px;color:#ffffff;letter-spacing:.8px;
}
.login-body{
  padding:28px 24px 26px;text-align:center;background:#000000;color:#ffffff;
}
.user-avatar-frame{
  width:96px;height:96px;margin:0 auto 18px;
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
}
.os-modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.86);
  display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;
}
.os-modal-win{
  width:100%;max-width:460px;background:#000000;border:2px solid #22c55e;
  border-radius:4px;color:#ffffff;overflow:hidden;
  box-shadow:0 0 0 2px #000000, 0 0 28px rgba(34,197,94,.25);
}
.os-modal-body{
  padding:18px 20px;background:#000000;color:#ffffff;text-align:left;
}
#nightFadeOverlay{
  position:fixed;inset:0;background:#000000;opacity:0;pointer-events:none;
  z-index:999;transition:opacity 0.65s ease-in-out;
  display:flex;align-items:center;justify-content:center;
}
#nightFadeOverlay.active{
  opacity:1;pointer-events:all;
}
#nightFadeText{
  color:#ffffff;
  font-family:"Courier New",Courier,ui-monospace,monospace;
  font-size:clamp(26px,4.5vw,44px);
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:0;
  transition:opacity 0.55s ease-in-out;
  user-select:none;
}
#nightFadeText.visible{
  opacity:1;
}

/* ============================================================================
   ENTORNO GRAFICO UNIFICADO ESTILO ARCHIVO / ANOMALIAS (A PARTIR DEL LOGIN)
   ============================================================================ */
body.boot-mode{
  background:#000000;
  padding:0;
}
body.boot-mode .terminal{
  background:#000000;
  border:none;
  border-radius:0;
  box-shadow:none;
}
body.boot-mode .terminal::after,
body.boot-mode .topbar,
body.boot-mode #tabs{
  display:none !important;
}
body.boot-mode #win{
  background:#000000;
  padding:0;
  overflow:hidden;
}
body.boot-mode .boot-screen{
  background:#000000;
  border:none;
  border-radius:0;
  max-width:none;
  width:100%;
  height:100%;
  padding:20px;
}
body.login-mode .terminal{
  background:transparent;
  border:none;
  box-shadow:none;
}
body.login-mode .terminal::after,
body.login-mode .topbar,
body.login-mode #tabs{
  display:none !important;
}
body.login-mode #win{
  background:transparent;
  padding:16px;
}
body.paper-theme{
  background:#1e1912;
  color:#2b2116;
  font-family:"Courier New",Courier,ui-monospace,monospace;
}
body.paper-theme .terminal{
  background:linear-gradient(180deg,#e9dec4 0%,#dfd0b0 100%);
  border:2px solid #8c734b;
  box-shadow:inset 0 0 28px rgba(92,68,36,.26),0 12px 36px rgba(0,0,0,.78);
}
body.paper-theme .terminal::after{
  background:radial-gradient(circle at center,transparent 62%,rgba(92,68,36,.16) 100%);
}
body.paper-theme .topbar{
  background:#d8c7a3;
  border-bottom:2px solid #8c734b;
  color:#2b2116;
}
body.paper-theme .topbar b{color:#3d2814}
body.paper-theme .pill{
  background:#f5eedc;
  border:1px solid #8c734b;
  color:#2b2116;
  font-weight:700;
}
body.paper-theme .pill.night{
  border-color:#991b1b;
  background:#f3d8d2;
  color:#7f1d1d;
}
body.paper-theme .pill.slowrech{
  border-color:#a16207;
  background:#f6e7c1;
  color:#713f12;
}
body.paper-theme .pill.norech{
  border-color:#9a3412;
  background:#f5dcd0;
  color:#7c2d12;
}
body.paper-theme #tabs{
  background:#d5c39e;
  border-bottom:2px solid #8c734b;
}
body.paper-theme .tab{
  background:#e9dec4;
  color:#3d2814;
  border:1px solid #9c8259;
}
body.paper-theme .tab:hover{
  background:#f5eedc;
  color:#24190e;
  border-color:#6e5634;

.xp-assistant-dock{
  position:relative;
  margin:14px auto 4px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  z-index:20;
  user-select:none;
  max-width:340px;
}
@media(min-width:840px){
  .xp-assistant-dock{
    position:absolute;
    right:26px;
    bottom:18px;
    margin:0;
  }
}
.xp-balloon{
  position:relative;
  width:292px;
  background:linear-gradient(180deg,#fffef4 0%,#f5eedc 100%);
  color:#24190e;
  border:2px solid #5c4424;
  border-radius:11px;
  padding:11px 13px 10px;
  margin-bottom:14px;
  box-shadow:0 10px 24px rgba(0,0,0,.55), inset 0 1px 0 #ffffff;
  font-family:"Courier New",Courier,ui-monospace,monospace;
  text-align:left;
  animation:xpBalloonPop .22s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes xpBalloonPop{
  from{opacity:0;transform:translateY(8px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.xp-balloon::before{
  content:"";
  position:absolute;
  right:58px;
  bottom:-14px;
  width:0;
  height:0;
  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-top:14px solid #5c4424;
}
.xp-balloon::after{
  content:"";
  position:absolute;
  right:60px;
  bottom:-11px;
  width:0;
  height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-top:11px solid #f5eedc;
}
.xp-balloon-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  font-weight:700;
  letter-spacing:.6px;
  color:#5c4424;
  border-bottom:1px dashed #b8a078;
  padding-bottom:4px;
  margin-bottom:7px;
}
.xp-balloon-msg{
  font-size:12.5px;
  line-height:1.45;
  color:#24190e;
  min-height:54px;
  margin-bottom:9px;
}
.xp-balloon-opts{
  display:flex;
  flex-direction:column;
  gap:5px;
  border-top:1px dashed #b8a078;
  padding-top:7px;
}
button.xp-opt-btn{
  width:100%;
  text-align:left;
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 9px;
  font-size:12px;
  font-weight:700;
  background:#fbf6ea;
  color:#2b2116;
  border:1px solid #8c734b;
  border-radius:5px;
  cursor:pointer;
  transition:background .12s, border-color .12s, transform .08s;
}
button.xp-opt-btn:hover:not(:disabled){
  background:#e6d7b8;
  border-color:#5c4424;
  color:#1e1912;
}
button.xp-opt-btn:active:not(:disabled){
  transform:translateY(1px);
}
.xp-opt-bullet{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#5c4424;
  color:#fbf6ea;
  font-size:10px;
  line-height:1;
  flex:none;
}
.xp-bear-row{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:flex-end;
  gap:4px;
}
button.xp-alert-btn{
  position:relative;
  top:10px;
  background:linear-gradient(180deg,#fef08a 0%,#eab308 100%);
  color:#24190e;
  border:2px solid #5c4424;
  border-radius:6px;
  padding:4px 9px;
  font-size:13px;
  font-weight:900;
  letter-spacing:.5px;
  box-shadow:0 4px 12px rgba(0,0,0,.55), inset 0 1px 0 #fef9c3;
  cursor:pointer;
  animation:xpAlertPulse 1.6s ease-in-out infinite;
  flex:none;
}
button.xp-alert-btn:hover:not(:disabled){
  background:linear-gradient(180deg,#fef9c3 0%,#facc15 100%);
  border-color:#3d2b14;
  color:#1e1912;
  transform:scale(1.06);
}
@keyframes xpAlertPulse{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
.xp-bear-wrap{
  width:144px;
  height:208px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  pointer-events:none;
}
.xp-bear-img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.68));
  transform-origin:bottom center;
  animation:xpBearIdle 3.4s ease-in-out infinite;
}
.xp-bear-img.hop{
  animation:xpBearHop .38s cubic-bezier(.25,1.4,.4,1);
}
@keyframes xpBearIdle{
  0%,100%{transform:scaleY(1) translateY(0)}
  50%{transform:scaleY(1.015) translateY(-1.5px)}
}
@keyframes xpBearHop{
  0%{transform:translateY(0) scale(1)}
  40%{transform:translateY(-10px) scale(1.03,.97)}
  75%{transform:translateY(2px) scale(.98,1.02)}
  100%{transform:translateY(0) scale(1)}
}

// Caché de sprites PNG en Signals/
const IMG_CACHE = {};
const offCv = document.createElement("canvas");
const offCx = offCv.getContext("2d");

function getSprite(src) {
  if (!src) return null;
  if (!IMG_CACHE[src]) {
    const im = new Image();
    im._failed = false;
    im.onerror = () => { im._failed = true; };
    im.src = src;
    IMG_CACHE[src] = im;
  }
  const im = IMG_CACHE[src];
  if (im._failed) return null;
  return (im.complete && im.naturalWidth > 0) ? im : null;
}

function preloadAllSprites() {
  MODELS.forEach(m => { if (m.img) getSprite(m.img); });
  ANOMALY_DEFS.forEach(a => {
    if (a.img) getSprite(a.img);
    if (a.spectrogramImg) getSprite(a.spectrogramImg);
  });
}

const BEAR_WELCOME_MSG = "¡Hola! Bienvenido a Avalanche Cosmos 95. Estoy aquí para ayudarte en lo que necesites.";
let bearDialogOpen = false;
let bearFrameIdx = 2; // Bear_3.png (neutral, ojos abiertos mirando al frente)
let bearIdleClock = 0;
let bearNextBlinkAt = 2.8;
let bearBlinkEndAt = 0;
let bearNextGlanceAt = 4.6;
let bearGlanceEndAt = 0;
let bearTalkingTimer = 0;
let bearTalkStep = 0;
let bearTypedChars = 0;
let bearHopPending = false;

function updateBearAnimation(dt) {
  bearIdleClock += dt;

  // Avance de texto tipo máquina de escribir cuando el globo está abierto
  if (bearDialogOpen && bearTypedChars < BEAR_WELCOME_MSG.length) {
    bearTypedChars = Math.min(BEAR_WELCOME_MSG.length, bearTypedChars + dt * 58);
    const msgEl = document.querySelector("#bearSpeechText");
    if (msgEl) {
      msgEl.textContent = BEAR_WELCOME_MSG.slice(0, Math.floor(bearTypedChars));
    }
  }

  let nextFrame = 2;
  if (bearTalkingTimer > 0) {
    bearTalkingTimer = Math.max(0, bearTalkingTimer - dt);
    bearTalkStep += dt;
    const phase = Math.floor(bearTalkStep / 0.13) % 6;
    // Alternancia expresiva estilo Rover hablando (boca abierta/cerrada + mirada + parpadeo)
    if (phase === 0) nextFrame = 4;      // Bear_5: hablando mirando al frente
    else if (phase === 1) nextFrame = 2; // Bear_3: pausa breve
    else if (phase === 2) nextFrame = 3; // Bear_4: hablando mirando hacia arriba/izquierda
    else if (phase === 3) nextFrame = 4; // Bear_5: hablando mirando al frente
    else if (phase === 4) nextFrame = 5; // Bear_6: hablando feliz con ojos cerrados
    else nextFrame = 0;                  // Bear_1: gesto atento
  } else {
    // Ciclo natural de parpadeo y mirada curiosa en reposo
    if (bearIdleClock >= bearNextBlinkAt) {
      bearBlinkEndAt = bearIdleClock + 0.15;
      bearNextBlinkAt = bearIdleClock + 3.0 + Math.random() * 2.4;
    }
    if (bearIdleClock >= bearNextGlanceAt) {
      bearGlanceEndAt = bearIdleClock + 1.35;
      bearNextGlanceAt = bearIdleClock + 5.2 + Math.random() * 3.0;
    }

    if (bearIdleClock < bearBlinkEndAt) {
      nextFrame = 1; // Bear_2: parpadeo
    } else if (bearIdleClock < bearGlanceEndAt) {
      nextFrame = 0; // Bear_1: mirando con curiosidad
    } else {
      nextFrame = 2; // Bear_3: reposo amigable
    }
  }

  if (nextFrame !== bearFrameIdx) {
    bearFrameIdx = nextFrame;
    const imgEl = document.querySelector("#bearSpriteImg");
    if (imgEl && BEAR_FRAMES[bearFrameIdx]) {
      imgEl.src = BEAR_FRAMES[bearFrameIdx];
    }
  }
}

function buildSessionSnapshot(finalized = false) {
  if (!S) return null;
  const elapsedTotal = sessionStartPerf ? +((performance.now() - sessionStartPerf) / 1000).toFixed(1) : (S.totalPlayTime || 0);
  S.totalPlayTime = elapsedTotal;
  S.status = finalized ? (gameOverReason === "ARREST" ? "CLAUSURADA_ONU" : "FINALIZADA") : "EN_CURSO";
  S.lastUpdated = new Date().toISOString();

  const shiftsList = [...S.shifts];
  if (!finalized && R && V !== "end") {
    shiftsList.push({
      ...R,
      time: +((performance.now() - R.t0) / 1000).toFixed(1),
      energy: Math.round(en),
      money: G ? G.money : 75
    });
  }

  return {
    id: S.id,
    playerName: S.playerName,
    startNight: selectedStartNight + 1,
    freeMode: isFreeMode,
    date: S.date,
    dateISO: S.dateISO,
    totalPlayTime: S.totalPlayTime,
    status: S.status,
    lastUpdated: S.lastUpdated,
    shifts: shiftsList,
    survey: null
  };
}

async function pushSnapshotToCloud(snap) {
  if (!activeDbUrl || !snap) return;
  if (cloudInFlight) {
    cloudQueuedSnap = snap;
    return;
  }
  cloudInFlight = true;
  try {
    await fetch(`${activeDbUrl}/sessions/${encodeURIComponent(snap.id)}.json`, {
      method: "PUT",
      body: JSON.stringify(snap)
    });
  } catch (_) {
  } finally {
    cloudInFlight = false;
    if (cloudQueuedSnap) {
      const next = cloudQueuedSnap;
      cloudQueuedSnap = null;
      pushSnapshotToCloud(next);
    }
  }
}

function syncLiveTelemetry(finalized = false, pushCloudNow = true) {
  const snap = buildSessionSnapshot(finalized);
  if (!snap) return;
  try {
    const raw = localStorage.getItem(LIVE_STORAGE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    const idx = list.findIndex(item => item.id === snap.id);
    if (idx >= 0) list[idx] = snap;
    else list.push(snap);
    localStorage.setItem(LIVE_STORAGE_KEY, JSON.stringify(list));
  } catch (_) {}

  if (bc) {
    try { bc.postMessage({type: "SESSION_UPDATE", session: snap}); } catch (_) {}
  }

  if (pushCloudNow && activeDbUrl) {
    pushSnapshotToCloud(snap);
  }
}

function beep(freq, dur = 0.08, type = "sine", vol = 0.06) {
  if (muted) return;
  try {
    ensureAudioContext();
    const o = au.createOscillator(), g = au.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, au.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, au.currentTime + dur);
    o.connect(g); g.connect(au.destination);
    o.start(); o.stop(au.currentTime + dur);
  } catch (_) {}
}

let staticNoiseBuffer = null;

function createStaticNoiseNodes(initialGain = 0) {
  ensureAudioContext();
  if (!au) return null;

  if (!staticNoiseBuffer) {
    const bufferSize = au.sampleRate * 2;
    staticNoiseBuffer = au.createBuffer(1, bufferSize, au.sampleRate);
    const data = staticNoiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
  }

  const noiseNode = au.createBufferSource();
  noiseNode.buffer = staticNoiseBuffer;
  noiseNode.loop = true;

  const filter = au.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1350;
  filter.Q.value = 0.7;

  const noiseGain = au.createGain();
  noiseGain.gain.value = initialGain;

  noiseNode.connect(filter);
  filter.connect(noiseGain);
  if (analyser) {
    noiseGain.connect(analyser);
  } else {
    noiseGain.connect(au.destination);
  }

  noiseNode.start();
  return { noiseNode, noiseGain };
}

function getSignalNoiseLevel(sigObj) {
  if (!sigObj || sigObj.fixed || sigObj.tgF === undefined) return 0;
  if (isTuned(sigObj)) return 0.015;
  const err = Math.min(1, (offF(sigObj) + offP(sigObj)) * 0.65);
  return Math.min(0.16, err * 0.16);
}

function stopVoice() {
  if (!activeVoice) return;
  if (activeVoice.o) {
    try { activeVoice.o.stop(); } catch (_) {}
  }
  if (activeVoice.audio) {
    try {
      activeVoice.audio.pause();
      activeVoice.audio.currentTime = 0;
    } catch (_) {}
  }
  if (activeVoice.noiseNode) {
    try { activeVoice.noiseNode.stop(); } catch (_) {}
  }
  if (activeVoice.noiseGain) {
    try { activeVoice.noiseGain.disconnect(); } catch (_) {}
  }
  activeVoice = null;
}

function playFallbackStartupSynth() {
  try {
    ensureAudioContext();
    if (!au || au.state !== "running") return false;
    const now = au.currentTime + 0.03;
    const master = au.createGain();
    const filter = au.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(360, now);
    filter.frequency.exponentialRampToValueAtTime(2400, now + 0.85);
    filter.frequency.exponentialRampToValueAtTime(980, now + 3.4);
    filter.Q.value = 1.4;

    master.gain.setValueAtTime(0.0001, now);
    master.gain.linearRampToValueAtTime(0.16, now + 0.22);
    master.gain.setValueAtTime(0.15, now + 1.65);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 3.6);

    filter.connect(master);
    master.connect(au.destination);

    const chords = [
      { t: 0.00, dur: 1.05, freqs: [155.56, 233.08, 311.13, 392.00, 466.16, 587.33] },
      { t: 0.82, dur: 1.05, freqs: [207.65, 311.13, 415.30, 523.25, 622.25, 783.99] },
      { t: 1.58, dur: 2.00, freqs: [155.56, 233.08, 349.23, 392.00, 587.33, 932.33] }
    ];

    chords.forEach((ch, ci) => {
      ch.freqs.forEach((f, fi) => {
        const osc = au.createOscillator();
        const vg = au.createGain();
        osc.type = (fi % 2 === 0) ? "triangle" : "sine";
        const detune = (fi % 2 === 0 ? -5 : 5) + ci * 1.5;
        osc.frequency.setValueAtTime(f, now + ch.t);
        osc.detune.setValueAtTime(detune, now + ch.t);

        const voicePeak = (fi === 0 ? 0.22 : 0.13) / Math.sqrt(ch.freqs.length);
        vg.gain.setValueAtTime(0.0001, now + ch.t);
        vg.gain.linearRampToValueAtTime(voicePeak, now + ch.t + 0.14);
        vg.gain.exponentialRampToValueAtTime(0.0001, now + ch.t + ch.dur);

        osc.connect(vg);
        vg.connect(filter);
        osc.start(now + ch.t);
        osc.stop(now + ch.t + ch.dur + 0.05);
      });
    });
    return true;
  } catch (_) {
    return false;
  }
}

function playStartupSound(forceReplay = false) {
  if (muted) return false;
  if (bootSoundPlayed && !forceReplay) return true;
  try {
    if (startupAudio) {
      try {
        startupAudio.pause();
        startupAudio.currentTime = 0;
      } catch (_) {}
    }
    const audio = new Audio("assets/audio/startup.mp3");
    audio.volume = 0.65;
    startupAudio = audio;

    audio.onerror = () => {
      if (!bootSoundPlayed && playFallbackStartupSynth()) {
        bootSoundPlayed = true;
        bootLoginChimePending = false;
      }
    };

    const playPromise = audio.play();
    if (playPromise && typeof playPromise.then === "function") {
      playPromise.then(() => {
        bootSoundPlayed = true;
        bootLoginChimePending = false;
        const hint = document.querySelector("#bootAudioHint");
        if (hint) hint.style.display = "none";
      }).catch(() => {
        // Navegador bloqueó reproducción automática hasta la primera interacción del usuario
      });
    } else {
      bootSoundPlayed = true;
      bootLoginChimePending = false;
    }
    return bootSoundPlayed;
  } catch (_) {
    return false;
  }
}

function startBootSequence() {
  V = "boot";
  bootElapsed = 0;
  bootProgress = 0;
  bootSoundPlayed = false;
  bootLoginChimePending = true;
  render();
  updTop();
  if (playStartupSound(true)) {
    const hint = document.querySelector("#bootAudioHint");
    if (hint) hint.style.display = "none";
  }
}

function startOscillatorFallback(sigObj, mod, anomDef, staticNodes) {
  try {
    ensureAudioContext();
    const o = au.createOscillator(), g = au.createGain();
    o.type = anomDef ? anomDef.wave : mod.wave;
    o.frequency.value = anomDef ? anomDef.freq : mod.freq;
    g.gain.value = 0.08;
    // Conectar directamente el mismo oscilador al AnalyserNode de Web Audio
    o.connect(g);
    if (analyser) {
      g.connect(analyser);
    } else {
      g.connect(au.destination);
    }
    o.start();
    activeVoice = {
      o,
      g,
      sig: sigObj,
      t: 0,
      max: 3.8,
      noiseNode: staticNodes ? staticNodes.noiseNode : null,
      noiseGain: staticNodes ? staticNodes.noiseGain : null
    };
  } catch (_) {}
}

function playSignalAudio(sigObj) {
  stopVoice();
  if (muted) return;
  ensureAudioContext();
  const anomDef = sigObj.anom ? ANOMALY_DEFS.find(a => a.type === sigObj.anomType) : null;
  const mod = MODELS.find(m => m.id === sigObj.modelId) || MODELS[0];
  const audioDef = (anomDef && anomDef.audioSrc)
    ? anomDef
    : (!sigObj.anom && mod && mod.audioSrc)
      ? mod
      : null;

  const staticNodes = createStaticNoiseNodes(getSignalNoiseLevel(sigObj));

  if (audioDef && audioDef.audioSrc) {
    try {
      const audio = new Audio(audioDef.audioSrc);
      audio.crossOrigin = "anonymous";
      const baseVol = (typeof audioDef.audioVol === "number") ? audioDef.audioVol : 0.48;
      const clarity = sigObj.fixed ? 1 : (sigObj.tgF !== undefined ? Math.max(0.25, 1 - (offF(sigObj) + offP(sigObj)) * 0.55) : 1);
      audio.volume = Math.max(0.08, Math.min(baseVol, baseVol * clarity));

      // Conectar el flujo de audio al AnalyserNode de Web Audio para que el espectrograma sea el audio real
      try {
        if (au && analyser) {
          const mediaSrc = au.createMediaElementSource(audio);
          mediaSrc.connect(analyser);
        }
      } catch (_) {}

      audio.onended = () => {
        if (activeVoice && activeVoice.audio === audio) {
          stopVoice();
          if (V === "proc") render();
        }
      };
      audio.onerror = () => {
        if (activeVoice && activeVoice.audio === audio) {
          const savedNoise = { noiseNode: activeVoice.noiseNode, noiseGain: activeVoice.noiseGain };
          activeVoice = null;
          startOscillatorFallback(sigObj, mod, anomDef, savedNoise);
          if (V === "proc") render();
        }
      };
      activeVoice = {
        audio,
        baseVol,
        sig: sigObj,
        t: 0,
        noiseNode: staticNodes ? staticNodes.noiseNode : null,
        noiseGain: staticNodes ? staticNodes.noiseGain : null
      };
      const p = audio.play();
      if (p && typeof p.catch === "function") {
        p.catch(() => {
          if (activeVoice && activeVoice.audio === audio) {
            stopVoice();
            if (V === "proc") render();
          }
        });
      }
      return;
    } catch (_) {}
  }

  startOscillatorFallback(sigObj, mod, anomDef, staticNodes);
}

function playMailChime() {
  if (muted) return;
  try {
    ensureAudioContext();
    if (!au || au.state !== "running") return;
    const now = au.currentTime;
    const startAt = Math.max(now + 0.01, nextMailChimeAt);
    nextMailChimeAt = startAt + 0.17;

    const notes = [880, 1174.66];
    notes.forEach((freq, idx) => {
      const o = au.createOscillator();
      const g = au.createGain();
      o.type = "triangle";
      const t0 = startAt + idx * 0.065;
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.065, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.connect(g);
      g.connect(au.destination);
      o.start(t0);
      o.stop(t0 + 0.17);
    });
  } catch (_) {}
}

function addMail(subj, body, extra = {}) {
  const id = uid();
  const sender = extra.sender || extra.sciName || "CENTRAL";
  const tag = extra.tag || `N${shift + 1}`;
  mail.unshift({id, subj, body, sender, tag, read: 0, ...extra});
  if (!selMail) selMail = id;
  playMailChime();
  return id;
}

function pickUniqueModelForCat(cat, forcedModelId = null) {
  const catModels = MODELS.filter(m => m.cat === cat && (m.minShift || 0) <= shift);
  const fallbackModels = catModels.length ? catModels : MODELS.filter(m => m.cat === cat);
  if (forcedModelId) {
    const found = fallbackModels.find(m => m.id === forcedModelId) || MODELS.find(m => m.id === forcedModelId);
    if (found) {
      if (cat === 1) usedPlanetModelsThisNight.add(found.id);
      return found;
    }
  }
  if (cat === 1) {
    const unusedPlanets = fallbackModels.filter(m => !usedPlanetModelsThisNight.has(m.id));
    const pool = unusedPlanets.length ? unusedPlanets : fallbackModels;
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    usedPlanetModelsThisNight.add(chosen.id);
    return chosen;
  }
  return fallbackModels[Math.floor(Math.random() * fallbackModels.length)];
}

function getAvailableUniqueAnomalies() {
  const claimedTypes = new Set([
    ...discoveredAnomalies.map(d => d.anomType),
    ...floppyStoredAnomalies.map(d => d.anomType),
    ...sigs.filter(s => s.anom && s.st !== "gone").map(s => s.anomType),
    ...outbox.filter(p => p.anom).map(p => p.anomType)
  ]);
  return ANOMALY_DEFS.filter(a => !claimedTypes.has(a.type));
}

function makeSignal(cat, forcedAnom = null, forcedAnomType = null, forcedModelId = null, assignRefId = null) {
  let x, y, tries = 0;
  do {
    x = 240 + Math.random() * (W - 480);
    y = 240 + Math.random() * (H - 480);
  } while (tries++ < 160 && sigs.some(s => s.st !== "gone" && Math.hypot(s.x - x, s.y - y) < 760));

  // Las anomalías SOLO aparecen a partir de Noche 10 (isAnomEnabled()), con ratio considerablemente menor (6%)
  // y cada anomalía es estrictamente única (si ya fue encontrada o está activa, nunca vuelve a aparecer)
  const availableAnoms = getAvailableUniqueAnomalies();
  const allowAnom = isAnomEnabled() && !assignRefId && availableAnoms.length > 0;
  let anom = allowAnom ? (forcedAnom !== null ? forcedAnom : (Math.random() < 0.06)) : false;

  let anomDef = null;
  if (anom) {
    if (forcedAnomType) {
      anomDef = availableAnoms.find(a => a.type === forcedAnomType) || null;
    } else {
      anomDef = availableAnoms[Math.floor(Math.random() * availableAnoms.length)] || null;
    }
    if (!anomDef) anom = false;
  }

  let actualCat = anomDef ? anomDef.cat : cat;
  // Si todos los planetas únicos de la noche ya aparecieron y no es asignación forzada, rotar a otra categoría disponible
  if (!anomDef && !forcedModelId && actualCat === 1) {
    const allPlanets = MODELS.filter(m => m.cat === 1);
    if (usedPlanetModelsThisNight.size >= allPlanets.length) {
      const altCats = getAvailableCategories().filter(c => c !== 1);
      actualCat = altCats[Math.floor(Math.random() * altCats.length)];
    }
  }

  const chosenModel = pickUniqueModelForCat(actualCat, forcedModelId);

  // Imágenes de señuelo/confusión en el CRT:
  // - Cuasar (Noche 5+): elige aleatoriamente entre enana amarilla y enana roja, pero en Atlas usa noimage_anomaly.png
  // - Enana Marrón (Noche 7+): usa red_dwarf.png en CRT, pero en Atlas usa brown_dwarf.png
  let signalImg = anomDef ? anomDef.img : chosenModel.img;
  if (!anomDef) {
    if (chosenModel.id === "sin_cuasar") {
      signalImg = Math.random() < 0.5 ? "Signals/yellow_dwarf.png" : "Signals/red_dwarf.png";
    } else if (chosenModel.id === "est_enana_marron") {
      signalImg = "Signals/red_dwarf.png";
    }
  }

  // A partir de la Noche 5 (shift >= 4), algunos archivos sufren daño visual con un ratio bajo (12% - 20%),
  // dejando visible únicamente el espectrograma y el audio para identificarlos (nunca en anomalías ni encargos)
  const corruptProb = (!anom && !assignRefId && shift >= 4)
    ? Math.min(0.20, 0.12 + (shift - 4) * 0.01)
    : 0;
  const isCorruptSignal = Math.random() < corruptProb;

  const moving = (actualCat === 2 || actualCat === 3);
  const ang = Math.random() * Math.PI * 2;
  const spd = moving ? (2.1 + Math.random() * 1.4) : 0;

  let textData = "[Sin subportadora]";
  let anomTitle = "";
  let anomType = "";
  if (anomDef) {
    anomType = anomDef.type;
    anomTitle = anomDef.title;
    textData = anomDef.textData;
  } else if (actualCat === 3) {
    const satNum = 100 + Math.floor(Math.random() * 899);
    const alt = 420 + Math.floor(Math.random() * 380);
    const hex = uid();
    textData = `TLM-SAT-${satNum} // ALT:${alt}KM // PWR:88% // HASH:${hex}`;
  }

  return {
    id: ++sid, x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    cat: actualCat, modelId: chosenModel.id, img: signalImg,
    anom, anomType, anomTitle, assignRefId,
    isCorruptSignal, st: "echo", align: 0, prog: 0,
    tot: 0, bad: 0, acc: 0, seed: Math.random() * 100,
    tgF: 14 + Math.floor(Math.random() * 72),
    tgP: 14 + Math.floor(Math.random() * 72),
    fixed: false, textData
  };
}

function getNormalStoredCount() {
  return sigs.filter(s => s.st === "raw" && !s.anom).length + outbox.filter(p => !p.anom).length;
}

function getAnomalyBufferCount() {
  return sigs.filter(s => s.st === "raw" && s.anom).length + outbox.filter(p => p.anom).length;
}

function getStoredMemoryCount() {
  return sigs.filter(s => s.st === "raw").length + outbox.length;
}

function canAcceptSignalInBuffer(isAnomSignal = false) {
  if (!hasFloppyDisk) {
    const reservedTotal = getStoredMemoryCount() + sigs.filter(s => s.st === "align" || s.st === "dl").length;
    return reservedTotal < MAX_MEMORY_SIGNALS;
  }
  const activeNormal = sigs.filter(s => (s.st === "align" || s.st === "dl") && !s.anom).length;
  const activeAnom = sigs.filter(s => (s.st === "align" || s.st === "dl") && s.anom).length;
  if (isAnomSignal) {
    return (getAnomalyBufferCount() + activeAnom) < MAX_FLOPPY_ANOMALIES;
  }
  return (getNormalStoredCount() + activeNormal) < MAX_MEMORY_SIGNALS;
}

function isBufferFullForLock() {
  if (!hasFloppyDisk) {
    const reservedTotal = getStoredMemoryCount() + sigs.filter(s => s.st === "align" || s.st === "dl").length;
    return reservedTotal >= MAX_MEMORY_SIGNALS;
  }
  const activeNormal = sigs.filter(s => (s.st === "align" || s.st === "dl") && !s.anom).length;
  const activeAnom = sigs.filter(s => (s.st === "align" || s.st === "dl") && s.anom).length;
  return (getNormalStoredCount() + activeNormal) >= MAX_MEMORY_SIGNALS &&
         (getAnomalyBufferCount() + activeAnom) >= MAX_FLOPPY_ANOMALIES;
}

function getUncatalogedNightAssignments() {
  const nightAsgs = nightAssignments.filter(a => a.night === shift && !a.done && !a.failed);
  const availableOutbox = [...outbox];
  const uncataloged = [];

  for (const asg of nightAsgs) {
    const matchIdx = availableOutbox.findIndex(p =>
      !p.anom &&
      p.trueCat === asg.cat &&
      p.chosenCat === asg.cat &&
      (!asg.modelId || (p.trueMod === asg.modelId && p.chosenMod === asg.modelId))
    );
    if (matchIdx >= 0) {
      availableOutbox.splice(matchIdx, 1);
    } else {
      uncataloged.push(asg);
    }
  }
  return uncataloged;
}

function areNightAssignmentsCataloged() {
  return getUncatalogedNightAssignments().length === 0;
}

function ensureSectorDiversity() {
  if (!isPulsarEnabled()) {
    sigs.forEach(s => { if (s.cat === 4 && s.st === "echo") s.st = "gone"; });
  }
  if (!isSingularityEnabled()) {
    sigs.forEach(s => { if (s.cat === 5 && s.st === "echo") s.st = "gone"; });
  }
  if (!isAnomEnabled()) {
    sigs.forEach(s => { if (s.anom && s.st === "echo") s.st = "gone"; });
  }

  const inSector = () => sigs.filter(s => s.st === "echo" || s.st === "align" || s.st === "dl");
  const heldOrQueued = sigs.filter(s => s.st === "raw");

  // 1. Garantizar que toda asignación aún no catalogada (ni entregada) tenga su señal disponible en mapa o procesador
  const uncatalogedAsgs = getUncatalogedNightAssignments();
  const availableSignals = [...inSector(), ...heldOrQueued];

  for (const asg of uncatalogedAsgs) {
    const matchIdx = availableSignals.findIndex(s =>
      !s.anom &&
      !s.isCorruptSignal &&
      s.cat === asg.cat &&
      (!asg.modelId || s.modelId === asg.modelId)
    );
    if (matchIdx >= 0) {
      availableSignals.splice(matchIdx, 1);
    } else {
      if (inSector().length >= 5) {
        const idleExtra = sigs.find(s => s.st === "echo" && !s.assignRefId);
        if (idleExtra) idleExtra.st = "gone";
      }
      const spawnMod = asg.spawnModelId || asg.modelId || null;
      const newSig = makeSignal(asg.cat, false, null, spawnMod, asg.id);
      sigs.push(newSig);
      nightTotalSpawned++;
    }
  }

  // En Noche 9 (shift === 8), asegurar al menos una aparición del Agujero Negro en el sector
  if (shift === 8 && !discoveredModels.has("sin_agujero_negro") && !sigs.some(s => s.modelId === "sin_agujero_negro" && s.st !== "gone")) {
    if (inSector().length >= 5) {
      const idleExtra = sigs.find(s => s.st === "echo" && !s.assignRefId);
      if (idleExtra) idleExtra.st = "gone";
    }
    sigs.push(makeSignal(5, false, null, "sin_agujero_negro", null));
    nightExtraSpawned++;
    nightTotalSpawned++;
  }

  // 2. Completar ecos en sector
  const allowedCats = getAvailableCategories();
  while (inSector().length < 5 && (!areNightAssignmentsCataloged() || nightTotalSpawned < MAX_NIGHT_SIGNALS_AFTER_CATALOG)) {
    const curSector = inSector();
    const missingCats = allowedCats.filter(c => !curSector.some(s => s.cat === c && !s.anom));
    let chosenCat;
    if (missingCats.length > 0) {
      chosenCat = missingCats[Math.floor(Math.random() * missingCats.length)];
    } else {
      const activeCats = getUncatalogedNightAssignments().map(a => a.cat);
      const weightedPool = [...allowedCats, ...activeCats];
      chosenCat = weightedPool[Math.floor(Math.random() * weightedPool.length)];
    }

    sigs.push(makeSignal(chosenCat, null, null, null, null));
    nightExtraSpawned++;
    nightTotalSpawned++;
  }
}

function initShift() {
  pendingOverrideSig = null;
  usedPlanetModelsThisNight = new Set();
  nightExtraSpawned = 0;
  nightTotalSpawned = 0;
  nightAssignPool = [];
  sigs = sigs.filter(s => s.st === "raw"); // Conservar únicamente tramas ya descargadas en buffer

  R = {
    shift: shiftLabel(shift), status: "EN_CURSO", ok: 0,
    t0: performance.now(), tFirst: null,
    slewTime: 0, retunes: 0, invalid: 0,
    repeats: 0, corrupt: 0, silentErrors: 0,
    specUses: 0, anomSent: 0, crash: 0, fix: 0
  };

  // Generar exactamente 3 encargos científicos diarios (pagos: $45-$65 CR)
  const allowedCats = getAvailableCategories();
  const usedSci = new Set();

  for (let i = 0; i < 3; i++) {
    let sci;
    do {
      sci = SCIENTISTS[Math.floor(Math.random() * SCIENTISTS.length)];
    } while (usedSci.has(sci.name) && usedSci.size < SCIENTISTS.length);
    usedSci.add(sci.name);

    const cat = allowedCats[(shift + i) % allowedCats.length];
    let mod;
    if (cat === 1) {
      const unusedPlanets = MODELS.filter(m => m.cat === 1 && (m.minShift || 0) <= shift && !usedPlanetModelsThisNight.has(m.id));
      const pool = unusedPlanets.length ? unusedPlanets : MODELS.filter(m => m.cat === 1 && (m.minShift || 0) <= shift);
      mod = pool[Math.floor(Math.random() * pool.length)];
      usedPlanetModelsThisNight.add(mod.id);
    } else {
      const catModels = MODELS.filter(m => m.cat === cat && (m.minShift || 0) <= shift);
      mod = catModels[Math.floor(Math.random() * catModels.length)];
    }

    const reward = 45 + Math.floor(Math.random() * 21); // $45 a $65 CR
    const requireModel = isSubcatEnabled();

    const targetDesc = requireModel
      ? `${CLASSES[cat]} (${mod.name})`
      : `${CLASSES[cat]}`;

    const assignObj = {
      id: uid(),
      night: shift,
      idx: i + 1,
      sciName: sci.name,
      inst: sci.inst,
      cat,
      modelId: requireModel ? mod.id : null,
      spawnModelId: mod.id,
      reward,
      done: false,
      failed: false
    };
    nightAssignments.push(assignObj);
    nightAssignPool.push({
      assignId: assignObj.id,
      cat,
      modelId: mod.id
    });

    addMail(
      `Encargo ${i + 1}/3 · ${targetDesc}`,
      `Remitente: ${sci.name} (${sci.inst})\n` +
      `Solicitud para ${shiftLabel(shift)}: Registro espectral verificado de ${targetDesc}.\n` +
      `Honorarios autorizados: $${reward} CR.\n\n` +
      `Procesa la captura y enviala manualmente a esta asignacion desde la pestana Plataforma.`,
      {
        kind: "as",
        assignId: assignObj.id,
        night: shift,
        sender: sci.name,
        tag: `N${shift + 1} · 0${i + 1}`,
        sciName: sci.name,
        cat,
        modelId: requireModel ? mod.id : null,
        reward,
        done: false,
        failed: false
      }
    );
  }

  // Avisos narrativos y técnicos por noche
  if (shift === 2) {
    addMail(

function makeServerChallenge() {
  const count = Math.min(7, 3 + Math.floor(shift / 3));
  const seq = Array.from({length: count}, (_, i) => i);
  if (shift >= 2) {
    for (let i = seq.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [seq[i], seq[j]] = [seq[j], seq[i]];
    }
  }
  return {
    count,
    seq,
    step: 0,
    latched: Array(count).fill(false),
    t: performance.now()
  };
}

function evaluatePlatformDispatch(ev) {
  const {pkg, targetType, assignId} = ev;

  if (pkg.anom) {
    if (R) R.anomSent++;
    triggerGovernmentArrestEnding();
    return;
  }

  const modObj = MODELS.find(m => m.id === pkg.modelId);

  if (targetType === "assign") {
    const asg = nightAssignments.find(a => a.id === assignId) || mail.find(m => m.id === assignId);
    if (!asg || asg.done || asg.failed) {
      addMail(
        `Envio #${pkg.sigId} [Asignacion Cerrada]`,
        "El encargo seleccionado ya no se encuentra vigente. Abono acreditado: $0 CR.",
        {sender: "CENTRAL", tag: `N${shift + 1} · $0`}
      );
      return;
    }

    const catMatches = pkg.chosenCat === pkg.trueCat && pkg.chosenCat === asg.cat;
    const modMatches = !asg.modelId || (pkg.chosenMod === pkg.trueMod && pkg.chosenMod === asg.modelId);

    if (!catMatches || !modMatches) {
      if (R) R.silentErrors++;
      addMail(
        `Archivo Erroneo (#${pkg.sigId})`,
        `El paquete enviado (#${pkg.sigId}) no coincide con los parametros solicitados o contiene una clasificacion erronea.\n\n` +
        `Lectura real verificada: ${CLASSES[pkg.trueCat]}${modObj ? ` (${modObj.name})` : ""}.\n` +
        `Pago emitido: $0 CR.`,
        {sender: asg.sciName, tag: `N${shift + 1} · ERR`}
      );
      ensureSectorDiversity();
      syncLiveTelemetry(false, true);
      if (V === "mail" || V === "map") render();
      else updBadges();
      return;
    }

    asg.done = true;
    const mailItem = mail.find(m => m.assignId === asg.id || m.id === assignId);
    if (mailItem) mailItem.done = true;
    discoveredModels.add(pkg.trueMod);
    G.money += asg.reward;
    addMail(
      `Encargo Validado (+$${asg.reward} CR)`,
      `Excelente trabajo, Operador. Los datos de ${CLASSES[pkg.trueCat]} (${modObj ? modObj.name : ""}) han sido incorporados a nuestra investigacion.\n\n` +
      `Honorarios transferidos: +$${asg.reward} CR.`,
      {sender: asg.sciName, tag: `N${shift + 1} · +$${asg.reward}`}
    );
    msg(`[OK] Encargo validado (+$${asg.reward} CR)`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    if (V === "mail" || V === "shop" || V === "atlas") render();
    return;
  }

  if (targetType === "central") {
    const catOk = pkg.chosenCat === pkg.trueCat;
    const modOk = !isSubcatEnabled() || (pkg.chosenMod === pkg.trueMod);

    if (!catOk || !modOk) {
      if (R) R.silentErrors++;
      addMail(
        `CENTRAL // PAQUETE #${pkg.sigId} [ARCHIVO ERRONEO]`,
        `La verificacion automatica detecto discrepancias en tu etiqueta (${CLASSES[pkg.chosenCat]}).\n` +
        `Cuerpo real: ${CLASSES[pkg.trueCat]}${modObj ? ` (${modObj.name})` : ""}. Abono: $0 CR.`
      );
      syncLiveTelemetry(false, true);
      if (V === "mail") render();
      else updBadges();
      return;
    }

    const isNewDiscovery = !discoveredModels.has(pkg.trueMod);
    discoveredModels.add(pkg.trueMod);
    const pay = isNewDiscovery ? 20 : 10;
    G.money += pay;

    addMail(
      `CENTRAL // REGISTRO EXTRA #${pkg.sigId} [ACEPTADO]`,
      isNewDiscovery
        ? `Nuevo cuerpo celeste (${modObj ? modObj.name : CLASSES[pkg.trueCat]}) catalogado en el Archivo Central: +$${pay} CR.`
        : `Registro adicional de ${modObj ? modObj.name : CLASSES[pkg.trueCat]} (ya descubierto previamente): +$${pay} CR.`

    updTop();
    if (V === "mail" || V === "shop" || V === "atlas") render();
