<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inicio de Sesion del Sistema</title>
<style>
:root{
  --bg:#000000;--panel:#000000;--card:#000000;--border:#22c55e;
  --fg:#ffffff;--mut:#d4d4d8;--accent:#22c55e;--warn:#eab308;--bad:#ef4444;--blue:#38bdf8;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{
  height:100%;margin:0;padding:0;background:#000000;color:#ffffff;
  font:14px/1.45 ui-monospace,"Cascadia Code","Fira Code",Consolas,monospace;
}
body{
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,6px) 8px env(safe-area-inset-bottom,8px);
  overflow:hidden;
}
main{
  width:100%;max-width:100%;flex:1;min-height:0;display:flex;flex-direction:column;margin:0;
}
.terminal{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  overflow:hidden;box-shadow:0 0 0 1px #000000, 0 12px 40px rgba(0,0,0,.92);
  position:relative;flex:1;min-height:0;display:flex;flex-direction:column;width:100%;
}
.terminal::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0px,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px);
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 12px;background:#000000;border-bottom:1px solid #22c55e;font-size:12px;color:#ffffff;
  flex:none;
}
.topbar b{color:#ffffff;letter-spacing:1px}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:#000000;border:1px solid #22c55e;color:#ffffff;padding:3px 8px;border-radius:3px}
.pill.night{border-color:#ef4444;color:#ffffff;background:#000000}
.pill.slowrech{border-color:#eab308;color:#ffffff;background:#000000}
.pill.norech{border-color:#f97316;color:#ffffff;background:#000000}
#tabs{
  display:flex;overflow-x:auto;background:#000000;border-bottom:2px solid #22c55e;
  gap:2px;padding:4px 6px;flex:none;
}
.tab{
  flex:none;background:#000000;color:#e4e4e7;
  border:1px solid #166534;border-radius:3px;
  padding:7px 14px;font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.4px;
  cursor:pointer;transition:.12s;
}
.tab:hover{background:#061c0e;color:#ffffff;border-color:#22c55e}
.tab.on{
  background:#072412;color:#ffffff;border:2px solid #22c55e;
  box-shadow:inset 0 -2px #4ade80;
}
.bd{background:#22c55e;color:#000000;border-radius:3px;padding:0 5px;font-weight:800;font-size:11px;margin-left:6px}
#win{
  padding:10px 12px;flex:1;min-height:0;display:flex;flex-direction:column;
  background:#000000;color:#ffffff;position:relative;overflow-y:auto;
}
button{
  font:inherit;font-size:13px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:7px 14px;cursor:pointer;
}
button:hover:not(:disabled){background:#072412;border-color:#4ade80;color:#ffffff}
button.primary-os{
  border-width:2px;font-weight:700;
}
button.logout-btn,
button.save-btn{
  padding:3px 10px;font-size:12px;font-weight:700;border-width:1px;
}
button.logout-btn:not(:disabled),
button.save-btn:not(:disabled){
  border-color:#4ade80;background:#062110;color:#ffffff;
}
.topbar-actions{display:inline-flex;gap:6px;flex-wrap:nowrap;align-items:center}
button.alt{background:#000000;color:#ffffff;border:1px solid #22c55e}
button.alt:hover:not(:disabled){background:#072412;border-color:#4ade80}
button.bad{background:#000000;border:1px solid #ef4444;color:#ffffff}
button.bad:hover:not(:disabled){background:#240808}
button.warn{background:#000000;border:1px solid #eab308;color:#ffffff}
button.warn:hover:not(:disabled){background:#241b06}
button.shadow{background:#000000;border:1px solid #a855f7;color:#ffffff}
button.shadow:hover:not(:disabled){background:#1c0b2e}
button:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:8px 0}
.card{background:#000000;border:1px solid #22c55e;border-radius:4px;padding:10px;margin:8px 0;color:#ffffff}
.card.warnbox{border-color:#eab308;background:#000000}
.card.dangerbox{border-color:#ef4444;background:#000000}
.card.shadowbox{border-color:#a855f7;background:#000000}
.mut{color:#d4d4d8}

/* Panel de Correo inspirado en terminal clásica de dos columnas */
.mail-shell{
  flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;
}
.mail-layout{
  flex:1;display:grid;grid-template-columns:1fr;gap:8px;min-height:360px;
}
@media(min-width:760px){
  .mail-layout{grid-template-columns:minmax(310px,38%) 1fr}
}
.mail-pane{
  border:2px solid #22c55e;border-radius:4px;background:#000000;
  display:flex;flex-direction:column;min-height:320px;overflow:hidden;
}
.mail-pane-top{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 10px;background:#000000;border-bottom:1px solid #22c55e;
  font-size:12px;font-weight:700;
}
.mail-list{
  flex:1;overflow-y:auto;background:#000000;
}
.mi{
  display:grid;grid-template-columns:115px 1fr auto;gap:8px;align-items:center;
  padding:8px 10px;border-bottom:1px solid #14532d;cursor:pointer;font-size:12.5px;color:#ffffff;
}
.mi:hover{background:#061c0e}
.mi.un{font-weight:700;background:#031208}
.mi.sel{background:#092b16;outline:1px solid #22c55e}
.mi.anom-mail{border-left:3px solid #a855f7}
.mi-sender{
  color:#4ade80;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi-subj{
  color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mi-tag{
  color:#38bdf8;font-size:11.5px;font-weight:700;white-space:nowrap;
}
.mail-reader-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 12px;border-bottom:1px solid #22c55e;background:#000000;
}
.mail-sender-box{
  display:flex;align-items:center;gap:10px;
}
.mail-sender-avatar{
  width:30px;height:30px;border:1px solid #22c55e;border-radius:3px;
  display:flex;align-items:center;justify-content:center;background:#000000;flex:none;
}
.mail-sender-name{
  font-size:14px;font-weight:700;color:#fde047;letter-spacing:.3px;
}
.mail-reader-meta{
  color:#38bdf8;font-size:12px;font-weight:700;
}
.mail-reader-subj{
  padding:8px 14px;border-bottom:1px solid #14532d;
  color:#4ade80;font-size:15px;font-weight:700;background:#000000;
}
.mail-body{
  flex:1;padding:14px 16px;white-space:pre-line;overflow-wrap:anywhere;word-break:break-word;font-size:14px;line-height:1.62;
  color:#ffffff;overflow-y:auto;background:#000000;
}
.mail-reader-foot{
  padding:10px 14px;border-top:1px solid #14532d;background:#030906;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.mail-help-btn{
  display:inline-flex;align-items:center;gap:8px;padding:7px 13px;
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.3px;
  color:#fde047;background:#071a10;border:1px solid #22c55e;border-radius:4px;
  cursor:pointer;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s;
}
.mail-help-btn:hover:not(:disabled){
  background:#14532d;border-color:#4ade80;color:#ffffff;
  box-shadow:0 0 10px rgba(34,197,94,.28);
}
.mail-help-btn:active:not(:disabled){transform:translateY(1px)}
.mail-help-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:50%;background:#fde047;color:#052e16;
  font-size:12px;font-weight:900;line-height:1;flex:none;
}

/* Mapa Estelar: área ampliada a pantalla completa con barra HUD compacta */
.map-shell{
  flex:1;display:flex;flex-direction:column;min-height:0;gap:6px;
}
.map-viewport{
  flex:1;min-height:280px;position:relative;display:flex;
  border:1px solid #22c55e;border-radius:4px;background:#03070d;overflow:hidden;
}
#cv{
  width:100%;height:100%;display:block;touch-action:none;cursor:grab;
}
#cv:active{cursor:grabbing}
.map-hud-bar{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:4px 10px;background:#030a06;border:1px solid #166534;border-radius:4px;
  font-size:12px;
}
.map-hud-bar button{
  padding:4px 11px;font-size:12px;
}

/* Procesador: monitores amplios y simétricos + panel lateral compacto y ordenado */
.proc-shell{
  flex:1;display:flex;flex-direction:column;min-height:0;gap:8px;
}
.proc-buffer-bar{
  flex:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:5px 10px;background:#030a06;border:1px solid #166534;border-radius:4px;
}
.proc-buffer-bar button{
  padding:4px 10px;font-size:12px;
}
.proc-grid{
  flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:10px;
}
@media(min-width:900px){
  .proc-grid{grid-template-columns:minmax(0,1fr) 315px}
}
@media(min-width:1280px){
  .proc-grid{grid-template-columns:minmax(0,1fr) 335px}
}
.proc-monitors{
  display:grid;grid-template-columns:1fr;gap:10px;min-height:250px;height:100%;
}
.proc-monitors.dual{
  grid-template-columns:1fr;
}
@media(min-width:640px){
  .proc-monitors.dual{grid-template-columns:1fr 1fr}
}
.crt-wrap{
  background:#000000;border:2px solid #22c55e;border-radius:4px;padding:8px 10px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;
  gap:6px;position:relative;min-height:230px;height:100%;min-width:0;
}
.crt-wrap.opt-fail{border-color:#ef4444;background:#000000}
.monitor-head{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.4px;padding-bottom:4px;
  border-bottom:1px dashed #166534;
}
body.paper-theme .monitor-head{
  border-bottom-color:#a89068;color:#3d2814;
}
.monitor-foot{
  flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;
  min-height:38px;font-size:11px;padding:4px 6px;border-radius:3px;
  border:1px solid #166534;background:#030a06;
}
body.paper-theme .monitor-foot{
  border-color:#a89068;background:#f5eedc;
}
.crt-stage{
  flex:1;width:100%;min-height:175px;display:flex;align-items:center;justify-content:center;
  background:#020503;border:1px solid #166534;border-radius:3px;padding:5px;overflow:hidden;
}
#crt{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
  background:#000000;display:block;
}
#spec{
  width:100%;height:100%;background:#000000;display:block;
}
.proc-side{
  display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;
}
.proc-side > .card{
  margin:0;flex:none;display:flex;flex-direction:column;gap:8px;padding:9px 10px;
}
.proc-sec-head{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;letter-spacing:.4px;padding-bottom:5px;
  border-bottom:1px dashed #166534;
}
body.paper-theme .proc-sec-head{
  border-bottom-color:#a89068;color:#3d2814;
}
.tuner-box{
  display:flex;flex-direction:column;gap:4px;padding:6px 8px;
  border:1px solid #166534;border-radius:3px;background:rgba(3,10,6,.55);
}
body.paper-theme .tuner-box{
  border-color:#b8a078;background:rgba(245,238,220,.7);
}
.tuner-row{
  display:flex;align-items:center;gap:6px;
}
.tuner-lbl{
  width:74px;flex:none;font-size:11.5px;font-weight:700;
}
.tuner-row input[type=range]{
  flex:1;min-width:0;margin:0;height:16px;
}
.tuner-val{
  width:28px;flex:none;text-align:right;font-size:12px;font-weight:700;
}
.tuner-box .prox-wrap{
  margin-top:0;gap:6px;font-size:10.5px;
}
.proc-actions{
  display:grid;grid-template-columns:1fr 1fr auto;gap:5px;padding-top:4px;
}
.proc-actions button{
  padding:6px 7px;font-size:11.5px;white-space:nowrap;
}
.proc-cat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:5px;
}
.proc-cat-grid button{
  padding:5px 6px;font-size:11.5px;
}

.databox{
  flex:none;height:38px;overflow-y:auto;
  background:#000000;border:1px solid #22c55e;border-radius:3px;padding:4px 7px;
  font-size:10.5px;line-height:1.35;color:#ffffff;white-space:pre-wrap;word-break:break-all;width:100%;
}
.databox.anom{border-color:#ef4444;color:#ffffff;background:#000000}
input[type=range]{flex:1;accent-color:#22c55e;cursor:pointer}
input[type=text]{
  width:100%;max-width:340px;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:9px 12px;font:14px inherit;
  outline:none;
}
input[type=text]:focus{border-color:#4ade80;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
select{
  width:100%;max-width:100%;background:#000000;color:#ffffff;
  border:1px solid #22c55e;border-radius:3px;padding:9px 12px;font:13px inherit;
  outline:none;cursor:pointer;
}
select:focus{border-color:#4ade80;box-shadow:0 0 0 2px rgba(34,197,94,.28)}
.prox-wrap{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:#ffffff}
.prox-bar{flex:1;height:7px;background:#000000;border:1px solid #22c55e;border-radius:3px;overflow:hidden}
.prox-fill{height:100%;transition:width .08s,background .12s}
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px;margin-top:10px}
.atlas-card{
  background:#000000;border:1px solid #22c55e;border-radius:4px;padding:9px;
  display:flex;flex-direction:column;gap:6px;color:#ffffff;
}
.atlas-card.locked{opacity:.52;background:#000000;border-color:#15803d}
.atlas-cv{width:100%;height:110px;image-rendering:pixelated;background:#000000;border:1px solid #22c55e;border-radius:3px;display:block}
.atlas-cv.spec-mode{image-rendering:auto}
.paper-sheet{
  background:linear-gradient(180deg,#e9dec4 0%,#dfd0b0 100%);
  color:#2b2116;border:2px solid #8c734b;border-radius:6px;padding:14px;
  margin-top:16px;box-shadow:inset 0 0 24px rgba(92,68,36,.28),0 4px 14px rgba(0,0,0,.45);
  font-family:"Courier New",Courier,monospace;
}
.paper-sheet h3{
  margin:0 0 10px;color:#3d2814;border-bottom:1px dashed #7c623c;padding-bottom:6px;
  font-size:15px;letter-spacing:.5px;
}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.paper-entry{
  background:rgba(255,250,238,.65);border:1px solid #9c8259;border-radius:4px;padding:9px;
  display:flex;flex-direction:column;gap:6px;
}
.paper-cv{
  width:100%;height:110px;image-rendering:pixelated;background:#1e1912;
  border:1px solid #6e5634;border-radius:3px;display:block;
}
.paper-cv.spec-mode{image-rendering:auto}
.paper-bin{
  background:#f5eedc;border:1px solid #a89068;padding:6px;border-radius:3px;
  font-size:11px;color:#24190e;word-break:break-all;white-space:pre-wrap;
}
.paper-btn{
  background:#5c4424;color:#fbf6ea;border:1px solid #3d2b14;font-size:11.5px;padding:4px 8px;
}
.paper-btn:hover{background:#473319}
#toast{
  margin-top:6px;padding:6px 12px;border-radius:4px;background:#000000;
  border:1px solid #22c55e;color:#ffffff;text-align:center;font-size:12px;flex:none;
}
#toast.ok{border-color:#22c55e;background:#000000;color:#ffffff}
#toast.bad{border-color:#ef4444;background:#000000;color:#ffffff}
.boot-screen{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  padding:34px 20px 28px;margin:auto;width:100%;max-width:620px;min-height:420px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;overflow:hidden;
}
.boot-logo{
  width:234px;height:192px;image-rendering:pixelated;image-rendering:crisp-edges;
  display:block;margin:0 auto 22px;object-fit:contain;
  animation:bootFadeIn .65s ease-out;
}
@keyframes bootFadeIn{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}
.boot-bar-frame{
  width:100%;max-width:360px;height:22px;padding:3px;
  background:#000000;border:1px solid #22c55e;
  margin:0 auto 10px;
}
.boot-bar-track{
  width:100%;height:100%;background:#000000;overflow:hidden;position:relative;
}
.boot-bar-fill{
  height:100%;width:0%;
  background:repeating-linear-gradient(
    90deg,
    #22c55e 0px,
    #22c55e 10px,
    #000000 10px,
    #000000 13px
  );
  transition:width .12s linear;
}
.boot-status{
  font-size:12px;color:#ffffff;letter-spacing:.6px;min-height:18px;margin-top:4px;
}
.boot-audio-hint{
  margin-top:18px;font-size:11px;color:#ffffff;letter-spacing:.8px;
  animation:blinkHint 1.3s steps(2,end) infinite;cursor:pointer;
}
@keyframes blinkHint{
  0%,100%{opacity:1}
  50%{opacity:.28}
}
.login-win{
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  width:100%;max-width:460px;margin:auto;padding:0;overflow:hidden;
}
.os-win-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 12px;background:#000000;border-bottom:1px solid #22c55e;
  font-size:12px;color:#ffffff;letter-spacing:.8px;
}
.login-body{
  padding:28px 24px 26px;text-align:center;background:#000000;color:#ffffff;
}
.user-avatar-frame{
  width:96px;height:96px;margin:0 auto 18px;
  background:#000000;border:2px solid #22c55e;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
}
.user-avatar-frame img{width:62px;height:62px;object-fit:contain;display:block}
.mail-sender-avatar img{width:20px;height:20px;object-fit:contain;display:block}
.os-modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.86);
  display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;
}
.os-modal-win{
  width:100%;max-width:460px;background:#000000;border:2px solid #22c55e;
  border-radius:4px;color:#ffffff;overflow:hidden;
  box-shadow:0 0 0 2px #000000, 0 0 28px rgba(34,197,94,.25);
}
.os-modal-body{
  padding:18px 20px;background:#000000;color:#ffffff;text-align:left;
}
#nightFadeOverlay{
  position:fixed;inset:0;background:#000000;opacity:0;pointer-events:none;
  z-index:999;transition:opacity 0.65s ease-in-out;
  display:flex;align-items:center;justify-content:center;
}
#nightFadeOverlay.active{
  opacity:1;pointer-events:all;
}
#nightFadeText{
  color:#ffffff;
  font-family:"Courier New",Courier,ui-monospace,monospace;
  font-size:clamp(26px,4.5vw,44px);
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:0;
  transition:opacity 0.55s ease-in-out;
  user-select:none;
}
#nightFadeText.visible{
  opacity:1;
}

/* ============================================================================
   ENTORNO GRAFICO UNIFICADO ESTILO ARCHIVO / ANOMALIAS (A PARTIR DEL LOGIN)
   ============================================================================ */
body.boot-mode{
  background:#000000;
  padding:0;
}
body.boot-mode .terminal{
  background:#000000;
  border:none;
  border-radius:0;
  box-shadow:none;
}
body.boot-mode .terminal::after,
body.boot-mode .topbar,
body.boot-mode #tabs{
  display:none !important;
}
body.boot-mode #win{
  background:#000000;
  padding:0;
  overflow:hidden;
}
body.boot-mode .boot-screen{
  background:#000000;
  border:none;
  border-radius:0;
  max-width:none;
  width:100%;
  height:100%;
  padding:20px;
}
body.login-mode .terminal{
  background:transparent;
  border:none;
  box-shadow:none;
}
body.login-mode .terminal::after,
body.login-mode .topbar,
body.login-mode #tabs{
  display:none !important;
}
body.login-mode #win{
  background:transparent;
  padding:16px;
}
body.paper-theme{
  background:#1e1912;
  color:#2b2116;
  font-family:"Courier New",Courier,ui-monospace,monospace;
}
body.paper-theme .terminal{

/* ============================================================================
   ASISTENTE INTERACTIVO ESTILO ROVER (WINDOWS XP) EN PANTALLA DE LOGIN
   ============================================================================ */
.xp-assistant-dock{
  position:relative;
  margin:14px auto 4px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  z-index:20;
  user-select:none;
  max-width:340px;
}
@media(min-width:840px){
  .xp-assistant-dock{
    position:absolute;
    right:26px;
    bottom:18px;
    margin:0;
  }
}
.xp-balloon{
  position:relative;
  width:292px;
  background:linear-gradient(180deg,#fffef4 0%,#f5eedc 100%);
  color:#24190e;
  border:2px solid #5c4424;
  border-radius:11px;
  padding:11px 13px 10px;
  margin-bottom:14px;
  box-shadow:0 10px 24px rgba(0,0,0,.55), inset 0 1px 0 #ffffff;
  font-family:"Courier New",Courier,ui-monospace,monospace;
  text-align:left;
  animation:xpBalloonPop .22s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes xpBalloonPop{
  from{opacity:0;transform:translateY(8px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.xp-balloon::before{
  content:"";
  position:absolute;
  right:58px;
  bottom:-14px;
  width:0;
  height:0;
  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-top:14px solid #5c4424;
}
.xp-balloon::after{
  content:"";
  position:absolute;
  right:60px;
  bottom:-11px;
  width:0;
  height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-top:11px solid #f5eedc;
}
.xp-balloon-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  font-weight:700;
  letter-spacing:.6px;
  color:#5c4424;
  border-bottom:1px dashed #b8a078;
  padding-bottom:4px;
  margin-bottom:7px;
}
.xp-balloon-msg{
  font-size:12.5px;
  line-height:1.45;
  color:#24190e;
  min-height:54px;
  margin-bottom:9px;
}
.xp-balloon-opts{
  display:flex;
  flex-direction:column;
  gap:5px;
  border-top:1px dashed #b8a078;
  padding-top:7px;
}
button.xp-opt-btn{
  width:100%;
  text-align:left;
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 9px;
  font-size:12px;
  font-weight:700;
  background:#fbf6ea;
  color:#2b2116;
  border:1px solid #8c734b;
  border-radius:5px;
  cursor:pointer;
  transition:background .12s, border-color .12s, transform .08s;
}
button.xp-opt-btn:hover:not(:disabled){
  background:#e6d7b8;
  border-color:#5c4424;
  color:#1e1912;
}
button.xp-opt-btn:active:not(:disabled){
  transform:translateY(1px);
}
.xp-opt-bullet{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#5c4424;
  color:#fbf6ea;
  font-size:10px;
  line-height:1;
  flex:none;
}
.xp-bear-row{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:flex-end;
  gap:4px;
}
button.xp-alert-btn{
  position:relative;
  top:10px;
  background:linear-gradient(180deg,#fef08a 0%,#eab308 100%);
  color:#24190e;
  border:2px solid #5c4424;
  border-radius:6px;
  padding:4px 9px;
  font-size:13px;
  font-weight:900;
  letter-spacing:.5px;
  box-shadow:0 4px 12px rgba(0,0,0,.55), inset 0 1px 0 #fef9c3;
  cursor:pointer;
  animation:xpAlertPulse 1.6s ease-in-out infinite;
  flex:none;
}
button.xp-alert-btn:hover:not(:disabled){
  background:linear-gradient(180deg,#fef9c3 0%,#facc15 100%);
  border-color:#3d2b14;
  color:#1e1912;
  transform:scale(1.06);
}
@keyframes xpAlertPulse{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
.xp-bear-wrap{
  width:144px;
  height:208px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  pointer-events:none;
}
.xp-bear-img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.68));
  transform-origin:bottom center;
  animation:xpBearIdle 3.4s ease-in-out infinite;
}
.xp-bear-img.hop{
  animation:xpBearHop .38s cubic-bezier(.25,1.4,.4,1);
}
@keyframes xpBearIdle{
  0%,100%{transform:scaleY(1) translateY(0)}
  50%{transform:scaleY(1.015) translateY(-1.5px)}
}
@keyframes xpBearHop{
  0%{transform:translateY(0) scale(1)}
  40%{transform:translateY(-10px) scale(1.03,.97)}
  75%{transform:translateY(2px) scale(.98,1.02)}
  100%{transform:translateY(0) scale(1)}
}

.tut-dock{

  bottom:14px;

.tut-bear.hop{animation:xpBearHop .38s cubic-bezier(.25,1.4,.4,1)}

@keyframes tutShake{

// Caché de sprites PNG en Signals/
const IMG_CACHE = {};
const offCv = document.createElement("canvas");
const offCx = offCv.getContext("2d");

function getSprite(src) {
  if (!src) return null;
  if (!IMG_CACHE[src]) {
    const im = new Image();
    im._failed = false;
    im.onerror = () => { im._failed = true; };
    im.src = src;
    IMG_CACHE[src] = im;
  }
  const im = IMG_CACHE[src];
  if (im._failed) return null;
  return (im.complete && im.naturalWidth > 0) ? im : null;
}

function preloadAllSprites() {
  MODELS.forEach(m => { if (m.img) getSprite(m.img); });
  ANOMALY_DEFS.forEach(a => {
    if (a.img) getSprite(a.img);
    if (a.spectrogramImg) getSprite(a.spectrogramImg);
  });
}

let bearMsg = BEAR_WELCOME_MSG;
let bearFarewell = false;
let bearCloseIn = 0;
let bearDialogOpen = false;
let bearFrameIdx = 0; // Bear_1.png (reposo amigable con ojos abiertos)
let bearIdleClock = 0;
let bearNextBlinkAt = 2.8;
let bearBlinkEndAt = 0;
let bearTalkingTimer = 0;
let bearTalkStep = 0;
let bearTypedChars = 0;
let bearHopPending = false;

function updateBearAnimation(dt) {
  bearIdleClock += dt;

  // Avance de texto tipo máquina de escribir cuando el globo está abierto
  if (bearDialogOpen && bearTypedChars < bearMsg.length) {
    bearTypedChars = Math.min(bearMsg.length, bearTypedChars + dt * 58);
    const msgEl = document.querySelector("#bearSpeechText");
    if (msgEl) {
      msgEl.textContent = bearMsg.slice(0, Math.floor(bearTypedChars));
    }
  } else if (bearDialogOpen && bearFarewell) {
    // Tras despedirse, el globo se cierra solo
    bearCloseIn += dt;
    if (bearCloseIn >= 2.6) {
      bearDialogOpen = false;
      bearFarewell = false;
      bearCloseIn = 0;
      render();
    }
  }

  let nextFrame = 0;
  if (bearTalkingTimer > 0) {
    bearTalkingTimer = Math.max(0, bearTalkingTimer - dt);
    bearTalkStep += dt;
    const phase = Math.floor(bearTalkStep / 0.13) % 6;
    // Alternancia expresiva estilo Rover hablando usando las 4 imágenes
    if (phase === 0) nextFrame = 2;      // Bear_4: hablando
    else if (phase === 1) nextFrame = 0; // Bear_1: pausa breve (boca cerrada)
    else if (phase === 2) nextFrame = 3; // Bear_5: hablando expresivo
    else if (phase === 3) nextFrame = 2; // Bear_4: hablando
    else if (phase === 4) nextFrame = 3; // Bear_5: hablando expresivo
    else nextFrame = 0;                  // Bear_1: gesto atento
  } else {
    // Ciclo natural de parpadeo en reposo
    if (bearIdleClock >= bearNextBlinkAt) {
      bearBlinkEndAt = bearIdleClock + 0.15;
      bearNextBlinkAt = bearIdleClock + 3.0 + Math.random() * 2.4;
    }

    if (bearIdleClock < bearBlinkEndAt) {
      nextFrame = 1; // Bear_2: parpadeo
    } else {
      nextFrame = 0; // Bear_1: reposo amigable
    }
  }

  if (nextFrame !== bearFrameIdx) {
    bearFrameIdx = nextFrame;
    const imgEl = document.querySelector("#bearSpriteImg");
    if (imgEl && BEAR_FRAMES[bearFrameIdx]) {
      imgEl.src = BEAR_FRAMES[bearFrameIdx];
    }
  }
}

function bearIsTalking() {

function loadBearVoiceBuffer() {
  if (bearVoiceBuffer || bearVoiceLoading) return;
  bearVoiceLoading = true;
  try {
    ensureAudioContext();
    fetch(BEAR_VOICE_SRC)
      .then(r => { if (!r.ok) throw new Error("http"); return r.arrayBuffer(); })
      .then(buf => new Promise((res, rej) => au.decodeAudioData(buf, res, rej)))
      .then(decoded => { bearVoiceBuffer = decoded; })
      .catch(() => {})
      .then(() => { bearVoiceLoading = false; });
  } catch (_) { bearVoiceLoading = false; }
}

function startBearVoiceNode() {
  try {
    ensureAudioContext();
    if (au.state === "suspended") au.resume();
    bearVoiceSource = au.createBufferSource();
    bearVoiceSource.buffer = bearVoiceBuffer;
    bearVoiceSource.loop = true;   // bucle sin pausas
    bearVoiceGain = au.createGain();
    bearVoiceGain.gain.value = 0.5;
    bearVoiceSource.connect(bearVoiceGain);
    bearVoiceGain.connect(au.destination);
    bearVoiceSource.start();
    return true;
  } catch (_) { bearVoiceSource = null; return false; }
}

function stopBearVoiceNode() {
  if (bearVoiceSource) {
    try { bearVoiceSource.stop(); } catch (_) {}
    try { bearVoiceSource.disconnect(); } catch (_) {}
    bearVoiceSource = null;
  }
  if (bearVoiceGain) {
    try { bearVoiceGain.disconnect(); } catch (_) {}

function beep(freq, dur = 0.08, type = "sine", vol = 0.06) {

    g.gain.exponentialRampToValueAtTime(0.0001, au.currentTime + dur);
    o.connect(g); g.connect(au.destination);

  } catch (_) {}
}

let staticNoiseBuffer = null;

function createStaticNoiseNodes(initialGain = 0) {
  ensureAudioContext();
  if (!au) return null;

  if (!staticNoiseBuffer) {
    const bufferSize = au.sampleRate * 2;
    staticNoiseBuffer = au.createBuffer(1, bufferSize, au.sampleRate);
    const data = staticNoiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
  }

  const noiseNode = au.createBufferSource();
  noiseNode.buffer = staticNoiseBuffer;
  noiseNode.loop = true;

  const filter = au.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1350;
  filter.Q.value = 0.7;

  const noiseGain = au.createGain();
  noiseGain.gain.value = initialGain;

  noiseNode.connect(filter);
  filter.connect(noiseGain);
  if (analyser) {
    noiseGain.connect(analyser);
  } else {
    noiseGain.connect(au.destination);
  }

  noiseNode.start();
  return { noiseNode, noiseGain };
}

function getSignalNoiseLevel(sigObj) {
  if (!sigObj || sigObj.fixed || sigObj.tgF === undefined) return 0;
  if (isTuned(sigObj)) return 0.015;
  const err = Math.min(1, (offF(sigObj) + offP(sigObj)) * 0.65);
  return Math.min(0.16, err * 0.16);
}

function stopVoice() {
  if (!activeVoice) return;
  if (activeVoice.o) {
    try { activeVoice.o.stop(); } catch (_) {}
  }
  if (activeVoice.audio) {

      activeVoice.audio.pause();
      activeVoice.audio.currentTime = 0;
    } catch (_) {}
  }
  if (activeVoice.noiseNode) {
    try { activeVoice.noiseNode.stop(); } catch (_) {}
  }
  if (activeVoice.noiseGain) {
    try { activeVoice.noiseGain.disconnect(); } catch (_) {}
  }
  activeVoice = null;
}

function playFallbackStartupSynth() {
  try {
    ensureAudioContext();
    if (!au || au.state !== "running") return false;
    const now = au.currentTime + 0.03;
    const master = au.createGain();
    const filter = au.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(360, now);
    filter.frequency.exponentialRampToValueAtTime(2400, now + 0.85);
    filter.frequency.exponentialRampToValueAtTime(980, now + 3.4);
    filter.Q.value = 1.4;

    master.gain.setValueAtTime(0.0001, now);
    master.gain.linearRampToValueAtTime(0.16, now + 0.22);
    master.gain.setValueAtTime(0.15, now + 1.65);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 3.6);

    filter.connect(master);
    master.connect(au.destination);

    const chords = [
      { t: 0.00, dur: 1.05, freqs: [155.56, 233.08, 311.13, 392.00, 466.16, 587.33] },
      { t: 0.82, dur: 1.05, freqs: [207.65, 311.13, 415.30, 523.25, 622.25, 783.99] },
      { t: 1.58, dur: 2.00, freqs: [155.56, 233.08, 349.23, 392.00, 587.33, 932.33] }
    ];

    chords.forEach((ch, ci) => {
      ch.freqs.forEach((f, fi) => {
        const osc = au.createOscillator();
        const vg = au.createGain();
        osc.type = (fi % 2 === 0) ? "triangle" : "sine";
        const detune = (fi % 2 === 0 ? -5 : 5) + ci * 1.5;
        osc.frequency.setValueAtTime(f, now + ch.t);
        osc.detune.setValueAtTime(detune, now + ch.t);

        const voicePeak = (fi === 0 ? 0.22 : 0.13) / Math.sqrt(ch.freqs.length);
        vg.gain.setValueAtTime(0.0001, now + ch.t);
        vg.gain.linearRampToValueAtTime(voicePeak, now + ch.t + 0.14);
        vg.gain.exponentialRampToValueAtTime(0.0001, now + ch.t + ch.dur);

        osc.connect(vg);
        vg.connect(filter);
        osc.start(now + ch.t);
        osc.stop(now + ch.t + ch.dur + 0.05);
      });
    });
    return true;
  } catch (_) {
    return false;
  }
}

function startOscillatorFallback(sigObj, mod, anomDef, staticNodes) {

    o.type = anomDef ? anomDef.wave : mod.wave;
    o.frequency.value = anomDef ? anomDef.freq : mod.freq;
    g.gain.value = 0.08;
    // Conectar directamente el mismo oscilador al AnalyserNode de Web Audio
    o.connect(g);
    if (analyser) {
      g.connect(analyser);
    } else {
      g.connect(au.destination);
    }
    o.start();
    activeVoice = {
      o,

      sig: sigObj,
      t: 0,
      max: 3.8,
      noiseNode: staticNodes ? staticNodes.noiseNode : null,

  } catch (_) {}
}

function playSignalAudio(sigObj) {
  stopVoice();
  if (muted) return;
  ensureAudioContext();
  const anomDef = sigObj.anom ? ANOMALY_DEFS.find(a => a.type === sigObj.anomType) : null;
  const mod = MODELS.find(m => m.id === sigObj.modelId) || MODELS[0];
  const audioDef = (anomDef && anomDef.audioSrc)
    ? anomDef
    : (!sigObj.anom && mod && mod.audioSrc)
      ? mod
      : null;

  const staticNodes = createStaticNoiseNodes(getSignalNoiseLevel(sigObj));

  if (audioDef && audioDef.audioSrc) {
    try {
      const audio = new Audio(audioDef.audioSrc);
      audio.crossOrigin = "anonymous";
      const baseVol = (typeof audioDef.audioVol === "number") ? audioDef.audioVol : 0.48;
      const clarity = sigObj.fixed ? 1 : (sigObj.tgF !== undefined ? Math.max(0.25, 1 - (offF(sigObj) + offP(sigObj)) * 0.55) : 1);
      audio.volume = Math.max(0.08, Math.min(baseVol, baseVol * clarity));

      // Conectar el flujo de audio al AnalyserNode de Web Audio para que el espectrograma sea el audio real
      try {
        if (au && analyser) {
          const mediaSrc = au.createMediaElementSource(audio);
          mediaSrc.connect(analyser);
        }
      } catch (_) {}

      audio.onended = () => {
        if (activeVoice && activeVoice.audio === audio) {
          stopVoice();
          if (V === "proc") render();
        }
      };
      audio.onerror = () => {
        if (activeVoice && activeVoice.audio === audio) {
          const savedNoise = { noiseNode: activeVoice.noiseNode, noiseGain: activeVoice.noiseGain };
          activeVoice = null;
          startOscillatorFallback(sigObj, mod, anomDef, savedNoise);
          if (V === "proc") render();
        }
      };
      activeVoice = {
        audio,
        baseVol,
        sig: sigObj,
        t: 0,
        noiseNode: staticNodes ? staticNodes.noiseNode : null,
        noiseGain: staticNodes ? staticNodes.noiseGain : null
      };
      const p = audio.play();
      if (p && typeof p.catch === "function") {
        p.catch(() => {
          if (activeVoice && activeVoice.audio === audio) {
            stopVoice();
            if (V === "proc") render();
          }
        });
      }
      return;
    } catch (_) {}
  }

  startOscillatorFallback(sigObj, mod, anomDef, staticNodes);
}

function playMailChime() {

function pickUniqueModelForCat(cat, forcedModelId = null) {
  const catModels = MODELS.filter(m => m.cat === cat && (m.minShift || 0) <= shift);
  const fallbackModels = catModels.length ? catModels : MODELS.filter(m => m.cat === cat);
  if (forcedModelId) {
    const found = fallbackModels.find(m => m.id === forcedModelId) || MODELS.find(m => m.id === forcedModelId);
    if (found) {
      if (cat === 1) usedPlanetModelsThisNight.add(found.id);
      return found;
    }
  }
  if (cat === 1) {
    const unusedPlanets = fallbackModels.filter(m => !usedPlanetModelsThisNight.has(m.id));
    const pool = unusedPlanets.length ? unusedPlanets : fallbackModels;
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    usedPlanetModelsThisNight.add(chosen.id);
    return chosen;
  }
  return fallbackModels[Math.floor(Math.random() * fallbackModels.length)];
}

function getAvailableUniqueAnomalies() {
  const claimedTypes = new Set([
    ...discoveredAnomalies.map(d => d.anomType),
    ...floppyStoredAnomalies.map(d => d.anomType),
    ...sigs.filter(s => s.anom && s.st !== "gone").map(s => s.anomType),
    ...outbox.filter(p => p.anom).map(p => p.anomType)
  ]);
  return ANOMALY_DEFS.filter(a => !claimedTypes.has(a.type));
}

function makeSignal(cat, forcedAnom = null, forcedAnomType = null, forcedModelId = null, assignRefId = null) {
  let x, y, tries = 0;
  do {
    x = 240 + Math.random() * (W - 480);
    y = 240 + Math.random() * (H - 480);
  } while (tries++ < 160 && sigs.some(s => s.st !== "gone" && Math.hypot(s.x - x, s.y - y) < 760));

  // Las anomalías SOLO aparecen a partir de Noche 10 (isAnomEnabled()), con ratio reducido (4.5%)
  // y cada anomalía es estrictamente única (si ya fue encontrada o está activa, nunca vuelve a aparecer)
  const availableAnoms = getAvailableUniqueAnomalies();
  const allowAnom = isAnomEnabled() && !assignRefId && availableAnoms.length > 0;
  let anom = allowAnom ? (forcedAnom !== null ? forcedAnom : (Math.random() < 0.06)) : false;

  let anomDef = null;
  if (anom) {
    if (forcedAnomType) {
      anomDef = availableAnoms.find(a => a.type === forcedAnomType) || null;
    } else {
      anomDef = availableAnoms[Math.floor(Math.random() * availableAnoms.length)] || null;
    }
    if (!anomDef) anom = false;
  }

  let actualCat = anomDef ? anomDef.cat : cat;
  // Si todos los planetas únicos de la noche ya aparecieron y no es asignación forzada, rotar a otra categoría disponible
  if (!anomDef && !forcedModelId && actualCat === 1) {
    const allPlanets = MODELS.filter(m => m.cat === 1);
    if (usedPlanetModelsThisNight.size >= allPlanets.length) {
      const altCats = getAvailableCategories().filter(c => c !== 1);
      actualCat = altCats[Math.floor(Math.random() * altCats.length)];
    }
  }

  const chosenModel = pickUniqueModelForCat(actualCat, forcedModelId);

  // Imágenes de señuelo/confusión en el CRT:
  // - Cuasar (Noche 5+): elige aleatoriamente entre enana amarilla y enana roja, pero en Atlas usa noimage_anomaly.png
  // - Enana Marrón (Noche 7+): usa red_dwarf.png en CRT, pero en Atlas usa brown_dwarf.png
  let signalImg = anomDef ? anomDef.img : chosenModel.img;
  if (!anomDef) {
    if (chosenModel.id === "sin_cuasar") {
      signalImg = Math.random() < 0.5 ? "Signals/yellow_dwarf.png" : "Signals/red_dwarf.png";
    } else if (chosenModel.id === "est_enana_marron") {
      signalImg = "Signals/red_dwarf.png";
    }
  }

  // A partir de la Noche 5 (shift >= 4), algunos archivos sufren daño visual con un ratio bajo (12% - 20%),
  // dejando visible únicamente el espectrograma y el audio para identificarlos (nunca en anomalías ni encargos)
  const corruptProb = (!anom && !assignRefId && shift >= 4)
    ? Math.min(0.20, 0.12 + (shift - 4) * 0.01)
    : 0;
  const isCorruptSignal = Math.random() < corruptProb;

  const moving = (actualCat === 2 || actualCat === 3);
  const ang = Math.random() * Math.PI * 2;
  const spd = moving ? (2.1 + Math.random() * 1.4) : 0;

  let textData = "[Sin subportadora]";
  let anomTitle = "";
  let anomType = "";
  if (anomDef) {
    anomType = anomDef.type;
    anomTitle = anomDef.title;
    textData = anomDef.textData;
  } else if (actualCat === 3) {
    const satNum = 100 + Math.floor(Math.random() * 899);
    const alt = 420 + Math.floor(Math.random() * 380);
    const hex = uid();
    textData = `TLM-SAT-${satNum} // ALT:${alt}KM // PWR:88% // HASH:${hex}`;
  }

  return {
    id: ++sid, x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    cat: actualCat, modelId: chosenModel.id, img: signalImg,
    anom, anomType, anomTitle, assignRefId,
    isCorruptSignal, st: "echo", align: 0, prog: 0,
    tot: 0, bad: 0, acc: 0, seed: Math.random() * 100,
    tgF: 14 + Math.floor(Math.random() * 72),
    tgP: 14 + Math.floor(Math.random() * 72),
    fixed: false, textData
  };
}

function getNormalStoredCount() {
  return sigs.filter(s => s.st === "raw" && !s.anom).length + outbox.filter(p => !p.anom).length;

function getAnomalyBufferCount() {
  return sigs.filter(s => s.st === "raw" && s.anom).length + outbox.filter(p => p.anom).length;
}

function getStoredMemoryCount() {
  return sigs.filter(s => s.st === "raw").length + outbox.length;

function canAcceptSignalInBuffer(isAnomSignal = false) {
  if (!hasFloppyDisk) {
    const reservedTotal = getStoredMemoryCount() + sigs.filter(s => s.st === "align" || s.st === "dl").length;
    return reservedTotal < getMemoryCapacity();
  }
  const activeNormal = sigs.filter(s => (s.st === "align" || s.st === "dl") && !s.anom).length;
  const activeAnom = sigs.filter(s => (s.st === "align" || s.st === "dl") && s.anom).length;
  if (isAnomSignal) {
    return (getAnomalyBufferCount() + activeAnom) < MAX_FLOPPY_ANOMALIES;
  }
  return (getNormalStoredCount() + activeNormal) < getMemoryCapacity();
}

function isBufferFullForLock() {
  if (!hasFloppyDisk) {
    const reservedTotal = getStoredMemoryCount() + sigs.filter(s => s.st === "align" || s.st === "dl").length;
    return reservedTotal >= getMemoryCapacity();
  }
  const activeNormal = sigs.filter(s => (s.st === "align" || s.st === "dl") && !s.anom).length;
  const activeAnom = sigs.filter(s => (s.st === "align" || s.st === "dl") && s.anom).length;
  return (getNormalStoredCount() + activeNormal) >= getMemoryCapacity() &&
         (getAnomalyBufferCount() + activeAnom) >= MAX_FLOPPY_ANOMALIES;
}

function getUncatalogedNightAssignments() {
  const nightAsgs = nightAssignments.filter(a => a.night === shift && !a.done && !a.failed);
  const availableOutbox = [...outbox];
  const uncataloged = [];

  for (const asg of nightAsgs) {
    const matchIdx = availableOutbox.findIndex(p =>
      !p.anom &&
      p.trueCat === asg.cat &&
      p.chosenCat === asg.cat &&
      (!asg.modelId || (p.trueMod === asg.modelId && p.chosenMod === asg.modelId))
    );
    if (matchIdx >= 0) {
      availableOutbox.splice(matchIdx, 1);
    } else {
      uncataloged.push(asg);
    }
  }
  return uncataloged;
}

function areNightAssignmentsCataloged() {
  return getUncatalogedNightAssignments().length === 0;
}

function ensureSectorDiversity() {
  if (S && S.tutorial) return; // En el tutorial el sector está controlado por el asistente
  if (!isPulsarEnabled()) {
    sigs.forEach(s => { if (s.cat === 4 && s.st === "echo") s.st = "gone"; });
  }
  if (!isSingularityEnabled()) {
    sigs.forEach(s => { if (s.cat === 5 && s.st === "echo") s.st = "gone"; });
  }
  if (!isAnomEnabled()) {
    sigs.forEach(s => { if (s.anom && s.st === "echo") s.st = "gone"; });
  }

  const inSector = () => sigs.filter(s => s.st === "echo" || s.st === "align" || s.st === "dl");
  const heldOrQueued = sigs.filter(s => s.st === "raw");

  // 1. Garantizar que toda asignación aún no catalogada (ni entregada) tenga su señal disponible en mapa o procesador
  const uncatalogedAsgs = getUncatalogedNightAssignments();
  const availableSignals = [...inSector(), ...heldOrQueued];

  for (const asg of uncatalogedAsgs) {
    const matchIdx = availableSignals.findIndex(s =>
      !s.anom &&
      !s.isCorruptSignal &&
      s.cat === asg.cat &&
      (!asg.modelId || s.modelId === asg.modelId)
    );
    if (matchIdx >= 0) {
      availableSignals.splice(matchIdx, 1);
    } else {
      if (inSector().length >= 5) {
        const idleExtra = sigs.find(s => s.st === "echo" && !s.assignRefId);
        if (idleExtra) idleExtra.st = "gone";
      }
      const spawnMod = asg.spawnModelId || asg.modelId || null;
      const newSig = makeSignal(asg.cat, false, null, spawnMod, asg.id);
      sigs.push(newSig);
      nightTotalSpawned++;
    }
  }

  // Primera anomalía garantizada: Voyager 1 aparece en la Noche 10.
  if (shift === 9 && !discoveredAnomalies.some(a => a.anomType === "voyager") &&
      !sigs.some(s => s.anomType === "voyager" && s.st !== "gone")) {
    if (inSector().length >= 5) {
      const idleExtra = sigs.find(s => s.st === "echo" && !s.assignRefId);
      if (idleExtra) idleExtra.st = "gone";
    }
    sigs.push(makeSignal(3, true, "voyager", null, null));
    nightExtraSpawned++;
    nightTotalSpawned++;
  }

  // En Noche 9 (shift === 8), asegurar al menos una aparición del Agujero Negro en el sector
  if (shift === 8 && !discoveredModels.has("sin_agujero_negro") && !sigs.some(s => s.modelId === "sin_agujero_negro" && s.st !== "gone")) {
    if (inSector().length >= 5) {
      const idleExtra = sigs.find(s => s.st === "echo" && !s.assignRefId);
      if (idleExtra) idleExtra.st = "gone";
    }
    sigs.push(makeSignal(5, false, null, "sin_agujero_negro", null));
    nightExtraSpawned++;
    nightTotalSpawned++;
  }

  // 2. Completar ecos en sector
  const allowedCats = getAvailableCategories();
  while (inSector().length < 5 && (!areNightAssignmentsCataloged() || nightTotalSpawned < getNightSignalLimit())) {
    const curSector = inSector();
    const missingCats = allowedCats.filter(c => !curSector.some(s => s.cat === c && !s.anom));
    let chosenCat;
    if (missingCats.length > 0) {
      chosenCat = missingCats[Math.floor(Math.random() * missingCats.length)];
    } else {
      // Las categorías solicitadas siguen garantizadas por sus ecos asignados,
      // pero ya no reciben peso adicional en las señales extra del sector.
      chosenCat = allowedCats[Math.floor(Math.random() * allowedCats.length)];
    }

    sigs.push(makeSignal(chosenCat, null, null, null, null));
    nightExtraSpawned++;
    nightTotalSpawned++;
  }
}

      {sender: "SISTEMA", tag: `N${shift + 1} · UPD`, helpTopic: "spectrogram"}
    );
  } else if (shift === 4) {
    addMail(
      "Nueva Categoria // Singularidad (Cuasar)",

      "Se ha incorporado la nueva categoria Singularidad al Procesador tras detectarse emisiones de Cuasares en el sector.\n\n" +
      "PRECAUCION OPTICA: Debido a la saturacion de los sensores opticos, los Cuasares pueden proyectar la silueta de una Enana Amarilla o una Enana Roja en el monitor CRT. Verifica siempre su firma de audio y espectrograma antes de catalogar.",
      {sender: "CENTRAL", tag: `N${shift + 1} · CAT`}
    );
    addMail(

      {sender: "SISTEMA", tag: `N${shift + 1} · SYS`}

  } else if (shift === 5) {

function offF(s) { return Math.min(1, Math.abs(knobF - s.tgF) / 45); }

function proxPct(val, target) { return Math.max(0, Math.round(100 - Math.min(100, Math.abs(val - target) * 2.2))); }
function isTuned(s) { return Math.abs(knobF - s.tgF) <= 6 && Math.abs(knobP - s.tgP) <= 6; }

function makeServerChallenge() {
  const count = Math.min(8, 3 + Math.floor(shift / 3));
  const seq = Array.from({length: count}, (_, i) => i);
  if (shift >= 2) {
    for (let i = seq.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [seq[i], seq[j]] = [seq[j], seq[i]];
    }
  }
  return {
    count,
    seq,
    step: 0,
    latched: Array(count).fill(false),
    t: performance.now()
  };
}

function evaluatePlatformDispatch(ev) {
  const {pkg, targetType, assignId} = ev;

  if (pkg.anom) {
    if (R) R.anomSent++;
    triggerGovernmentArrestEnding();
    return;
  }

  const modObj = MODELS.find(m => m.id === pkg.modelId);

  if (targetType === "assign") {
    const asg = nightAssignments.find(a => a.id === assignId) || mail.find(m => m.id === assignId);
    if (!asg || asg.done || asg.failed) {
      addMail(
        `Envio #${pkg.sigId} [Asignacion Cerrada]`,
        "El encargo seleccionado ya no se encuentra vigente. Abono acreditado: $0 CR.",
        {sender: "CENTRAL", tag: `N${shift + 1} · $0`}
      );
      return;
    }

    const catMatches = pkg.chosenCat === pkg.trueCat && pkg.chosenCat === asg.cat;
    const modMatches = !asg.modelId || (pkg.chosenMod === pkg.trueMod && pkg.chosenMod === asg.modelId);

    if (!catMatches || !modMatches) {
      if (R) R.silentErrors++;
      addMail(
        `Archivo Erroneo (#${pkg.sigId})`,
        `El paquete enviado (#${pkg.sigId}) no coincide con los parametros solicitados o contiene una clasificacion erronea.\n\n` +
        `Lectura real verificada: ${CLASSES[pkg.trueCat]}${modObj ? ` (${modObj.name})` : ""}.\n` +
        `Pago emitido: $0 CR.`,
        {sender: asg.sciName, tag: `N${shift + 1} · ERR`}
      );
      ensureSectorDiversity();
      syncLiveTelemetry(false, true);
      if (V === "mail" || V === "map") render();
      else updBadges();
      return;
    }

    asg.done = true;
    const mailItem = mail.find(m => m.assignId === asg.id || m.id === assignId);
    if (mailItem) mailItem.done = true;
    discoveredModels.add(pkg.trueMod);
    G.money += asg.reward;
    addMail(
      `Encargo Validado (+$${asg.reward} CR)`,
      `Excelente trabajo, Operador. Los datos de ${CLASSES[pkg.trueCat]} (${modObj ? modObj.name : ""}) han sido incorporados a nuestra investigacion.\n\n` +
      `Honorarios transferidos: +$${asg.reward} CR.`,
      {sender: asg.sciName, tag: `N${shift + 1} · +$${asg.reward}`}
    );
    msg(`[OK] Encargo validado (+$${asg.reward} CR)`, 1);
    syncLiveTelemetry(false, true);
    autoSaveGame();
    updTop();
    if (V === "mail" || V === "shop" || V === "atlas") render();
    return;
  }

  if (targetType === "central") {
    const catOk = pkg.chosenCat === pkg.trueCat;
    const modOk = !isSubcatEnabled() || (pkg.chosenMod === pkg.trueMod);

    if (!catOk || !modOk) {
      if (R) R.silentErrors++;
      addMail(
        `CENTRAL // PAQUETE #${pkg.sigId} [ARCHIVO ERRONEO]`,
        `La verificacion automatica detecto discrepancias en tu etiqueta (${CLASSES[pkg.chosenCat]}).\n` +
        `Cuerpo real: ${CLASSES[pkg.trueCat]}${modObj ? ` (${modObj.name})` : ""}. Abono: $0 CR.`
      );
      syncLiveTelemetry(false, true);
      if (V === "mail") render();
      else updBadges();
      return;
    }

    const isNewDiscovery = !discoveredModels.has(pkg.trueMod);
    discoveredModels.add(pkg.trueMod);
    const pay = isNewDiscovery ? 25 : 15;
    G.money += pay;

    addMail(
      `CENTRAL // REGISTRO EXTRA #${pkg.sigId} [ACEPTADO]`,
      isNewDiscovery
        ? `Nuevo cuerpo celeste (${modObj ? modObj.name : CLASSES[pkg.trueCat]}) catalogado en el Archivo Central: +$${pay} CR.`
        : `Registro adicional de ${modObj ? modObj.name : CLASSES[pkg.trueCat]} (ya descubierto previamente): +$${pay} CR.`
    );
    msg(`[OK] Registro extra acreditado (+$${pay} CR)`, 1);
    syncLiveTelemetry(false, true);
    autoSaveGame();
    updTop();
    if (V === "mail" || V === "shop" || V === "atlas") render();
  }
}

function advanceNight() {
  const pendingList = nightAssignments.filter(a => a.night === shift && !a.done && !a.failed);
  const completed = pendingList.length === 0;

  if (R) {
    R.ok = completed ? 1 : 0;
    R.status = completed ? "COMPLETADA" : "INCOMPLETA";
    R.time = +((performance.now() - R.t0) / 1000).toFixed(1);
    R.energy = Math.round(en);
    R.money = G.money;
    S.shifts.push({...R});
  }

  if (shift < TOTAL_NIGHTS - 1) {
    shift++;
    selMail = null;
    initShift();
    V = "mail";
    updTop();
    render();
  } else {
    gameOverReason = "COMPLETED";
    V = "end";
    syncLiveTelemetry(true, true);
    updTop();
    render();
  }
}

function triggerNightFadeTransition() {
  if (isTransitioningNight) return;
  isTransitioningNight = true;
  stopVoice();
  beep(420, 0.14, "sine", 0.06);
  const overlay = document.querySelector("#nightFadeOverlay");
  const textEl = document.querySelector("#nightFadeText");
  const hasNextNight = shift < TOTAL_NIGHTS - 1;

  if (textEl) {
    textEl.classList.remove("visible");
    textEl.textContent = hasNextNight ? `Noche ${shift + 2}` : "";
  }
  if (overlay) {
    overlay.classList.add("active");
  }

  if (hasNextNight) {
    setTimeout(() => {
      if (textEl) textEl.classList.add("visible");
      setTimeout(() => {
        if (textEl) textEl.classList.remove("visible");
        setTimeout(() => {
          advanceNight();
          setTimeout(() => {
            if (overlay) overlay.classList.remove("active");
            isTransitioningNight = false;
          }, 160);
        }, 600);
      }, 1350);
    }, 700);
  } else {
    setTimeout(() => {
      advanceNight();
      setTimeout(() => {
        if (overlay) overlay.classList.remove("active");
        isTransitioningNight = false;
      }, 180);
    }, 680);
  }
}

function computeBootProgress(sec) {
  if (sec <= 0.8) return Math.round((sec / 0.8) * 18);
  if (sec <= 2.0) return Math.round(18 + ((sec - 0.8) / 1.2) * 34);
  if (sec <= 3.1) return Math.round(52 + ((sec - 2.0) / 1.1) * 16);
  if (sec <= 4.4) return Math.round(68 + ((sec - 3.1) / 1.3) * 28);
  if (sec <= 4.9) return Math.round(96 + ((sec - 4.4) / 0.5) * 4);
  return 100;
}

function drawBoot() {
  const fill = document.querySelector("#bootBarFill");
  if (fill) fill.style.width = `${bootProgress}%`;
}

function tick(dt) {
  if (V === "boot") {
    bootElapsed += dt;
    bootProgress = computeBootProgress(bootElapsed);
    if (!bootSoundPlayed) {
      playStartupSound(false);
    }
    if (bootElapsed >= 5.0) {
      V = "intro";
      updTop();
      render();
    }
    return;
  }
  if (V === "intro") {
    updateBearAnimation(dt);
    return;
  }
  if (!G || V === "end") return;

  const regenMode = getEnergyRegenMode();
  if (regenMode === "fast") {
    en = Math.min(cap, en + dt * (en < 25 ? 1.45 : 0.90));
  } else if (regenMode === "slow") {
    en = Math.min(cap, en + dt * (en < 20 ? 0.42 : 0.22));
  }

  if (rd > 0) rd = Math.max(0, rd - dt);
  if (!isFreeMode && !TUT) en = Math.max(0, en - dt * (0.025 + (shift / (TOTAL_NIGHTS - 1)) * 0.055));

  const alignDur = TUT ? 2.0 : Math.max(0.65, 4.4 - (G.align || 0) * 0.22);
  const dlDur = TUT ? 5.5 : Math.max(2.2, 12.0 - (G.download || 0) * 0.48);
  const noiseProb = Math.max(0.02, 0.24 - G.f * 0.04);
  let activeDl = false;

  sigs.forEach((s, idx) => {
    if ((s.st === "echo" || s.st === "align" || s.st === "dl") && (s.vx || s.vy)) {
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.x < 160 || s.x > W - 160) { s.vx *= -1; s.x = Math.max(160, Math.min(W - 160, s.x)); }
      if (s.y < 160 || s.y > H - 160) { s.vy *= -1; s.y = Math.max(160, Math.min(H - 160, s.y)); }
      for (let j = 0; j < sigs.length; j++) {
        if (j === idx) continue;
        const other = sigs[j];
        if (other.st === "gone" || other.st === "raw") continue;
        const dx = s.x - other.x, dy = s.y - other.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.1 && dist < 420) {
          const nx = dx / dist, ny = dy / dist;
          s.x += nx * 18 * dt;
          s.y += ny * 18 * dt;
          if (s.vx * nx + s.vy * ny < 0) {
            const dot = s.vx * nx + s.vy * ny;
            s.vx -= 2 * dot * nx;
            s.vy -= 2 * dot * ny;
          }
        }
      }
    }

    if (srv) return;

    if (s.st === "align") {
      if (R) R.slewTime += dt;
      s.align += dt / alignDur;
      if (s.align >= 1) {
        s.align = 1;
        s.st = "dl";
        beep(520, 0.08, "triangle", 0.05);
        msg("[OK] Antenas alineadas // Descargando trama", 1);
      }
    } else if (s.st === "dl") {
      activeDl = true;
      s.prog += dt / dlDur;
      s.acc += dt;
      while (s.acc >= 0.5) {
        s.acc -= 0.5;
        s.tot++;
        if (Math.random() < noiseProb) {
          s.bad++;
          if (R) R.corrupt++;
        }
      }
      if (s.prog >= 1) {
        s.prog = 1;
        s.st = "raw";
        beep(680, 0.12, "sine", 0.07);
        msg(`[OK] Trama #${s.id} lista en Procesador`, 1);
        ensureSectorDiversity();
        syncLiveTelemetry(false, true);
        if (V === "map" || V === "mail") render();
        else updBadges();
      }
    }
  });

  if (activeDl && !srv && !TUT && Math.random() < dt / (46 + (G.st || 0) * 5)) triggerCrash();

  if (activeVoice) {
    activeVoice.t += dt;
    const s = activeVoice.sig;
    const clarity = s.fixed ? 1 : (s.tgF !== undefined ? Math.max(0.18, 1 - (offF(s) + offP(s)) * 0.6) : 1);
    if (activeVoice.noiseGain) {
      activeVoice.noiseGain.gain.value = getSignalNoiseLevel(s);
    }
    if (activeVoice.audio) {
      const baseVol = typeof activeVoice.baseVol === "number" ? activeVoice.baseVol : 0.48;
      activeVoice.audio.volume = Math.max(0.08, Math.min(baseVol, baseVol * clarity));
    } else if (activeVoice.g) {
      const mod = MODELS.find(m => m.id === s.modelId);
      const anomDef = s.anom ? ANOMALY_DEFS.find(a => a.type === s.anomType) : null;
      const cat = s.cat !== undefined ? s.cat : (anomDef ? anomDef.cat : (mod ? mod.cat : 0));
      const pulse = cat === 4 ? ((activeVoice.t * 7 % 1) < 0.22 ? 1 : 0.05)
                  : cat === 5 ? (0.55 + 0.45 * Math.sin(activeVoice.t * (s.modelId === "sin_agujero_negro" ? 1.8 : 11)))
                  : cat === 3 ? ((activeVoice.t * 2.5 % 1) < 0.45 ? 0.9 : 0.1)
                  : (0.65 + 0.35 * Math.sin(activeVoice.t * 3));
      activeVoice.g.gain.value = 0.08 * clarity * pulse;
      if (activeVoice.t >= activeVoice.max) {
        stopVoice();
        if (V === "proc") render();
      }
    }
  }

  for (let i = pendingEvals.length - 1; i >= 0; i--) {
    if (performance.now() >= pendingEvals[i].at) {
      const ev = pendingEvals.splice(i, 1)[0];
      evaluatePlatformDispatch(ev);
    }
  }

  if (flashT > 0) {
    flashT -= dt;
    if (flashT <= 0) { flash = ""; updTop(); }
  }

  uiTick += dt;
  if (uiTick >= 0.45) { uiTick = 0; updTop(); }

  liveSyncTimer += dt;
  if (liveSyncTimer >= 2.0) {
    liveSyncTimer = 0;
    syncLiveTelemetry(false, false);
  }

  cloudSyncTimer += dt;
  if (cloudSyncTimer >= 5.0) {
    cloudSyncTimer = 0;
    if (activeDbUrl) {
      pushSnapshotToCloud(buildSessionSnapshot(false));
    }
  }

  autoSaveTimer += dt;
  if (autoSaveTimer >= 20.0) {
    autoSaveTimer = 0;
    autoSaveGame();
  }
}

// Filtro CRT: sprite PNG + scanlines + estática (sin sprite: solo estática)
function renderCelestialToCanvas(cv, spec, t, filterLv = 5, tuneErr = 0, sepiaMode = false, opticalFailure = false) {
  if (!cv) return;
  const cx = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  const img = cx.createImageData(w, h);
  const d = img.data;

  // Fallo óptico (Noche 9) o archivo visual dañado (desde Noche 5): no se muestra imagen en el CRT
  if (opticalFailure) {
    for (let y = 0; y < h; y++) {
      const band = Math.sin(y * 0.4 + t * 22) > 0.72 ? 42 : 0;
      for (let x = 0; x < w; x++) {
        const noise = (Math.random() * 28 + band) * ((y % 2 === 0) ? 0.7 : 1.0);
        const idx = (y * w + x) * 4;
        d[idx] = Math.min(255, noise * 1.45);
        d[idx + 1] = Math.min(255, noise * 0.42);
        d[idx + 2] = Math.min(255, noise * 0.42);
        d[idx + 3] = 255;
      }
    }
    cx.putImageData(img, 0, 0);
    return;
  }

  const baseFloor = [0.60, 0.44, 0.30, 0.18, 0.09, 0.02][Math.min(5, Math.max(0, filterLv))];
  const staticAmt = (sepiaMode && tuneErr === 0 && filterLv >= 5) ? 0.06 : Math.min(0.98, baseFloor + tuneErr * (1 - baseFloor));

  const modObj = MODELS.find(m => m.id === spec.modelId);
  const spriteSrc = spec.img || (modObj && modObj.img);
  const sprite = getSprite(spriteSrc);

  if (sprite && offCx) {
    offCv.width = w;
    offCv.height = h;
    offCx.imageSmoothingEnabled = false;
    offCx.fillStyle = "#000000";
    offCx.fillRect(0, 0, w, h);

    const aspect = sprite.naturalWidth / sprite.naturalHeight;
    let dw = w, dh = h;
    if (w / h > aspect) {
      dw = Math.round(h * aspect);
    } else {
      dh = Math.round(w / aspect);
    }
    const ox = Math.floor((w - dw) / 2);
    const oy = Math.floor((h - dh) / 2);
    offCx.drawImage(sprite, ox, oy, dw, dh);

    try {
      const srcData = offCx.getImageData(0, 0, w, h).data;
      for (let y = 0; y < h; y++) {
        const scanline = (y % 2 === 0) ? 0.86 : 1.0;
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const alpha = srcData[idx + 3] / 255;
          const r0 = srcData[idx] * alpha;
          const g0 = srcData[idx + 1] * alpha;
          const b0 = srcData[idx + 2] * alpha;
          const snow = Math.random() * 255;

          let r = (r0 * (1 - staticAmt) + snow * staticAmt) * scanline;
          let g = (g0 * (1 - staticAmt) + snow * staticAmt) * scanline;
          let b = (b0 * (1 - staticAmt) + snow * staticAmt) * scanline;

          if (sepiaMode) {
            r *= 1.04;
            g *= 0.99;
            b *= 0.90;
          }

          d[idx] = Math.max(0, Math.min(255, r));
          d[idx + 1] = Math.max(0, Math.min(255, g));
          d[idx + 2] = Math.max(0, Math.min(255, b));
          d[idx + 3] = 255;
        }
      }
      cx.putImageData(img, 0, 0);
      return;
    } catch (_) {
      cx.imageSmoothingEnabled = false;
      cx.fillStyle = sepiaMode ? "#1e1912" : "#000000";
      cx.fillRect(0, 0, w, h);
      cx.save();
      cx.globalAlpha = Math.max(0.18, 1 - staticAmt * 0.85);
      cx.drawImage(sprite, ox, oy, dw, dh);
      cx.restore();
      cx.fillStyle = "rgba(0, 0, 0, 0.18)";
      for (let y = 0; y < h; y += 2) {
        cx.fillRect(0, y, w, 1);
      }
      if (staticAmt > 0.04) {
        const specks = Math.floor(w * h * staticAmt * 0.35);
        for (let i = 0; i < specks; i++) {
          const sx = Math.floor(Math.random() * w);
          const sy = Math.floor(Math.random() * h);
          const v = Math.floor(Math.random() * 255);
          cx.fillStyle = `rgba(${v},${v},${v},0.45)`;
          cx.fillRect(sx, sy, 1, 1);
        }
      }
      return;
    }
  }

  // Sin sprite cargado: solo estática CRT sobre fondo oscuro
  for (let y = 0; y < h; y++) {
    const scanline = (y % 2 === 0) ? 0.90 : 1.0;
    for (let x = 0; x < w; x++) {
      const snow = Math.random() * 255;
      const finalVal = Math.max(0, Math.min(255, (10 * (1 - staticAmt) + snow * staticAmt) * scanline));
      const idx = (y * w + x) * 4;
      if (sepiaMode) {
        d[idx] = Math.min(255, finalVal * 1.05);
        d[idx + 1] = Math.min(255, finalVal * 0.92);
        d[idx + 2] = Math.min(255, finalVal * 0.72);
      } else {
        d[idx] = finalVal;
        d[idx + 1] = finalVal;
        d[idx + 2] = finalVal;
      }
      d[idx + 3] = 255;
    }
  }
  cx.putImageData(img, 0, 0);
}

function getMapViewportMetrics(cv) {
  const vw = Math.max(320, Math.round(cv.clientWidth || 960));
  const vh = Math.max(240, Math.round(cv.clientHeight || 520));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const pw = Math.round(vw * dpr);
  const ph = Math.round(vh * dpr);
  if (cv.width !== pw || cv.height !== ph) {
    cv.width = pw;
    cv.height = ph;
  }
  return {vw, vh, dpr};
}

function drawMap(t) {
  const cv = $("#cv");
  if (!cv) return;
  const {vw, vh, dpr} = getMapViewportMetrics(cv);
  cam.x = Math.max(0, Math.min(Math.max(0, W - vw), cam.x));
  cam.y = Math.max(0, Math.min(Math.max(0, H - vh), cam.y));

  const cx = cv.getContext("2d");
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const paper = isPaperTheme();
  cx.fillStyle = paper ? "#1e1912" : "#03070d";
  cx.fillRect(0, 0, vw, vh);

  cx.strokeStyle = paper ? "rgba(168, 144, 104, 0.20)" : "rgba(52, 95, 68, 0.22)";
  cx.lineWidth = 1;
  const step = 90;
  const gx0 = -(cam.x % step), gy0 = -(cam.y % step);
  for (let x = gx0; x < vw; x += step) {
    const px = Math.round(x) + 0.5;
    cx.beginPath(); cx.moveTo(px, 0); cx.lineTo(px, vh); cx.stroke();
  }
  for (let y = gy0; y < vh; y += step) {
    const py = Math.round(y) + 0.5;
    cx.beginPath(); cx.moveTo(0, py); cx.lineTo(vw, py); cx.stroke();
  }

  cx.fillStyle = paper ? "#f5eedc" : "#d1fae5";
  stars.forEach(([x, y, r]) => {
    const sx = x - cam.x, sy = y - cam.y;
    if (sx < -2 || sx > vw + 2 || sy < -2 || sy > vh + 2) return;
    cx.globalAlpha = 0.32 + 0.38 * Math.sin(t * 1.4 + x);
    cx.beginPath();
    cx.arc(sx, sy, r * 0.72, 0, Math.PI * 2);
    cx.fill();
  });
  cx.globalAlpha = 1;

  cx.save();
  cx.translate(-cam.x, -cam.y);
  cx.strokeStyle = paper ? "rgba(168, 144, 104, 0.36)" : "rgba(34, 197, 94, 0.28)";
  cx.setLineDash([8, 6]);
  cx.strokeRect(12, 12, W - 24, H - 24);
  cx.setLineDash([]);
  sigs.forEach(s => {
    if (s.st === "gone" || s.st === "raw") return;
    const col = paper
      ? (s.st === "echo" ? "233, 222, 196" : s.st === "align" ? "217, 119, 6" : "245, 158, 11")
      : (s.st === "echo" ? "96, 195, 255" : s.st === "align" ? "234, 179, 8" : "74, 222, 128");
    const pulse = (t * 0.45 + s.seed) % 1;
    cx.strokeStyle = `rgba(${col}, ${(1 - pulse) * 0.7})`;
    cx.lineWidth = 1.3;
    cx.beginPath(); cx.arc(s.x, s.y, 7 + pulse * 30, 0, Math.PI * 2); cx.stroke();

    cx.fillStyle = `rgb(${col})`;
    cx.beginPath(); cx.arc(s.x, s.y, 5, 0, Math.PI * 2); cx.fill();

    if (s.st === "align") {
      cx.strokeStyle = paper ? "#d97706" : "#eab308";
      cx.lineWidth = 2.6;
      cx.beginPath(); cx.arc(s.x, s.y, 17, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.align); cx.stroke();
    } else if (s.st === "dl") {
      cx.strokeStyle = srv ? "#ef4444" : (paper ? "#f59e0b" : "#4ade80");
      cx.lineWidth = 2.6;
      cx.beginPath(); cx.arc(s.x, s.y, 17, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.prog); cx.stroke();
    }
    cx.lineWidth = 1;
  });
  if (TUT && TUT.sig && TUT.sig.st === "echo" && tutHlKey() === "signal") {
    const hs = TUT.sig;
    const hp = (t * 0.9) % 1;
    cx.strokeStyle = `rgba(250, 204, 21, ${1 - hp * 0.6})`;
    cx.lineWidth = 2.4;
    cx.setLineDash([6, 5]);
    cx.beginPath(); cx.arc(hs.x, hs.y, 28 + hp * 14, 0, Math.PI * 2); cx.stroke();
    cx.setLineDash([]);
    cx.lineWidth = 1;
  }
  cx.restore();

  if (rd > 0) {
    cx.globalAlpha = Math.min(1, rd / 2);
    const halfW = vw / 2, halfH = vh / 2;
    sigs.forEach(s => {
      if (s.st !== "echo") return;
      const sx = s.x - cam.x, sy = s.y - cam.y;
      if (sx > 14 && sx < vw - 14 && sy > 14 && sy < vh - 14) return;
      const a = Math.atan2(sy - halfH, sx - halfW);
      const k = Math.min((halfW - 22) / Math.abs(Math.cos(a) || 1e-5), (halfH - 22) / Math.abs(Math.sin(a) || 1e-5));
      cx.save();
      cx.translate(halfW + Math.cos(a)*k, halfH + Math.sin(a)*k);
      cx.rotate(a);
      cx.fillStyle = paper ? "#e9dec4" : "#4ade80";
      cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(-15, -6.5); cx.lineTo(-15, 6.5); cx.fill();
      cx.restore();
    });
    cx.globalAlpha = 1;
  }

  cx.fillStyle = paper ? "rgba(30, 25, 18, 0.86)" : "rgba(8, 14, 11, 0.72)";
  cx.fillRect(vw - 178, 10, 168, 24);
  cx.strokeStyle = paper ? "#8c734b" : "#166534";
  cx.strokeRect(vw - 178, 10, 168, 24);
  cx.fillStyle = paper ? "#e9dec4" : "#86efac";
  cx.font = paper ? "11px 'Courier New', Courier, monospace" : "11px ui-monospace, Consolas, monospace";
  cx.textAlign = "right";
  cx.fillText(`SEC ${Math.round(cam.x + vw/2)} // ${Math.round(cam.y + vh/2)}`, vw - 18, 26);
  cx.textAlign = "left";

  const aligning = sigs.find(s => s.st === "align");
  const targetAng = aligning ? Math.atan2(aligning.y - H/2, aligning.x - W/2) : -Math.PI/2;
  const hudY = vh - 46;
  cx.fillStyle = paper ? "rgba(30, 25, 18, 0.88)" : "rgba(8, 14, 11, 0.84)";
  cx.fillRect(10, hudY, 118, 36);
  cx.strokeStyle = paper ? "#8c734b" : "#243d2b";
  cx.strokeRect(10, hudY, 118, 36);
  for (let i = 0; i < 3; i++) {
    const ax = 30 + i * 38, ay = hudY + 18;
    cx.strokeStyle = paper ? "#e9dec4" : "#4ade80";
    cx.lineWidth = 1.4;
    cx.beginPath(); cx.arc(ax, ay, 9, 0, Math.PI * 2); cx.stroke();
    const curA = aligning ? (targetAng - (1 - aligning.align) * 2.2) : targetAng;
    cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(ax + Math.cos(curA)*11, ay + Math.sin(curA)*11); cx.stroke();
  }
  cx.lineWidth = 1;
}

function drawCRT(t) {
  const cv = $("#crt");
  if (!cv || !cur) return;
  const [rw, rh] = CRT_RES[Math.min(5, G.f)];
  if (cv.width !== rw || cv.height !== rh) {
    cv.width = rw;
    cv.height = rh;
  }
  const tuneErr = cur.fixed ? 0 : Math.min(1, (offF(cur) + offP(cur)) * 0.75);
  const visualBlocked = isOpticalFailed() || Boolean(cur.isCorruptSignal);
  renderCelestialToCanvas(cv, cur, t, G.f, tuneErr, isPaperTheme(), visualBlocked);
}

function getSpecBuffer(key, w = 280, h = 150) {
  let buf = SPEC_BUFFERS[key];
  if (!buf) {
    const cv = document.createElement("canvas");
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = isPaperTheme() ? "#18130d" : "#030805";
    ctx.fillRect(0, 0, w, h);
    buf = {cv, ctx, peakHold: 0, rmsSmooth: 0};
    SPEC_BUFFERS[key] = buf;
  } else if (buf.cv.width !== w || buf.cv.height !== h) {
    const oldCv = buf.cv;
    const newCv = document.createElement("canvas");
    newCv.width = w;
    newCv.height = h;
    const newCtx = newCv.getContext("2d");
    newCtx.fillStyle = isPaperTheme() ? "#18130d" : "#030805";
    newCtx.fillRect(0, 0, w, h);
    newCtx.drawImage(oldCv, 0, 0, w, h);
    buf.cv = newCv;
    buf.ctx = newCtx;
  }
  return buf;
}

// Espectrograma impulsado literalmente por el AnalyserNode de Web Audio sobre el oscilador / flujo activo
function drawSpectrogram(t, targetCv = null, opts = {}) {
  const cv = targetCv || $("#spec");
  if (!cv) return;
  if (!targetCv && !cur) return;

  const isCompact = Boolean(opts.compact);
  const targetW = isCompact ? 260 : Math.max(280, Math.round(cv.clientWidth || 380));
  const targetH = isCompact ? 110 : Math.max(170, Math.round(cv.clientHeight || 220));
  if (cv.width !== targetW || cv.height !== targetH) {
    cv.width = targetW;
    cv.height = targetH;
  }

  const bufKey = opts.bufKey || "proc";
  if (bufKey === "proc" && cur && lastProcSpecSigId !== cur.id) {
    delete SPEC_BUFFERS["proc"];
    lastProcSpecSigId = cur.id;
  }

  const paper = isPaperTheme();
  const cx = cv.getContext("2d");
  const w = cv.width, h = cv.height;

  // Determinar si el AnalyserNode está recibiendo audio activo correspondiente a esta vista
  let isLive = false;
  if (analyser && specFreqData && specTimeData && activeVoice) {
    if (opts.matchModelId) {
      isLive = Boolean(activeVoice.sig && !activeVoice.sig.anom && activeVoice.sig.modelId === opts.matchModelId);
    } else if (opts.matchAnomType) {
      isLive = Boolean(activeVoice.sig && activeVoice.sig.anom && activeVoice.sig.anomType === opts.matchAnomType);
    } else if (cur) {
      isLive = Boolean(activeVoice.sig && (activeVoice.sig.id === cur.id || activeVoice.sig === cur));
    }
  }

  const isAnom = opts.isAnom !== undefined ? opts.isAnom : Boolean(cur && cur.anom);
  const meterW = isCompact ? 34 : 44;
  const wfW = w - meterW - 4;
  const wfH = h;
  const buf = getSpecBuffer(bufKey, wfW, wfH);

  let rmsLevel = 0;
  let dbText = "-- dB";

  if (isLive) {
    analyser.getByteFrequencyData(specFreqData);
    analyser.getByteTimeDomainData(specTimeData);

    // Calcular nivel RMS real del oscilador / audio desde getByteTimeDomainData
    let sumSq = 0;
    for (let i = 0; i < specTimeData.length; i++) {
      const sample = (specTimeData[i] - 128) / 128;
      sumSq += sample * sample;
    }
    const rms = Math.sqrt(sumSq / specTimeData.length);
    const dbVal = rms > 0.0005 ? Math.max(-60, Math.min(0, Math.round(20 * Math.log10(rms * 3.2)))) : -60;
    dbText = `${dbVal}dB`;
    rmsLevel = Math.min(1, Math.pow(rms * 3.8, 0.72));
    buf.rmsSmooth = buf.rmsSmooth * 0.65 + rmsLevel * 0.35;
    buf.peakHold = Math.max(buf.rmsSmooth, buf.peakHold - 0.008);

    // Desplazar cascada (waterfall) 2px hacia la izquierda y pintar nueva columna FFT a la derecha
    buf.ctx.drawImage(buf.cv, -2, 0);
    buf.ctx.fillStyle = paper ? "#18130d" : "#030805";
    buf.ctx.fillRect(wfW - 2, 0, 2, wfH);

    // Rango enfocado en bins 1..140 (~23 Hz a ~3.2 kHz con fftSize=2048) para capturar fundamentales y armónicos
    const maxBin = Math.min(specFreqData.length - 1, 140);
    for (let py = 0; py < wfH; py++) {
      const normY = 1 - (py / Math.max(1, wfH - 1)); // 0 abajo (graves), 1 arriba (agudos)
      const binIdx = Math.max(1, Math.min(maxBin, Math.floor(1 + Math.pow(normY, 1.35) * (maxBin - 1))));
      const rawVal = specFreqData[binIdx] / 255;
      const val = rawVal > 0.03 ? Math.min(1, Math.pow(rawVal, 0.76) * 1.15) : 0;

      if (val > 0.02) {
        if (isAnom) {
          const r = Math.min(255, Math.round(90 + val * 165));
          const g = Math.min(255, Math.round(val > 0.78 ? (val - 0.78) * 650 : 18 * val));
          const b = Math.min(255, Math.round(35 + val * 75));
          buf.ctx.fillStyle = `rgb(${r},${g},${b})`;
        } else if (paper) {
          const r = Math.min(255, Math.round(55 + val * 200));
          const g = Math.min(255, Math.round(45 + val * 185));
          const b = Math.min(255, Math.round(25 + val * 115));
          buf.ctx.fillStyle = `rgb(${r},${g},${b})`;
        } else {
          const r = Math.min(255, Math.round(val > 0.75 ? (val - 0.75) * 600 : 12 * val));
          const g = Math.min(255, Math.round(60 + val * 195));
          const b = Math.min(255, Math.round(30 + val * 110));
          buf.ctx.fillStyle = `rgb(${r},${g},${b})`;
        }
        buf.ctx.fillRect(wfW - 2, py, 2, 1);
      }
    }
  } else {
    buf.rmsSmooth = Math.max(0, buf.rmsSmooth - 0.06);
    buf.peakHold = Math.max(0, buf.peakHold - 0.015);
    buf.ctx.drawImage(buf.cv, -1, 0);
    buf.ctx.fillStyle = paper ? "#18130d" : "#030805";
    buf.ctx.fillRect(wfW - 1, 0, 1, wfH);
  }

  // Dibujar fondo y cascada FFT
  cx.fillStyle = paper ? "#18130d" : "#030805";
  cx.fillRect(0, 0, w, h);
  cx.drawImage(buf.cv, 0, 0, wfW, wfH);

  // Rejilla de frecuencias y niveles
  cx.strokeStyle = paper ? "rgba(168, 144, 104, 0.22)" : "rgba(52, 95, 68, 0.25)";
  cx.lineWidth = 1;
  for (let gx = 40; gx < wfW; gx += 48) {
    cx.beginPath(); cx.moveTo(gx + 0.5, 0); cx.lineTo(gx + 0.5, wfH); cx.stroke();
  }
  const freqTicks = [
    {yFrac: 0.22, label: "2kHz"},
    {yFrac: 0.50, label: "800Hz"},
    {yFrac: 0.78, label: "200Hz"}
  ];
  cx.font = isCompact ? "9px 'Courier New', monospace" : "10px 'Courier New', monospace";
  freqTicks.forEach(ft => {
    const gy = Math.round(wfH * ft.yFrac) + 0.5;
    cx.beginPath(); cx.moveTo(0, gy); cx.lineTo(wfW, gy); cx.stroke();
    cx.fillStyle = paper ? "rgba(233, 222, 196, 0.62)" : "rgba(134, 239, 172, 0.62)";
    cx.fillText(ft.label, 4, gy - 2);
  });

  // Etiqueta de estado FFT arriba a la izquierda
  cx.fillStyle = isLive
    ? (isAnom ? "#f87171" : (paper ? "#fde68a" : "#4ade80"))
    : (paper ? "rgba(233, 222, 196, 0.68)" : "rgba(161, 161, 170, 0.75)");
  cx.fillText(isLive ? "FFT AUDIO // VIVO" : "FFT // SIN AUDIO", 4, isCompact ? 11 : 12);

  // Panel derecho: Medidor de Niveles (VU / dB)
  const mx = wfW + 4;
  cx.fillStyle = paper ? "#241d14" : "#060e09";
  cx.fillRect(mx, 0, meterW, h);
  cx.strokeStyle = paper ? "#8c734b" : "#166534";
  cx.strokeRect(mx + 0.5, 0.5, meterW - 1, h - 1);

  cx.fillStyle = paper ? "#e9dec4" : "#86efac";
  cx.textAlign = "center";
  cx.fillText("LVL", mx + meterW / 2, isCompact ? 10 : 12);

  const barTop = isCompact ? 14 : 17;
  const barBot = h - (isCompact ? 14 : 16);
  const barH = Math.max(20, barBot - barTop);
  const barW = isCompact ? 10 : 14;
  const barX = mx + Math.floor((meterW - barW) / 2);

  const segments = isCompact ? 14 : 18;
  const segGap = 1.5;
  const segH = (barH - segGap * (segments - 1)) / segments;

  for (let s = 0; s < segments; s++) {
    const frac = (s + 1) / segments;
    const sy = barBot - (s + 1) * segH - s * segGap;
    const active = buf.rmsSmooth >= frac - (0.5 / segments);
    if (active) {
      if (frac > 0.82) cx.fillStyle = "#ef4444";
      else if (frac > 0.62) cx.fillStyle = "#eab308";
      else cx.fillStyle = paper ? "#d97706" : "#22c55e";
    } else {
      cx.fillStyle = paper ? "rgba(140, 115, 75, 0.22)" : "rgba(34, 197, 94, 0.14)";
    }
    cx.fillRect(barX, sy, barW, segH);
  }

  // Indicador de pico retenido (Peak Hold)
  if (buf.peakHold > 0.02) {
    const peakY = Math.max(barTop, Math.min(barBot - 2, barBot - buf.peakHold * barH));
    cx.fillStyle = "#ffffff";
    cx.fillRect(barX - 1, peakY, barW + 2, 2);
  }

  // Lectura numérica en dB al pie del medidor
  cx.fillStyle = isLive ? (paper ? "#fde68a" : "#4ade80") : (paper ? "#a89068" : "#71717a");
  cx.fillText(dbText, mx + meterW / 2, h - 4);
  cx.textAlign = "left";
}

function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  tick(dt);
  tutUpdate(dt);
  asstHelpUpdate(dt);
  updateBearVoice();
  const t = now / 1000;
  if (V === "boot") drawBoot();
  if (V === "map") drawMap(t);
  if (V === "proc") {
    drawCRT(t);
    if (isSpectrogramEnabled()) drawSpectrogram(t);
  }
  if (V === "atlas") drawAtlasCanvases(t);
  requestAnimationFrame(loop);
}

              <b>[!] ALERTA DE SERVIDOR // ENLACE DE RELES CAIDO (${srv.count} MODULOS)</b>
              <div style="font-size:11.5px">La alineacion y descarga de antenas estan detenidas hasta restablecer el servidor.</div>
            </div>
            <button class="bad" id="goSrvBtn" style="padding:4px 10px;font-size:12px">Ir a Servidor</button>

        <div class="map-viewport">

        </div>
        ${pendingOverrideSig ? `
          <div class="card warnbox between" style="margin:0;padding:7px 10px;flex:none">
            <div>
              <b>ANTENAS OCUPADAS // RASTREO EN CURSO (#${busySig ? busySig.id : ""})</b>
              <div style="font-size:11.5px">Ya existe una busqueda activa. Si insistes, se borrara la investigacion en curso y comenzara con el eco #${pendingOverrideSig.id} (-${ECHO_LOCK_COST} PWR).</div>
