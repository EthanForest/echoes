.tab{

button:hover:not(:disabled){background:#277346}
button.alt{background:#101b15;color:var(--fg);border:1px solid var(--border)}
button.alt:hover:not(:disabled){background:#182920}
button.bad{background:#7f1d1d;border-color:#b91c1c;color:#fef2f2}
button.warn{background:#78350f;border-color:#d97706;color:#fef3c7}
button.shadow{background:#231438;border-color:#7e22ce;color:#f3e8ff}

.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

// Caché de sprites PNG en Signals/
const IMG_CACHE = {};
const offCv = document.createElement("canvas");
const offCx = offCv.getContext("2d");

function getSprite(src) {
  if (!src) return null;
  if (!IMG_CACHE[src]) {
    const im = new Image();
    im._failed = false;
    im.onerror = () => { im._failed = true; };
    im.src = src;
    IMG_CACHE[src] = im;
  }
  const im = IMG_CACHE[src];
  if (im._failed) return null;
  return (im.complete && im.naturalWidth > 0) ? im : null;
}

function preloadAllSprites() {
  MODELS.forEach(m => { if (m.img) getSprite(m.img); });
  ANOMALY_DEFS.forEach(a => { if (a.img) getSprite(a.img); });

function buildSessionSnapshot(finalized = false) {

  const shiftsList = [...S.shifts];
  if (!finalized && R && V !== "end") {
    shiftsList.push({
      ...R,
      time: +((performance.now() - R.t0) / 1000).toFixed(1),
      energy: Math.round(en),
      money: G ? G.money : 75
    });
  }

  return {
    id: S.id,

    startNight: selectedStartNight + 1,
    freeMode: isFreeMode,

    dateISO: S.dateISO,

    shifts: shiftsList,
    survey: null,
    notesLength: S.notesLength,

}

async function pushSnapshotToCloud(snap) {
  if (!activeDbUrl || !snap) return;
  if (cloudInFlight) {
    cloudQueuedSnap = snap;
    return;
  }
  cloudInFlight = true;
  try {
    await fetch(`${activeDbUrl}/sessions/${encodeURIComponent(snap.id)}.json`, {
      method: "PUT",
      body: JSON.stringify(snap)
    });
  } catch (_) {
  } finally {
    cloudInFlight = false;
    if (cloudQueuedSnap) {
      const next = cloudQueuedSnap;
      cloudQueuedSnap = null;
      pushSnapshotToCloud(next);
    }
  }
}

function syncLiveTelemetry(finalized = false, pushCloudNow = true) {
  const snap = buildSessionSnapshot(finalized);
  if (!snap) return;
  try {
    const raw = localStorage.getItem(LIVE_STORAGE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    const idx = list.findIndex(item => item.id === snap.id);
    if (idx >= 0) list[idx] = snap;
    else list.push(snap);
    localStorage.setItem(LIVE_STORAGE_KEY, JSON.stringify(list));
  } catch (_) {}

  if (bc) {
    try { bc.postMessage({type: "SESSION_UPDATE", session: snap}); } catch (_) {}
  }

  if (pushCloudNow && activeDbUrl) {
    pushSnapshotToCloud(snap);
  }
}

function fmtClock(sec) {
  const s = Math.max(0, Math.ceil(sec));
  const mm = String(Math.floor(s / 60)).padStart(2, "0");
  const ss = String(s % 60).padStart(2, "0");
  return `${mm}:${ss}`;
}

function beep(freq, dur = 0.08, type = "sine", vol = 0.06) {
  if (muted) return;
  try {
    au = au || new (window.AudioContext || window.webkitAudioContext)();
    if (au.state === "suspended") au.resume();
    const o = au.createOscillator(), g = au.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, au.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, au.currentTime + dur);
    o.connect(g); g.connect(au.destination);
    o.start(); o.stop(au.currentTime + dur);
  } catch (_) {}
}

function stopVoice() {
  if (!activeVoice) return;
  try { activeVoice.o.stop(); } catch (_) {}
  activeVoice = null;
}

function playSignalAudio(sigObj) {
  stopVoice();
  if (muted) return;
  try {
    au = au || new (window.AudioContext || window.webkitAudioContext)();
    if (au.state === "suspended") au.resume();
    const o = au.createOscillator(), g = au.createGain();
    const mod = MODELS.find(m => m.id === sigObj.modelId) || MODELS[0];
    const anomDef = sigObj.anom ? ANOMALY_DEFS.find(a => a.type === sigObj.anomType) : null;
    o.type = anomDef ? anomDef.wave : mod.wave;
    o.frequency.value = anomDef ? anomDef.freq : mod.freq;
    g.gain.value = 0.07;
    o.connect(g); g.connect(au.destination);
    o.start();
    activeVoice = {o, g, sig: sigObj, t: 0, max: 3.4};
  } catch (_) {}
}

function makeSignal(cat, forcedAnom = null, forcedAnomType = null) {
  let x, y, tries = 0;
  do {
    x = 110 + Math.random() * (W - 220);
    y = 110 + Math.random() * (H - 220);
  } while (tries++ < 60 && sigs.some(s => s.st !== "gone" && Math.hypot(s.x - x, s.y - y) < 195));

  // Las anomalías SOLO aparecen a partir de Noche 10 (isAnomEnabled())
  const allowAnom = isAnomEnabled();
  const anom = allowAnom ? (forcedAnom !== null ? forcedAnom : (Math.random() < 0.22)) : false;

  let anomDef = null;
  if (anom) {
    if (forcedAnomType) {
      anomDef = ANOMALY_DEFS.find(a => a.type === forcedAnomType) || ANOMALY_DEFS[0];
    } else {
      const undiscovered = ANOMALY_DEFS.filter(a => !discoveredAnomalies.some(d => d.anomType === a.type));
      const pool = undiscovered.length ? undiscovered : ANOMALY_DEFS;
      anomDef = pool[Math.floor(Math.random() * pool.length)];
    }
  }

  const actualCat = anomDef ? anomDef.cat : cat;
  const catModels = MODELS.filter(m => m.cat === actualCat);
  const chosenModel = catModels[Math.floor(Math.random() * catModels.length)];

  // Probabilidad de señal corrupta a partir de Noche 5 (shift >= 4)
  const corruptProb = shift >= 4 ? Math.min(0.42, 0.16 + (shift - 4) * 0.03) : 0.04;
  const isCorruptSignal = !anom && (Math.random() < corruptProb);

  const moving = (actualCat === 2 || actualCat === 3);
  const ang = Math.random() * Math.PI * 2;
  const spd = moving ? (2.1 + Math.random() * 1.4) : 0;

  let textData = "[Sin subportadora]";
  let anomTitle = "";
  let anomType = "";
  if (anomDef) {
    anomType = anomDef.type;
    anomTitle = anomDef.title;
    textData = anomDef.textData;
  } else if (actualCat === 3) {
    const satNum = 100 + Math.floor(Math.random() * 899);
    const alt = 420 + Math.floor(Math.random() * 380);
    const hex = uid();
    textData = `TLM-SAT-${satNum} // ${chosenModel.name.toUpperCase()} // ALT:${alt}KM // PWR:88% // HASH:${hex}`;
  } else {
    textData = `ESPECTRO-${chosenModel.id.toUpperCase()} // INTENSIDAD:${62 + Math.floor(Math.random()*35)}%`;
  }

  return {
    id: ++sid, x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    cat: actualCat, modelId: chosenModel.id, img: anomDef ? anomDef.img : chosenModel.img,
    anom, anomType, anomTitle,
    isCorruptSignal, st: "echo", align: 0, prog: 0,
    tot: 0, bad: 0, acc: 0, seed: Math.random() * 100,
    tgF: 14 + Math.floor(Math.random() * 72),
    tgP: 14 + Math.floor(Math.random() * 72),
    fixed: false, textData
  };
}

function ensureSectorDiversity() {
  const inSector = sigs.filter(s => s.st === "echo" || s.st === "align" || s.st === "dl");
  const allowedCats = isPulsarEnabled() ? [0, 1, 2, 3, 4] : [0, 1, 2, 3];

  if (!isPulsarEnabled()) {
    sigs.forEach(s => { if (s.cat === 4 && s.st === "echo") s.st = "gone"; });
  }
  if (!isAnomEnabled()) {
    sigs.forEach(s => { if (s.anom && s.st === "echo") s.st = "gone"; });
  }

  for (const c of allowedCats) {
    if (!inSector.some(s => s.cat === c && !s.anom)) {
      sigs.push(makeSignal(c, false, null));
    }
  }

  // En Noche 10+, garantizar que siempre haya al menos 1 anomalía disponible en el sector
  if (isAnomEnabled() && !inSector.some(s => s.anom)) {
    sigs.push(makeSignal(3, true, null));
  }
}

function offF(s) { return Math.min(1, Math.abs(knobF - s.tgF) / 45); }
function offP(s) { return Math.min(1, Math.abs(knobP - s.tgP) / 45); }
function proxPct(val, target) { return Math.max(0, Math.round(100 - Math.min(100, Math.abs(val - target) * 2.2))); }
function isTuned(s) { return Math.abs(knobF - s.tgF) <= 6 && Math.abs(knobP - s.tgP) <= 6; }

function makeServerChallenge() {
  const count = Math.min(7, 3 + Math.floor(shift / 3));
  const seq = Array.from({length: count}, (_, i) => i);
  if (shift >= 2) {
    for (let i = seq.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [seq[i], seq[j]] = [seq[j], seq[i]];
    }
  }
  return {
    count,
    seq,
    step: 0,
    latched: Array(count).fill(false),
    t: performance.now()
  };
}

function evaluatePlatformDispatch(ev) {
  const {pkg, targetType, assignId} = ev;

  if (pkg.anom && targetType !== "shadow") {
    if (R) R.anomSent++;
    triggerGovernmentArrestEnding();
    return;
  }

  if (targetType === "shadow") {
    if (!pkg.anom) {
      addMail(
        "INTERMEDIARIO SOMBRA // PAQUETE RECHAZADO",
        "Esto es telemetria convencional. Solo pagamos por anomalias reales fuera de catalogo. Pago: $0 CR."
      );
    } else {
      if (R) R.anomSent++;
      G.money += 240;
      addMail(
        "INTERMEDIARIO SOMBRA // TRANSFERENCIA COMPLETADA",
        `Paquete anomalo (${pkg.anomTitle}) recibido en el nodo cifrado. Fondos acreditados: +$240 CR.`
      );
      msg("[OK] Venta cifrada completada (+$240 CR)", 1);
    }
    syncLiveTelemetry(false, true);
    updTop();
    if (V === "mail" || V === "shop") render();
    return;
  }

  const modObj = MODELS.find(m => m.id === pkg.modelId);

  if (targetType === "assign") {
    const asg = mail.find(m => m.id === assignId);
    if (!asg || asg.done || asg.failed) {
      addMail(
        `RE: ENVIO #${pkg.sigId} [ASIGNACION CERRADA]`,
        "El encargo seleccionado ya no se encuentra vigente. Abono acreditado: $0 CR."
      );
      return;
    }

    const catMatches = pkg.chosenCat === pkg.trueCat && pkg.chosenCat === asg.cat;
    const modMatches = !asg.modelId || (pkg.chosenMod === pkg.trueMod && pkg.chosenMod === asg.modelId);

    if (!catMatches || !modMatches) {
      if (R) R.silentErrors++;
      addMail(
        `RE: ${asg.sciName.toUpperCase()} [ARCHIVO ERRONEO]`,
        `El paquete enviado (#${pkg.sigId}) no coincide con los parametros solicitados o contiene una clasificacion erronea.\n\n` +
        `Lectura real verificada: ${CLASSES[pkg.trueCat]}${modObj ? ` (${modObj.name})` : ""}.\n` +
        `Pago emitido: $0 CR.`
      );
      syncLiveTelemetry(false, true);
      if (V === "mail") render();
      else updBadges();
      return;
    }

    asg.done = true;
    discoveredModels.add(pkg.trueMod);
    G.money += asg.reward;
    addMail(
      `RE: ${asg.sciName.toUpperCase()} [ENCARGO VALIDADO]`,
      `Excelente trabajo, Operador. Los datos de ${CLASSES[pkg.trueCat]} (${modObj ? modObj.name : ""}) han sido incorporados a nuestra investigacion.\n\n` +
      `Honorarios transferidos: +$${asg.reward} CR.`
    );
    msg(`[OK] Encargo validado (+$${asg.reward} CR)`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    if (V === "mail" || V === "shop" || V === "atlas") render();
    return;
  }

  if (targetType === "central") {
    const catOk = pkg.chosenCat === pkg.trueCat;
    const modOk = !isSubcatEnabled() || (pkg.chosenMod === pkg.trueMod);

    if (!catOk || !modOk) {
      if (R) R.silentErrors++;
      addMail(
        `CENTRAL // PAQUETE #${pkg.sigId} [ARCHIVO ERRONEO]`,
        `La verificacion automatica detecto discrepancias en tu etiqueta (${CLASSES[pkg.chosenCat]}).\n` +
        `Cuerpo real: ${CLASSES[pkg.trueCat]}${modObj ? ` (${modObj.name})` : ""}. Abono: $0 CR.`
      );
      syncLiveTelemetry(false, true);
      if (V === "mail") render();
      else updBadges();
      return;
    }

    discoveredModels.add(pkg.trueMod);
    const isSat = pkg.trueCat === 3;
    const baseExtraPay = 48;
    const pay = isSat ? 60 : Math.round(baseExtraPay * 0.75);
    G.money += pay;

    addMail(
      `CENTRAL // REGISTRO EXTRA #${pkg.sigId} [ACEPTADO]`,
      isSat
        ? `Telemetria satelital (${modObj ? modObj.name : "Satelite"}) archivada al 100% de tarifa orbital: +$${pay} CR.`
        : `Registro adicional de ${CLASSES[pkg.trueCat]} archivado (tarifa extra -25%): +$${pay} CR.`
    );
    msg(`[OK] Registro extra acreditado (+$${pay} CR)`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    if (V === "mail" || V === "shop" || V === "atlas") render();
  }
}

function advanceNight(timedOut) {
  const pendingList = mail.filter(m => m.kind === "as" && m.night === shift && !m.done && !m.failed);
  const completed = pendingList.length === 0;

  if (timedOut && pendingList.length > 0) {
    pendingList.forEach(a => { a.failed = true; });
    addMail(
      `CIERRE DE GUARDIA ${shiftLabel(shift)} // ENCARGOS EXPIRADOS`,
      `Se agotaron los 10:00 minutos de la noche con ${pendingList.length} encargo(s) sin entregar.`
    );
  }

  if (R) {
    R.ok = completed ? 1 : 0;
    R.status = completed ? "COMPLETADA" : "INCOMPLETA_TIEMPO";
    R.time = +((performance.now() - R.t0) / 1000).toFixed(1);
    R.energy = Math.round(en);
    R.money = G.money;
    S.shifts.push({...R});
  }

  if (shift < TOTAL_NIGHTS - 1) {
    shift++;
    initShift();
    msg(timedOut ? `[CAMBIO DE GUARDIA] ${shiftLabel(shift)}` : `[NUEVA GUARDIA] ${shiftLabel(shift)}`, timedOut ? 0 : 1);
    updTop();
    render();
  } else {
    gameOverReason = "COMPLETED";
    V = "end";
    syncLiveTelemetry(true, true);
    updTop();
    render();
  }
}

function tick(dt) {
  if (!G || V === "intro" || V === "end") return;

  shiftLeft -= dt;
  if (shiftLeft <= 0) {
    shiftLeft = 0;
    advanceNight(true);
    return;
  }

  // Recuperación de energía escalonada por tramos de noches:
  // Noches 1 a 5 (shift 0..4): rápida
  // Noches 6 a 10 (shift 5..9): lenta
  // Noches 11 a 15 (shift 10..14): nula
  const regenMode = getEnergyRegenMode();
  if (regenMode === "fast") {
    en = Math.min(cap, en + dt * (en < 25 ? 1.45 : 0.90));
  } else if (regenMode === "slow") {
    en = Math.min(cap, en + dt * (en < 20 ? 0.42 : 0.22));
  }

  if (rd > 0) rd = Math.max(0, rd - dt);

  const alignDur = Math.max(1.1, 4.4 - G.a * 0.65);
  const dlDur = Math.max(3.8, 12.0 - G.a * 1.6);
  const noiseProb = Math.max(0.02, 0.24 - G.f * 0.04);
  let activeDl = false;

  sigs.forEach(s => {
    if ((s.st === "echo" || s.st === "align" || s.st === "dl") && (s.vx || s.vy)) {
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.x < 90 || s.x > W - 90) { s.vx *= -1; s.x = Math.max(90, Math.min(W - 90, s.x)); }
      if (s.y < 90 || s.y > H - 90) { s.vy *= -1; s.y = Math.max(90, Math.min(H - 90, s.y)); }
    }

    if (srv) return;

    if (s.st === "align") {
      if (R) R.slewTime += dt;
      s.align += dt / alignDur;
      if (s.align >= 1) {
        s.align = 1;
        s.st = "dl";
        beep(520, 0.08, "triangle", 0.05);
        msg("[OK] Antenas alineadas // Descargando trama", 1);
      }
    } else if (s.st === "dl") {
      activeDl = true;
      s.prog += dt / dlDur;
      s.acc += dt;
      while (s.acc >= 0.5) {
        s.acc -= 0.5;
        s.tot++;
        if (Math.random() < noiseProb) {
          s.bad++;
          if (R) R.corrupt++;
        }
      }
      if (s.prog >= 1) {
        s.prog = 1;
        s.st = "raw";
        beep(680, 0.12, "sine", 0.07);
        msg(`[OK] Trama #${s.id} lista en Procesador`, 1);
        ensureSectorDiversity();
        syncLiveTelemetry(false, true);
        if (V === "map" || V === "mail") render();
        else updBadges();
      }
    }
  });

  if (activeDl && !srv && Math.random() < dt / 46) triggerCrash();

  if (activeVoice) {
    activeVoice.t += dt;
    const s = activeVoice.sig;
    const clarity = s.fixed ? 1 : (s.tgF !== undefined ? Math.max(0.18, 1 - (offF(s) + offP(s)) * 0.6) : 1);
    const pulse = s.cat === 4 ? ((activeVoice.t * 7 % 1) < 0.22 ? 1 : 0.05)
                : s.cat === 3 ? ((activeVoice.t * 2.5 % 1) < 0.45 ? 0.9 : 0.1)
                : (0.65 + 0.35 * Math.sin(activeVoice.t * 3));
    activeVoice.g.gain.value = 0.07 * clarity * pulse;
    if (activeVoice.t >= activeVoice.max) stopVoice();
  }

  for (let i = pendingEvals.length - 1; i >= 0; i--) {
    if (performance.now() >= pendingEvals[i].at) {
      const ev = pendingEvals.splice(i, 1)[0];
      evaluatePlatformDispatch(ev);
    }
  }

  if (flashT > 0) {
    flashT -= dt;
    if (flashT <= 0) { flash = ""; updTop(); }
  }

  uiTick += dt;
  if (uiTick >= 0.45) { uiTick = 0; updTop(); }

  liveSyncTimer += dt;
  if (liveSyncTimer >= 2.0) {
    liveSyncTimer = 0;
    syncLiveTelemetry(false, false);
  }

  cloudSyncTimer += dt;
  if (cloudSyncTimer >= 5.0) {
    cloudSyncTimer = 0;
    if (activeDbUrl) {
      pushSnapshotToCloud(buildSessionSnapshot(false));
    }
  }
}

// Renderizador procedural de modelos y anomalías
function renderCelestialToCanvas(cv, spec, t, filterLv = 5, tuneErr = 0, sepiaMode = false, opticalFailure = false) {
  if (!cv) return;
  const cx = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  const img = cx.createImageData(w, h);
  const d = img.data;

  // Evento Noche 9: fallo óptico total en el monitor CRT del Procesador
  if (opticalFailure) {
    for (let y = 0; y < h; y++) {
      const band = Math.sin(y * 0.4 + t * 22) > 0.72 ? 42 : 0;
      for (let x = 0; x < w; x++) {
        const noise = (Math.random() * 28 + band) * ((y % 2 === 0) ? 0.7 : 1.0);
        const idx = (y * w + x) * 4;
        d[idx] = Math.min(255, noise * 1.45);
        d[idx + 1] = Math.min(255, noise * 0.42);
        d[idx + 2] = Math.min(255, noise * 0.42);
        d[idx + 3] = 255;
      }
    }
    cx.putImageData(img, 0, 0);
    return;
  }

  const baseFloor = [0.60, 0.44, 0.30, 0.18, 0.09, 0.02][Math.min(5, Math.max(0, filterLv))];
  const staticAmt = sepiaMode ? 0.06 : Math.min(0.98, baseFloor + tuneErr * (1 - baseFloor));

  const modObj = MODELS.find(m => m.id === spec.modelId);
  const spriteSrc = spec.img || (modObj && modObj.img);
  const sprite = getSprite(spriteSrc);

  if (sprite && offCx) {
    offCv.width = w;
    offCv.height = h;
    offCx.imageSmoothingEnabled = false;
    offCx.fillStyle = "#000000";
    offCx.fillRect(0, 0, w, h);

    const aspect = sprite.naturalWidth / sprite.naturalHeight;
    let dw = w, dh = h;
    if (w / h > aspect) {
      dw = Math.round(h * aspect);
    } else {
      dh = Math.round(w / aspect);
    }
    const ox = Math.floor((w - dw) / 2);
    const oy = Math.floor((h - dh) / 2);
    offCx.drawImage(sprite, ox, oy, dw, dh);

    try {
      const srcData = offCx.getImageData(0, 0, w, h).data;
      for (let y = 0; y < h; y++) {
        const scanline = (y % 2 === 0) ? 0.90 : 1.0;
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const alpha = srcData[idx + 3] / 255;
          const rawLum = (srcData[idx] * 0.299 + srcData[idx + 1] * 0.587 + srcData[idx + 2] * 0.114) * alpha;
          const lum = Math.max(8, rawLum);
          const snow = Math.random() * 255;
          const finalVal = Math.max(0, Math.min(255, (lum * (1 - staticAmt) + snow * staticAmt) * scanline));

          if (sepiaMode) {
            d[idx] = Math.min(255, finalVal * 1.05);
            d[idx + 1] = Math.min(255, finalVal * 0.92);
            d[idx + 2] = Math.min(255, finalVal * 0.72);
          } else {
            d[idx] = finalVal;
            d[idx + 1] = finalVal;
            d[idx + 2] = finalVal;
          }
          d[idx + 3] = 255;
        }
      }
      cx.putImageData(img, 0, 0);
      return;
    } catch (_) {
      // Fallback directo si se abre via file:// sin servidor local
      cx.imageSmoothingEnabled = false;
      cx.fillStyle = sepiaMode ? "#1e1912" : "#000000";
      cx.fillRect(0, 0, w, h);
      cx.save();
      cx.filter = sepiaMode ? "grayscale(100%) sepia(55%)" : "grayscale(100%)";
      cx.globalAlpha = Math.max(0.15, 1 - staticAmt * 0.85);
      cx.drawImage(sprite, ox, oy, dw, dh);
      cx.restore();
      return;
    }
  }

  const cx0 = w / 2, cy0 = h / 2;
  const scale = Math.min(w, h) / 96;
  const mid = spec.modelId || "est_enana";
  const seed = spec.seed || 1.5;
  const anomType = spec.anomType || "";

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = (x - cx0) / scale;
      const dy = (y - cy0) / scale;
      const dist = Math.hypot(dx, dy);
      let lum = 10;

      if (anomType === "voyager") {
        // Voyager 1: plato parabólico fracturado, bus decagonal y antena magnetómetro
        const dish = Math.hypot(dx + 6, dy + 2);
        const crack = Math.abs(dx - dy * 0.7 + 4) < 1.6;
        const bus = Math.abs(dx - 8) < 6 && Math.abs(dy - 5) < 5;
        const boom = Math.abs(dy - (dx - 8) * 0.45 - 5) < 1.2 && dx >= 12 && dx <= 34;
        const frag1 = Math.hypot(dx + 22, dy - 14) < 3.2;
        const frag2 = Math.hypot(dx - 24, dy + 16) < 2.6;
        if (dish < 15 && dish > 10 && !crack) lum = 225;
        else if (dish <= 10 && !crack) lum = 145;
        else if (bus) lum = 205;
        else if (boom) lum = 185;
        else if (frag1 || frag2) lum = 195;
      } else if (anomType === "dyson") {
        // Esfera de Dyson: estrella central parcialmente eclipsada por anillos geodésicos orbitales
        const core = dist < 15;
        const shellOuter = dist >= 22 && dist <= 26;
        const latRing = Math.abs(dy - Math.sin(dx * 0.14 + t * 1.4) * 9) < 2.1 && dist <= 26;
        const lonRing = Math.abs(dx - Math.cos(dy * 0.14 - t * 1.1) * 9) < 2.1 && dist <= 26;
        const gap = ((Math.floor(dx + 40) + Math.floor(dy + 40)) % 7 === 0);
        if (shellOuter && !gap) lum = 235;
        else if ((latRing || lonRing) && !gap) lum = 215;
        else if (core) lum = 155 + Math.sin(t * 6) * 20;
      } else if (anomType === "failed_planet") {
        // Planeta Fallido: cuerpo masivo agrietado con núcleo incandescente expuesto y fragmentos orbitales
        const ang = Math.atan2(dy, dx);
        const rad = 25 + Math.sin(ang * 5 + seed) * 3;
        const fissure = Math.abs(Math.sin(dx * 0.22 + dy * 0.18)) < 0.16 && dist < rad;
        const deb1 = Math.hypot(dx - 31, dy + 12) < 3.2;
        const deb2 = Math.hypot(dx + 30, dy - 15) < 2.8;
        if (dist < rad) {
          lum = fissure ? (235 + Math.sin(t * 8) * 18) : (105 - dx * 0.9);
        } else if (deb1 || deb2) {
          lum = 190;
        }
      } else if (anomType === "dark_eyes") {
        // Silueta pálida ovalada con dos cuencas oculares negras profundas (sin boca)
        const oval = Math.hypot(dx * 1.15, dy * 0.85);
        const leftEye = Math.hypot(dx + 9, dy + 4) < 5.2;
        const rightEye = Math.hypot(dx - 9, dy + 4) < 5.2;
        if (oval < 27) {
          if (leftEye || rightEye) lum = 4;
          else lum = 205 - oval * 2.4 + Math.sin(t * 5 + dy * 0.3) * 10;
        }
      } else if (mid === "est_enana") {
        if (dist < 20) lum = 235 - dist * 2;
        else if (dist < 40) lum = Math.max(14, 155 - (dist - 20) * 6);
        if ((Math.abs(dx) < 1.6 || Math.abs(dy) < 1.6) && dist < 48) lum = Math.max(lum, 185 - dist * 2.5);
      } else if (mid === "est_gigante") {
        if (dist < 30) lum = 240 - dist * 1.4;
        else if (dist < 50) lum = Math.max(14, 180 - (dist - 30) * 7 + Math.sin(Math.atan2(dy, dx)*10 + t*2)*16);
      } else if (mid === "est_binaria") {
        const off = 14;
        const a = t * 1.4;
        const d1 = Math.hypot(dx - Math.cos(a)*off, dy - Math.sin(a)*off);
        const d2 = Math.hypot(dx + Math.cos(a)*off, dy + Math.sin(a)*off);
        if (d1 < 12) lum = 240 - d1 * 5;
        if (d2 < 9) lum = Math.max(lum, 225 - d2 * 6);
      } else if (mid === "est_trinaria") {
        for (let k = 0; k < 3; k++) {
          const a = t * 1.2 + k * (Math.PI * 2 / 3);
          const dk = Math.hypot(dx - Math.cos(a)*15, dy - Math.sin(a)*15);
          if (dk < 9) lum = Math.max(lum, 235 - dk * 6);
        }
      } else if (mid === "pla_rocoso") {
        if (dist < 22) lum = 165 - dx * 1.2 + Math.sin(dx * 0.5) * Math.cos(dy * 0.5) * 28;
      } else if (mid === "pla_gaseoso") {
        if (dist < 27) lum = 175 + Math.sin(dy * 0.75) * 48 - dx * 0.9;
      } else if (mid === "pla_anillos") {
        const rx = dx * 0.86 + dy * 0.5;
        const ry = -dx * 0.5 + dy * 0.86;
        const ring = Math.abs(Math.hypot(rx * 0.36, ry * 1.45) - 27) < 3.8;
        if (dist < 20) lum = 165 + Math.sin(ry * 0.6) * 35 - dx * 0.9;
        else if (ring) lum = 220;
      } else if (mid === "pla_enano") {
        if (dist < 13) lum = 180 - dx * 1.4;
      } else if (mid === "pla_oceanico") {
        if (dist < 23) lum = 195 + Math.sin(dx * 0.25 + t * 2) * 18 - dx * 0.7;
      } else if (mid === "ast_metalico") {
        const ang = Math.atan2(dy, dx);
        const rad = 22 + Math.sin(ang * 3 + seed) * 7 + Math.cos(ang * 5) * 4;
        if (dist < rad) lum = 195 + Math.sin(dx * 0.4) * 40;
      } else if (mid === "ast_condrita") {
        const ang = Math.atan2(dy, dx);
        const rad = 24 + Math.cos(ang * 4 + seed) * 6;
        if (dist < rad) lum = 125 + Math.sin(dx * 0.5) * Math.cos(dy * 0.5) * 35;
      } else if (mid === "ast_cometa") {
        const head = Math.hypot(dx + 14, dy);
        if (head < 10) lum = 240 - head * 6;
        else if (dx > -14 && Math.abs(dy) < (dx + 14) * 0.38 && dx < 38) {
          lum = Math.max(14, 175 - (dx + 14) * 3.1);
        }
      } else if (mid === "sat_com") {
        const core = Math.abs(dx) < 7 && Math.abs(dy) < 9;
        const panel = Math.abs(dx) >= 11 && Math.abs(dx) <= 42 && Math.abs(dy) < 6;
        const strut = Math.abs(dy) < 1.8 && Math.abs(dx) < 42;
        if (core) lum = 225;
        else if (panel) lum = ((x % 5 === 0 || y % 4 === 0) ? 95 : 190);
        else if (strut) lum = 170;
      } else if (mid === "sat_sonda") {
        const dish = Math.hypot(dx + 8, dy);
        const body = dx >= 4 && dx <= 22 && Math.abs(dy) < 6;
        if (dish < 14 && dish > 9) lum = 230;
        else if (body) lum = 195;
      } else if (mid === "sat_telescopio") {
        const tube = Math.abs(dx) < 22 && Math.abs(dy) < 8;
        const flap = dx < -18 && dx > -28 && Math.abs(dy + 10) < 4;
        if (tube) lum = 210 - Math.abs(dy) * 8;
        else if (flap) lum = 180;
      } else if (mid === "sat_estacion") {
        const truss = Math.abs(dy) < 2.2 && Math.abs(dx) < 44;
        const modV = Math.abs(dx) < 5 && Math.abs(dy) < 22;
        const wings = (Math.abs(dx + 28) < 6 || Math.abs(dx - 28) < 6) && Math.abs(dy) < 18;
        if (truss || modV) lum = 225;
        else if (wings) lum = 175;
      } else if (mid === "pul_ms") {
        const beam = Math.abs(dy - dx * Math.tan(t * 9)) < 2.4 && dist < 46;
        if (dist < 11) lum = 245;
        else if (beam) lum = 220;
      } else if (mid === "pul_magnetar") {
        const ring = Math.abs(dist - 24) < 2.5;
        if (dist < 14) lum = 250;
        else if (ring) lum = 200;
      } else if (mid === "pul_binario") {
        const d1 = Math.hypot(dx + 12, dy);
        const d2 = Math.hypot(dx - 14, dy);
        if (d1 < 10) lum = 245;
        if (d2 < 14 && d2 > 10) lum = 195;
      }

      const snow = Math.random() * 255;
      const scanline = (y % 2 === 0) ? 0.90 : 1.0;
      const finalVal = Math.max(0, Math.min(255, (lum * (1 - staticAmt) + snow * staticAmt) * scanline));

      const idx = (y * w + x) * 4;
      if (sepiaMode) {
        d[idx] = Math.min(255, finalVal * 1.05);
        d[idx + 1] = Math.min(255, finalVal * 0.92);
        d[idx + 2] = Math.min(255, finalVal * 0.72);
      } else {
        d[idx] = finalVal;
        d[idx + 1] = finalVal;
        d[idx + 2] = finalVal;
      }
      d[idx + 3] = 255;
    }
  }
  cx.putImageData(img, 0, 0);
}

function drawMap(t) {
  const cv = $("#cv");
  if (!cv) return;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#03070d";
  cx.fillRect(0, 0, 640, 310);

  cx.strokeStyle = "rgba(52, 95, 68, 0.2)";
  cx.lineWidth = 1;
  const gx0 = -(cam.x % 80), gy0 = -(cam.y % 80);
  for (let x = gx0; x < 640; x += 80) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, 310); cx.stroke(); }
  for (let y = gy0; y < 310; y += 80) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(640, y); cx.stroke(); }

  cx.fillStyle = "#d1fae5";
  stars.forEach(([x, y, r]) => {
    const sx = x - cam.x, sy = y - cam.y;
    if (sx < 0 || sx > 640 || sy < 0 || sy > 310) return;
    cx.globalAlpha = 0.3 + 0.35 * Math.sin(t * 1.4 + x);
    cx.fillRect(sx, sy, r, r);
  });
  cx.globalAlpha = 1;

  cx.save();
  cx.translate(-cam.x, -cam.y);
  sigs.forEach(s => {
    if (s.st === "gone" || s.st === "raw") return;
    const col = s.st === "echo" ? "96, 195, 255" : s.st === "align" ? "234, 179, 8" : "74, 222, 128";
    const pulse = (t * 0.45 + s.seed) % 1;
    cx.strokeStyle = `rgba(${col}, ${(1 - pulse) * 0.65})`;
    cx.beginPath(); cx.arc(s.x, s.y, 7 + pulse * 26, 0, Math.PI * 2); cx.stroke();

    cx.fillStyle = `rgb(${col})`;
    cx.beginPath(); cx.arc(s.x, s.y, 4.5, 0, Math.PI * 2); cx.fill();

    if (s.st === "align") {
      cx.strokeStyle = "#eab308";
      cx.lineWidth = 2.5;
      cx.beginPath(); cx.arc(s.x, s.y, 16, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.align); cx.stroke();
      cx.lineWidth = 1;
    } else if (s.st === "dl") {
      cx.strokeStyle = srv ? "#ef4444" : "#4ade80";
      cx.lineWidth = 2.5;
      cx.beginPath(); cx.arc(s.x, s.y, 16, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.prog); cx.stroke();
      cx.lineWidth = 1;
    }
  });
  cx.restore();

  if (rd > 0) {
    cx.globalAlpha = Math.min(1, rd / 2);
    sigs.forEach(s => {
      if (s.st !== "echo") return;
      const sx = s.x - cam.x, sy = s.y - cam.y;
      if (sx > 10 && sx < 630 && sy > 10 && sy < 300) return;
      const a = Math.atan2(sy - 155, sx - 320);
      const k = Math.min(295 / Math.abs(Math.cos(a) || 1e-5), 136 / Math.abs(Math.sin(a) || 1e-5));
      cx.save();
      cx.translate(320 + Math.cos(a)*k, 155 + Math.sin(a)*k);
      cx.rotate(a);
      cx.fillStyle = "#4ade80";
      cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(-14, -6); cx.lineTo(-14, 6); cx.fill();
      cx.restore();
    });
    cx.globalAlpha = 1;
  }

  const aligning = sigs.find(s => s.st === "align");
  const targetAng = aligning ? Math.atan2(aligning.y - H/2, aligning.x - W/2) : -Math.PI/2;
  cx.fillStyle = "rgba(8, 14, 11, 0.78)";
  cx.fillRect(8, 268, 112, 34);
  cx.strokeStyle = "#243d2b";
  cx.strokeRect(8, 268, 112, 34);
  for (let i = 0; i < 3; i++) {
    const ax = 26 + i * 36, ay = 285;
    cx.strokeStyle = "#4ade80";
    cx.beginPath(); cx.arc(ax, ay, 8, 0, Math.PI * 2); cx.stroke();
    const curA = aligning ? (targetAng - (1 - aligning.align) * 2.2) : targetAng;
    cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(ax + Math.cos(curA)*10, ay + Math.sin(curA)*10); cx.stroke();
  }
}

function drawCRT(t) {
  const cv = $("#crt");
  if (!cv || !cur) return;
  const [rw, rh] = CRT_RES[Math.min(5, G.f)];
  if (cv.width !== rw || cv.height !== rh) {
    cv.width = rw;
    cv.height = rh;
  }
  const tuneErr = cur.fixed ? 0 : Math.min(1, (offF(cur) + offP(cur)) * 0.75);
  renderCelestialToCanvas(cv, cur, t, G.f, tuneErr, false, isOpticalFailed());
}

function drawAtlasCanvases(t) {
  document.querySelectorAll("[data-atlas-mid]").forEach(cv => {
    const mid = cv.dataset.atlasMid;
    const mod = MODELS.find(m => m.id === mid);
    if (mod) {
      renderCelestialToCanvas(cv, {modelId: mod.id, img: mod.img, seed: 2.1, anom: false, anomType: ""}, t, 5, 0, false, false);
    }
  });
  document.querySelectorAll("[data-anom-idx]").forEach(cv => {
    const idx = +cv.dataset.anomIdx;
    const item = discoveredAnomalies[idx];
    if (item) {
      renderCelestialToCanvas(cv, item, t, 5, 0, true, false);
    }
  });
}

function drawSpectrogram(t) {
  const cv = $("#spec");
  if (!cv || !cur) return;
  const cx = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  cx.fillStyle = "#030805";
  cx.fillRect(0, 0, w, h);

  cx.strokeStyle = "rgba(52, 95, 68, 0.25)";
  for (let x = 0; x < w; x += 40) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, h); cx.stroke(); }
  for (let y = 0; y < h; y += 30) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(w, y); cx.stroke(); }

  const cat = cur.cat;
  for (let x = 0; x < w; x += 3) {
    const phase = x * 0.04 + t * 2.2;
    if (cur.anom) {
      for (let b = 0; b < 4; b++) {
        const bend = Math.exp(-Math.pow((x - w/2)/65, 2)) * 38;
        const y = 30 + b * 28 + bend + Math.sin(phase * 1.4 + b) * 4;
        cx.fillStyle = "rgba(248, 113, 113, 0.88)";
        cx.fillRect(x, y, 2, 5);
      }
    } else if (cat === 0) {
      for (let b = 0; b < 3; b++) {
        const y = 38 + b * 42 + Math.sin(phase * 0.7 + b) * 4;
        cx.fillStyle = "rgba(74, 222, 128, 0.55)";
        cx.fillRect(x, y - 6, 3, 12);
      }
    } else if (cat === 1) {
      for (let b = 0; b < 4; b++) {
        const y = 32 + b * 28 + Math.sin(phase + b) * 2;
        cx.fillStyle = "rgba(74, 222, 128, 0.82)";
        cx.fillRect(x, y, 3, 4);
      }
    } else if (cat === 4) {
      if (((x + Math.floor(t * 45)) % 36) < 4) {
        cx.fillStyle = "rgba(74, 222, 128, 0.9)";
        cx.fillRect(x, 18, 3, h - 36);
      }
    } else if (cat === 3) {
      const slot = Math.floor((x + t * 35) / 18);
      if ((slot * 7 + Math.floor(cur.seed)) % 3 === 0) {
        const top = 26 + (slot % 3) * 32;
        cx.fillStyle = "rgba(74, 222, 128, 0.85)";
        cx.fillRect(x, top, 3, 28);
      }
    } else if (cat === 2) {
      const y = ((x * 0.6 + t * 40) % (h - 30)) + 15;
      cx.fillStyle = "rgba(134, 239, 172, 0.65)";
      cx.fillRect(x, y, 2, 9);
    }
  }
}

function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  tick(dt);
  const t = now / 1000;
  if (V === "map") drawMap(t);
  if (V === "proc") drawCRT(t);
  if (V === "spec") drawSpectrogram(t);
  if (V === "atlas") drawAtlasCanvases(t);
  requestAnimationFrame(loop);
}

            const mod = a.modelId ? MODELS.find(m => m.id === a.modelId) : null;
            const reqTxt = `${CLASSES[a.cat]}${mod ? ` (${mod.name})` : ""}`;
            return `<div class="between" style="padding:7px 0;border-bottom:1px solid #1b2e22">
              <div>
                <b>Encargo ${idx + 1}/3 · ${a.sciName}</b>
                <div class="mut" style="font-size:12px">Solicita: ${reqTxt} · Pago: $${a.reward} CR</div>
              </div>
              <button data-send-as="${a.id}" ${a.done || a.failed ? "disabled" : ""}>
                ${a.done ? "ENTREGADO" : a.failed ? "EXPIRADO" : "Enviar a encargo"}
              </button>
            </div>`;
          }).join("")}

          <div class="between" style="padding:9px 0;border-bottom:1px solid #1b2e22">
            <div>
              <b>Archivo Central (Envio Libre / Extra)</b>
              <div class="mut" style="font-size:12px">
                ${extrasMode
                  ? "Asignaciones diarias completadas: tarifa extra -25% ($36 CR), Satelites conservan 100% ($60 CR)."
                  : "Envio secundario fuera de asignacion (-25% = $36 CR; Satelites 100% = $60 CR)."}
              </div>
            </div>
            <button class="alt" id="sendCentralBtn">Enviar a Central</button>
          </div>

          ${shadowBuyerUnlocked ? `
            <div class="between" style="padding:9px 0">
              <div>
                <b style="color:#d8b4fe">Canal Cifrado // Intermediario Sombra</b>
                <div class="mut" style="font-size:12px">Compra directa de lecturas anomalas fuera de la red oficial ($240 CR).</div>
              </div>
              <button class="shadow" id="sendShadowBtn">Transmitir por Canal Cifrado</button>
            </div>
          ` : ""}
        </div>`;
    }
  } else if (V === "atlas") {
    h = `
      <div class="card">
        <b>ATLAS DE CUERPOS CELESTES (${discoveredModels.size}/${MODELS.length} DESCUBIERTOS)</b>
        <div class="atlas-grid">
          ${MODELS.map(m => {
            const unlocked = discoveredModels.has(m.id);
            if (!unlocked) {
              return `<div class="atlas-card locked">
                <div style="font-size:11px" class="mut">${CLASSES[m.cat].toUpperCase()}</div>
                <b>[NO DESCUBIERTO]</b>
                <div class="mut" style="font-size:11px">Verifica esta senal en Central para desbloquear su registro visual y sonoro.</div>
              </div>`;
            }
            return `<div class="atlas-card">
              <div class="between">
                <span style="font-size:11px;color:var(--accent)">${CLASSES[m.cat].toUpperCase()}</span>
                <button class="alt" style="padding:2px 7px;font-size:11px" data-atlas-au="${m.id}">🔊 Audio</button>
              </div>
              <b>${m.name}</b>
              <canvas class="atlas-cv" width="96" height="58" data-atlas-mid="${m.id}"></canvas>
              <div class="mut" style="font-size:11px">${m.desc}</div>
            </div>`;
          }).join("")}
        </div>
      </div>`;

    if (discoveredAnomalies.length > 0) {
      h += `
        <div class="paper-sheet">
          <h3>REGISTRO EN PAPEL // ANOMALIAS</h3>
          <div class="paper-grid">
            ${discoveredAnomalies.map((a, idx) => `
              <div class="paper-entry">
                <div class="between">
                  <b>${a.anomTitle}</b>
                  <button class="paper-btn" data-anom-au="${idx}">🔊 Audio</button>
                </div>
                <canvas class="paper-cv" width="96" height="58" data-anom-idx="${idx}"></canvas>
                <div class="paper-bin">${a.textData}</div>
              </div>
            `).join("")}
          </div>
        </div>`;
    }
  } else if (V === "spec") {
    const ready = sigs.filter(s => s.st === "raw");
    if (cur && !ready.includes(cur)) cur = null;
    if (!cur && ready[0]) { cur = ready[0]; knobF = 50; knobP = 50; choiceCat = null; choiceMod = null; }

    h = `<div class="row">
      <span class="mut" style="font-size:12px">ANALISIS ESPECTRAL:</span>
      ${ready.length ? ready.map(s => `<button class="${s === cur ? "" : "alt"}" data-s="${s.id}">TRAMA #${s.id}</button>`).join("") : `<span class="mut">Sin tramas en buffer</span>`}
    </div>`;

    if (cur) {
      h += `
        <canvas id="spec" width="640" height="190"></canvas>
        <div class="card">
          <div class="between">
            <b>SUBPORTADORA // TRAMA #${cur.id}</b>
            ${cur.cat === 3 && !cur.anom ? `<button id="saveSatBtn">Guardar datos de satelite</button>` : ""}
          </div>
          <div class="databox ${cur.anom ? "anom" : ""}">${cur.textData}</div>
        </div>`;
    }
  } else if (V === "srv") {
    h = srv ? `
      <div class="card">
        <b>ENLACE DE RELES INTERRUMPIDO (${srv.count} MODULOS)</b>
        <p class="mut">Activa los ${srv.count} reles en el orden correcto de sincronizacion (avance: ${srv.step}/${srv.count}).</p>
        <div class="grid">
          ${Array.from({length: srv.count}, (_, i) => {
            const on = srv.latched[i];
            return `<button class="${on ? "" : "alt"}" data-b="${i}">RELE 0${i + 1}</button>`;
          }).join("")}
        </div>
      </div>` : `<div class="card"><b>SERVIDOR EN LINEA</b><p class="mut">Sin incidencias.</p></div>`;
  } else if (V === "shop") {
    const upgrades = [
      ["a", "Servomotores de Antena", "Acelera el giro de antenas y la descarga.", 5, 85 + 55 * G.a],
      ["f", "Filtro CRT Optico", "Aumenta la resolucion del CRT y reduce la estatica.", 5, 80 + 50 * G.f],
      ["b", "Banco de Baterias", "Aumenta la capacidad maxima de PWR (+20 por nivel).", 5, 75 + 45 * G.b],
      ["spec", "Modulo Espectrograma", "Habilita Espectrograma y lectura de subportadoras.", 5, 65 + 40 * G.spec]
    ];
    h = upgrades.map(([k, name, desc, maxLv, cost]) => {
      const lv = G[k];
      return `<div class="card between">
        <div>
          <b>${name}</b> <span class="mut">[NV ${lv}/${maxLv}]</span>
          <div class="mut" style="font-size:12px">${desc}</div>
        </div>
        <button data-u="${k}" ${lv >= maxLv || G.money < cost ? "disabled" : ""}>${lv >= maxLv ? "MAXIMO" : `$${cost} CR`}</button>
      </div>`;
    }).join("") + `
    <div class="card between">
      <div>
        <b>Celda de Energia Auxiliar (+45 PWR)</b>
        <div class="mut" style="font-size:12px">Suministro de emergencia indispensable cuando la recarga es lenta o nula.</div>
      </div>
      <button id="buyCellBtn" ${G.money < 30 || en >= cap ? "disabled" : ""}>$30 CR</button>
    </div>`;
  } else if (V === "end") {
    if (gameOverReason === "ARREST") {
      h = `
        <div class="card dangerbox" style="padding:22px">
          <div style="font-size:12px;color:#fca5a5;letter-spacing:1.5px">INTERVENCION GUBERNAMENTAL // DIVISION DEL ESPACIO DE NACIONES UNIDAS</div>
          <h2 style="margin:8px 0;color:#f87171">ESTACION ERIAL-7 CLAUSURADA</h2>
          <p>
            Al transmitir una senal anomala a traves de la red oficial, los filtros de seguridad de la <b>Division del Espacio de Naciones Unidas</b> rastrearon el origen hasta tu terminal.
          </p>
          <p class="mut">
            Fuerzas de contencion orbital han clausurado la estacion Erial-7 y has sido puesto bajo arresto preventivo para investigacion.
          </p>
          <div class="row" style="margin-top:16px">
            <button id="rsBtn">Iniciar nueva partida</button>
          </div>
        </div>`;
    } else {
      h = `
        <div class="card" style="padding:22px">
          <div style="font-size:12px;color:var(--accent);letter-spacing:1.5px">CAMPANA COMPLETADA // 15 NOCHES</div>
          <h2 style="margin:8px 0;color:var(--accent)">GUARDIA FINALIZADA · OP. ${S.playerName.toUpperCase()}</h2>
          <p>
            Has completado las 15 noches de vigilancia en la Estacion Erial-7.
          </p>
          <div class="row">
            <span class="pill">Creditos finales: $${G.money} CR</span>
            <span class="pill">Modelos en Atlas: ${discoveredModels.size}/${MODELS.length}</span>
            <span class="pill">Anomalias registradas: ${discoveredAnomalies.length}</span>
          </div>
          <div class="row" style="margin-top:16px">
            <button id="rsBtn">Iniciar nueva partida</button>
          </div>
        </div>`;
    }
  }

  w.innerHTML = h;
  bindEvents(w);
}

function bindEvents(w) {
  const on = (sel, fn) => { const el = w.querySelector(sel); if (el) el.onclick = fn; };

  const pn = w.querySelector("#playerName");
  const sn = w.querySelector("#startNight");
  const fm = w.querySelector("#freeModeChk");
  if (sn) {
    sn.onchange = e => { selectedStartNight = +e.target.value; };
  }
  if (fm) {
    fm.onchange = e => { freeModeSelected = e.target.checked; };
  }
  if (pn) {
    pn.oninput = e => { playerNameInput = e.target.value; };
    pn.onkeydown = e => {
      if (e.key === "Enter") {
        const nightVal = sn ? +sn.value : selectedStartNight;
        const freeVal = fm ? fm.checked : freeModeSelected;
        beep(520, 0.1);
        start(pn.value, nightVal, freeVal);
      }
    };
    setTimeout(() => pn.focus(), 30);
  }

  on("#go", () => {
    const val = w.querySelector("#playerName")?.value || playerNameInput;
    const nightVal = sn ? +sn.value : selectedStartNight;
    const freeVal = fm ? fm.checked : freeModeSelected;
    beep(520, 0.1);
    start(val, nightVal, freeVal);
  });

  on("#goFreeBtn", () => {
    const val = w.querySelector("#playerName")?.value || playerNameInput;
    const nightVal = sn ? +sn.value : selectedStartNight;
    freeModeSelected = true;
    beep(620, 0.12);
    start(val, nightVal, true);
  });

  w.querySelectorAll("[data-m]").forEach(el => el.onclick = () => {
    markFirst();
    const m = mail.find(x => x.id === el.dataset.m);
    if (m) { m.read = 1; selMail = m.id; beep(380, 0.04); render(); }
  });

  const nb = w.querySelector("#notesBox");
  if (nb) nb.oninput = e => { notes = e.target.value; syncLiveTelemetry(false, false); };

  on("#sendSatMail", () => {
    if (!savedSatLog) return;
    markFirst();
    const log = savedSatLog;
    savedSatLog = null;
    satReportsSent++;
    if (R) R.satReports++;
    G.money += 45;
    beep(640, 0.1);
    addMail(
      "RE: REPORTE DE TELEMETRIA SATELITAL [RECIBIDO]",
      `Registro orbital archivado:\n${log}\n\nBonificacion acreditada: +$45 CR.`
    );
    msg("[OK] Reporte satelital enviado (+$45 CR)", 1);
    syncLiveTelemetry(false, true);
    updTop();
    render();
  });

  on("#restBtn", () => {
    if (!allNightAssignsClosed()) return;
    beep(480, 0.1);
    advanceNight(false);
  });

  on("#goSrvBtn", () => {
    beep(420, 0.05);
    V = "srv";
    render();
  });

  const cv = $("#cv");
  if (cv) {
    cv.onpointerdown = e => {
      moved = 0;
      drag = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y};
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    };
    cv.onpointermove = e => {
      if (!drag) return;
      const r = cv.getBoundingClientRect();
      const dx = (e.clientX - drag.x) * 640 / r.width;
      const dy = (e.clientY - drag.y) * 310 / r.height;
      if (Math.hypot(dx, dy) > 6) moved = 1;
      if (moved) {
        cam.x = Math.max(0, Math.min(W - 640, drag.cx - dx));
        cam.y = Math.max(0, Math.min(H - 310, drag.cy - dy));
      }
    };
    cv.onpointerup = cv.onpointercancel = () => { drag = null; };
    cv.onclick = e => {
      if (moved) return;
      markFirst();
      const r = cv.getBoundingClientRect();
      const x = (e.clientX - r.left) * 640 / r.width + cam.x;
      const y = (e.clientY - r.top) * 310 / r.height + cam.y;
      const hit = sigs.find(s => (s.st === "echo" || s.st === "align" || s.st === "dl") && Math.hypot(s.x - x, s.y - y) < 32);
      if (!hit) { if (R) R.invalid++; syncLiveTelemetry(false, false); return; }

      if (hit.st === "echo") {
        const busySig = sigs.find(s => s.st === "align" || s.st === "dl");
        if (busySig) {
          if (pendingOverrideSig && pendingOverrideSig.id === hit.id) {
            if (en < 8) { beep(180, 0.15, "sawtooth"); return msg("[ERR] Energia insuficiente (8 PWR)", 0); }
            busySig.st = "gone";
            pendingOverrideSig = null;
            en -= 8;
            hit.st = "align";
            ensureSectorDiversity();
            beep(340, 0.12, "triangle");
            msg(`[OK] Busqueda anterior cancelada // Rastreando #${hit.id}`, 1);
            updTop();
            render();
            return;
          }
          pendingOverrideSig = hit;
          beep(220, 0.1, "sawtooth");
          msg(`[AVISO] Antenas ocupadas con #${busySig.id}. Insiste para cancelar y cambiar.`, 0);
          render();
          return;
        }

        if (en < 8) { if (R) R.invalid++; beep(180, 0.15, "sawtooth"); return msg("[ERR] Energia insuficiente (8 PWR)", 0); }
        en -= 8;
        hit.st = "align";
        pendingOverrideSig = null;
        beep(320, 0.12, "triangle");
        syncLiveTelemetry(false, true);
        updTop();
        render();
      }
    };
  }

  on("#confirmOverrideBtn", () => {
    if (!pendingOverrideSig) return;
    const busySig = sigs.find(s => s.st === "align" || s.st === "dl");
    if (en < 8) { beep(180, 0.15, "sawtooth"); return msg("[ERR] Energia insuficiente (8 PWR)", 0); }
    if (busySig) busySig.st = "gone";
    en -= 8;
    pendingOverrideSig.st = "align";
    const newId = pendingOverrideSig.id;
    pendingOverrideSig = null;
    ensureSectorDiversity();
    beep(340, 0.12, "triangle");
    msg(`[OK] Investigacion reemplazada // Rastreando #${newId}`, 1);
    updTop();
    render();
  });

  on("#cancelOverrideBtn", () => {
    pendingOverrideSig = null;
    render();
  });

  on("#rd", () => {
    markFirst();
    if (rd > 0) return;
    if (en < 6) { if (R) R.invalid++; return msg("[ERR] Energia insuficiente (6 PWR)", 0); }
    en -= 6; rd = 7;
    beep(580, 0.12);
    updTop();
  });

  w.querySelectorAll("[data-s]").forEach(el => el.onclick = () => {
    cur = sigs.find(s => s.id === +el.dataset.s) || null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    stopVoice();
    render();
  });

  const knF = $("#knF"), knP = $("#knP");
  if (knF) knF.oninput = e => {
    knobF = +e.target.value;
    const vf = $("#valF");
    if (vf) vf.textContent = knobF;
    if (R) R.retunes++;
    if (cur) {
      const pF = proxPct(knobF, cur.tgF);
      const colF = pF >= 88 ? "#4ade80" : pF >= 55 ? "#eab308" : "#ef4444";
      const bf = $("#barF"), tf = $("#txtF");
      if (bf) { bf.style.width = `${pF}%`; bf.style.background = colF; }
      if (tf) { tf.textContent = `${pF}%`; tf.style.color = colF; }
      const fb = $("#fixBtn");
      if (fb) fb.disabled = !(isTuned(cur) && !cur.fixed);
    }
  };
  if (knP) knP.oninput = e => {
    knobP = +e.target.value;
    const vp = $("#valP");
    if (vp) vp.textContent = knobP;
    if (R) R.retunes++;
    if (cur) {
      const pP = proxPct(knobP, cur.tgP);
      const colP = pP >= 88 ? "#4ade80" : pP >= 55 ? "#eab308" : "#ef4444";
      const bp = $("#barP"), tp = $("#txtP");
      if (bp) { bp.style.width = `${pP}%`; bp.style.background = colP; }
      if (tp) { tp.textContent = `${pP}%`; tp.style.color = colP; }
      const fb = $("#fixBtn");
      if (fb) fb.disabled = !(isTuned(cur) && !cur.fixed);
    }
  };

  on("#playAu", () => {
    if (!cur) return;
    if (activeVoice) { stopVoice(); render(); return; }
    if (en < 2) { if (R) R.invalid++; return msg("[ERR] Energia insuficiente (2 PWR)", 0); }
    en -= 2;
    if (R) R.repeats++;
    playSignalAudio(cur);
    syncLiveTelemetry(false, false);
    updTop();
    render();
  });

  on("#fixBtn", () => {
    if (!cur || !isTuned(cur)) return;
    cur.fixed = true;
    beep(620, 0.08);

    if (cur.anom) {
      if (!discoveredAnomalies.some(a => a.anomType === cur.anomType)) {
        discoveredAnomalies.push({
          anomTitle: cur.anomTitle,
          anomType: cur.anomType,
          modelId: cur.modelId,
          img: cur.img,
          seed: cur.seed,
          anom: true,
          textData: cur.textData
        });
      }
      onFirstAnomalyDiscovered();
    }

    syncLiveTelemetry(false, true);
    render();
  });

  on("#dropBtn", () => {
    if (!cur) return;
    stopVoice();
    cur.st = "gone";
    cur = null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    ensureSectorDiversity();
    msg("Trama descartada", 1);
    render();
  });

  w.querySelectorAll("[data-k]").forEach(el => el.onclick = () => {
    choiceCat = +el.dataset.k;
    choiceMod = null;
    beep(440, 0.04);
    render();
  });

  w.querySelectorAll("[data-mod]").forEach(el => el.onclick = () => {
    choiceMod = el.dataset.mod;
    beep(490, 0.04);
    render();
  });

  on("#queueBtn", () => {
    if (!cur || choiceCat === null) return;
    if (isSubcatEnabled() && choiceMod === null) return;
    stopVoice();
    const pkgId = uid();
    outbox.push({
      id: pkgId,
      sigId: cur.id,
      trueCat: cur.cat,
      trueMod: cur.modelId,
      anom: cur.anom,
      anomTitle: cur.anomTitle,
      chosenCat: choiceCat,
      chosenMod: choiceMod
    });
    selPkgId = pkgId;
    cur.st = "gone";
    cur = null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    ensureSectorDiversity();
    beep(560, 0.1);
    msg("[OK] Paquete enviado a Plataforma de Envio", 1);
    V = "plat";
    render();
  });

  w.querySelectorAll("[data-pkg]").forEach(el => el.onclick = () => {
    selPkgId = el.dataset.pkg;
    render();
  });

  w.querySelectorAll("[data-send-as]").forEach(el => el.onclick = () => {
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox.splice(pkgIdx, 1)[0];
    selPkgId = outbox[0]?.id || null;
    beep(540, 0.1);
    msg("[OK] Paquete despachado a asignacion", 1);
    pendingEvals.push({
      at: performance.now() + 1800,
      pkg,
      targetType: "assign",
      assignId: el.dataset.sendAs
    });
    render();
  });

  on("#sendCentralBtn", () => {
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox.splice(pkgIdx, 1)[0];
    selPkgId = outbox[0]?.id || null;
    beep(540, 0.1);
    msg("[OK] Paquete despachado a Archivo Central", 1);
    pendingEvals.push({
      at: performance.now() + 1800,
      pkg,
      targetType: "central"
    });
    render();
  });

  on("#sendShadowBtn", () => {
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox.splice(pkgIdx, 1)[0];
    selPkgId = outbox[0]?.id || null;
    beep(620, 0.12);
    msg("[OK] Paquete enviado por Canal Cifrado", 1);
    pendingEvals.push({
      at: performance.now() + 1800,
      pkg,
      targetType: "shadow"
    });
    render();
  });

  w.querySelectorAll("[data-atlas-au]").forEach(el => el.onclick = () => {
    playSignalAudio({modelId: el.dataset.atlasAu, anom: false, anomType: ""});
  });

  w.querySelectorAll("[data-anom-au]").forEach(el => el.onclick = () => {
    const item = discoveredAnomalies[+el.dataset.anomAu];
    if (item) playSignalAudio(item);
  });

  on("#saveSatBtn", () => {
    if (!cur || cur.cat !== 3 || cur.anom) return;
    savedSatLog = cur.textData;
    beep(600, 0.08);
    msg("[OK] Telemetria satelital guardada", 1);
  });

  w.querySelectorAll("[data-b]").forEach(el => el.onclick = () => {
    if (!srv) return;
    const idx = +el.dataset.b;
    if (srv.latched[idx]) return;
    const expected = srv.seq[srv.step];
    if (idx === expected) {
      srv.latched[idx] = true;
      srv.step++;
      en = Math.max(0, en - 1);
      beep(440 + srv.step * 90, 0.09);
      if (srv.step >= srv.seq.length) {
        if (R) R.fix += +((performance.now() - srv.t) / 1000).toFixed(1);
        srv = null;
        msg("[OK] Servidor restablecido", 1);
        syncLiveTelemetry(false, true);
      }
      render();
    } else {
      srv.step = 0;
      srv.latched = Array(srv.count).fill(false);
      beep(150, 0.16, "sawtooth");
      msg("[ERR] Secuencia de reles reiniciada", 0);
      render();
    }
  });

  w.querySelectorAll("[data-u]").forEach(el => el.onclick = () => {
    const k = el.dataset.u;
    if (G[k] >= 5) return;
    const costs = {
      a: 85 + 55 * G.a,
      f: 80 + 50 * G.f,
      b: 75 + 45 * G.b,
      spec: 65 + 40 * G.spec
    };
    const cost = costs[k];
    if (G.money < cost) return;
    G.money -= cost;
    G[k]++;
    if (k === "b") { cap = 100 + 20 * G.b; en = Math.min(cap, en + 20); }
    beep(660, 0.1);
    msg(`[OK] Mejora instalada (NV ${G[k]}/5)`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    render();
  });

  on("#buyCellBtn", () => {
    if (G.money < 30 || en >= cap) return;
    G.money -= 30;
    en = Math.min(cap, en + 45);
    beep(680, 0.1);
    msg("[OK] Celda auxiliar conectada (+45 PWR)", 1);
    updTop();
    render();
  });

  on("#rsBtn", () => { V = "intro"; updTop(); render(); });
}

function bootTerminal() {
  try {
    preloadAllSprites();
    render();
    updTop();
    requestAnimationFrame(loop);
  } catch (err) {
    const w = document.querySelector("#win");
    if (w) {
      w.innerHTML = `<div class="card dangerbox"><b>ERROR DE INICIALIZACION</b><pre style="white-space:pre-wrap;font-size:12px">${err && err.stack ? err.stack : err}</pre></div>`;
    }
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootTerminal);
} else {
  bootTerminal();
}
</script>
</body>
</html>
