            </div>
          </div>
        ` : ""}
        <div class="map-hud-bar">
          <span class="mut">${
            isBufferFullForLock() && !busySig
              ? `Memoria llena (${getStoredMemoryCount()}/${hasFloppyDisk ? getMemoryCapacity() + MAX_FLOPPY_ANOMALIES : getMemoryCapacity()}): envia en Plataforma o descarta en Procesador.`
              : busySig
                ? `Antenas ocupadas rastreando señal #${busySig.id} (${busySig.st === "align" ? "alineando" : "descargando"})... [MEM ${getStoredMemoryCount()}/${hasFloppyDisk ? getMemoryCapacity() + MAX_FLOPPY_ANOMALIES : getMemoryCapacity()}]`
                : sigs.filter(s => s.st === "echo").length === 0 && areNightAssignmentsCataloged() && nightTotalSpawned >= getNightSignalLimit()
                  ? "No quedan mas señales en el sector durante esta noche."
                  : `Antenas libres (-${ECHO_LOCK_COST} PWR por fijacion de eco) · Memoria: ${hasFloppyDisk ? `${getNormalStoredCount()}/${getMemoryCapacity()} + ${getAnomalyBufferCount()}/${MAX_FLOPPY_ANOMALIES} ANOM` : `${getStoredMemoryCount()}/${getMemoryCapacity()}`}.`
          }</span>
          <button class="alt" id="rd">Pulso Radar (-6 PWR · CD 5s)</button>
        </div>
      </div>`;
  } else if (V === "proc") {
    const ready = sigs.filter(s => s.st === "raw");
    if (cur && !ready.includes(cur)) cur = null;
    if (!cur && ready[0]) { cur = ready[0]; knobF = 50; knobP = 50; choiceCat = null; choiceMod = null; }

    h = `<div class="proc-shell">
      <div class="proc-buffer-bar">
        <span class="mut" style="font-size:12px">MEMORIA (${getStoredMemoryCount()}/${getMemoryCapacity()}) · BUFFER:</span>

    if (cur) {
      const tuned = isTuned(cur);
      const optFail = isOpticalFailed();
      const visualCorrupt = Boolean(cur.isCorruptSignal);
      const crtBlocked = optFail || visualCorrupt;
      const specEnabled = isSpectrogramEnabled();
      const [rw, rh] = CRT_RES[Math.min(5, G.f)];
      const pF = proxPct(knobF, cur.tgF);
      const pP = proxPct(knobP, cur.tgP);
      const colF = pF >= 88 ? "#15803d" : pF >= 55 ? "#b45309" : "#b91c1c";
      const colP = pP >= 88 ? "#15803d" : pP >= 55 ? "#b45309" : "#b91c1c";

      const needSub = isSubcatEnabled();
      const availCats = getAvailableCategories();
      const catModels = choiceCat !== null ? MODELS.filter(m => m.cat === choiceCat && (m.minShift || 0) <= shift) : [];
      const canQueue = choiceCat !== null && (!needSub || choiceMod !== null);

      const crtFooterMsg = optFail
        ? "[ERROR OPTICO // MONITOR AVERIADO]"
        : visualCorrupt
          ? "[ARCHIVO VISUAL DAÑADO // USAR ESPECTROGRAMA]"
          : `CRT ${rw}x${rh}px // FILTRO NV.${G.f}/5`;

      h += `
        <div class="proc-grid">
          <div class="proc-monitors ${specEnabled ? "dual" : ""}">
            <div class="crt-wrap ${crtBlocked ? "opt-fail" : ""}">
              <div class="monitor-head">
                <span>MONITOR</span>
                <span class="mut">${cur.fixed ? "[CAPTURA FIJADA]" : "SIN FIJAR"}</span>
              </div>
              <div class="crt-stage">
                <canvas id="crt" width="${rw}" height="${rh}"></canvas>
              </div>
              <div class="monitor-foot">
                <span class="mut">#${cur.id}</span>

            </div>

            ${specEnabled ? `
              <div class="crt-wrap">
                <div class="monitor-head">

          <div class="proc-side">
            <div class="card">
              <div class="proc-sec-head">
                <span>SINTONIZACION DE SEÑAL</span>
                <span class="mut">${cur.fixed ? "FIJADA" : tuned ? "LISTA" : "AJUSTANDO"}</span>
              </div>

              <div class="tuner-box">
                <div class="tuner-row">

                  <span class="mut" style="width:74px">PROXIMIDAD</span>

                <div class="prox-wrap">
                  <span class="mut" style="width:74px">PROXIMIDAD</span>

        ${hasFloppyDisk ? `

            <button class="shadow" id="saveFloppyPlatBtn" ${!selPkg || !selPkg.anom || floppyStoredAnomalies.length >= MAX_FLOPPY_ANOMALIES ? "disabled" : ""}>Guardar en Disco Floppy</button>

  } else if (V === "atlas") {
    const specAvail = isSpectrogramEnabled();
    const visibleModels = isFreeMode ? MODELS : MODELS.filter(m => (m.minShift || 0) <= shift || discoveredModels.has(m.id));
    h = `
      <div class="card">
        <b>ATLAS DE CUERPOS CELESTES (${discoveredModels.size}/${visibleModels.length} DESCUBIERTOS)</b>

            if (!unlocked) {
              return `<div class="atlas-card locked">

                <div class="mut" style="font-size:11px">Verifica esta señal en Central para desbloquear su registro visual y sonoro.</div>
              </div>`;
            }
            const showSpec = specAvail && atlasSpecMode.has(m.id);
            return `<div class="atlas-card">
              <div class="between">
                <span class="mut" style="font-size:11px;font-weight:700">${CLASSES[m.cat].toUpperCase()}</span>
                <div class="row" style="margin:0;gap:4px">
                  ${specAvail ? `<button class="alt" style="padding:2px 7px;font-size:11px" data-atlas-view="${m.id}">${showSpec ? "Imagen" : "Espectrograma"}</button>` : ""}
                  <button class="alt" style="padding:2px 7px;font-size:11px" data-atlas-au="${m.id}">Audio</button>

              </div>

              ${showSpec
                ? `<canvas class="atlas-cv spec-mode" width="260" height="110" data-atlas-spec="${m.id}"></canvas>`
                : `<canvas class="atlas-cv" width="96" height="58" data-atlas-mid="${m.id}"></canvas>`}

    if (discoveredAnomalies.length > 0) {
      h += `
        <div class="paper-sheet">
          <h3>ANOMALÍAS</h3>
          <div class="paper-grid">
            ${discoveredAnomalies.map((a, idx) => {
              const anomKey = `anom_${a.anomType}`;
              const showSpec = specAvail && atlasSpecMode.has(anomKey);
              return `
                <div class="paper-entry">
                  <div class="between">
                    <b>${a.anomTitle}${floppyStoredAnomalies.some(f => f.anomType === a.anomType) ? " [FLOPPY]" : ""}</b>
                    <div class="row" style="margin:0;gap:4px">
                      ${specAvail ? `<button class="paper-btn" data-anom-view="${idx}">${showSpec ? "Imagen" : "Espectrograma"}</button>` : ""}
                      <button class="paper-btn" data-anom-au="${idx}">Audio</button>
                    </div>
                  </div>
                  ${showSpec
                    ? `<canvas class="paper-cv spec-mode" width="260" height="110" data-anom-spec="${idx}"></canvas>`
                    : `<canvas class="paper-cv" width="96" height="58" data-anom-idx="${idx}"></canvas>`}
                  <div class="paper-bin">${a.textData}</div>

          </div>

    }
  } else if (V === "srv") {
    h = srv ? `
      <div class="card">
        <b>ENLACE DE RELES INTERRUMPIDO (${srv.count} MODULOS)</b>
        <p class="mut">Activa los ${srv.count} reles en el orden correcto de sincronizacion (avance: ${srv.step}/${srv.count}).</p>
        <div class="grid">
          ${Array.from({length: srv.count}, (_, i) => {
            const on = srv.latched[i];
            return `<button class="${on ? "" : "alt"}" data-b="${i}">RELE 0${i + 1}</button>`;
          }).join("")}
        </div>
      </div>` : `<div class="card"><b>SERVIDOR EN LINEA</b><p class="mut">Sin incidencias.</p></div>`;
  } else if (V === "shop") {
    const upgrades = [
      ["ant2", "Segunda Antena", "Permite mantener dos señales en alineación/descarga simultáneamente. Disponible desde Noche 15.", 1, 180 + 0, shift >= 14],
      ["mem", "Aumento de Memoria", "Añade un espacio de señal al buffer por nivel (hasta 10 señales).", 5, 45 + 25 * G.mem, true],
      ["st", "Estabilizador de Servidor", "Reduce la frecuencia de fallos del servidor. Disponible desde Noche 1.", 16, 10 + 2 * G.st, true],
      ["align", "Velocidad de Alineación", "Reduce el tiempo necesario para orientar las antenas.", 16, 20 + 4 * G.align, true],
      ["download", "Velocidad de Descarga", "Reduce el tiempo necesario para descargar cada señal.", 16, 20 + 4 * G.download, true],
      ["f", "Filtro CRT Óptico", "Aumenta la resolución del CRT y reduce la estática.", 5, 60 + 40 * G.f, true],
      ["b", "Banco de Baterías", "Aumenta la capacidad máxima de PWR (+20 por nivel).", 5, 75 + 45 * G.b, true]
    ];
    h = upgrades.map(([k, name, desc, maxLv, cost, unlocked]) => {

      return `<div class="card between">
        <div>
          <b>${name}</b> <span class="mut">[NV ${lv}/${maxLv}]</span>
          <div class="mut" style="font-size:12px">${desc}</div>

        <button data-u="${k}" ${!unlocked || lv >= maxLv || G.money < cost ? "disabled" : ""}>${!unlocked ? "DISPONIBLE NOCHE 15" : lv >= maxLv ? "MAXIMO" : `$${cost} CR`}</button>

function bindEvents(w) {
  const on = (sel, fn) => { const el = w.querySelector(sel); if (el) el.onclick = fn; };

  const bootEl = w.querySelector("#bootScreen");
  if (bootEl) {
    bootEl.onclick = () => {
      if (playStartupSound(false)) {
        const hint = w.querySelector("#bootAudioHint");
        if (hint) hint.style.display = "none";
      }
    };
  }

  const pn = w.querySelector("#playerName");
  const apn = w.querySelector("#adminPlayerName");
  const sn = w.querySelector("#startNight");

  if (sn) {
    sn.onchange = e => { selectedStartNight = +e.target.value; };
  }

  if (pn) {
    pn.oninput = e => { playerNameInput = e.target.value; };
    pn.onkeydown = e => {
      if (e.key === "Enter") {
        beep(520, 0.1);
        adminModalOpen = false;
        start(pn.value, 0, false);
      }
    };
    pn.onfocus = () => {
      if (bootLoginChimePending && !bootSoundPlayed) {
        playStartupSound(false);
      }
    };
    if (!adminModalOpen) {
      setTimeout(() => pn.focus(), 30);
    }
  }

  if (apn) {
    apn.oninput = e => {
      playerNameInput = e.target.value;
      if (pn) pn.value = playerNameInput;
    };
    apn.onkeydown = e => {
      if (e.key === "Enter") {
        const nightVal = sn ? +sn.value : selectedStartNight;
        beep(620, 0.12);
        adminModalOpen = false;
        start(apn.value, nightVal, true);
      } else if (e.key === "Escape") {
        adminModalOpen = false;
        render();
      }
    };
    setTimeout(() => apn.focus(), 30);
  }

  on("#go", () => {
    const val = w.querySelector("#playerName")?.value || playerNameInput;
    if (bootLoginChimePending && !bootSoundPlayed) {
      playStartupSound(false);
    } else {
      beep(520, 0.1);
    }
    adminModalOpen = false;
    start(val, 0, false);
  });

  on("#bearAlertBtn", () => {
    if (bootLoginChimePending && !bootSoundPlayed) {
      playStartupSound(false);
    } else {
      beep(523.25, 0.08, "triangle", 0.06);

    cv.onpointerdown = e => {
      moved = 0;
      drag = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y};
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    };
    cv.onpointermove = e => {
      if (!drag) return;
      const r = cv.getBoundingClientRect();
      const vw = cv.clientWidth || r.width || 640;
      const vh = cv.clientHeight || r.height || 310;
      const dx = (e.clientX - drag.x) * vw / (r.width || vw);
      const dy = (e.clientY - drag.y) * vh / (r.height || vh);
      if (Math.hypot(dx, dy) > 6) moved = 1;
      if (moved) {
        cam.x = Math.max(0, Math.min(Math.max(0, W - vw), drag.cx - dx));
        cam.y = Math.max(0, Math.min(Math.max(0, H - vh), drag.cy - dy));
      }
    };
    cv.onpointerup = cv.onpointercancel = () => { drag = null; };
    cv.onclick = e => {
      if (moved) return;
      if (TUT && !tutGate("map_pick", "Aún no: termina de escucharme y luego selecciona el eco.")) return;
      markFirst();
      const r = cv.getBoundingClientRect();
      const vw = cv.clientWidth || r.width || 640;
      const vh = cv.clientHeight || r.height || 310;
      const x = (e.clientX - r.left) * vw / (r.width || vw) + cam.x;
      const y = (e.clientY - r.top) * vh / (r.height || vh) + cam.y;
      const hit = sigs.find(s => (s.st === "echo" || s.st === "align" || s.st === "dl") && Math.hypot(s.x - x, s.y - y) < 34);
      if (!hit) { if (R) R.invalid++; syncLiveTelemetry(false, false); return; }

      if (hit.st === "echo") {
        const activeAntennaSignals = sigs.filter(s => s.st === "align" || s.st === "dl");
        const busySig = activeAntennaSignals[0];
        if (activeAntennaSignals.length >= getAntennaSlots()) {
          if (pendingOverrideSig && pendingOverrideSig.id === hit.id) {
            if (en < ECHO_LOCK_COST) { beep(180, 0.15, "sawtooth"); return msg(`[ERR] Energia insuficiente (${ECHO_LOCK_COST} PWR)`, 0); }
            busySig.st = "gone";
            pendingOverrideSig = null;
            en -= ECHO_LOCK_COST;
            hit.st = "align";
            ensureSectorDiversity();
            beep(340, 0.12, "triangle");
            msg(`[OK] Busqueda anterior cancelada // Rastreando #${hit.id}`, 1);
            updTop();
            render();
            return;
          }
          pendingOverrideSig = hit;
          beep(220, 0.1, "sawtooth");
          msg(`[AVISO] Antenas ocupadas con #${busySig.id}. Insiste para cancelar y cambiar.`, 0);
          render();
          return;
        }

        if (!canAcceptSignalInBuffer(hit.anom)) {
          if (R) R.invalid++;
          beep(180, 0.15, "sawtooth");
          const maxCap = hasFloppyDisk ? (getMemoryCapacity() + MAX_FLOPPY_ANOMALIES) : getMemoryCapacity();
          return msg(`[ERR] Memoria llena (${getStoredMemoryCount()}/${maxCap}) // Envia, guarda en Floppy o descarta señales antes de capturar mas`, 0);
        }
        if (en < ECHO_LOCK_COST) { if (R) R.invalid++; beep(180, 0.15, "sawtooth"); return msg(`[ERR] Energia insuficiente (${ECHO_LOCK_COST} PWR)`, 0); }
        en -= ECHO_LOCK_COST;
        hit.st = "align";
        pendingOverrideSig = null;
        beep(320, 0.12, "triangle");
        syncLiveTelemetry(false, true);
        updTop();
        render();
      }
    };
  }

function ensureTutDock() {
  let dock = document.querySelector("#tutDock");
  if (dock) return dock;
  dock = document.createElement("div");
  dock.id = "tutDock";
  dock.className = "tut-dock";
  dock.style.display = "none";
  dock.setAttribute("aria-label", "Asistente del tutorial");
  dock.innerHTML = `
    <div class="xp-balloon" role="dialog" aria-label="Tutorial de Snøskred">
      <div class="xp-balloon-head">
        <span>Snøskred el Oso</span>
        <span id="tutStepLbl">[TUTORIAL]</span>
      </div>
      <div class="xp-balloon-msg" id="tutMsg"></div>
      <div class="xp-balloon-opts">
        <div class="tut-wait" id="tutWait">Realiza la acción indicada para continuar.</div>
        <button type="button" class="xp-opt-btn" id="tutNextBtn">
          <span class="xp-opt-bullet">&#9656;</span><span id="tutNextLbl">Siguiente</span>
        </button>
        <button type="button" class="xp-opt-btn tut-skip" id="tutExitBtn">
          <span class="xp-opt-bullet">&times;</span><span>Salir del tutorial</span>
        </button>
      </div>
    </div>
    <img id="tutBear" class="tut-bear" alt="Snøskred, asistente del tutorial" src="${TUT_IMG.presentando_1}">
  `;
  document.body.appendChild(dock);

  dock.querySelector("#tutNextBtn").onclick = () => tutNext();
  dock.querySelector("#tutExitBtn").onclick = () => {
    if (isTransitioningNight) return;
    tutEnd(false);
  };

  // Arrastrar el asistente desde su globo para que no tape la interfaz
  const head = dock.querySelector(".xp-balloon-head");
  let drag = null;
  head.addEventListener("pointerdown", e => {
    const r = dock.getBoundingClientRect();
    drag = {dx: e.clientX - r.left, dy: e.clientY - r.top};
    dock.style.left = r.left + "px";
    dock.style.top = r.top + "px";
    dock.style.right = "auto";
    dock.style.bottom = "auto";
    dock.classList.add("dragging");
    document.body.classList.remove("tut-side"); // al moverlo, vuelve a flotar libremente
    try { head.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  head.addEventListener("pointermove", e => {
    if (!drag) return;
    const r = dock.getBoundingClientRect();
    dock.style.left = Math.max(0, Math.min(window.innerWidth - r.width, e.clientX - drag.dx)) + "px";
    dock.style.top = Math.max(0, Math.min(window.innerHeight - r.height, e.clientY - drag.dy)) + "px";
  });
  const endDrag = () => { drag = null; dock.classList.remove("dragging"); };
  head.addEventListener("pointerup", endDrag);
  head.addEventListener("pointercancel", endDrag);
  return dock;
}

function tutRenderDock() {
  if (!TUT) return;
  const st = tutStep();
  const lbl = document.querySelector("#tutStepLbl");
  const msgEl = document.querySelector("#tutMsg");
  const nextBtn = document.querySelector("#tutNextBtn");
  const nextLbl = document.querySelector("#tutNextLbl");
  const wait = document.querySelector("#tutWait");
  if (lbl) lbl.textContent = `[PASO ${TUT.i + 1}/${TUT_STEPS.length}]`;
  if (msgEl) msgEl.textContent = TUT.text.slice(0, Math.floor(TUT.typed));
  if (nextBtn) nextBtn.style.display = st.btn ? "flex" : "none";
  if (nextLbl && st.btn) nextLbl.textContent = st.btn;
  if (wait) wait.style.display = st.btn ? "none" : "block";
}

function tutHop() {
  const img = document.querySelector("#tutBear");
  if (!img) return;
  img.classList.remove("hop");
  void img.offsetWidth;
  img.classList.add("hop");
}

function tutGo(i) {
  if (!TUT || i >= TUT_STEPS.length) return;
  const st = TUT_STEPS[i];
  TUT.i = i;
  TUT.pose = st.pose;
  TUT.text = typeof st.text === "function" ? st.text() : st.text;
  TUT.typed = 0;
  TUT.talkStep = 0;
  TUT.frame = "";
  if (st.enter) st.enter();
  // Texto dependiente del estado (p. ej. créditos) se recalcula tras el enter
  if (typeof st.text === "function") TUT.text = st.text();
  tutRenderDock();
  tutHop();
  beep(523.25, 0.06, "triangle", 0.04);
  tutSync();
}

function tutNext() {
  if (!TUT) return;
  const st = tutStep();
  if (TUT.typed < TUT.text.length) {
    TUT.typed = TUT.text.length;
    tutRenderDock();
    return;
  }
  if (!st.btn) return;
  if (st.onNext) st.onNext();
  tutGo(TUT.i + 1);
}

// Permite una acción solo en ciertos pasos; si no, el oso "sacude la cabeza"
function tutGate(ids, hint) {
  if (!TUT) return true;
  const list = Array.isArray(ids) ? ids : [ids];
  if (list.includes(tutStep().id)) return true;
  tutNudge(hint);
  return false;
}

function tutNudge(text) {
  if (!TUT) return;
  beep(180, 0.1, "sawtooth", 0.04);
  msg(`[TUTORIAL] ${text || "Todavía no: sigue las indicaciones de Snøskred."}`, 0);
  const dock = document.querySelector("#tutDock");
  if (dock) {
    dock.classList.remove("shake");
    void dock.offsetWidth;
    dock.classList.add("shake");
  }
}

function tutAllowTab(tab) {
  const st = tutStep();
  const allow = st.allowTab || [st.view];
  return allow.includes(tab);
}

function tutSync() {
  const key = TUT ? tutHlKey() : null;
  const sel = key ? TUT_HL[key] : null;
  document.querySelectorAll(".tut-hl").forEach(el => {
    if (!sel || !el.matches(sel)) el.classList.remove("tut-hl");
  });
  if (sel) document.querySelectorAll(sel).forEach(el => el.classList.add("tut-hl"));
}

function tutPlaceStar() {
  const s = TUT && TUT.sig;
  if (!s) return;
  const cv = document.querySelector("#cv");
  const vw = (cv && cv.clientWidth) || 640;
  const vh = (cv && cv.clientHeight) || 320;
  s.x = cam.x + vw * 0.64;
  s.y = cam.y + vh * 0.42;
}

function tutUpdate(dt) {
  if (!TUT) return;
  const st = tutStep();

  // Texto tipo máquina de escribir
  if (TUT.typed < TUT.text.length) {
    TUT.typed = Math.min(TUT.text.length, TUT.typed + dt * 64);
    const el = document.querySelector("#tutMsg");
    if (el) el.textContent = TUT.text.slice(0, Math.floor(TUT.typed));
  }

  // Animación del oso: boca abierta/cerrada mientras habla, parpadeo en reposo
  const pose = TUT_POSES[TUT.pose] || TUT_POSES.read;
  const talking = TUT.typed < TUT.text.length;
  TUT.clock += dt;
  let key;
  if (talking) {
    TUT.talkStep += dt;
    const ph = Math.floor(TUT.talkStep / 0.12);
    const n = Math.floor(ph / 2);
    key = ph % 2 === 0 ? pose.open[n % pose.open.length] : pose.closed[n % pose.closed.length];
  } else {
    if (TUT.clock >= TUT.nextBlink) {
      TUT.blinkEnd = TUT.clock + 0.16;
      TUT.nextBlink = TUT.clock + 3.0 + Math.random() * 2.4;
    }
    key = TUT.clock < TUT.blinkEnd ? pose.blink : pose.closed[0];
  }
  if (key !== TUT.frame) {
    TUT.frame = key;
    const img = document.querySelector("#tutBear");
    if (img && TUT_IMG[key]) img.src = TUT_IMG[key];
  }

  // Resaltado de elementos (se reaplica por si la interfaz se redibujó)
  TUT.hlClock += dt;
  if (TUT.hlClock >= 0.2) { TUT.hlClock = 0; tutSync(); }

  // Avance automático cuando el jugador completa la acción pedida
  if (st.done && st.done()) tutGo(TUT.i + 1);
}

// Cierre de sesión del tutorial: fundido y fin del tutorial
function tutLogoutFade() {
  if (isTransitioningNight) return;
  isTransitioningNight = true;
  stopVoice();
  beep(420, 0.14, "sine", 0.06);
  const overlay = document.querySelector("#nightFadeOverlay");
  const textEl = document.querySelector("#nightFadeText");
  if (textEl) {
    textEl.classList.remove("visible");
    textEl.textContent = "Fin del tutorial";
  }
  if (overlay) overlay.classList.add("active");
  setTimeout(() => {
    if (textEl) textEl.classList.add("visible");
    setTimeout(() => {
      if (textEl) textEl.classList.remove("visible");
      setTimeout(() => {
        tutEnd(true);
        setTimeout(() => {
          if (overlay) overlay.classList.remove("active");
          isTransitioningNight = false;
        }, 160);
      }, 600);
    }, 1350);
  }, 700);
}

    try { head.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  head.addEventListener("pointermove", e => {

    dock.style.left = Math.max(0, Math.min(window.innerWidth - r.width, e.clientX - drag.dx)) + "px";
    dock.style.top = Math.max(0, Math.min(window.innerHeight - r.height, e.clientY - drag.dy)) + "px";

  return dock;

function asstHelpUpdate(dt) {
  if (!ASST_HELP) return;
  if (V === "boot" || V === "intro" || V === "end") {
    closeAssistantHelp();
    return;
  }

  if (ASST_HELP.typed < ASST_HELP.text.length) {
    ASST_HELP.typed = Math.min(ASST_HELP.text.length, ASST_HELP.typed + dt * 64);
    const el = document.querySelector("#asstHelpMsg");
    if (el) el.textContent = ASST_HELP.text.slice(0, Math.floor(ASST_HELP.typed));
  }

  const pose = TUT_POSES[ASST_HELP.pose] || TUT_POSES.read;
  const talking = ASST_HELP.typed < ASST_HELP.text.length;
  ASST_HELP.clock += dt;
  let key;
  if (talking) {
    ASST_HELP.talkStep += dt;
    const ph = Math.floor(ASST_HELP.talkStep / 0.12);
    const n = Math.floor(ph / 2);
    key = ph % 2 === 0 ? pose.open[n % pose.open.length] : pose.closed[n % pose.closed.length];
  } else {
    if (ASST_HELP.clock >= ASST_HELP.nextBlink) {
      ASST_HELP.blinkEnd = ASST_HELP.clock + 0.16;
      ASST_HELP.nextBlink = ASST_HELP.clock + 3.0 + Math.random() * 2.4;
    }
    key = ASST_HELP.clock < ASST_HELP.blinkEnd ? pose.blink : pose.closed[0];
  }
  if (key !== ASST_HELP.frame) {
    ASST_HELP.frame = key;
    const img = document.querySelector("#asstHelpBear");
    if (img && TUT_IMG[key]) img.src = TUT_IMG[key];
  }
}

function readSaveStore() {
  try {
    const raw = localStorage.getItem(SAVE_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        memorySaveStore = parsed;
        return parsed;
      }
    }
  } catch (_) {}
  return memorySaveStore || {};
}

function writeSaveStore(store) {
  memorySaveStore = store;
  try {
    localStorage.setItem(SAVE_STORAGE_KEY, JSON.stringify(store));
    return true;
  } catch (_) {
    return false;
  }
}

function buildSaveRecord(slotId, state) {
  const def = SAVE_SLOT_DEFS.find(d => d.id === slotId) || { id: slotId, label: slotId };
  const now = new Date();
  return {
    version: 1,
    slotId: def.id,
    slotLabel: def.label,
    savedAt: formatLocalDateTime(now),
    savedAtISO: now.toISOString(),
    summary: {
      playerName: state.S.playerName || "Operador",
      night: (Number(state.shift) || 0) + 1,
      totalNights: TOTAL_NIGHTS,
      freeMode: Boolean(state.isFreeMode),
      money: Number(state.G.money) || 0,
      upgrades: `ANT ${state.G.a || 0} · CRT ${state.G.f || 0} · BAT ${state.G.b || 0}`,
      atlasCount: Array.isArray(state.discoveredModels) ? state.discoveredModels.length : 0,
      atlasTotal: MODELS.length,
      anomCount: Array.isArray(state.discoveredAnomalies) ? state.discoveredAnomalies.length : 0,
      hasFloppyDisk: Boolean(state.hasFloppyDisk)
    },
    state
  };
}

function saveToSlot(slotId, silent = false) {
  const state = captureGameState();
  if (!state) return false;
  const store = readSaveStore();
  const record = buildSaveRecord(slotId, state);
  store[slotId] = record;
  const persisted = writeSaveStore(store);

  if (!silent) {
    beep(640, 0.1);
    msg(
      persisted
        ? `[OK] Partida guardada en ${record.slotLabel}`
        : `[AVISO] Guardado en memoria temporal (${record.slotLabel})`,
      1
    );
    if (saveModalOpen) renderSaveModal();
  }
  return true;
}

function autoSaveGame() {
  if (TUT || isTransitioningNight) return false;
  if (!G || !S || S.tutorial) return false;
  if (V === "boot" || V === "intro" || V === "end") return false;
  return saveToSlot("auto", true);
}

function loadFromSlot(slotId) {
  const store = readSaveStore();
  const record = store[slotId];
  if (!record || !record.state) {
    beep(180, 0.12, "sawtooth");
    return msg("[ERR] La ranura seleccionada está vacía", 0);
  }
  closeSaveModal();
  if (restoreGameState(record.state)) {
    beep(580, 0.11);
    msg(`[OK] Partida cargada · ${record.summary.playerName} (${shiftLabel(shift)})`, 1);
  }
}

function deleteSaveSlot(slotId) {
  const store = readSaveStore();
  delete store[slotId];
  writeSaveStore(store);
  saveDeleteConfirmId = null;
  beep(320, 0.08);
  if (saveModalOpen) renderSaveModal();
  if (V === "intro") render();
}

function exportSaveRecordToFile(record) {
  if (!record || !record.state) return;
  try {
    const safeName = String(record.summary?.playerName || "operador")
      .replace(/[^a-zA-Z0-9_-]+/g, "_")
      .slice(0, 24);
    const nightNum = record.summary?.night || 1;
    const filename = `erial7_${safeName}_N${nightNum}.json`;
    const blob = new Blob([JSON.stringify(record, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    beep(620, 0.09);
    msg(`[OK] Archivo exportado: ${filename}`, 1);
  } catch (_) {
    msg("[ERR] No se pudo exportar el archivo de guardado", 0);
  }
}

function importSaveFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || ""));
      const state = parsed && parsed.state ? parsed.state : parsed;
      if (!state || !state.S || !state.G) {
        beep(180, 0.14, "sawtooth");
        return msg("[ERR] El archivo JSON no corresponde a una partida válida", 0);
      }
      const store = readSaveStore();
      store.auto = buildSaveRecord("auto", state);
      writeSaveStore(store);
      closeSaveModal();
      if (restoreGameState(state)) {
        beep(640, 0.12);
        msg(`[OK] Guardado importado · ${S.playerName} (${shiftLabel(shift)})`, 1);
      }
    } catch (_) {
      beep(180, 0.14, "sawtooth");
      msg("[ERR] Error al leer el archivo de guardado", 0);
    }
  };
  reader.readAsText(file);
}

function ensureSaveModalRoot() {
  let root = document.querySelector("#saveModalRoot");
  if (root) return root;
  root = document.createElement("div");
  root.id = "saveModalRoot";
  document.body.appendChild(root);
  return root;
}

function openSaveModal() {
  saveModalOpen = true;
  saveDeleteConfirmId = null;
  renderSaveModal();
}

function closeSaveModal() {
  saveModalOpen = false;
  saveDeleteConfirmId = null;
  const root = document.querySelector("#saveModalRoot");
  if (root) root.innerHTML = "";
}

function renderSaveModal() {
  const root = ensureSaveModalRoot();
  if (!saveModalOpen) {
    root.innerHTML = "";
    return;
  }

  const inActiveSession = Boolean(G && S && !S.tutorial && V !== "boot" && V !== "intro" && V !== "end");
  const store = readSaveStore();

  const slotsHtml = SAVE_SLOT_DEFS.map(def => {
    const rec = store[def.id] && store[def.id].state ? store[def.id] : null;
    const sum = rec ? rec.summary : null;
    const isConfirmDel = saveDeleteConfirmId === def.id;

    return `
      <div class="card save-slot-card ${def.isAuto ? "auto-slot" : ""}">
        <div class="save-slot-head">
          <div>
            <b>${def.label.toUpperCase()}</b>
            ${rec ? `<span class="mut" style="font-size:11px;margin-left:6px">${rec.savedAt}</span>` : `<span class="mut" style="font-size:11px;margin-left:6px">[VACÍA]</span>`}
          </div>
          ${sum ? `<span class="pill ${sum.night >= 9 ? "night" : ""}">${sum.freeMode ? `MODO LIBRE · N${sum.night}` : `NOCHE ${sum.night}/${sum.totalNights || TOTAL_NIGHTS}`}</span>` : ""}
        </div>

        ${sum ? `
          <div class="save-slot-meta">
            <span><b>OP:</b> ${sum.playerName}</span>
            <span>· <b>CR:</b> $${sum.money}</span>
            <span>· <b>MEJORAS:</b> ${sum.upgrades}</span>
            <span>· <b>ATLAS:</b> ${sum.atlasCount}/${sum.atlasTotal}</span>
            ${sum.anomCount > 0 ? `<span>· <b>ANOM:</b> ${sum.anomCount}</span>` : ""}
            ${sum.hasFloppyDisk ? `<span>· <b>FLOPPY</b></span>` : ""}
          </div>
        ` : `
          <div class="mut" style="font-size:11.5px">
            ${def.isAuto ? "Se actualiza automáticamente durante tu guardia." : "Sin datos guardados en esta ranura."}
          </div>
        `}

        <div class="save-slot-actions">
          ${inActiveSession && !def.isAuto ? `<button type="button" data-save-slot="${def.id}">Guardar aquí</button>` : ""}
          ${inActiveSession && def.isAuto ? `<button type="button" class="alt" data-save-slot="auto">Actualizar autoguardado</button>` : ""}
          ${rec ? `<button type="button" class="primary-os" data-load-slot="${def.id}">Cargar</button>` : ""}
          ${rec ? `<button type="button" class="alt" data-export-slot="${def.id}">Exportar</button>` : ""}
          ${rec ? (
            isConfirmDel
              ? `<button type="button" class="bad" data-del-confirm="${def.id}">Confirmar borrado</button>
                 <button type="button" class="alt" data-del-cancel="${def.id}">Cancelar</button>`
              : `<button type="button" class="bad" data-del-ask="${def.id}">Borrar</button>`
          ) : ""}
        </div>
      </div>
    `;
  }).join("");

  root.innerHTML = `
    <div class="os-modal-backdrop" id="saveModalBackdrop">
      <div class="os-modal-win save-modal-win" role="dialog" aria-modal="true" aria-label="Sistema de Guardado">
        <div class="os-win-bar">
          <span>SISTEMA DE GUARDADO // ARCHIVO DE ESTACIÓN</span>
          <button type="button" class="alt" id="closeSaveModalBtn" style="padding:2px 8px;font-size:11px">X</button>
        </div>
        <div class="os-modal-body save-modal-body">
          <div class="mut" style="font-size:11.5px">
            ${inActiveSession
              ? `Sesión actual: <b>${S.playerName}</b> (${shiftLabel(shift)} · $${G.money} CR). Guarda en una ranura manual o carga un registro previo.`
              : "Selecciona una partida guardada para continuar tu guardia o importa un archivo .JSON."}
          </div>
          ${slotsHtml}
          <div class="save-modal-foot">
            <div class="row" style="margin:0;gap:6px">
              ${inActiveSession ? `<button type="button" class="alt" id="exportCurrentBtn">Exportar actual (.JSON)</button>` : ""}
              <button type="button" class="alt" id="importSaveBtn">Importar (.JSON)</button>
              <input type="file" id="importSaveInput" accept=".json,application/json" style="display:none">
            </div>
            <button type="button" class="alt" id="doneSaveModalBtn">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const backdrop = root.querySelector("#saveModalBackdrop");
  if (backdrop) {
    backdrop.onclick = e => {
      if (e.target === backdrop) closeSaveModal();
    };
  }
  const closeBtn = root.querySelector("#closeSaveModalBtn");
  if (closeBtn) closeBtn.onclick = () => { beep(380, 0.06); closeSaveModal(); };
  const doneBtn = root.querySelector("#doneSaveModalBtn");
  if (doneBtn) doneBtn.onclick = () => { beep(380, 0.06); closeSaveModal(); };

  root.querySelectorAll("[data-save-slot]").forEach(btn => {
    btn.onclick = () => saveToSlot(btn.dataset.saveSlot, false);
  });
  root.querySelectorAll("[data-load-slot]").forEach(btn => {
    btn.onclick = () => loadFromSlot(btn.dataset.loadSlot);
  });
  root.querySelectorAll("[data-export-slot]").forEach(btn => {
    btn.onclick = () => {
      const st = readSaveStore();
      exportSaveRecordToFile(st[btn.dataset.exportSlot]);
    };
  });
  root.querySelectorAll("[data-del-ask]").forEach(btn => {
    btn.onclick = () => {
      saveDeleteConfirmId = btn.dataset.delAsk;
      renderSaveModal();
    };
  });
  root.querySelectorAll("[data-del-cancel]").forEach(btn => {
    btn.onclick = () => {
      saveDeleteConfirmId = null;
      renderSaveModal();
    };
  });
  root.querySelectorAll("[data-del-confirm]").forEach(btn => {
    btn.onclick = () => deleteSaveSlot(btn.dataset.delConfirm);
  });

  const expCur = root.querySelector("#exportCurrentBtn");
  if (expCur) {
    expCur.onclick = () => {
      const st = captureGameState();
      if (st) exportSaveRecordToFile(buildSaveRecord("export", st));
    };
  }
  const impBtn = root.querySelector("#importSaveBtn");
  const impInput = root.querySelector("#importSaveInput");
  if (impBtn && impInput) {
    impBtn.onclick = () => impInput.click();
    impInput.onchange = e => {
      const file = e.target.files && e.target.files[0];
      if (file) importSaveFromFile(file);
      impInput.value = "";
    };
  }
}

function startTutorialFromGame() {
  if (TUT || isTransitioningNight) return;
  if (G && S && !S.tutorial) {
    const snap = captureGameState();
    if (snap) {
      TUT_RETURN_SNAPSHOT = snap;
    }
  }
  beep(659.25, 0.1, "triangle", 0.06);
  startTutorial();
}

function unlockBootAudioOnGesture() {
  if (V === "boot" && !bootSoundPlayed) {
    if (playStartupSound(false)) {
      const hint = document.querySelector("#bootAudioHint");
      if (hint) hint.style.display = "none";
    }
  }
}
window.addEventListener("pointerdown", unlockBootAudioOnGesture, { passive: true });
window.addEventListener("keydown", unlockBootAudioOnGesture, { passive: true });

function bootTerminal() {
  try {
    preloadAllSprites();
    startBootSequence();
    requestAnimationFrame(loop);
  } catch (err) {
    const w = document.querySelector("#win");
    if (w) {
      w.innerHTML = `<div class="card dangerbox"><b>ERROR DE INICIALIZACION</b><pre style="white-space:pre-wrap;font-size:12px">${err && err.stack ? err.stack : err}</pre></div>`;
    }
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootTerminal);
} else {
  bootTerminal();
}
</script>
</body>
