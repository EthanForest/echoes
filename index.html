function computeBootProgress(sec) {
  if (sec <= 0.8) return Math.round((sec / 0.8) * 18);
  if (sec <= 2.0) return Math.round(18 + ((sec - 0.8) / 1.2) * 34);
  if (sec <= 3.1) return Math.round(52 + ((sec - 2.0) / 1.1) * 16);
  if (sec <= 4.4) return Math.round(68 + ((sec - 3.1) / 1.3) * 28);
  if (sec <= 4.9) return Math.round(96 + ((sec - 4.4) / 0.5) * 4);
  return 100;
}

function drawBoot() {
  const fill = document.querySelector("#bootBarFill");
  if (fill) fill.style.width = `${bootProgress}%`;
}

function tick(dt) {
  if (V === "boot") {
    bootElapsed += dt;
    bootProgress = computeBootProgress(bootElapsed);
    if (!bootSoundPlayed) {
      playStartupSound(false);
    }
    if (bootElapsed >= 5.0) {
      V = "intro";
      updTop();
      render();
    }
    return;
  }
  if (V === "intro") {
    updateBearAnimation(dt);
    return;
  }
  if (!G || V === "end") return;

  const regenMode = getEnergyRegenMode();
  if (regenMode === "fast") {
    en = Math.min(cap, en + dt * (en < 25 ? 1.45 : 0.90));
  } else if (regenMode === "slow") {
    en = Math.min(cap, en + dt * (en < 20 ? 0.42 : 0.22));
  }

  if (rd > 0) rd = Math.max(0, rd - dt);

  const alignDur = Math.max(1.1, 4.4 - G.a * 0.65);
  const dlDur = Math.max(3.8, 12.0 - G.a * 1.6);
  const noiseProb = Math.max(0.02, 0.24 - G.f * 0.04);
  let activeDl = false;

  sigs.forEach((s, idx) => {
    if ((s.st === "echo" || s.st === "align" || s.st === "dl") && (s.vx || s.vy)) {
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.x < 160 || s.x > W - 160) { s.vx *= -1; s.x = Math.max(160, Math.min(W - 160, s.x)); }
      if (s.y < 160 || s.y > H - 160) { s.vy *= -1; s.y = Math.max(160, Math.min(H - 160, s.y)); }
      for (let j = 0; j < sigs.length; j++) {
        if (j === idx) continue;
        const other = sigs[j];
        if (other.st === "gone" || other.st === "raw") continue;
        const dx = s.x - other.x, dy = s.y - other.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0.1 && dist < 420) {
          const nx = dx / dist, ny = dy / dist;
          s.x += nx * 18 * dt;
          s.y += ny * 18 * dt;
          if (s.vx * nx + s.vy * ny < 0) {
            const dot = s.vx * nx + s.vy * ny;
            s.vx -= 2 * dot * nx;
            s.vy -= 2 * dot * ny;
          }
        }
      }
    }

    if (srv) return;

    if (s.st === "align") {
      if (R) R.slewTime += dt;
      s.align += dt / alignDur;
      if (s.align >= 1) {
        s.align = 1;
        s.st = "dl";
        beep(520, 0.08, "triangle", 0.05);
        msg("[OK] Antenas alineadas // Descargando trama", 1);
      }
    } else if (s.st === "dl") {
      activeDl = true;
      s.prog += dt / dlDur;
      s.acc += dt;
      while (s.acc >= 0.5) {
        s.acc -= 0.5;
        s.tot++;
        if (Math.random() < noiseProb) {
          s.bad++;
          if (R) R.corrupt++;
        }
      }
      if (s.prog >= 1) {
        s.prog = 1;
        s.st = "raw";
        beep(680, 0.12, "sine", 0.07);
        msg(`[OK] Trama #${s.id} lista en Procesador`, 1);
        ensureSectorDiversity();
        syncLiveTelemetry(false, true);
        if (V === "map" || V === "mail") render();
        else updBadges();
      }
    }
  });

  if (activeDl && !srv && Math.random() < dt / 46) triggerCrash();

  if (activeVoice) {
    activeVoice.t += dt;
    const s = activeVoice.sig;
    const clarity = s.fixed ? 1 : (s.tgF !== undefined ? Math.max(0.18, 1 - (offF(s) + offP(s)) * 0.6) : 1);
    if (activeVoice.noiseGain) {
      activeVoice.noiseGain.gain.value = getSignalNoiseLevel(s);
    }
    if (activeVoice.audio) {
      const baseVol = typeof activeVoice.baseVol === "number" ? activeVoice.baseVol : 0.48;
      activeVoice.audio.volume = Math.max(0.08, Math.min(baseVol, baseVol * clarity));
    } else if (activeVoice.g) {
      const mod = MODELS.find(m => m.id === s.modelId);
      const anomDef = s.anom ? ANOMALY_DEFS.find(a => a.type === s.anomType) : null;
      const cat = s.cat !== undefined ? s.cat : (anomDef ? anomDef.cat : (mod ? mod.cat : 0));
      const pulse = cat === 4 ? ((activeVoice.t * 7 % 1) < 0.22 ? 1 : 0.05)
                  : cat === 5 ? (0.55 + 0.45 * Math.sin(activeVoice.t * (s.modelId === "sin_agujero_negro" ? 1.8 : 11)))
                  : cat === 3 ? ((activeVoice.t * 2.5 % 1) < 0.45 ? 0.9 : 0.1)
                  : (0.65 + 0.35 * Math.sin(activeVoice.t * 3));
      activeVoice.g.gain.value = 0.08 * clarity * pulse;
      if (activeVoice.t >= activeVoice.max) {
        stopVoice();
        if (V === "proc") render();
      }
    }
  }

  for (let i = pendingEvals.length - 1; i >= 0; i--) {
    if (performance.now() >= pendingEvals[i].at) {
      const ev = pendingEvals.splice(i, 1)[0];
      evaluatePlatformDispatch(ev);
    }
  }

  if (flashT > 0) {
    flashT -= dt;
    if (flashT <= 0) { flash = ""; updTop(); }
  }

  uiTick += dt;
  if (uiTick >= 0.45) { uiTick = 0; updTop(); }

  liveSyncTimer += dt;
  if (liveSyncTimer >= 2.0) {
    liveSyncTimer = 0;
    syncLiveTelemetry(false, false);
  }

  cloudSyncTimer += dt;
  if (cloudSyncTimer >= 5.0) {
    cloudSyncTimer = 0;
    if (activeDbUrl) {
      pushSnapshotToCloud(buildSessionSnapshot(false));
    }
  }
}

// Renderizador procedural de modelos y anomalías
function renderCelestialToCanvas(cv, spec, t, filterLv = 5, tuneErr = 0, sepiaMode = false, opticalFailure = false) {
  if (!cv) return;
  const cx = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  const img = cx.createImageData(w, h);
  const d = img.data;

  // Fallo óptico (Noche 9) o archivo visual dañado (desde Noche 5): no se muestra imagen en el CRT
  if (opticalFailure) {
    for (let y = 0; y < h; y++) {
      const band = Math.sin(y * 0.4 + t * 22) > 0.72 ? 42 : 0;
      for (let x = 0; x < w; x++) {
        const noise = (Math.random() * 28 + band) * ((y % 2 === 0) ? 0.7 : 1.0);
        const idx = (y * w + x) * 4;
        d[idx] = Math.min(255, noise * 1.45);
        d[idx + 1] = Math.min(255, noise * 0.42);
        d[idx + 2] = Math.min(255, noise * 0.42);
        d[idx + 3] = 255;
      }
    }
    cx.putImageData(img, 0, 0);
    return;
  }

  const baseFloor = [0.60, 0.44, 0.30, 0.18, 0.09, 0.02][Math.min(5, Math.max(0, filterLv))];
  const staticAmt = (sepiaMode && tuneErr === 0 && filterLv >= 5) ? 0.06 : Math.min(0.98, baseFloor + tuneErr * (1 - baseFloor));

  const modObj = MODELS.find(m => m.id === spec.modelId);
  const spriteSrc = spec.img || (modObj && modObj.img);
  const sprite = getSprite(spriteSrc);

  if (sprite && offCx) {
    offCv.width = w;
    offCv.height = h;
    offCx.imageSmoothingEnabled = false;
    offCx.fillStyle = "#000000";
    offCx.fillRect(0, 0, w, h);

    const aspect = sprite.naturalWidth / sprite.naturalHeight;
    let dw = w, dh = h;
    if (w / h > aspect) {
      dw = Math.round(h * aspect);
    } else {
      dh = Math.round(w / aspect);
    }
    const ox = Math.floor((w - dw) / 2);
    const oy = Math.floor((h - dh) / 2);
    offCx.drawImage(sprite, ox, oy, dw, dh);

    try {
      const srcData = offCx.getImageData(0, 0, w, h).data;
      for (let y = 0; y < h; y++) {
        const scanline = (y % 2 === 0) ? 0.86 : 1.0;
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const alpha = srcData[idx + 3] / 255;
          const r0 = srcData[idx] * alpha;
          const g0 = srcData[idx + 1] * alpha;
          const b0 = srcData[idx + 2] * alpha;
          const snow = Math.random() * 255;

          let r = (r0 * (1 - staticAmt) + snow * staticAmt) * scanline;
          let g = (g0 * (1 - staticAmt) + snow * staticAmt) * scanline;
          let b = (b0 * (1 - staticAmt) + snow * staticAmt) * scanline;

          if (sepiaMode) {
            r *= 1.04;
            g *= 0.99;
            b *= 0.90;
          }

          d[idx] = Math.max(0, Math.min(255, r));
          d[idx + 1] = Math.max(0, Math.min(255, g));
          d[idx + 2] = Math.max(0, Math.min(255, b));
          d[idx + 3] = 255;
        }
      }
      cx.putImageData(img, 0, 0);
      return;
    } catch (_) {
      cx.imageSmoothingEnabled = false;
      cx.fillStyle = sepiaMode ? "#1e1912" : "#000000";
      cx.fillRect(0, 0, w, h);
      cx.save();
      cx.globalAlpha = Math.max(0.18, 1 - staticAmt * 0.85);
      cx.drawImage(sprite, ox, oy, dw, dh);
      cx.restore();
      cx.fillStyle = "rgba(0, 0, 0, 0.18)";
      for (let y = 0; y < h; y += 2) {
        cx.fillRect(0, y, w, 1);
      }
      if (staticAmt > 0.04) {
        const specks = Math.floor(w * h * staticAmt * 0.35);
        for (let i = 0; i < specks; i++) {
          const sx = Math.floor(Math.random() * w);
          const sy = Math.floor(Math.random() * h);
          const v = Math.floor(Math.random() * 255);
          cx.fillStyle = `rgba(${v},${v},${v},0.45)`;
          cx.fillRect(sx, sy, 1, 1);
        }
      }
      return;
    }
  }

  const cx0 = w / 2, cy0 = h / 2;
  const scale = Math.min(w, h) / 96;
  const mid = spec.modelId || "est_enana";
  const seed = spec.seed || 1.5;
  const anomType = spec.anomType || "";

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = (x - cx0) / scale;
      const dy = (y - cy0) / scale;
      const dist = Math.hypot(dx, dy);
      let lum = 10;

      if (anomType === "voyager") {
        const dish = Math.hypot(dx + 6, dy + 2);
        const crack = Math.abs(dx - dy * 0.7 + 4) < 1.6;
        const bus = Math.abs(dx - 8) < 6 && Math.abs(dy - 5) < 5;
        const boom = Math.abs(dy - (dx - 8) * 0.45 - 5) < 1.2 && dx >= 12 && dx <= 34;
        const frag1 = Math.hypot(dx + 22, dy - 14) < 3.2;
        const frag2 = Math.hypot(dx - 24, dy + 16) < 2.6;
        if (dish < 15 && dish > 10 && !crack) lum = 225;
        else if (dish <= 10 && !crack) lum = 145;
        else if (bus) lum = 205;
        else if (boom) lum = 185;
        else if (frag1 || frag2) lum = 195;
      } else if (anomType === "dyson") {
        const core = dist < 15;
        const shellOuter = dist >= 22 && dist <= 26;
        const latRing = Math.abs(dy - Math.sin(dx * 0.14 + t * 1.4) * 9) < 2.1 && dist <= 26;
        const lonRing = Math.abs(dx - Math.cos(dy * 0.14 - t * 1.1) * 9) < 2.1 && dist <= 26;
        const gap = ((Math.floor(dx + 40) + Math.floor(dy + 40)) % 7 === 0);
        if (shellOuter && !gap) lum = 235;
        else if ((latRing || lonRing) && !gap) lum = 215;
        else if (core) lum = 155 + Math.sin(t * 6) * 20;
      } else if (anomType === "failed_planet") {
        const ang = Math.atan2(dy, dx);
        const rad = 25 + Math.sin(ang * 5 + seed) * 3;
        const fissure = Math.abs(Math.sin(dx * 0.22 + dy * 0.18)) < 0.16 && dist < rad;
        const deb1 = Math.hypot(dx - 31, dy + 12) < 3.2;
        const deb2 = Math.hypot(dx + 30, dy - 15) < 2.8;
        if (dist < rad) {
          lum = fissure ? (235 + Math.sin(t * 8) * 18) : (105 - dx * 0.9);
        } else if (deb1 || deb2) {
          lum = 190;
        }
      } else if (anomType === "dark_eyes") {
        const oval = Math.hypot(dx * 1.15, dy * 0.85);
        const leftEye = Math.hypot(dx + 9, dy + 4) < 5.2;
        const rightEye = Math.hypot(dx - 9, dy + 4) < 5.2;
        if (oval < 27) {
          if (leftEye || rightEye) lum = 4;
          else lum = 205 - oval * 2.4 + Math.sin(t * 5 + dy * 0.3) * 10;
        }
      } else if (mid === "est_enana") {
        if (dist < 20) lum = 235 - dist * 2;
        else if (dist < 40) lum = Math.max(14, 155 - (dist - 20) * 6);
        if ((Math.abs(dx) < 1.6 || Math.abs(dy) < 1.6) && dist < 48) lum = Math.max(lum, 185 - dist * 2.5);
      } else if (mid === "est_gigante") {
        if (dist < 30) lum = 240 - dist * 1.4;
        else if (dist < 50) lum = Math.max(14, 180 - (dist - 30) * 7 + Math.sin(Math.atan2(dy, dx)*10 + t*2)*16);
      } else if (mid === "est_binaria") {
        const off = 14;
        const a = t * 1.4;
        const d1 = Math.hypot(dx - Math.cos(a)*off, dy - Math.sin(a)*off);
        const d2 = Math.hypot(dx + Math.cos(a)*off, dy + Math.sin(a)*off);
        if (d1 < 12) lum = 240 - d1 * 5;
        if (d2 < 9) lum = Math.max(lum, 225 - d2 * 6);
      } else if (mid === "est_trinaria") {
        for (let k = 0; k < 3; k++) {
          const a = t * 1.2 + k * (Math.PI * 2 / 3);
          const dk = Math.hypot(dx - Math.cos(a)*15, dy - Math.sin(a)*15);
          if (dk < 9) lum = Math.max(lum, 235 - dk * 6);
        }
      } else if (mid === "ast_metalico") {
        const ang = Math.atan2(dy, dx);
        const rad = 22 + Math.sin(ang * 3 + seed) * 7 + Math.cos(ang * 5) * 4;
        if (dist < rad) lum = 195 + Math.sin(dx * 0.4) * 40;
      } else if (mid === "ast_condrita") {
        const ang = Math.atan2(dy, dx);
        const rad = 24 + Math.cos(ang * 4 + seed) * 6;
        if (dist < rad) lum = 125 + Math.sin(dx * 0.5) * Math.cos(dy * 0.5) * 35;
      } else if (mid === "ast_cometa") {
        const head = Math.hypot(dx + 14, dy);
        if (head < 10) lum = 240 - head * 6;
        else if (dx > -14 && Math.abs(dy) < (dx + 14) * 0.38 && dx < 38) {
          lum = Math.max(14, 175 - (dx + 14) * 3.1);
        }
      } else if (mid === "sat_com") {
        const core = Math.abs(dx) < 7 && Math.abs(dy) < 9;
        const panel = Math.abs(dx) >= 11 && Math.abs(dx) <= 42 && Math.abs(dy) < 6;
        const strut = Math.abs(dy) < 1.8 && Math.abs(dx) < 42;
        if (core) lum = 225;
        else if (panel) lum = ((x % 5 === 0 || y % 4 === 0) ? 95 : 190);
        else if (strut) lum = 170;
      } else if (mid === "sat_sonda") {
        const dish = Math.hypot(dx + 8, dy);
        const body = dx >= 4 && dx <= 22 && Math.abs(dy) < 6;
        if (dish < 14 && dish > 9) lum = 230;
        else if (body) lum = 195;
      } else if (mid === "sat_telescopio") {
        const tube = Math.abs(dx) < 22 && Math.abs(dy) < 8;
        const flap = dx < -18 && dx > -28 && Math.abs(dy + 10) < 4;
        if (tube) lum = 210 - Math.abs(dy) * 8;
        else if (flap) lum = 180;
      } else if (mid === "sat_estacion") {
        const truss = Math.abs(dy) < 2.2 && Math.abs(dx) < 44;
        const modV = Math.abs(dx) < 5 && Math.abs(dy) < 22;
        const wings = (Math.abs(dx + 28) < 6 || Math.abs(dx - 28) < 6) && Math.abs(dy) < 18;
        if (truss || modV) lum = 225;
        else if (wings) lum = 175;
      } else if (mid === "pul_ms") {
        const beam = Math.abs(dy - dx * Math.tan(t * 9)) < 2.4 && dist < 46;
        if (dist < 11) lum = 245;
        else if (beam) lum = 220;
      } else if (mid === "pul_magnetar") {
        const ring = Math.abs(dist - 24) < 2.5;
        if (dist < 14) lum = 250;
        else if (ring) lum = 200;
      } else if (mid === "pul_binario") {
        const d1 = Math.hypot(dx + 12, dy);
        const d2 = Math.hypot(dx - 14, dy);
        if (d1 < 10) lum = 245;
        if (d2 < 14 && d2 > 10) lum = 195;
      }

      const snow = Math.random() * 255;
      const scanline = (y % 2 === 0) ? 0.90 : 1.0;
      const finalVal = Math.max(0, Math.min(255, (lum * (1 - staticAmt) + snow * staticAmt) * scanline));

      const idx = (y * w + x) * 4;
      if (sepiaMode) {
        d[idx] = Math.min(255, finalVal * 1.05);
        d[idx + 1] = Math.min(255, finalVal * 0.92);
        d[idx + 2] = Math.min(255, finalVal * 0.72);
      } else {
        d[idx] = finalVal;
        d[idx + 1] = finalVal;
        d[idx + 2] = finalVal;
      }
      d[idx + 3] = 255;
    }
  }
  cx.putImageData(img, 0, 0);
}

function getMapViewportMetrics(cv) {
  const vw = Math.max(320, Math.round(cv.clientWidth || 960));
  const vh = Math.max(240, Math.round(cv.clientHeight || 520));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const pw = Math.round(vw * dpr);
  const ph = Math.round(vh * dpr);
  if (cv.width !== pw || cv.height !== ph) {
    cv.width = pw;
    cv.height = ph;
  }
  return {vw, vh, dpr};
}

function drawMap(t) {
  const cv = $("#cv");
  if (!cv) return;
  const {vw, vh, dpr} = getMapViewportMetrics(cv);
  cam.x = Math.max(0, Math.min(Math.max(0, W - vw), cam.x));
  cam.y = Math.max(0, Math.min(Math.max(0, H - vh), cam.y));

  const cx = cv.getContext("2d");
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const paper = isPaperTheme();
  cx.fillStyle = paper ? "#1e1912" : "#03070d";
  cx.fillRect(0, 0, vw, vh);

  cx.strokeStyle = paper ? "rgba(168, 144, 104, 0.20)" : "rgba(52, 95, 68, 0.22)";
  cx.lineWidth = 1;
  const step = 90;
  const gx0 = -(cam.x % step), gy0 = -(cam.y % step);
  for (let x = gx0; x < vw; x += step) {
    const px = Math.round(x) + 0.5;
    cx.beginPath(); cx.moveTo(px, 0); cx.lineTo(px, vh); cx.stroke();
  }
  for (let y = gy0; y < vh; y += step) {
    const py = Math.round(y) + 0.5;
    cx.beginPath(); cx.moveTo(0, py); cx.lineTo(vw, py); cx.stroke();
  }

  cx.fillStyle = paper ? "#f5eedc" : "#d1fae5";
  stars.forEach(([x, y, r]) => {
    const sx = x - cam.x, sy = y - cam.y;
    if (sx < -2 || sx > vw + 2 || sy < -2 || sy > vh + 2) return;
    cx.globalAlpha = 0.32 + 0.38 * Math.sin(t * 1.4 + x);
    cx.beginPath();
    cx.arc(sx, sy, r * 0.72, 0, Math.PI * 2);
    cx.fill();
  });
  cx.globalAlpha = 1;

  cx.save();
  cx.translate(-cam.x, -cam.y);
  cx.strokeStyle = paper ? "rgba(168, 144, 104, 0.36)" : "rgba(34, 197, 94, 0.28)";
  cx.setLineDash([8, 6]);
  cx.strokeRect(12, 12, W - 24, H - 24);
  cx.setLineDash([]);
  sigs.forEach(s => {
    if (s.st === "gone" || s.st === "raw") return;
    const col = paper
      ? (s.st === "echo" ? "233, 222, 196" : s.st === "align" ? "217, 119, 6" : "245, 158, 11")
      : (s.st === "echo" ? "96, 195, 255" : s.st === "align" ? "234, 179, 8" : "74, 222, 128");
    const pulse = (t * 0.45 + s.seed) % 1;
    cx.strokeStyle = `rgba(${col}, ${(1 - pulse) * 0.7})`;
    cx.lineWidth = 1.3;
    cx.beginPath(); cx.arc(s.x, s.y, 7 + pulse * 30, 0, Math.PI * 2); cx.stroke();

    cx.fillStyle = `rgb(${col})`;
    cx.beginPath(); cx.arc(s.x, s.y, 5, 0, Math.PI * 2); cx.fill();

    if (s.st === "align") {
      cx.strokeStyle = paper ? "#d97706" : "#eab308";
      cx.lineWidth = 2.6;
      cx.beginPath(); cx.arc(s.x, s.y, 17, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.align); cx.stroke();
    } else if (s.st === "dl") {
      cx.strokeStyle = srv ? "#ef4444" : (paper ? "#f59e0b" : "#4ade80");
      cx.lineWidth = 2.6;
      cx.beginPath(); cx.arc(s.x, s.y, 17, -Math.PI/2, -Math.PI/2 + Math.PI*2*s.prog); cx.stroke();
    }
    cx.lineWidth = 1;
  });
  cx.restore();

  if (rd > 0) {
    cx.globalAlpha = Math.min(1, rd / 2);
    const halfW = vw / 2, halfH = vh / 2;
    sigs.forEach(s => {
      if (s.st !== "echo") return;
      const sx = s.x - cam.x, sy = s.y - cam.y;
      if (sx > 14 && sx < vw - 14 && sy > 14 && sy < vh - 14) return;
      const a = Math.atan2(sy - halfH, sx - halfW);
      const k = Math.min((halfW - 22) / Math.abs(Math.cos(a) || 1e-5), (halfH - 22) / Math.abs(Math.sin(a) || 1e-5));
      cx.save();
      cx.translate(halfW + Math.cos(a)*k, halfH + Math.sin(a)*k);
      cx.rotate(a);
      cx.fillStyle = paper ? "#e9dec4" : "#4ade80";
      cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(-15, -6.5); cx.lineTo(-15, 6.5); cx.fill();
      cx.restore();
    });
    cx.globalAlpha = 1;
  }

  cx.fillStyle = paper ? "rgba(30, 25, 18, 0.86)" : "rgba(8, 14, 11, 0.72)";
  cx.fillRect(vw - 178, 10, 168, 24);
  cx.strokeStyle = paper ? "#8c734b" : "#166534";
  cx.strokeRect(vw - 178, 10, 168, 24);
  cx.fillStyle = paper ? "#e9dec4" : "#86efac";
  cx.font = paper ? "11px 'Courier New', Courier, monospace" : "11px ui-monospace, Consolas, monospace";
  cx.textAlign = "right";
  cx.fillText(`SEC ${Math.round(cam.x + vw/2)} // ${Math.round(cam.y + vh/2)}`, vw - 18, 26);
  cx.textAlign = "left";

  const aligning = sigs.find(s => s.st === "align");
  const targetAng = aligning ? Math.atan2(aligning.y - H/2, aligning.x - W/2) : -Math.PI/2;
  const hudY = vh - 46;
  cx.fillStyle = paper ? "rgba(30, 25, 18, 0.88)" : "rgba(8, 14, 11, 0.84)";
  cx.fillRect(10, hudY, 118, 36);
  cx.strokeStyle = paper ? "#8c734b" : "#243d2b";
  cx.strokeRect(10, hudY, 118, 36);
  for (let i = 0; i < 3; i++) {
    const ax = 30 + i * 38, ay = hudY + 18;
    cx.strokeStyle = paper ? "#e9dec4" : "#4ade80";
    cx.lineWidth = 1.4;
    cx.beginPath(); cx.arc(ax, ay, 9, 0, Math.PI * 2); cx.stroke();
    const curA = aligning ? (targetAng - (1 - aligning.align) * 2.2) : targetAng;
    cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(ax + Math.cos(curA)*11, ay + Math.sin(curA)*11); cx.stroke();
  }
  cx.lineWidth = 1;
}

function drawCRT(t) {
  const cv = $("#crt");
  if (!cv || !cur) return;
  const [rw, rh] = CRT_RES[Math.min(5, G.f)];
  if (cv.width !== rw || cv.height !== rh) {
    cv.width = rw;
    cv.height = rh;
  }
  const tuneErr = cur.fixed ? 0 : Math.min(1, (offF(cur) + offP(cur)) * 0.75);
  const visualBlocked = isOpticalFailed() || Boolean(cur.isCorruptSignal);
  renderCelestialToCanvas(cv, cur, t, G.f, tuneErr, isPaperTheme(), visualBlocked);
}

function drawAtlasCanvases(t) {
  document.querySelectorAll("[data-atlas-mid]").forEach(cv => {
    const mid = cv.dataset.atlasMid;
    const mod = MODELS.find(m => m.id === mid);
    if (mod) {
      renderCelestialToCanvas(cv, {modelId: mod.id, img: mod.img, seed: 2.1, anom: false, anomType: ""}, t, 5, 0, isPaperTheme(), false);
    }
  });
  document.querySelectorAll("[data-atlas-spec]").forEach(cv => {
    const mid = cv.dataset.atlasSpec;
    const mod = MODELS.find(m => m.id === mid);
    if (mod) {
      drawSpectrogram(t, cv, {
        bufKey: `atlas_${mid}`,
        matchModelId: mid,
        isAnom: false,
        compact: true
      });
    }
  });
  document.querySelectorAll("[data-anom-idx]").forEach(cv => {
    const idx = +cv.dataset.anomIdx;
    const item = discoveredAnomalies[idx];
    if (item) {
      renderCelestialToCanvas(cv, item, t, 5, 0, true, false);
    }
  });
  document.querySelectorAll("[data-anom-spec]").forEach(cv => {
    const idx = +cv.dataset.anomSpec;
    const item = discoveredAnomalies[idx];
    if (item) {
      drawSpectrogram(t, cv, {
        bufKey: `anom_${item.anomType}`,
        matchAnomType: item.anomType,
        isAnom: true,
        compact: true
      });
    }
  });
}

function getSpecBuffer(key, w = 280, h = 150) {
  let buf = SPEC_BUFFERS[key];
  if (!buf) {
    const cv = document.createElement("canvas");
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = isPaperTheme() ? "#18130d" : "#030805";
    ctx.fillRect(0, 0, w, h);
    buf = {cv, ctx, peakHold: 0, rmsSmooth: 0};
    SPEC_BUFFERS[key] = buf;
  } else if (buf.cv.width !== w || buf.cv.height !== h) {
    const oldCv = buf.cv;
    const newCv = document.createElement("canvas");
    newCv.width = w;
    newCv.height = h;
    const newCtx = newCv.getContext("2d");
    newCtx.fillStyle = isPaperTheme() ? "#18130d" : "#030805";
    newCtx.fillRect(0, 0, w, h);
    newCtx.drawImage(oldCv, 0, 0, w, h);
    buf.cv = newCv;
    buf.ctx = newCtx;
  }
  return buf;
}

// Espectrograma impulsado literalmente por el AnalyserNode de Web Audio sobre el oscilador / flujo activo
function drawSpectrogram(t, targetCv = null, opts = {}) {
  const cv = targetCv || $("#spec");
  if (!cv) return;
  if (!targetCv && !cur) return;

  const isCompact = Boolean(opts.compact);
  const targetW = isCompact ? 260 : Math.max(280, Math.round(cv.clientWidth || 380));
  const targetH = isCompact ? 110 : Math.max(170, Math.round(cv.clientHeight || 220));
  if (cv.width !== targetW || cv.height !== targetH) {
    cv.width = targetW;
    cv.height = targetH;
  }

  const bufKey = opts.bufKey || "proc";
  if (bufKey === "proc" && cur && lastProcSpecSigId !== cur.id) {
    delete SPEC_BUFFERS["proc"];
    lastProcSpecSigId = cur.id;
  }

  const paper = isPaperTheme();
  const cx = cv.getContext("2d");
  const w = cv.width, h = cv.height;

  // Determinar si el AnalyserNode está recibiendo audio activo correspondiente a esta vista
  let isLive = false;
  if (analyser && specFreqData && specTimeData && activeVoice) {
    if (opts.matchModelId) {
      isLive = Boolean(activeVoice.sig && !activeVoice.sig.anom && activeVoice.sig.modelId === opts.matchModelId);
    } else if (opts.matchAnomType) {
      isLive = Boolean(activeVoice.sig && activeVoice.sig.anom && activeVoice.sig.anomType === opts.matchAnomType);
    } else if (cur) {
      isLive = Boolean(activeVoice.sig && (activeVoice.sig.id === cur.id || activeVoice.sig === cur));
    }
  }

  const isAnom = opts.isAnom !== undefined ? opts.isAnom : Boolean(cur && cur.anom);
  const meterW = isCompact ? 34 : 44;
  const wfW = w - meterW - 4;
  const wfH = h;
  const buf = getSpecBuffer(bufKey, wfW, wfH);

  let rmsLevel = 0;
  let dbText = "-- dB";

  if (isLive) {
    analyser.getByteFrequencyData(specFreqData);
    analyser.getByteTimeDomainData(specTimeData);

    // Calcular nivel RMS real del oscilador / audio desde getByteTimeDomainData
    let sumSq = 0;
    for (let i = 0; i < specTimeData.length; i++) {
      const sample = (specTimeData[i] - 128) / 128;
      sumSq += sample * sample;
    }
    const rms = Math.sqrt(sumSq / specTimeData.length);
    const dbVal = rms > 0.0005 ? Math.max(-60, Math.min(0, Math.round(20 * Math.log10(rms * 3.2)))) : -60;
    dbText = `${dbVal}dB`;
    rmsLevel = Math.min(1, Math.pow(rms * 3.8, 0.72));
    buf.rmsSmooth = buf.rmsSmooth * 0.65 + rmsLevel * 0.35;
    buf.peakHold = Math.max(buf.rmsSmooth, buf.peakHold - 0.008);

    // Desplazar cascada (waterfall) 2px hacia la izquierda y pintar nueva columna FFT a la derecha
    buf.ctx.drawImage(buf.cv, -2, 0);
    buf.ctx.fillStyle = paper ? "#18130d" : "#030805";
    buf.ctx.fillRect(wfW - 2, 0, 2, wfH);

    // Rango enfocado en bins 1..140 (~23 Hz a ~3.2 kHz con fftSize=2048) para capturar fundamentales y armónicos
    const maxBin = Math.min(specFreqData.length - 1, 140);
    for (let py = 0; py < wfH; py++) {
      const normY = 1 - (py / Math.max(1, wfH - 1)); // 0 abajo (graves), 1 arriba (agudos)
      const binIdx = Math.max(1, Math.min(maxBin, Math.floor(1 + Math.pow(normY, 1.35) * (maxBin - 1))));
      const rawVal = specFreqData[binIdx] / 255;
      const val = rawVal > 0.03 ? Math.min(1, Math.pow(rawVal, 0.76) * 1.15) : 0;

      if (val > 0.02) {
        if (isAnom) {
          const r = Math.min(255, Math.round(90 + val * 165));
          const g = Math.min(255, Math.round(val > 0.78 ? (val - 0.78) * 650 : 18 * val));
          const b = Math.min(255, Math.round(35 + val * 75));
          buf.ctx.fillStyle = `rgb(${r},${g},${b})`;
        } else if (paper) {
          const r = Math.min(255, Math.round(55 + val * 200));
          const g = Math.min(255, Math.round(45 + val * 185));
          const b = Math.min(255, Math.round(25 + val * 115));
          buf.ctx.fillStyle = `rgb(${r},${g},${b})`;
        } else {
          const r = Math.min(255, Math.round(val > 0.75 ? (val - 0.75) * 600 : 12 * val));
          const g = Math.min(255, Math.round(60 + val * 195));
          const b = Math.min(255, Math.round(30 + val * 110));
          buf.ctx.fillStyle = `rgb(${r},${g},${b})`;
        }
        buf.ctx.fillRect(wfW - 2, py, 2, 1);
      }
    }
  } else {
    buf.rmsSmooth = Math.max(0, buf.rmsSmooth - 0.06);
    buf.peakHold = Math.max(0, buf.peakHold - 0.015);
    buf.ctx.drawImage(buf.cv, -1, 0);
    buf.ctx.fillStyle = paper ? "#18130d" : "#030805";
    buf.ctx.fillRect(wfW - 1, 0, 1, wfH);
  }

  // Dibujar fondo y cascada FFT
  cx.fillStyle = paper ? "#18130d" : "#030805";
  cx.fillRect(0, 0, w, h);
  cx.drawImage(buf.cv, 0, 0, wfW, wfH);

  // Rejilla de frecuencias y niveles
  cx.strokeStyle = paper ? "rgba(168, 144, 104, 0.22)" : "rgba(52, 95, 68, 0.25)";
  cx.lineWidth = 1;
  for (let gx = 40; gx < wfW; gx += 48) {
    cx.beginPath(); cx.moveTo(gx + 0.5, 0); cx.lineTo(gx + 0.5, wfH); cx.stroke();
  }
  const freqTicks = [
    {yFrac: 0.22, label: "2kHz"},
    {yFrac: 0.50, label: "800Hz"},
    {yFrac: 0.78, label: "200Hz"}
  ];
  cx.font = isCompact ? "9px 'Courier New', monospace" : "10px 'Courier New', monospace";
  freqTicks.forEach(ft => {
    const gy = Math.round(wfH * ft.yFrac) + 0.5;
    cx.beginPath(); cx.moveTo(0, gy); cx.lineTo(wfW, gy); cx.stroke();
    cx.fillStyle = paper ? "rgba(233, 222, 196, 0.62)" : "rgba(134, 239, 172, 0.62)";
    cx.fillText(ft.label, 4, gy - 2);
  });

  // Etiqueta de estado FFT arriba a la izquierda
  cx.fillStyle = isLive
    ? (isAnom ? "#f87171" : (paper ? "#fde68a" : "#4ade80"))
    : (paper ? "rgba(233, 222, 196, 0.68)" : "rgba(161, 161, 170, 0.75)");
  cx.fillText(isLive ? "FFT AUDIO // VIVO" : "FFT // SIN AUDIO", 4, isCompact ? 11 : 12);

  // Panel derecho: Medidor de Niveles (VU / dB)
  const mx = wfW + 4;
  cx.fillStyle = paper ? "#241d14" : "#060e09";
  cx.fillRect(mx, 0, meterW, h);
  cx.strokeStyle = paper ? "#8c734b" : "#166534";
  cx.strokeRect(mx + 0.5, 0.5, meterW - 1, h - 1);

  cx.fillStyle = paper ? "#e9dec4" : "#86efac";
  cx.textAlign = "center";
  cx.fillText("LVL", mx + meterW / 2, isCompact ? 10 : 12);

  const barTop = isCompact ? 14 : 17;
  const barBot = h - (isCompact ? 14 : 16);
  const barH = Math.max(20, barBot - barTop);
  const barW = isCompact ? 10 : 14;
  const barX = mx + Math.floor((meterW - barW) / 2);

  const segments = isCompact ? 14 : 18;
  const segGap = 1.5;
  const segH = (barH - segGap * (segments - 1)) / segments;

  for (let s = 0; s < segments; s++) {
    const frac = (s + 1) / segments;
    const sy = barBot - (s + 1) * segH - s * segGap;
    const active = buf.rmsSmooth >= frac - (0.5 / segments);
    if (active) {
      if (frac > 0.82) cx.fillStyle = "#ef4444";
      else if (frac > 0.62) cx.fillStyle = "#eab308";
      else cx.fillStyle = paper ? "#d97706" : "#22c55e";
    } else {
      cx.fillStyle = paper ? "rgba(140, 115, 75, 0.22)" : "rgba(34, 197, 94, 0.14)";
    }
    cx.fillRect(barX, sy, barW, segH);
  }

  // Indicador de pico retenido (Peak Hold)
  if (buf.peakHold > 0.02) {
    const peakY = Math.max(barTop, Math.min(barBot - 2, barBot - buf.peakHold * barH));
    cx.fillStyle = "#ffffff";
    cx.fillRect(barX - 1, peakY, barW + 2, 2);
  }

  // Lectura numérica en dB al pie del medidor
  cx.fillStyle = isLive ? (paper ? "#fde68a" : "#4ade80") : (paper ? "#a89068" : "#71717a");
  cx.fillText(dbText, mx + meterW / 2, h - 4);
  cx.textAlign = "left";
}

function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  tick(dt);
  const t = now / 1000;
  if (V === "boot") drawBoot();
  if (V === "map") drawMap(t);
  if (V === "proc") {
    drawCRT(t);
    if (isSpectrogramEnabled()) drawSpectrogram(t);
  }
  if (V === "atlas") drawAtlasCanvases(t);
  requestAnimationFrame(loop);
}

function bindEvents(w) {
  const on = (sel, fn) => { const el = w.querySelector(sel); if (el) el.onclick = fn; };

  const bootEl = w.querySelector("#bootScreen");
  if (bootEl) {
    bootEl.onclick = () => {
      if (playStartupSound(false)) {
        const hint = w.querySelector("#bootAudioHint");
        if (hint) hint.style.display = "none";
      }
    };
  }

  const pn = w.querySelector("#playerName");
  const apn = w.querySelector("#adminPlayerName");
  const sn = w.querySelector("#startNight");

  if (sn) {
    sn.onchange = e => { selectedStartNight = +e.target.value; };
  }

  if (pn) {
    pn.oninput = e => { playerNameInput = e.target.value; };
    pn.onkeydown = e => {
      if (e.key === "Enter") {
        beep(520, 0.1);
        adminModalOpen = false;
        start(pn.value, 0, false);
      }
    };
    pn.onfocus = () => {
      if (bootLoginChimePending && !bootSoundPlayed) {
        playStartupSound(false);
      }
    };
    if (!adminModalOpen) {
      setTimeout(() => pn.focus(), 30);
    }
  }

  if (apn) {
    apn.oninput = e => {
      playerNameInput = e.target.value;
      if (pn) pn.value = playerNameInput;
    };
    apn.onkeydown = e => {
      if (e.key === "Enter") {
        const nightVal = sn ? +sn.value : selectedStartNight;
        beep(620, 0.12);
        adminModalOpen = false;
        start(apn.value, nightVal, true);
      } else if (e.key === "Escape") {
        adminModalOpen = false;
        render();
      }
    };
    setTimeout(() => apn.focus(), 30);
  }

  on("#go", () => {
    const val = w.querySelector("#playerName")?.value || playerNameInput;
    if (bootLoginChimePending && !bootSoundPlayed) {
      playStartupSound(false);
    } else {
      beep(520, 0.1);
    }
    adminModalOpen = false;
    start(val, 0, false);
  });

  on("#bearAlertBtn", () => {
    if (bootLoginChimePending && !bootSoundPlayed) {
      playStartupSound(false);
    } else {
      beep(523.25, 0.08, "triangle", 0.06);
      setTimeout(() => beep(659.25, 0.11, "triangle", 0.06), 75);
    }
    bearDialogOpen = true;
    bearTypedChars = 0;
    bearTalkingTimer = 2.4;
    bearTalkStep = 0;
    bearHopPending = true;
    render();
    bearHopPending = false;
  });

  on("#bearFarewellBtn", e => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    // Sin accion por el momento
  });

  on("#bearTutorialBtn", e => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    // El tutorial se implementara despues
  });

  on("#openAdminBtn", () => {
    const val = w.querySelector("#playerName")?.value;
    if (typeof val === "string") playerNameInput = val;
    if (bootLoginChimePending && !bootSoundPlayed) {
      playStartupSound(false);
    } else {
      beep(460, 0.08);
    }
    adminModalOpen = true;
    render();
  });

  on("#closeAdminBtn", () => {
    beep(380, 0.06);
    adminModalOpen = false;
    render();
  });

  on("#cancelAdminBtn", () => {
    beep(380, 0.06);
    adminModalOpen = false;
    render();
  });

  on("#adminNormalBtn", () => {
    const val = w.querySelector("#adminPlayerName")?.value || playerNameInput;
    const nightVal = sn ? +sn.value : selectedStartNight;
    beep(520, 0.1);
    adminModalOpen = false;
    start(val, nightVal, false);
  });

  on("#adminFreeBtn", () => {
    const val = w.querySelector("#adminPlayerName")?.value || playerNameInput;
    const nightVal = sn ? +sn.value : selectedStartNight;
    beep(620, 0.12);
    adminModalOpen = false;
    start(val, nightVal, true);
  });

  w.querySelectorAll("[data-m]").forEach(el => el.onclick = () => {
    markFirst();
    const m = mail.find(x => x.id === el.dataset.m);
    if (m) { m.read = 1; selMail = m.id; beep(380, 0.04); render(); updBadges(); }
  });

  on("#clearMailBtn", () => {
    if (!mail.length) return;
    mail = [];
    selMail = null;
    beep(340, 0.06);
    updBadges();
    render();
  });

  on("#goSrvBtn", () => {
    beep(420, 0.05);
    V = "srv";
    render();
  });

  const cv = $("#cv");
  if (cv) {
    cv.onpointerdown = e => {
      moved = 0;
      drag = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y};
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    };
    cv.onpointermove = e => {
      if (!drag) return;
      const r = cv.getBoundingClientRect();
      const vw = cv.clientWidth || r.width || 640;
      const vh = cv.clientHeight || r.height || 310;
      const dx = (e.clientX - drag.x) * vw / (r.width || vw);
      const dy = (e.clientY - drag.y) * vh / (r.height || vh);
      if (Math.hypot(dx, dy) > 6) moved = 1;
      if (moved) {
        cam.x = Math.max(0, Math.min(Math.max(0, W - vw), drag.cx - dx));
        cam.y = Math.max(0, Math.min(Math.max(0, H - vh), drag.cy - dy));
      }
    };
    cv.onpointerup = cv.onpointercancel = () => { drag = null; };
    cv.onclick = e => {
      if (moved) return;
      markFirst();
      const r = cv.getBoundingClientRect();
      const vw = cv.clientWidth || r.width || 640;
      const vh = cv.clientHeight || r.height || 310;
      const x = (e.clientX - r.left) * vw / (r.width || vw) + cam.x;
      const y = (e.clientY - r.top) * vh / (r.height || vh) + cam.y;
      const hit = sigs.find(s => (s.st === "echo" || s.st === "align" || s.st === "dl") && Math.hypot(s.x - x, s.y - y) < 34);
      if (!hit) { if (R) R.invalid++; syncLiveTelemetry(false, false); return; }

      if (hit.st === "echo") {
        const busySig = sigs.find(s => s.st === "align" || s.st === "dl");
        if (busySig) {
          if (pendingOverrideSig && pendingOverrideSig.id === hit.id) {
            if (en < ECHO_LOCK_COST) { beep(180, 0.15, "sawtooth"); return msg(`[ERR] Energia insuficiente (${ECHO_LOCK_COST} PWR)`, 0); }
            busySig.st = "gone";
            pendingOverrideSig = null;
            en -= ECHO_LOCK_COST;
            hit.st = "align";
            ensureSectorDiversity();
            beep(340, 0.12, "triangle");
            msg(`[OK] Busqueda anterior cancelada // Rastreando #${hit.id}`, 1);
            updTop();
            render();
            return;
          }
          pendingOverrideSig = hit;
          beep(220, 0.1, "sawtooth");
          msg(`[AVISO] Antenas ocupadas con #${busySig.id}. Insiste para cancelar y cambiar.`, 0);
          render();
          return;
        }

        if (!canAcceptSignalInBuffer(hit.anom)) {
          if (R) R.invalid++;
          beep(180, 0.15, "sawtooth");
          const maxCap = hasFloppyDisk ? (MAX_MEMORY_SIGNALS + MAX_FLOPPY_ANOMALIES) : MAX_MEMORY_SIGNALS;
          return msg(`[ERR] Memoria llena (${getStoredMemoryCount()}/${maxCap}) // Envia, guarda en Floppy o descarta senales antes de capturar mas`, 0);
        }
        if (en < ECHO_LOCK_COST) { if (R) R.invalid++; beep(180, 0.15, "sawtooth"); return msg(`[ERR] Energia insuficiente (${ECHO_LOCK_COST} PWR)`, 0); }
        en -= ECHO_LOCK_COST;
        hit.st = "align";
        pendingOverrideSig = null;
        beep(320, 0.12, "triangle");
        syncLiveTelemetry(false, true);
        updTop();
        render();
      }
    };
  }

  on("#confirmOverrideBtn", () => {
    if (!pendingOverrideSig) return;
    const busySig = sigs.find(s => s.st === "align" || s.st === "dl");
    if (en < ECHO_LOCK_COST) { beep(180, 0.15, "sawtooth"); return msg(`[ERR] Energia insuficiente (${ECHO_LOCK_COST} PWR)`, 0); }
    if (busySig) busySig.st = "gone";
    en -= ECHO_LOCK_COST;
    pendingOverrideSig.st = "align";
    const newId = pendingOverrideSig.id;
    pendingOverrideSig = null;
    ensureSectorDiversity();
    beep(340, 0.12, "triangle");
    msg(`[OK] Investigacion reemplazada // Rastreando #${newId}`, 1);
    updTop();
    render();
  });

  on("#cancelOverrideBtn", () => {
    pendingOverrideSig = null;
    render();
  });

  on("#rd", () => {
    markFirst();
    if (rd > 0) return;
    if (en < 6) { if (R) R.invalid++; return msg("[ERR] Energia insuficiente (6 PWR)", 0); }
    en -= 6; rd = 7;
    beep(580, 0.12);
    updTop();
  });

  w.querySelectorAll("[data-s]").forEach(el => el.onclick = () => {
    cur = sigs.find(s => s.id === +el.dataset.s) || null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    delete SPEC_BUFFERS["proc"];
    stopVoice();
    render();
  });

  const knF = $("#knF"), knP = $("#knP");
  if (knF) knF.oninput = e => {
    knobF = +e.target.value;
    const vf = $("#valF");
    if (vf) vf.textContent = knobF;
    if (R) R.retunes++;
    if (cur) {
      const pF = proxPct(knobF, cur.tgF);
      const colF = pF >= 88 ? "#15803d" : pF >= 55 ? "#b45309" : "#b91c1c";
      const bf = $("#barF"), tf = $("#txtF");
      if (bf) { bf.style.width = `${pF}%`; bf.style.background = colF; }
      if (tf) { tf.textContent = `${pF}%`; tf.style.color = colF; }
      const fb = $("#fixBtn");
      if (fb) fb.disabled = !(isTuned(cur) && !cur.fixed);
    }
  };
  if (knP) knP.oninput = e => {
    knobP = +e.target.value;
    const vp = $("#valP");
    if (vp) vp.textContent = knobP;
    if (R) R.retunes++;
    if (cur) {
      const pP = proxPct(knobP, cur.tgP);
      const colP = pP >= 88 ? "#15803d" : pP >= 55 ? "#b45309" : "#b91c1c";
      const bp = $("#barP"), tp = $("#txtP");
      if (bp) { bp.style.width = `${pP}%`; bp.style.background = colP; }
      if (tp) { tp.textContent = `${pP}%`; tp.style.color = colP; }
      const fb = $("#fixBtn");
      if (fb) fb.disabled = !(isTuned(cur) && !cur.fixed);
    }
  };

  on("#playAu", () => {
    if (!cur) return;
    if (activeVoice) { stopVoice(); render(); return; }
    if (en < 2) { if (R) R.invalid++; return msg("[ERR] Energia insuficiente (2 PWR)", 0); }
    en -= 2;
    if (R) {
      R.repeats++;
      if (isSpectrogramEnabled()) R.specUses++;
    }
    playSignalAudio(cur);
    syncLiveTelemetry(false, false);
    updTop();
    render();
  });

  on("#fixBtn", () => {
    if (!cur || !isTuned(cur)) return;
    cur.fixed = true;
    beep(620, 0.08);

    if (cur.anom) {
      if (!discoveredAnomalies.some(a => a.anomType === cur.anomType)) {
        discoveredAnomalies.push({
          anomTitle: cur.anomTitle,
          anomType: cur.anomType,
          cat: cur.cat,
          modelId: cur.modelId,
          img: cur.img,
          seed: cur.seed,
          anom: true,
          textData: cur.textData
        });
      }
      onFirstAnomalyDiscovered();
    }

    syncLiveTelemetry(false, true);
    render();
  });

  on("#dropBtn", () => {
    if (!cur) return;
    stopVoice();
    cur.st = "gone";
    cur = null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    delete SPEC_BUFFERS["proc"];
    ensureSectorDiversity();
    msg("Trama descartada", 1);
    updTop();
    render();
  });

  w.querySelectorAll("[data-k]").forEach(el => el.onclick = () => {
    choiceCat = +el.dataset.k;
    choiceMod = null;
    beep(440, 0.04);
    render();
  });

  w.querySelectorAll("[data-mod]").forEach(el => el.onclick = () => {
    choiceMod = el.dataset.mod;
    beep(490, 0.04);
    render();
  });

  on("#queueBtn", () => {
    if (!cur || choiceCat === null) return;
    if (isSubcatEnabled() && choiceMod === null) return;
    stopVoice();
    const pkgId = uid();
    outbox.push({
      id: pkgId,
      sigId: cur.id,
      trueCat: cur.cat,
      trueMod: cur.modelId,
      anom: cur.anom,
      anomType: cur.anomType,
      anomTitle: cur.anomTitle,
      img: cur.img,
      seed: cur.seed,
      textData: cur.textData,
      chosenCat: choiceCat,
      chosenMod: choiceMod
    });
    selPkgId = pkgId;
    cur.st = "gone";
    cur = null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    delete SPEC_BUFFERS["proc"];
    ensureSectorDiversity();
    beep(560, 0.1);
    msg("[OK] Paquete enviado a Plataforma de Envio", 1);
    V = "plat";
    updTop();
    render();
  });

  w.querySelectorAll("[data-pkg]").forEach(el => el.onclick = () => {
    selPkgId = el.dataset.pkg;
    render();
  });

  w.querySelectorAll("[data-send-as]").forEach(el => el.onclick = () => {
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox.splice(pkgIdx, 1)[0];
    selPkgId = outbox[0]?.id || null;
    beep(540, 0.1);
    msg("[OK] Paquete despachado a asignacion", 1);
    pendingEvals.push({
      at: performance.now() + 1800,
      pkg,
      targetType: "assign",
      assignId: el.dataset.sendAs
    });
    updTop();
    render();
  });

  on("#sendCentralBtn", () => {
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox.splice(pkgIdx, 1)[0];
    selPkgId = outbox[0]?.id || null;
    beep(540, 0.1);
    msg("[OK] Paquete despachado a Archivo Central", 1);
    pendingEvals.push({
      at: performance.now() + 1800,
      pkg,
      targetType: "central"
    });
    updTop();
    render();
  });

  on("#saveFloppyProcBtn", () => {
    if (!cur || !cur.anom || !cur.fixed || !hasFloppyDisk) return;
    if (floppyStoredAnomalies.length >= MAX_FLOPPY_ANOMALIES) {
      return msg(`[ERR] Disco Floppy lleno (${MAX_FLOPPY_ANOMALIES}/${MAX_FLOPPY_ANOMALIES})`, 0);
    }
    stopVoice();
    if (!floppyStoredAnomalies.some(f => f.anomType === cur.anomType)) {
      floppyStoredAnomalies.push({
        anomTitle: cur.anomTitle,
        anomType: cur.anomType,
        cat: cur.cat,
        modelId: cur.modelId,
        img: cur.img,
        seed: cur.seed,
        anom: true,
        textData: cur.textData
      });
    }
    cur.st = "gone";
    cur = null;
    knobF = 50;
    knobP = 50;
    choiceCat = null;
    choiceMod = null;
    delete SPEC_BUFFERS["proc"];
    ensureSectorDiversity();
    beep(620, 0.12);
    msg(`[OK] Anomalia guardada en Disco Floppy (${floppyStoredAnomalies.length}/${MAX_FLOPPY_ANOMALIES})`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    render();
  });

  on("#saveFloppyPlatBtn", () => {
    if (!hasFloppyDisk) return;
    const pkgIdx = outbox.findIndex(p => p.id === selPkgId);
    if (pkgIdx < 0) return;
    const pkg = outbox[pkgIdx];
    if (!pkg.anom) {
      return msg("[ERR] El Disco Floppy solo almacena lecturas anomalas", 0);
    }
    if (floppyStoredAnomalies.length >= MAX_FLOPPY_ANOMALIES) {
      return msg(`[ERR] Disco Floppy lleno (${MAX_FLOPPY_ANOMALIES}/${MAX_FLOPPY_ANOMALIES})`, 0);
    }
    outbox.splice(pkgIdx, 1);
    selPkgId = outbox[0]?.id || null;
    if (!floppyStoredAnomalies.some(f => f.anomType === pkg.anomType)) {
      floppyStoredAnomalies.push({
        anomTitle: pkg.anomTitle,
        anomType: pkg.anomType,
        cat: pkg.trueCat,
        modelId: pkg.trueMod,
        img: pkg.img,
        seed: pkg.seed || 2.1,
        anom: true,
        textData: pkg.textData || ""
      });
    }
    ensureSectorDiversity();
    beep(620, 0.12);
    msg(`[OK] Anomalia guardada en Disco Floppy (${floppyStoredAnomalies.length}/${MAX_FLOPPY_ANOMALIES})`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    render();
  });

  // Botón en Atlas para alternar entre imagen y espectrograma
  w.querySelectorAll("[data-atlas-view]").forEach(el => el.onclick = () => {
    const mid = el.dataset.atlasView;
    const mod = MODELS.find(m => m.id === mid);
    if (atlasSpecMode.has(mid)) {
      atlasSpecMode.delete(mid);
    } else {
      atlasSpecMode.add(mid);
      delete SPEC_BUFFERS[`atlas_${mid}`];
      const alreadyPlaying = activeVoice && activeVoice.sig && !activeVoice.sig.anom && activeVoice.sig.modelId === mid;
      if (!alreadyPlaying) {
        playSignalAudio({modelId: mid, cat: mod ? mod.cat : 0, anom: false, anomType: ""});
      }
    }
    beep(470, 0.05);
    render();
  });

  w.querySelectorAll("[data-atlas-au]").forEach(el => el.onclick = () => {
    const mid = el.dataset.atlasAu;
    const mod = MODELS.find(m => m.id === mid);
    const alreadyPlaying = activeVoice && activeVoice.sig && !activeVoice.sig.anom && activeVoice.sig.modelId === mid;
    if (alreadyPlaying) {
      stopVoice();
      return;
    }
    playSignalAudio({modelId: mid, cat: mod ? mod.cat : 0, anom: false, anomType: ""});
  });

  // Botón en sección Anomalías del Atlas para alternar entre imagen y espectrograma
  w.querySelectorAll("[data-anom-view]").forEach(el => el.onclick = () => {
    const item = discoveredAnomalies[+el.dataset.anomView];
    if (!item) return;
    const anomKey = `anom_${item.anomType}`;
    if (atlasSpecMode.has(anomKey)) {
      atlasSpecMode.delete(anomKey);
    } else {
      atlasSpecMode.add(anomKey);
      delete SPEC_BUFFERS[anomKey];
      const alreadyPlaying = activeVoice && activeVoice.sig && activeVoice.sig.anom && activeVoice.sig.anomType === item.anomType;
      if (!alreadyPlaying) {
        playSignalAudio(item);
      }
    }
    beep(470, 0.05);
    render();
  });

  w.querySelectorAll("[data-anom-au]").forEach(el => el.onclick = () => {
    const item = discoveredAnomalies[+el.dataset.anomAu];
    if (!item) return;
    if (activeVoice && activeVoice.sig && activeVoice.sig.anomType === item.anomType) {
      stopVoice();
      return;
    }
    playSignalAudio(item);
  });

  w.querySelectorAll("[data-b]").forEach(el => el.onclick = () => {
    if (!srv) return;
    const idx = +el.dataset.b;
    if (srv.latched[idx]) return;
    const expected = srv.seq[srv.step];
    if (idx === expected) {
      srv.latched[idx] = true;
      srv.step++;
      en = Math.max(0, en - 1);
      beep(440 + srv.step * 90, 0.09);
      if (srv.step >= srv.seq.length) {
        if (R) R.fix += +((performance.now() - srv.t) / 1000).toFixed(1);
        srv = null;
        msg("[OK] Servidor restablecido", 1);
        syncLiveTelemetry(false, true);
      }
      render();
    } else {
      srv.step = 0;
      srv.latched = Array(srv.count).fill(false);
      beep(150, 0.16, "sawtooth");
      msg("[ERR] Secuencia de reles reiniciada", 0);
      render();
    }
  });

  w.querySelectorAll("[data-u]").forEach(el => el.onclick = () => {
    const k = el.dataset.u;
    const maxLv = 5;
    if (G[k] >= maxLv) return;
    const costs = {
      a: 85 + 55 * G.a,
      f: 80 + 50 * G.f,
      b: 75 + 45 * G.b
    };
    const cost = costs[k];
    if (G.money < cost) return;
    G.money -= cost;
    G[k]++;
    if (k === "b") { cap = 100 + 20 * G.b; en = Math.min(cap, en + 20); }
    beep(660, 0.1);
    msg(`[OK] Mejora instalada (NV ${G[k]}/${maxLv})`, 1);
    syncLiveTelemetry(false, true);
    updTop();
    render();
  });

  on("#buyCellBtn", () => {
    if (G.money < 30 || en >= cap) return;
    G.money -= 30;
    en = Math.min(cap, en + 45);
    beep(680, 0.1);
    msg("[OK] Celda auxiliar conectada (+45 PWR)", 1);
    updTop();
    render();
  });

  on("#buyFloppyBtn", () => {
    if (hasFloppyDisk || G.money < 50) return;
    G.money -= 50;
    hasFloppyDisk = true;
    beep(680, 0.12);
    msg("[OK] Disco Floppy instalado (+5 espacios para anomalias en buffer)", 1);
    syncLiveTelemetry(false, true);
    updTop();
    render();
  });

  on("#rsBtn", () => { adminModalOpen = false; bearDialogOpen = false; V = "intro"; updTop(); render(); });
}

function unlockBootAudioOnGesture() {
  if (V === "boot" && !bootSoundPlayed) {
    if (playStartupSound(false)) {
      const hint = document.querySelector("#bootAudioHint");
      if (hint) hint.style.display = "none";
    }
  }
}
window.addEventListener("pointerdown", unlockBootAudioOnGesture, { passive: true });
window.addEventListener("keydown", unlockBootAudioOnGesture, { passive: true });

function bootTerminal() {
  try {
    preloadAllSprites();
    startBootSequence();
    requestAnimationFrame(loop);
  } catch (err) {
    const w = document.querySelector("#win");
    if (w) {
      w.innerHTML = `<div class="card dangerbox"><b>ERROR DE INICIALIZACION</b><pre style="white-space:pre-wrap;font-size:12px">${err && err.stack ? err.stack : err}</pre></div>`;
    }
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootTerminal);
} else {
  bootTerminal();
}
</script>
</body>
</html>
